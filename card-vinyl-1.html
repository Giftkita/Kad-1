#pentas{position:fixed;container-type:inline-size}
#pentas>*{position:absolute}
.x{position:absolute;inset:0;width:100%;height:100%;display:block}
#tt{filter:drop-shadow(0 1.6cqw 2cqw rgba(0,0,0,.55))}
#rekod{transition:left 1s cubic-bezier(.5,.1,.3,1),top 1s cubic-bezier(.5,.1,.3,1),width 1s cubic-bezier(.5,.1,.3,1),opacity .4s;filter:drop-shadow(0 .8cqw 1.2cqw rgba(0,0,0,.5))}
#rekod .putar{position:absolute;inset:0}
#rekod.main .putar{animation:putar 1.8s linear infinite}
#rekod.jeda .putar{animation-play-state:paused}
@keyframes putar{to{transform:rotate(360deg)}}
#rekod .lab{position:absolute;overflow:hidden;border-radius:50%;background:#8e1b2b;-webkit-mask-size:100% 100%;mask-size:100% 100%}
#rekod .lab img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
#rekod .kilau{position:absolute;inset:0;border-radius:50%;background:conic-gradient(from 20deg,transparent 0 8%,rgba(255,255,255,.10) 12%,transparent 18% 50%,rgba(255,255,255,.08) 62%,transparent 68%);pointer-events:none}
#lengan{transform-origin:51% 19.6%;transform:rotate(-4deg);transition:transform 1.3s cubic-bezier(.45,.05,.3,1);filter:drop-shadow(.8cqw 1.2cqw .8cqw rgba(0,0,0,.45));z-index:5}
#lengan.atas{transform:rotate(30deg) scale(1.03)}
#lengan.main{transform:rotate(31deg);transition:transform .35s ease-in}
#lengan.gerak{transform:rotate(36deg);transition:transform 240s linear}
#sampul3d{perspective:1400px;z-index:6;cursor:pointer;transition:left 1s cubic-bezier(.5,.1,.3,1),top 1s cubic-bezier(.5,.1,.3,1),width 1s cubic-bezier(.5,.1,.3,1)}
#sampul3d .kad{position:absolute;inset:0;transform-style:preserve-3d;transition:transform 1s cubic-bezier(.45,.05,.3,1)}
#sampul3d.balik .kad{transform:rotateY(180deg)}
#sampul3d .muka{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;container-type:inline-size;filter:drop-shadow(0 1cqw 1.6cqw rgba(0,0,0,.5))}
#sampul3d .blk{transform:rotateY(180deg)}
#sampul3d.mula{animation:denyut 1.8s ease-in-out infinite}
@keyframes denyut{0%,100%{transform:scale(1)}50%{transform:scale(1.025)}}
.tingkap{position:absolute;overflow:hidden;background:#3b2a20}
.tingkap img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.dpnT{position:absolute;left:10%;right:10%;top:66%;bottom:6%;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center}
.dpnT h1{font:italic 700 11cqw/1 'Playfair Display',serif;color:#8e1b2b;letter-spacing:-.01em}
.dpnT p{font:700 4.2cqw/1.2 'Courier Prime',monospace;color:#5a3a26;margin-top:1.4cqw;letter-spacing:.08em}
.dpnT small{font:400 3.6cqw/1 'Bebas Neue',sans-serif;color:#8e1b2b;letter-spacing:.2em;margin-top:1.6cqw}
.blkT{position:absolute;left:8%;right:8%;top:6.5%;bottom:5%;display:flex;flex-direction:column}
.blkT .hd{display:flex;justify-content:space-between;align-items:flex-end;border-bottom:.5cqw solid #8e1b2b;padding-bottom:1.2cqw;margin-bottom:1.4cqw}
.blkT .hd b{font:400 8cqw/1 'Bebas Neue',sans-serif;color:#8e1b2b;letter-spacing:.08em}
.blkT .hd i{font:italic 700 4.6cqw/1 'Playfair Display',serif;color:#5a3a26;font-style:italic;max-width:60%;text-align:right;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.trek{display:flex;align-items:center;gap:1.8cqw;padding:1.15cqw 1.4cqw;border-radius:1.2cqw;font:700 3.9cqw/1.15 'Courier Prime',monospace;color:#2b1d14;cursor:pointer;transition:background .2s}
.trek .n{width:5cqw;flex:none;color:#8e1b2b}
.trek .t{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.trek .d{flex:none;color:#7a6a58;font-size:3.4cqw}
.trek:active,.trek.aktif{background:rgba(142,27,43,.12)}
.trek.aktif .n{color:transparent;background:linear-gradient(#8e1b2b,#8e1b2b) 10% 100%/18% 40% no-repeat,linear-gradient(#8e1b2b,#8e1b2b) 45% 100%/18% 80% no-repeat,linear-gradient(#8e1b2b,#8e1b2b) 80% 100%/18% 55% no-repeat;height:3.6cqw;animation:eq .7s ease-in-out infinite alternate}
@keyframes eq{to{background-size:18% 90%,18% 35%,18% 100%}}
.trek.dah .t{color:#8a7a68}
.trek.bonus{color:#8e1b2b}
.garis{border-top:.35cqw dashed rgba(142,27,43,.45);margin:1.2cqw 0}
.blkT .kaki{margin-top:auto;font:700 2.8cqw/1.3 'Courier Prime',monospace;color:#8a7a68;text-align:center}
#suratM{cursor:pointer;z-index:7;animation:gegar 2.6s ease-in-out infinite}
@keyframes gegar{0%,72%,100%{transform:rotate(var(--r))}78%{transform:rotate(calc(var(--r) - 6deg))}84%{transform:rotate(calc(var(--r) + 6deg))}90%{transform:rotate(calc(var(--r) - 3deg))}}
.dek{pointer-events:none;filter:drop-shadow(0 .5cqw .7cqw rgba(0,0,0,.35))}
.not{position:absolute;pointer-events:none;z-index:8;filter:drop-shadow(0 .4cqw .6cqw rgba(0,0,0,.3))}
.pet{position:absolute;z-index:20;pointer-events:none;white-space:nowrap;font:600 1.9cqw/1 Fredoka,sans-serif;color:#fff;background:#8e1b2b;padding:1cqw 1.8cqw;border-radius:99cqw;box-shadow:0 .6cqw 1.4cqw rgba(0,0,0,.35);transform:translateX(-50%);animation:lompat 1.4s ease-in-out infinite}
@keyframes lompat{0%,100%{transform:translate(-50%,0)}50%{transform:translate(-50%,-1cqw)}}

#tayang{position:fixed;inset:0;z-index:1200;display:none;align-items:center;justify-content:center;background:rgba(18,8,4,.62);backdrop-filter:blur(2px);-webkit-backdrop-filter:blur(2px)}
#tayang.on{display:flex}

.duo{display:flex;align-items:center;justify-content:center;gap:2vmin}

.capT{text-align:center;color:#fff;text-shadow:0 .4vmin 1vmin rgba(0,0,0,.6)}

.lirik .tx .f{font:700 4vmin/1.1 Caveat,cursive;color:#5a3a26;text-align:right;margin-top:1vmin}
