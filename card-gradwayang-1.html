function esc(s){ return String(s==null?'':s).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];}); }
function ytId(u){ if(!u) return ''; var m=String(u).match(/(?:v=|youtu\.be\/|embed\/|shorts\/)([A-Za-z0-9_-]{11})/); return m?m[1]:''; }
function v(k,d){ var s=D&&D[k]!=null?String(D[k]).trim():''; return s||d||''; }
function thn(){ return v('tahun',''+new Date().getFullYear()); }
function nama(){ return v('to','—'); }
function tajukFilem(){ return v('tajuk', (v('to')?v('to')+': ':'')+T('tajuk')); }
function gkZoom(s){ if(!window.GKLightbox||!s) return; GKLightbox.attach(); var a=document.querySelectorAll('img[data-gklb]'); for(var i=0;i<a.length;i++) if(a[i].src===s){ a[i].click(); return; } }
function pos(el,g){ el.style.left=g.x+'%'; el.style.top=g.y+'%'; el.style.width=g.w+'%'; el.style.height=g.h+'%'; }

/* ---------- saiz ---------- */
var stage=$('#stage');
function ukur(){ var vw=innerWidth, vh=innerHeight, W=Math.min(vw,vh*ASP), H=W/ASP;
  stage.style.width=W+'px'; stage.style.height=H+'px'; stage.style.left=((vw-W)/2)+'px'; stage.style.top=((vh-H)/2)+'px'; }
addEventListener('resize',ukur);

/* ---------- 1. tiket ---------- */
function binaTiket(){
  var tk=$('#tiket'), G=GEO.tiketPenuh; pos(tk,G);
  var pf=GEO.tiketPerf;   /* % tinggi tiket di garisan perforasi */
  var u=$('#tUtama'), k=$('#tKerat'); u.style.top='0'; u.style.height=pf+'%'; k.style.top=pf+'%'; k.style.height=(100-pf)+'%';
  u.querySelectorAll('.tt').forEach(function(e){e.remove();}); k.querySelectorAll('.tt').forEach(function(e){e.remove();});
  /* kotak dalam tiket (% bahagian utama) */
  var t1=document.createElement('div'); t1.className='tt'; t1.style.cssText='left:10.6%;right:10.7%;top:19.3%;height:25.6%';
  t1.innerHTML='<div class="a1">'+T('admit')+'</div><div class="tj">'+esc(tajukFilem())+'</div><div class="a2">★ '+T('premiere')+' ★</div>'; u.appendChild(t1);
  var t2=document.createElement('div'); t2.className='tt'; t2.style.cssText='left:10.6%;right:10.7%;top:49.2%;height:13.1%';
  t2.innerHTML='<div class="kc">'+T('starring').toUpperCase()+'</div><div class="nm">'+esc(nama())+'</div>'; u.appendChild(t2);
  var t3=document.createElement('div'); t3.className='tt'; t3.style.cssText='left:10.6%;right:10.7%;top:66.6%;height:13.3%';
  t3.innerHTML='<div class="kt">'+esc(v('uni',T('hall')))+'<br>'+esc(v('tarikh',thn()))+'</div>'; u.appendChild(t3);
  var t4=document.createElement('div'); t4.className='tt'; t4.style.cssText='left:10.6%;right:10.7%;top:18%;height:51%';
  var y=thn(); t4.innerHTML='<div class="st">ROW '+esc(y.slice(0,2))+' · '+T('kerusi')+' '+esc(y.slice(2))+'</div>'; k.appendChild(t4);
  var ph=$('#pTiket'); ph.textContent=T('koyak'); ph.style.top=(G.y+G.h*.985)+'%';
  $('#panah').style.top=(G.y+G.h*.86)+'%';
}
var sy=null;
$('#tKerat').addEventListener('pointerdown',function(e){ sy=e.clientY; });
addEventListener('pointerup',function(e){ if(fasa!=='tiket'||sy===null) return; var dy=e.clientY-sy; sy=null; if(dy>25||Math.abs(dy)<8) koyak(); });
$('#tiket').addEventListener('click',function(){ if(fasa==='tiket') koyak(); });
function koyak(){
  if(fasa!=='tiket') return; fasa='koyak';
  mulaMuzik();
  $('#tiket').classList.add('koyak'); $('#pTiket').style.opacity='0'; $('#panah').style.opacity='0';
  setTimeout(function(){ tukar('aPoster'); fasa='poster'; },1500);
}
function tukar(id){
  $('#malap').style.opacity='1';
  setTimeout(function(){ document.querySelectorAll('.adegan').forEach(function(a){ a.classList.toggle('on',a.id===id); });
    $('#kabur').style.backgroundImage='url('+$('#'+id+' img.bg').src+')';
    setTimeout(function(){ $('#malap').style.opacity='0'; },120); },900);
}

/* ---------- 2. poster ---------- */
function binaPoster(){
  var s=$('#slotPoster'); pos(s,GEO.posterSlot); s.innerHTML='';
  var f=foto(0); if(f){ var im=document.createElement('img'); im.src=f.src; im.alt=''; var p=D.pos&&D.pos[f.k]; if(p) im.style.transform='translate('+(p.x||0)+'%,'+(p.y||0)+'%) scale('+(p.s||1)+')'; s.appendChild(im);
    s.onclick=function(){ gkZoom(f.src); }; }
  var P=GEO.posterSlot, j=$('#judul'); j.style.left=P.x+'%'; j.style.width=P.w+'%'; j.style.top=(P.y+P.h+.6)+'%'; j.style.height='16.4%';
  j.innerHTML='<div class="p1">'+T('sekarang')+'</div><div class="p2">'+esc(tajukFilem())+'</div><div class="p3">'+esc(v('tagline',T('tagline')))+'</div><div class="p4">'+esc(v('uni',T('hall')))+' · '+esc(v('tarikh',thn()))+'</div>';
  var p2=j.querySelector('.p2'); var L=tajukFilem().length; p2.style.fontSize=(L>22?5.6:L>14?7:9)+'cqw';
  var a=$('#aPoster'); a.querySelectorAll('.mentol').forEach(function(m){m.remove();});
  GEO.mentol.forEach(function(m,i){ var d=document.createElement('div'); d.className='mentol'+(i%2?' b':''); d.style.left=m[0]+'%'; d.style.top=m[1]+'%'; d.style.width=d.style.height=(m[2]*2.2)+'cqw'; a.appendChild(d); });
  var b=$('#btnMasuk'); b.textContent=T('masuk'); b.style.top='83%';
}
$('#btnMasuk').onclick=function(){ if(fasa!=='poster') return; fasa='panggung'; tukar('aPanggung'); setTimeout(bukaTirai,1700); };

/* ---------- 3. panggung ---------- */
var SLAID=[], si=-1, tmr=0;
function binaPanggung(){
  pos($('#skrin'),GEO.skrin);
  var b=$('#bekas'); b.style.left='29%'; b.style.width='42%'; b.style.top='60%'; b.style.height=(42*GEO.bekas.h/GEO.bekas.w)+'%';
  $('#labelB').innerHTML='<b>CLASS OF</b><i>'+esc(thn())+'</i>';
  var w=$('#slaid'); w.innerHTML=''; SLAID=[];
  var L=[]; for(var i=2;i<=N_FOTO;i++) if(D&&D['f'+i]) L.push({k:'f'+i,src:D['f'+i]});
  if(!L.length&&D&&D.f1) L.push({k:'f1',src:D.f1});
  var C=[]; for(var c=1;c<=6;c++) C.push(v('c'+c,T('c')[c-1]));
  L.forEach(function(f,i){ var d=document.createElement('div'); d.className='slaid'; var im=document.createElement('img'); im.src=f.src; im.alt='';
    var p=D.pos&&D.pos[f.k]; if(p) im.style.objectPosition=(50-(p.x||0))+'% '+(50-(p.y||0))+'%'; d.appendChild(im); w.appendChild(d);
    var ci=Math.min(5,Math.floor(i*6/L.length)), awal=(i===0||Math.floor((i-1)*6/L.length)!==ci);
    SLAID.push({el:d,cap:awal?C[ci]:'',bab:ci+1}); });
}
function bukaTirai(){ $('#aPanggung').classList.add('dibuka'); setTimeout(kiraTurun,2700); }
function kiraTurun(){
  var k=$('#kira'), n=3; k.style.display='flex';
  (function satu(){ $('#kiraN').textContent=n; var t0=performance.now();
    (function f(now){ var p=Math.min(1,(now-t0)/1000); $('#bul').style.setProperty('--d',(p*360)+'deg'); if(p<1) requestAnimationFrame(f);
      else { n--; if(n>0) satu(); else { k.style.display='none'; mainSlaid(0); } } })(t0); })();
}
function mainSlaid(i){
  clearTimeout(tmr);
  if(i>=SLAID.length){ tamatTayang(); return; }
  if(si>=0&&SLAID[si]) SLAID[si].el.classList.remove('on');
  si=i; var S=SLAID[i]; S.el.classList.add('on'); var im=S.el.querySelector('img'); im.style.animation='none'; im.offsetWidth; im.style.animation='';
  var b=$('#babak'), s=$('#sarikata'); b.textContent=T('babak')+' '+S.bab; b.style.opacity='1';
  s.style.opacity='0'; setTimeout(function(){ s.textContent=S.cap; s.style.opacity=S.cap?'1':'0'; },500);
  tmr=setTimeout(function(){ mainSlaid(si+1); },5200);
}
$('#skrin').addEventListener('click',function(){ if(fasa==='panggung'&&si>=0&&si<SLAID.length) mainSlaid(si+1); });
function tamatTayang(){
  fasa='popcorn'; $('#babak').style.opacity='0'; $('#sarikata').style.opacity='0';
  $('#bekas').classList.add('naik'); var p=$('#pPanggung'); p.textContent=T('popcorn'); p.style.top='54%'; p.style.opacity='1';
}
$('#bekas').onclick=function(){
  if(fasa!=='popcorn') return; fasa='kejut'; $('#pPanggung').style.opacity='0';
  var b=$('#bekas'); b.classList.add('goyang');
  var w=$('#bertihWrap'); w.innerHTML='';
  for(var i=0;i<16;i++){ (function(i){ var im=document.createElement('img'); im.className='bertih'; im.src=BERTIH[i%BERTIH.length]; im.alt=''; w.appendChild(im);
    var x0=46+Math.random()*8, y0=64, x1=x0+(Math.random()-.5)*90, ymax=y0-25-Math.random()*35, rot=(Math.random()-.5)*720;
    im.style.left=x0+'%'; im.style.top=y0+'%';
    im.animate([{transform:'translate(0,0) rotate(0)',opacity:1},{transform:'translate('+((x1-x0)*0.5)+'cqw,'+((ymax-y0)*1.41)+'cqw) rotate('+(rot/2)+'deg)',opacity:1,offset:.45},
      {transform:'translate('+((x1-x0))+'cqw,'+((100-y0)*1.41)+'cqw) rotate('+rot+'deg)',opacity:.9}],{duration:1800+Math.random()*700,delay:i*40,easing:'cubic-bezier(.3,.6,.6,1)',fill:'forwards'});
  })(i); }
  letup();
  setTimeout(bukaKejutan,1100);
};
function bukaKejutan(){
  var h='<h3>'+T('kejut')+'</h3>', ks=v('surprise_img')||(foto(1)||{}).src||'';
  if(ks) h+='<img src="'+esc(ks)+'" alt="">';
  if(v('surprise')) h+='<div>'+esc(v('surprise'))+'</div>';
  $('#kejutIsi').innerHTML=h; $('#popKejut').classList.add('show');
}
function tutupPop(p){ p.classList.remove('show'); if(p.id==='popKejut'&&fasa==='kejut'){ fasa='kredit'; setTimeout(mulaKredit,500); } }
document.addEventListener('click',function(e){ var t=e.target; if(t.hasAttribute&&t.hasAttribute('data-tutup')) tutupPop(t.closest('.pop')); else if(t.classList&&t.classList.contains('pop')) tutupPop(t); });

/* ---------- credits ---------- */
var gulAnim=null;
function mulaKredit(){
  $('#bekas').classList.remove('naik','goyang'); $('#bertihWrap').innerHTML='';
  var g=$('#gulung'), cast=[]; for(var i=1;i<=6;i++) if(v('k'+i)) cast.push(esc(v('k'+i)));
  g.innerHTML='<div class="k0">'+T('prod')+'</div><div class="kT">'+esc(tajukFilem())+'</div>'
   +'<div class="kL">'+T('bintang')+'</div><div class="kN">'+esc(nama())+'</div>'
   +(v('kursus')?'<div class="kn">'+esc(v('kursus'))+'</div>':'')
   +(cast.length?'<div class="kL">'+T('pelakon')+'</div><div class="kn">'+cast.join('<br>')+'</div>':'')
   +'<div class="kL">'+T('arahan')+'</div><div class="kn">'+T('arah')+'</div>'
   +'<div class="kL">'+T('terima')+'</div><div class="kU">'+esc(v('ucapan',T('ucap')))+'</div>'
   +(v('from')?'<div class="kL">'+T('dari')+'</div><div class="kN">'+esc(v('from'))+'</div>':'')
   +'<div class="kE">'+T('tamat')+'</div>';
  $('#langkau').textContent=T('langkau');
  var k=$('#kredit'); k.classList.add('on');
  setTimeout(function(){ var H=g.offsetHeight, S=stage.offsetHeight, jarak=H+S, ms=Math.max(16000,jarak/S*9000);
    gulAnim=g.animate([{transform:'translateY(0)'},{transform:'translateY('+(-jarak)+'px)'}],{duration:ms,easing:'linear',fill:'forwards'});
    gulAnim.onfinish=akhir; },400);
}
$('#langkau').onclick=function(){ if(gulAnim){ gulAnim.onfinish=null; gulAnim.cancel(); } akhir(); };
function akhir(){
  if(fasa==='akhir') return; fasa='akhir';
  $('#kredit').classList.remove('on');
  SLAID.forEach(function(s){ s.el.classList.remove('on'); });
  var t=$('#tamat'), id=ytId(v('video'));
  t.innerHTML='<div class="t1">'+T('tamat')+'</div>'+(id?'<div class="main" id="tonton"><svg viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg></div><div class="t2">'+T('tonton')+'</div>':'<div class="t2">'+esc(nama())+' · '+esc(thn())+'</div>')
   +'<button class="pil" id="ulang" style="margin-top:2cqw;font-size:3cqw;padding:1.6cqw 3cqw">'+T('ulang')+'</button>';
  t.style.display='flex';
  var tn=$('#tonton'); if(tn) tn.onclick=function(e){ e.stopPropagation(); if(muzikOn) toggleMuzik();
    var f=document.createElement('iframe'); f.src='https://www.youtube.com/embed/'+id+'?autoplay=1&playsinline=1'; f.allow='autoplay; encrypted-media; fullscreen'; f.allowFullscreen=true; $('#skrin').appendChild(f); };
  $('#ulang').onclick=function(e){ e.stopPropagation(); ulang(); };
}
function ulang(){
  var f=$('#skrin iframe'); if(f) f.remove(); $('#tamat').style.display='none'; si=-1;
  $('#aPanggung').classList.remove('dibuka'); $('#tiket').classList.remove('koyak'); $('#pTiket').style.opacity='1'; $('#panah').style.opacity='1';
  fasa='tiket'; tukar('aTiket');
}

/* ---------- foto ---------- */
function foto(i){ var L=[]; for(var n=1;n<=N_FOTO;n++) if(D&&D['f'+n]) L.push({k:'f'+n,src:D['f'+n]}); if(!L.length) return null; var k='f'+(i+1); return (D&&D[k])?{k:k,src:D[k]}:L[i%L.length]; }

/* ---------- confetti ---------- */
function letup(){ var w=['#e8b85a','#ffe3a1','#c8102e','#ffffff','#f28baa'];
  for(var i=0;i<46;i++){ var c=document.createElement('div');
    c.style.cssText='position:fixed;z-index:1500;left:50%;top:55%;width:8px;height:12px;border-radius:2px;pointer-events:none;background:'+w[i%5];
    document.body.appendChild(c); var a=Math.random()*Math.PI*2, j=120+Math.random()*220;
    c.animate([{transform:'translate(0,0) rotate(0)',opacity:1},{transform:'translate('+Math.cos(a)*j+'px,'+(Math.sin(a)*j+240)+'px) rotate('+(Math.random()*720)+'deg)',opacity:0}],{duration:1400+Math.random()*700,easing:'cubic-bezier(.2,.7,.4,1)',fill:'forwards'});
    setTimeout(function(x){return function(){x.remove();};}(c),2300); } }

/* ---------- muzik ---------- */
function sediaMuzik(){
  if(v('mp3')){ audio=new Audio(v('mp3')); audio.loop=true; }
  else if(ytId(v('yt'))){ var f=document.createElement('iframe'); f.style.cssText='position:fixed;width:1px;height:1px;opacity:0;pointer-events:none;left:-10px';
    f.allow='autoplay'; document.body.appendChild(f); var yid=ytId(v('yt'));
    audio={ play:function(){ f.src='https://www.youtube.com/embed/'+yid+'?autoplay=1&loop=1&playlist='+yid; }, pause:function(){ f.src=''; } }; }
  if(!audio) $('#bMuzik').classList.add('hide');
}
function mulaMuzik(){ if(audio&&!muzikOn) toggleMuzik(); }
function toggleMuzik(){ if(!audio) return; muzikOn=!muzikOn; try{ muzikOn?audio.play():audio.pause(); }catch(e){}
  $('#bMuzik').style.background=muzikOn?'#e8b85a':'rgba(20,6,10,.6)'; $('#bMuzik').style.color=muzikOn?'#3a0a12':'#f3e6c8'; }
$('#bMuzik').onclick=toggleMuzik;
$('#bAlbum').onclick=function(){ if(window.GKAlbum&&GKAlbum.open) GKAlbum.open(); };

/* ---------- bahasa ---------- */
function binaSemua(){ binaTiket(); binaPoster(); binaPanggung(); }
$('#lang').onclick=function(){ lang=(lang==='ms')?'en':'ms'; try{localStorage.setItem('gk_lang',lang);}catch(e){} document.documentElement.lang=lang;
  binaTiket(); binaPoster(); $('#btnMasuk').textContent=T('masuk'); };
try{ var _l=localStorage.getItem('gk_lang'); if(_l==='en'||_l==='ms') lang=_l; }catch(e){}

/* ---------- demo ---------- */
function fotoDemo(n){ var c=document.createElement('canvas'); c.width=640; c.height=480; var x=c.getContext('2d');
  var a=['#8e1b2b','#c9a24a','#5a0f1c','#3a5a8c','#6a3fb0','#2f6b4f'][n%6];
  var g=x.createLinearGradient(0,0,640,480); g.addColorStop(0,a); g.addColorStop(1,'#1a0a0d'); x.fillStyle=g; x.fillRect(0,0,640,480);
  x.fillStyle='rgba(255,240,210,.85)'; x.beginPath(); x.arc(320,190,70,0,7); x.fill();
  x.fillStyle='rgba(255,240,210,.7)'; x.beginPath(); x.ellipse(320,450,160,110,0,Math.PI,0); x.fill();
  x.fillStyle='#fff'; x.font='bold 30px system-ui'; x.textAlign='center'; x.fillText('GAMBAR '+n,320,330);
  return c.toDataURL('image/jpeg',0.75); }
function demoData(){ var d={to:'Nur Aisyah',from:'Mama & Abah',tahun:'2026',uni:'UiTM Shah Alam',tarikh:'18 Okt 2026',kursus:'Ijazah Sarjana Muda Sains',
  k1:'Mama',k2:'Abah',k3:'Hana',k4:'Mira',surprise:(lang==='en')?'Proud of you, always 💗':'Bangga dengan kau, selalu 💗',video:'https://www.youtube.com/watch?v=2Vv-BfVoq4g',yt:'',mp3:'',pos:{}};
  for(var i=1;i<=8;i++) d['f'+i]=fotoDemo(i); d.surprise_img=fotoDemo(20); return d; }

/* ---------- muat ---------- */
function ralat(t){ $('#muat').style.display='none'; $('#ralat').style.display='flex'; $('#ralat').innerHTML=t; }
function mula(){ $('#muat').style.display='none'; document.documentElement.lang=lang; sediaMuzik(); ukur(); binaSemua(); $('#kabur').style.backgroundImage='url('+$('#aTiket img.bg').src+')'; }
(function init(){
  var q=new URLSearchParams(location.search); var id=q.get('id')||q.get('kad')||location.hash.replace('#','');
  if(q.get('preview')==='1'){ try{ D=JSON.parse(localStorage.getItem('gk_preview')); }catch(e){ D=null; }
    if(!D) return ralat(T('takdePratonton')); $('#badge').style.display=''; mula(); return; }
  if(q.get('demo')==='1'||!id){ D=demoData(); $('#badge').style.display=''; $('#badge').textContent='DEMO'; mula(); return; }
  if(!db) return ralat(T('dbGagal'));
  db.from('cards').select('card_data,paid').eq('id',id).single().then(function(r){
    if(r.error) throw r.error; if(r.data.paid!==true){ ralat(T('belum')); return; }
    if(r.data.card_data&&r.data.card_data.tamat){ ralat('Kad ini telah tamat tempoh (link aktif 2 bulan). · This card has expired (links stay active for 2 months).'); return; }
    D=r.data.card_data||{}; mula();
  }).catch(function(){ ralat(T('tiada')); });
})();
</script>
