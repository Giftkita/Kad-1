<!DOCTYPE html>
<html lang="ms">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Congrats, Grad! 🌻</title>
<script src="https://unpkg.com/@supabase/supabase-js@2"></script>
<script>if(!window.supabase){document.write('<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"><\/script>');}</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500;1,600&family=Libre+Baskerville:ital@0;1&family=Poppins:wght@400;500;600&display=swap" rel="stylesheet">
<!--
  GiftKita — Kad Graduasi "Sunflower" (template: sunflower) — enjin sama dengan Yin & Yang
  Rujukan: TikTok @flower_is_blooming — tiru sebijik. Design: 4 halaman Canva (26 Sep 2026).
  Aliran: dinding bunga → komet peony → bunga masuk semula → tersingkap → sampul (ketik) →
          babak kolaj: kad yin-yang (ketik = terbalik), jambak, 4 polaroid "Scratch me",
          kad video, kad lagu, peta kenangan (pin + nota suara). Semua objek boleh diseret.
  card_data: template, nama, pengirim, surat, p1..p4 (+ _pos), video, yt|mp3, song, artist,
             peta:{img,pins:[{x,y,img,title,place,date}]}, suara, surprise_img (+_pos), surprise, lang
-->
<style>
:root{--u:min(1vw,5.4px)}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;overflow:hidden;background:#ecc97e}
body{font-family:'Cormorant Garamond',Georgia,serif;color:#4a3316;-webkit-user-select:none;user-select:none}
img{-webkit-user-drag:none}

/* latar */
.latar{position:fixed;inset:0}
#latarRose{background:radial-gradient(ellipse 70% 60% at 45% 55%,#fff3cc 0%,#f8dc8e 35%,#ecbd52 72%,#a06c1a 135%)}
#latarPeach{background:linear-gradient(180deg,#fef8e6 0%,#f6e6bb 55%,#d9b578 112%);opacity:0;transition:opacity 1s}
#latarUtama{background:radial-gradient(ellipse 80% 70% at 50% 35%,#fdf5dd 0%,#f7e7bd 40%,#ead090 80%,#c9a066 122%);opacity:0;transition:opacity 1.2s}

/* intro bunga */
#bunga{position:fixed;inset:0;z-index:40;pointer-events:none;overflow:hidden}
.fl{position:absolute;left:0;top:0;will-change:transform,opacity}
.asap{position:fixed;z-index:39;border-radius:50%;pointer-events:none;background:radial-gradient(circle,rgba(236,178,52,.55),rgba(236,178,52,0) 70%);filter:blur(4px)}
#langkau{position:fixed;inset:0;z-index:45}

/* sampul */
#skSampul{position:fixed;inset:0;z-index:20;display:flex;flex-direction:column;align-items:center;justify-content:center;opacity:0;pointer-events:none;transition:opacity .9s}
#skSampul.on{opacity:1;pointer-events:auto}
#skSampul.pergi{opacity:0;pointer-events:none;transition:opacity .8s .5s}
.ketikTeks{position:absolute;top:calc(env(safe-area-inset-top,0px) + 58px);left:0;right:0;text-align:center;font:500 11px/1 'Libre Baskerville',serif;letter-spacing:.22em;color:#8a5a1c;text-transform:uppercase}
#skSampul .drp{transition:opacity .4s}
#skSampul.buka .drp,#skSampul.buka .ketikTeks{opacity:0}
.drp{font:400 11px 'Libre Baskerville',serif;letter-spacing:.22em;color:#8a5a1c;text-transform:uppercase;display:flex;align-items:baseline;gap:10px}
.drp i{font:italic 600 clamp(1.4rem,6vw,1.9rem) 'Cormorant Garamond',serif;letter-spacing:0;text-transform:none;color:#4a3316}
#sampulBox{position:relative;width:min(74vw,380px);margin:22px 0 26px;cursor:pointer;animation:apung 3s ease-in-out infinite}
#sampulBox img{display:block;width:100%}
#sampulBox .buka{position:absolute;left:0;bottom:0;width:100%;opacity:0}
#sampulBox .kadNaik{position:absolute;left:23%;width:54%;bottom:12%;opacity:0;z-index:-1}
#sampulBox.dibuka{animation:none}
#sampulBox.dibuka .tutup{opacity:0;transition:opacity .35s}
#sampulBox.dibuka .buka{opacity:1;transition:opacity .35s}
#sampulBox.dibuka .kadNaik{opacity:1;transform:translateY(-42%);transition:transform 1s cubic-bezier(.2,.8,.3,1) .35s,opacity .3s .3s}
@keyframes apung{50%{transform:translateY(-8px)}}

/* babak utama */
#pentas{position:fixed;left:0;top:0;transform-origin:0 0;z-index:10;opacity:0;pointer-events:none;transition:opacity 1s,filter .5s}
#pentas.on{opacity:1;pointer-events:auto}
#pentas.kabur{filter:blur(6px) saturate(.8);opacity:.45}
.ob{position:absolute;touch-action:none;transform:translate(var(--x,0px),var(--y,0px)) rotate(var(--r,0deg)) scale(var(--s,1));
  transition:transform .9s cubic-bezier(.2,.8,.3,1.1),opacity .6s;filter:drop-shadow(0 8px 12px rgba(90,40,30,.28))}
.ob{cursor:grab}
.ob.seret{transition:none;cursor:grabbing;z-index:60}
#pentas.angkat .ob:not(.seret){filter:blur(5px) saturate(.85);opacity:.45;transition:filter .35s,opacity .35s,transform .9s cubic-bezier(.2,.8,.3,1.1)}
.ob.sorok{opacity:0}
#pentas:not(.masuk) .ob{--s:.4;opacity:0}
.ob img.sp{display:block;width:100%;pointer-events:none}
/* pemegang seret (butang bulat ikon 4 titik, macam video) */
.pg{position:absolute;right:-9px;top:-9px;width:26px;height:26px;border-radius:50%;background:#fff;box-shadow:0 2px 6px rgba(90,40,30,.3);cursor:grab;touch-action:none;z-index:5;
  display:flex;align-items:center;justify-content:center}
.pg::before{content:"";width:12px;height:12px;background:radial-gradient(circle,#a07a3a 2.4px,transparent 2.6px) 0 0/6px 6px}
.pg:active{cursor:grabbing}
.ob.kiri .pg{right:auto;left:-9px}
#oSampul{cursor:default;filter:drop-shadow(0 10px 18px rgba(90,40,30,.25))}
/* kad flip */
#oKad{perspective:1400px;filter:none;cursor:pointer}
#oKad .dalam{position:relative;width:100%;transform-style:preserve-3d;transition:transform .9s cubic-bezier(.3,.7,.3,1)}
#oKad.balik .dalam{transform:rotateY(180deg)}
#oKad .muka{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;filter:drop-shadow(0 8px 12px rgba(90,40,30,.28))}
#oKad .muka.d{position:relative}
#oKad .muka.b{transform:rotateY(180deg)}
#oKad .pusing{position:absolute;left:50%;top:calc(var(--u)*-2.5);transform:translateX(-50%);white-space:nowrap;z-index:3;pointer-events:none;
  background:rgba(255,255,255,.88);color:#8a5a1c;border-radius:999px;padding:calc(var(--u)*1.3) calc(var(--u)*3);font:italic 600 calc(var(--u)*2.8) 'Cormorant Garamond',serif;
  box-shadow:0 3px 10px rgba(90,40,30,.2);animation:pusingDenyut 1.8s ease-in-out infinite;transition:opacity .4s}
#oKad.balik .pusing,#oKad.sudah .pusing{opacity:0}
@keyframes pusingDenyut{50%{transform:translateX(-50%) scale(1.06)}}
#oKad .muka img{display:block;width:100%;height:100%}
#msj{position:absolute;overflow:hidden;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:0 4%;
  font-family:'Libre Baskerville',serif;color:#5e4320;line-height:1.55;white-space:pre-line}
#msj .ttd{display:block;align-self:stretch;margin-top:.6em;font-style:italic;text-align:right;white-space:nowrap}
/* polaroid kecil */
.pol{cursor:pointer}
.pol .ft{position:absolute;overflow:hidden;background:#efe0bd}
.pol .ft img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.pol .ft .tutup{position:absolute;inset:0;background:linear-gradient(155deg,#8a5a10 0%,#c9901e 35%,#ecc45a 70%,#fbe7a6 100%);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2%;
  font:italic 600 calc(var(--u)*2.9) 'Cormorant Garamond',serif;color:#fff;transition:opacity .6s;text-shadow:0 1px 3px rgba(0,0,0,.25)}
.pol .ft .tutup::after{content:"✦";font-size:.55em;opacity:.8}
.pol.siap .ft .tutup{opacity:0}
.pol .no{position:absolute;left:10%;bottom:4.5%;font:500 calc(var(--u)*1.7) 'Libre Baskerville',serif;color:#a07a3a}
.pol .kosong{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;color:rgba(150,90,100,.35);font-size:calc(var(--u)*6)}
/* polaroid dibesarkan (gosok) */
#besar{position:fixed;inset:0;z-index:60;display:none}
#besar.on{display:block}
#besar:not(.vid) #bVid,#besar.vid #bPol{display:none}
#besar .sinar{position:absolute;left:50%;top:50%;width:80vmin;height:80vmin;transform:translate(-50%,-50%);border-radius:50%;background:radial-gradient(circle,rgba(255,240,235,.75),rgba(255,240,235,0) 65%);pointer-events:none}
#bPol{position:absolute;left:0;top:0;transform-origin:0 0;filter:drop-shadow(0 14px 24px rgba(90,40,30,.35))}
#bPol>img{display:block;width:100%}
#bPol .pg{cursor:default}
#bFt{position:absolute;overflow:hidden;background:#efe0bd}
#bFt img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
#bFt canvas{position:absolute;inset:0;width:100%;height:100%;touch-action:none;cursor:crosshair;transition:opacity .7s}
#bNo{position:absolute;left:10%;bottom:4.5%;font:500 12px 'Libre Baskerville',serif;color:#a07a3a}
/* kad video dibesarkan */
#bVid{position:absolute;left:0;top:0;transform-origin:0 0;background:#111;border-radius:14px;overflow:hidden;box-shadow:0 18px 40px rgba(60,20,20,.45);aspect-ratio:16/9}
#bVid iframe{position:absolute;inset:0;width:100%;height:100%;border:0}
#bVid .tt{position:absolute;left:0;right:0;bottom:-34px;text-align:center;font:italic 500 13px 'Cormorant Garamond',serif;color:rgba(90,58,52,.8);pointer-events:none}
/* kad video */
#oVid{cursor:pointer;background:#111;border-radius:calc(var(--u)*2.2);overflow:hidden;aspect-ratio:16/10}
#oVid .th{position:absolute;inset:0;background:#222 center/cover no-repeat}
#oVid .th::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(0,0,0,.45),transparent 40%,rgba(0,0,0,.35))}
#oVid .mn{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:calc(var(--u)*12);height:calc(var(--u)*8.4);border-radius:calc(var(--u)*2.4);background:#e62117;z-index:2}
#oVid .mn::after{content:"";position:absolute;left:40%;top:28%;border-left:calc(var(--u)*3.6) solid #fff;border-top:calc(var(--u)*2) solid transparent;border-bottom:calc(var(--u)*2) solid transparent}
#oVid .tj{position:absolute;left:5%;top:6%;right:5%;z-index:2;font:600 calc(var(--u)*2.6)/1.2 Poppins,sans-serif;color:#fff}
#oVid iframe{position:absolute;inset:0;width:100%;height:100%;border:0;z-index:3}
/* kad lagu */
#oLagu{background:#121212;border-radius:calc(var(--u)*2.4);padding:calc(var(--u)*2.2);display:flex;align-items:center;gap:calc(var(--u)*2.4);color:#fff;font-family:Poppins,sans-serif}
#oLagu .cv{flex:0 0 calc(var(--u)*11);height:calc(var(--u)*11);border-radius:calc(var(--u)*1.2);background:linear-gradient(135deg,#f2c14e,#b0741c) center/cover}
#oLagu .tx{flex:1;min-width:0}
#oLagu .t1{font-weight:600;font-size:calc(var(--u)*2.7);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#oLagu .t2{font-size:calc(var(--u)*2.2);color:#b3b3b3;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:2px}
#oLagu .eq{display:flex;gap:2px;align-items:flex-end;height:calc(var(--u)*2.4);margin-top:calc(var(--u)*1)}
#oLagu .eq i{width:3px;background:#f2c14e;height:30%}
#oLagu.main .eq i{animation:eq .9s ease-in-out infinite}
#oLagu .eq i:nth-child(2){animation-delay:.2s}#oLagu .eq i:nth-child(3){animation-delay:.4s}#oLagu .eq i:nth-child(4){animation-delay:.1s}
@keyframes eq{50%{height:100%}}
#oLagu .bt{flex:0 0 calc(var(--u)*8);height:calc(var(--u)*8);border-radius:50%;background:#fff;border:0;position:relative;cursor:pointer}
#oLagu .bt::after{content:"";position:absolute;left:38%;top:28%;border-left:calc(var(--u)*2.8) solid #121212;border-top:calc(var(--u)*1.8) solid transparent;border-bottom:calc(var(--u)*1.8) solid transparent}
#oLagu.main .bt::after{left:32%;top:30%;width:calc(var(--u)*2.8);height:calc(var(--u)*3.4);border:0;border-left:calc(var(--u)*.9) solid #121212;border-right:calc(var(--u)*.9) solid #121212;box-sizing:border-box}
/* peta */
#oPeta{background:#fbf6f0;border-radius:calc(var(--u)*2.4);padding:calc(var(--u)*2.4);font-family:'Cormorant Garamond',serif}
#oPeta .kp{display:flex;align-items:flex-end;justify-content:space-between;margin-bottom:calc(var(--u)*1.6)}
#oPeta small{display:block;font:500 calc(var(--u)*1.5) Poppins,sans-serif;letter-spacing:.2em;color:#a0864f}
#oPeta b{font:600 calc(var(--u)*4.2)/1 'Cormorant Garamond',serif;color:#3d2a26}
#oPeta .zm{display:flex;gap:4px}
#oPeta .zm button{width:calc(var(--u)*5);height:calc(var(--u)*5);border-radius:50%;border:0;background:#2f4b37;color:#fff;font:600 calc(var(--u)*3)/1 Poppins,sans-serif;cursor:pointer}
#oPeta .bingkai{position:relative;overflow:hidden;border-radius:calc(var(--u)*1.4)}
#oPeta .dlm{position:relative;transform-origin:50% 50%;transition:transform .4s}
#oPeta .dlm img{display:block;width:100%}
.pin{position:absolute;width:calc(var(--u)*7);height:calc(var(--u)*7);transform:translate(-50%,-100%);cursor:pointer;z-index:2}
.pin span{position:absolute;inset:0;border-radius:50%;border:2px solid #fff;background:#f2c14e center/cover;box-shadow:0 3px 8px rgba(0,0,0,.35)}
.pin::after{content:"";position:absolute;left:50%;bottom:-5px;width:9px;height:9px;background:#2f9e5b;border:2px solid #fff;border-radius:50%;transform:translateX(-50%)}

/* pelekat kejutan (kunci sampai semua polaroid digosok) */
#oKejut{cursor:pointer;background:#fdf6e3;border-radius:calc(var(--u)*2.4);padding:calc(var(--u)*2) calc(var(--u)*2.4);text-align:center;font-family:'Cormorant Garamond',serif;border:2px dashed #d8a21c}
#oKejut .ik{font-size:calc(var(--u)*7);line-height:1}
#oKejut b{display:block;font:italic 600 calc(var(--u)*3.2)/1.1 'Cormorant Garamond',serif;color:#b0741c;margin-top:calc(var(--u)*.8)}
#oKejut small{display:block;font:500 calc(var(--u)*2) Poppins,sans-serif;color:#a0864f;margin-top:calc(var(--u)*.6)}
#oKejut.buka{border-style:solid;border-color:#f2c14e;background:#fff}
#oKejut.goyang{animation:goyang .5s ease}
@keyframes goyang{20%{transform:translate(var(--x,0px),var(--y,0px)) rotate(calc(var(--r) - 8deg))}60%{transform:translate(var(--x,0px),var(--y,0px)) rotate(calc(var(--r) + 8deg))}}
/* skrol ucapan */
#oSkrol{cursor:pointer}
#oSkrol .pusing2{position:absolute;left:50%;top:calc(var(--u)*-9);transform:translateX(-50%);white-space:nowrap;pointer-events:none;
  background:rgba(255,255,255,.9);color:#8a5a1c;border-radius:999px;padding:calc(var(--u)*1.3) calc(var(--u)*3);font:italic 600 calc(var(--u)*3.4) 'Cormorant Garamond',serif;
  box-shadow:0 3px 10px rgba(90,60,20,.2);animation:pusingDenyut 1.8s ease-in-out infinite;transition:opacity .4s}
#oSkrol.sudah .pusing2{opacity:0}
#lapSk{z-index:950;flex-direction:column}
#skBox{position:relative;width:min(86vw,380px);display:flex;flex-direction:column;align-items:center;filter:drop-shadow(0 18px 30px rgba(90,60,20,.35))}
#skBox .gl{position:relative;width:108%;height:30px;border-radius:15px;z-index:2;
  background:linear-gradient(180deg,#fff8e8 0%,#f3e2bd 35%,#dcc28e 70%,#b99a60 100%);box-shadow:inset 0 -3px 5px rgba(120,80,30,.25)}
#skBox .gl::before,#skBox .gl::after{content:"";position:absolute;top:3px;width:18px;height:24px;border-radius:50%;background:radial-gradient(circle at 40% 40%,#f7ead0,#c9ab70)}
#skBox .gl::before{left:-6px}#skBox .gl::after{right:-6px}
#skKertas{width:100%;max-height:0;overflow:hidden;background:#fbf2dc;background-image:radial-gradient(ellipse at 50% 0%,rgba(255,255,255,.6),transparent 60%),
  linear-gradient(90deg,rgba(185,150,90,.18),transparent 8%,transparent 92%,rgba(185,150,90,.18));transition:max-height 1.3s cubic-bezier(.3,.7,.3,1) .45s;margin:-6px 0}
#lapSk.buka #skKertas{max-height:68vh}
#skDlm{padding:26px 26px 30px;text-align:center;max-height:68vh;overflow-y:auto;opacity:0;transition:opacity .8s 1.3s}
#lapSk.buka #skDlm{opacity:1}
#skDlm .ik{font-size:30px;line-height:1}
#skDlm h3{font:italic 600 1.9rem/1.1 'Cormorant Garamond',serif;color:#8a5a1c;margin:8px 0 4px}
#skDlm .gar{width:60%;height:1px;margin:10px auto 14px;background:linear-gradient(90deg,transparent,#d8a21c,transparent)}
#skDlm p{font:1rem/1.75 'Libre Baskerville',serif;color:#4a3316;white-space:pre-line}
#skDlm .ttd{margin-top:18px;font:italic 600 1.3rem 'Cormorant Garamond',serif;color:#8a5a1c}
#skReben{position:absolute;left:50%;top:50%;width:120px;transform:translate(-50%,-50%);z-index:3;pointer-events:none;transition:transform 1s cubic-bezier(.5,0,.7,.4),opacity .8s}
#lapSk.buka #skReben{transform:translate(-50%,40vh) rotate(160deg);opacity:0}
#lapSk .tt2{margin-top:18px;font:italic 13px 'Cormorant Garamond',serif;color:rgba(90,60,20,.7)}
/* lapisan */
.lap{position:fixed;inset:0;z-index:80;display:none;align-items:center;justify-content:center;padding:20px;background:rgba(120,70,60,.35);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px)}
.lap.on{display:flex;animation:muncul .4s ease}
@keyframes muncul{from{opacity:0}}
.x{position:absolute;right:-10px;top:-10px;width:30px;height:30px;border-radius:50%;border:0;background:#fff;color:#8a5a1c;box-shadow:0 3px 10px rgba(0,0,0,.2);font-size:14px;cursor:pointer;z-index:5}
#pinBox,#kjBox{position:relative;width:min(80vw,300px);background:#fbf6f0;border-radius:18px;padding:12px 12px 16px;box-shadow:0 20px 50px rgba(60,20,20,.35);animation:naik .5s cubic-bezier(.2,.8,.3,1.2)}
#pinBox .gm,#kjBox .gm{width:100%;aspect-ratio:1.2;border-radius:12px;background:#f1e2bf center/cover}
#pinBox .tr{margin-top:10px;font:500 10px Poppins,sans-serif;letter-spacing:.14em;color:#a0864f}
#pinBox h4{font:600 1.6rem/1.1 'Cormorant Garamond',serif;color:#3d2a26;margin-top:2px}
#pinBox .tp{font:italic 500 1rem 'Cormorant Garamond',serif;color:#8a5a1c}
.vn{margin-top:12px;display:flex;align-items:center;gap:10px;background:#fff;border-radius:40px;padding:6px 12px 6px 6px;box-shadow:0 2px 8px rgba(90,40,30,.1)}
.vn button{flex:0 0 34px;height:34px;border-radius:50%;border:0;background:#2f4b37;color:#fff;font-size:12px;cursor:pointer}
.vn .gl{flex:1;display:flex;gap:2px;align-items:center;height:22px}
.vn .gl i{flex:1;background:#d9c8c1;border-radius:2px}
.vn .gl i.on{background:#2f4b37}
.vn .ms{font:500 11px Poppins,sans-serif;color:#8a5a1c;min-width:30px;text-align:right}
.vn b{display:block;font:600 12px Poppins,sans-serif;color:#3d2a26}
#kjBox{text-align:center}
#kjBox h3{font:italic 600 1.9rem 'Cormorant Garamond',serif;color:#b0741c;margin:4px 0 10px}
#kjBox p{margin-top:12px;font:italic 1rem/1.6 'Libre Baskerville',serif;color:#5e4320;white-space:pre-line}
#lb{z-index:1000;background:rgba(40,10,10,.92);padding:0;touch-action:none;overflow:hidden}
#lb img{max-width:100vw;max-height:100vh;border-radius:0;box-shadow:none;transform-origin:0 0;will-change:transform;-webkit-user-drag:none}
#lb .tt{position:absolute;left:0;right:0;bottom:calc(env(safe-area-inset-bottom,0px) + 16px);text-align:center;font:italic 13px 'Cormorant Garamond',serif;color:rgba(255,255,255,.6);pointer-events:none}
#lb .x{position:fixed;right:14px;top:14px;background:rgba(255,255,255,.9);z-index:2}
#pinBox .gm,#kjBox .gm{cursor:zoom-in}
.hati{position:fixed;z-index:90;pointer-events:none;animation:jatuh 2.6s ease-in forwards}
@keyframes jatuh{to{transform:translateY(110vh) rotate(260deg);opacity:.2}}
#hint{position:fixed;left:0;right:0;bottom:calc(env(safe-area-inset-bottom,0px) + 14px);z-index:30;text-align:center;font:italic 500 13px 'Cormorant Garamond',serif;color:rgba(90,58,52,.75);opacity:0;transition:opacity 1s;pointer-events:none}

#bhs{position:fixed;top:10px;right:10px;z-index:95;display:flex;background:rgba(255,255,255,.85);border-radius:30px;padding:3px;box-shadow:0 2px 10px rgba(90,40,30,.2)}

function intro(){
  var W=innerWidth,H=innerHeight,bx=$('bunga'),cell=Math.max(72,Math.min(W,H)/3.6);
  /* 1. dinding penuh */
  var dind=[];

    e.style.transform=TR(px,py,sz,1,r);bx.appendChild(e);dind.push({e:e,x:px,y:py,sz:sz,r:r});}
  later(function(){dind.forEach(function(f){var a=Math.atan2(f.y-H/2,f.x-W/2),d=Math.max(W,H);
    f.e.animate([{transform:TR(f.x,f.y,f.sz,1,f.r),opacity:1},{transform:TR(f.x+Math.cos(a)*d*.8,f.y+Math.sin(a)*d*.8,f.sz,1.4,f.r+rnd(-90,90)),opacity:0}],{duration:rnd(600,900),easing:'cubic-bezier(.5,0,.8,.6)',fill:'forwards'});});
    later(function(){dind.forEach(function(f){f.e.remove();});},950);},700);
  /* 2. komet peony */
  later(function(){var sz=Math.min(W,H)*.34,e=bungaEl(sz,'topi2');bx.appendChild(e);
    var x0=W*1.05,y0=-sz*.4,x1=W*.2,y1=H*.62,t0=performance.now(),dur=1500;
    (function langkah(t){var p=Math.min(1,(t-t0)/dur),q=1-Math.pow(1-p,2),x=x0+(x1-x0)*q,y=y0+(y1-y0)*q;
      e.style.transform=TR(x,y,sz,.8+.2*q,-20+q*30);
      if(p<.92&&Math.random()<.9){var s=document.createElement('div');s.className='asap';var r=sz*rnd(.25,.45);s.style.width=s.style.height=r+'px';
        s.style.left=(x-r/2+rnd(-sz*.15,sz*.15))+'px';s.style.top=(y-r/2+rnd(-sz*.15,sz*.15))+'px';document.body.appendChild(s);
        s.animate([{opacity:.9,transform:'scale(.6)'},{opacity:0,transform:'scale(2.2)'}],{duration:1100,easing:'ease-out',fill:'forwards'});setTimeout(function(){s.remove();},1150);}
      if(p<1)requestAnimationFrame(langkah);else e.animate([{opacity:1},{opacity:0,transform:TR(x,y,sz,1.1,10)}],{duration:500,fill:'forwards'});})(t0);
  },1300);
  /* 3. bunga masuk satu-satu, longgok dari bawah */
  later(function(){var sen=[];
    for(var y=H/cell+1;y>-.6;y-=.62)for(var x=-.3;x<W/cell+1;x+=.62)sen.push({x:x*cell+rnd(-24,24),y:y*cell+rnd(-24,24),sz:cell*rnd(1.1,1.55),r:rnd(-40,40)});
    var n=sen.length;
    sen.forEach(function(f,i){var e=bungaEl(f.sz);bx.appendChild(e);f.e=e;var dari=Math.random();
      var sx=dari<.5?rnd(-.2,1.2)*W:(dari<.75?-f.sz:W+f.sz),sy=dari<.5?H+f.sz:rnd(.3,1)*H;
      e.animate([{transform:TR(sx,sy,f.sz,.5,f.r-90),opacity:0},{opacity:1,offset:.25},{transform:TR(f.x,f.y,f.sz,1,f.r),opacity:1}],
        {duration:900,delay:i/n*2800+rnd(0,250),easing:'cubic-bezier(.2,.8,.3,1)',fill:'both'});});
    /* 4. tersingkap ke atas */
    later(function(){$('latarPeach').style.opacity=1;$('skSampul').classList.add('on');
      sen.forEach(function(f){f.e.animate([{transform:TR(f.x,f.y,f.sz,1,f.r)},{transform:TR(f.x+rnd(-30,30),f.y-H*1.15,f.sz,1,f.r+rnd(-40,40))}],
        {duration:1300,delay:(1-f.y/H)*200+rnd(0,300),easing:'cubic-bezier(.6,0,.4,1)',fill:'forwards'});});
      later(function(){bx.innerHTML='';selesaiIntro();},1900);},3900);
  },2900);
  $('langkau').onclick=function(){langkau();};
}

/* ═══ SERET (badan atau pemegang, macam video) + KETIK ═══ */
var zTop=20,AMBANG=9;
function seretan(el,ketik){
  var id=null,sx,sy,bx,by,gerak=false;
  function mula(e,paksa){if(e.target.closest('button,iframe,.pin'))return;id=e.pointerId;sx=e.clientX;sy=e.clientY;
    bx=parseFloat(el.style.getPropertyValue('--x'))||0;by=parseFloat(el.style.getPropertyValue('--y'))||0;gerak=false;el.style.zIndex=++zTop;
    if(paksa)angkat();}
  function angkat(){gerak=true;el.classList.add('seret');$('pentas').classList.add('angkat');try{el.setPointerCapture(id);}catch(_){}}
  el.addEventListener('pointerdown',function(e){var pg=e.target.closest('.pg');mula(e,!!pg);if(pg)e.preventDefault();});
  el.addEventListener('pointermove',function(e){if(e.pointerId!==id)return;var dx=e.clientX-sx,dy=e.clientY-sy;
    if(!gerak&&Math.hypot(dx,dy)>AMBANG)angkat();
    if(gerak){e.preventDefault();el.style.setProperty('--x',(bx+dx/SKALA)+'px');el.style.setProperty('--y',(by+dy/SKALA)+'px');}});
  function lepas(e){if(e.pointerId!==id)return;id=null;var g=gerak;gerak=false;el.classList.remove('seret');$('pentas').classList.remove('angkat');
    if(!g&&ketik&&!e.target.closest('.pg,button,iframe'))ketik(e);}
  el.addEventListener('pointerup',lepas);el.addEventListener('pointercancel',function(e){if(e.pointerId!==id)return;id=null;gerak=false;el.classList.remove('seret');$('pentas').classList.remove('angkat');});
}

/* ═══ CALAR (scratch) — polaroid besar di tengah, tetap, latar kabur ═══ */
var calarEl=null,calarSiap={},calarBuka=false;
function bukaCalar(el){
  var k=el.getAttribute('data-p');if(!D[k]||calarBuka)return;
  if(el.classList.contains('siap')){lbBuka(D[k]);return;}
  calarBuka=true;calarEl=el;
  var b=$('bPol'),ft=$('bFt');b.querySelector('img').src=ASET.polaroid;
  ft.style.left=(SLOT_POL.l-SLOT_POL.w/2)+'%';ft.style.top=(SLOT_POL.t-SLOT_POL.h/2)+'%';ft.style.width=SLOT_POL.w+'%';ft.style.height=SLOT_POL.h+'%';
  $('bImg').src=D[k];$('bImg').style.objectPosition=D[k+'_pos']||'50% 50%';$('bNo').textContent=el.querySelector('.no').textContent;
  /* saiz akhir: 62vmin lebar maks, muat tinggi */
  var W=innerWidth,H=innerHeight,bw=Math.min(W*.68,H*.66/POL_R,340),bh=bw*POL_R;b.style.width=bw+'px';
  var r0=el.getBoundingClientRect(),x1=(W-bw)/2,y1=(H-bh)/2;
  $('besar').classList.add('on');$('pentas').classList.add('kabur');el.classList.add('sorok');
  b.animate([{transform:'translate('+r0.left+'px,'+r0.top+'px) scale('+(r0.width/bw)+') rotate('+(SUSUN[k].r)+'deg)'},{transform:'translate('+x1+'px,'+y1+'px) scale(1) rotate(0deg)'}],
    {duration:650,easing:'cubic-bezier(.2,.8,.3,1)',fill:'forwards'});
  setTimeout(function(){var cv=$('bCv'),r=ft.getBoundingClientRect(),dp=Math.min(2,devicePixelRatio||1);
    cv.width=r.width*dp;cv.height=r.height*dp;cv.style.opacity=1;var c=cv.getContext('2d');c.setTransform(dp,0,0,dp,0,0);
    var g=c.createLinearGradient(0,0,r.width,r.height);g.addColorStop(0,'#8a5a10');g.addColorStop(.35,'#c9901e');g.addColorStop(.7,'#ecc45a');g.addColorStop(1,'#fbe7a6');
    c.globalCompositeOperation='source-over';c.fillStyle=g;c.fillRect(0,0,r.width,r.height);
    c.fillStyle='rgba(255,255,255,.96)';c.font='italic 600 '+Math.round(r.width*.11)+'px "Cormorant Garamond",serif';c.textAlign='center';c.textBaseline='middle';c.fillText(T('scratch'),r.width/2,r.height/2);
    c.font=Math.round(r.width*.06)+'px serif';c.fillText('\u2726',r.width/2,r.height/2+r.width*.11);
    c.globalCompositeOperation='destination-out';c.lineCap='round';c.lineJoin='round';c.lineWidth=r.width*.16;
    var aktif=false,lx,ly,siap=false,kira=0;
    function pt(e){var bb=cv.getBoundingClientRect();return[e.clientX-bb.left,e.clientY-bb.top];}
    function semak(){var d=c.getImageData(0,0,cv.width,cv.height).data,n=0,t=0;for(var i=3;i<d.length;i+=48){t++;if(d[i]<40)n++;}return n/t;}
    cv.onpointerdown=function(e){e.preventDefault();aktif=true;try{cv.setPointerCapture(e.pointerId);}catch(_){}var p=pt(e);lx=p[0];ly=p[1];c.beginPath();c.arc(lx,ly,c.lineWidth/2,0,7);c.fill();};
    cv.onpointermove=function(e){if(!aktif||siap)return;var p=pt(e);c.beginPath();c.moveTo(lx,ly);c.lineTo(p[0],p[1]);c.stroke();lx=p[0];ly=p[1];
      if(++kira%6===0&&semak()>.55){siap=true;cv.style.opacity=0;terdedah(calarEl);}};
    cv.onpointerup=cv.onpointercancel=function(){aktif=false;if(!siap&&semak()>.55){siap=true;cv.style.opacity=0;terdedah(calarEl);}};
  },700);
}
function polAda(){return [].filter.call(document.querySelectorAll('.pol'),function(p){return p.dataset.ada;}).length;}

/* lightbox: cubit zum, seret, dwiketik; ketik sekali (tanpa zum) = tutup */
var LB={s:1,x:0,y:0};
function lbBuka(src){var im=$('lbimg');im.src=src;LB={s:1,x:0,y:0};lbTerap();$('lbTt').textContent=T('lbTt');$('lb').classList.add('on');}
function lbTerap(){$('lbimg').style.transform='translate('+LB.x+'px,'+LB.y+'px) scale('+LB.s+')';}
(function(){var lb=$('lb'),im=$('lbimg'),pts={},d0=0,s0=1,c0=null,x0=0,y0=0,gerak=false,lastTap=0,tapT=0;
  function pusat(){var k=Object.keys(pts);if(k.length<2)return null;var a=pts[k[0]],b=pts[k[1]];return{x:(a.x+b.x)/2,y:(a.y+b.y)/2,d:Math.hypot(a.x-b.x,a.y-b.y)};}
  lb.addEventListener('pointerdown',function(e){if(e.target.closest('.x'))return;pts[e.pointerId]={x:e.clientX,y:e.clientY};try{lb.setPointerCapture(e.pointerId);}catch(_){}
    var p=pusat();if(p){d0=p.d;s0=LB.s;c0=p;x0=LB.x;y0=LB.y;}else{x0=LB.x;y0=LB.y;c0={x:e.clientX,y:e.clientY};}gerak=false;tapT=Date.now();});
  lb.addEventListener('pointermove',function(e){if(!pts[e.pointerId])return;pts[e.pointerId]={x:e.clientX,y:e.clientY};var p=pusat();
    if(p){var s=Math.max(1,Math.min(5,s0*p.d/d0));var r=im.getBoundingClientRect();
      /* zum ke arah titik cubit: kekalkan titik bawah jari */
      var px=(c0.x-(x0+im.offsetLeft))/s0,py=(c0.y-(y0+im.offsetTop))/s0;
      LB.s=s;LB.x=p.x-im.offsetLeft-px*s;LB.y=p.y-im.offsetTop-py*s;gerak=true;lbTerap();}
    else if(LB.s>1){var dx=e.clientX-c0.x,dy=e.clientY-c0.y;if(Math.hypot(dx,dy)>6)gerak=true;LB.x=x0+dx;LB.y=y0+dy;lbTerap();}});
  function lepas(e){if(!pts[e.pointerId])return;delete pts[e.pointerId];
    if(Object.keys(pts).length===0){var t=Date.now();
      if(!gerak&&t-tapT<300){if(t-lastTap<320){/* dwiketik: zum 2.5x ke titik / reset */
          if(LB.s>1){LB={s:1,x:0,y:0};}else{var s=2.5,px=e.clientX-im.offsetLeft,py=e.clientY-im.offsetTop;LB={s:s,x:px-px*s,y:py-py*s};}lbTerap();lastTap=0;}
        else{lastTap=t;setTimeout(function(){if(lastTap===t&&LB.s===1)tutupLap('lb');},320);}}
      if(LB.s===1){LB.x=0;LB.y=0;lbTerap();}}
    else{var k=Object.keys(pts)[0];c0={x:pts[k].x,y:pts[k].y};x0=LB.x;y0=LB.y;}}
  lb.addEventListener('pointerup',lepas);lb.addEventListener('pointercancel',lepas);
})();

  $('besar').classList.add('on','vid');$('pentas').classList.add('kabur');el.classList.add('sorok');$('bVidTt').textContent=T('tutup');
  b.animate([{transform:'translate('+r0.left+'px,'+r0.top+'px) scale('+(r0.width/bw)+') rotate('+SUSUN.oVid.r+'deg)'},{transform:'translate('+((W-bw)/2)+'px,'+((H-bh)/2)+'px) scale(1) rotate(0deg)'}],
    {duration:600,easing:'cubic-bezier(.2,.8,.3,1)',fill:'forwards'});
  setTimeout(function(){var f=document.createElement('iframe');f.src='https://www.youtube.com/embed/'+id+'?autoplay=1&playsinline=1&rel=0';f.allow='autoplay; encrypted-media; fullscreen';f.allowFullscreen=true;b.appendChild(f);},550);}
function tutupVideo(){if(!vidBuka)return;var b=$('bVid'),f=b.querySelector('iframe');if(f)f.remove();

  b.animate([{transform:'translate('+((W-bw)/2)+'px,'+((H-bh)/2)+'px) scale(1) rotate(0deg)'},{transform:'translate('+r1.left+'px,'+r1.top+'px) scale('+(r1.width/bw)+') rotate('+SUSUN.oVid.r+'deg)'}],
    {duration:450,easing:'cubic-bezier(.4,0,.6,1)',fill:'forwards'});

/* ═══ MUZIK ═══ */
var mode=null,ytp=null,ytOk=false,siapM=false,mainLagu=false,dihentiUser=false;
function muzik(){if(siapM||!D)return;siapM=true;
  if(D.mp3){mode='mp3';var a=$('mp3');a.src=D.mp3;a.play().then(function(){setMain(true);}).catch(function(){});}
  else if(D.yt){var id=ytId(D.yt);if(!id)return;mode='yt';
    if(window.YT&&YT.Player)buatYT(id);else{var s=document.createElement('script');s.src='https://www.youtube.com/iframe_api';document.head.appendChild(s);window.onYouTubeIframeAPIReady=function(){buatYT(id);};}}
  ['pointerdown','touchstart'].forEach(function(ev){document.addEventListener(ev,function(){if(!dihentiUser&&!mainLagu&&!vidBuka&&$('suara').paused)sambungMuzik(false);},{passive:true});});
}
function buatYT(id){ytp=new YT.Player('yt-root',{width:'1',height:'1',videoId:id,playerVars:{autoplay:1,controls:0,disablekb:1,fs:0,rel:0,playsinline:1,loop:1,playlist:id},
  events:{onReady:function(){ytOk=true;try{ytp.playVideo();}catch(e){}},onStateChange:function(e){setMain(e.data===1);}}});}
function setMain(b){mainLagu=b;$('oLagu').classList.toggle('main',b);}
function hentiMuzik(user){if(user)dihentiUser=true;if(mode==='mp3'){$('mp3').pause();setMain(false);}else if(ytp&&ytOk)try{ytp.pauseVideo();}catch(e){}}
function sambungMuzik(user){if(user)dihentiUser=false;if(dihentiUser)return;
  if(mode==='mp3'){var a=$('mp3');if(a.paused)a.play().then(function(){setMain(true);}).catch(function(){});}
  else if(mode==='yt'&&ytp&&ytOk){try{if(ytp.getPlayerState()!==1)ytp.playVideo();}catch(e){}}}
