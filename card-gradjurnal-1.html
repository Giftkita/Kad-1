*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;background:#e9dccb;overflow:hidden;font-family:"Fredoka",system-ui,sans-serif;color:#2b2622;
  touch-action:none;user-select:none;-webkit-user-select:none;-webkit-tap-highlight-color:transparent}
#pentas{position:fixed;inset:0;overflow:hidden;background:#e9dccb;perspective:2200px}
#kamera{position:absolute;left:0;top:0;will-change:transform;transform-style:preserve-3d}
.adegan{position:absolute;left:0;top:0;width:100%;height:100%;overflow:hidden;container-type:inline-size;background:#e9dccb}
.adegan>img.bg{position:absolute;inset:0;width:100%;height:100%;display:block}
.adegan img{pointer-events:none}
.adegan>img.atas{position:absolute;pointer-events:none;z-index:6}
/* cahaya lampu hangat macam video */
.adegan:after{content:'';position:absolute;inset:0;pointer-events:none;z-index:9;
  background:radial-gradient(ellipse at 55% 35%,rgba(255,226,170,.10),rgba(90,50,10,.12) 85%)}
.slot{position:absolute;overflow:hidden;background:#e7e0d6;z-index:4;cursor:pointer}
.slot img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:block}
.slot:before{content:'';position:absolute;inset:0;z-index:2;pointer-events:none;
  background:linear-gradient(135deg,rgba(255,255,255,.10),rgba(0,0,0,0) 40%,rgba(0,0,0,.06));box-shadow:0 0 0 1px rgba(0,0,0,.06) inset}
.slot.oval{border-radius:50%}
.slot .kosong{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;color:#a99c8c;font:600 1.3cqw/1 Fredoka,sans-serif}
.tx{position:absolute;transform:translate(-50%,-50%);display:flex;align-items:center;justify-content:center;text-align:center;
  pointer-events:none;z-index:5;line-height:1.18;color:#2b2622;font-family:"Patrick Hand",cursive;overflow:hidden}
.tx.kiri{justify-content:flex-start;text-align:left;align-items:flex-start}
.tx.p{white-space:pre-wrap}
.tj{font-family:"Gochi Hand",cursive;color:#2b2622}
.gel{font:700 5.2cqw/1 Fredoka,sans-serif;color:#fff;letter-spacing:.02em;
  -webkit-text-stroke:.45cqw #6a3fb0;paint-order:stroke fill;text-shadow:.35cqw .35cqw 0 #e9418a}
.mjl{flex-direction:column;color:#fff;font:700 2.6cqw/1.02 Fredoka,sans-serif;text-transform:uppercase}
.mjl small{font-size:1.1cqw;letter-spacing:.12em;margin-top:.8cqw;font-weight:600}
.surat{position:absolute;z-index:5;overflow:hidden;cursor:pointer;display:flex;flex-direction:column;
  background:#fffdf6 repeating-linear-gradient(to bottom,transparent 0,transparent calc(2.05cqw - 1px),rgba(226,140,160,.35) calc(2.05cqw - 1px),rgba(226,140,160,.35) 2.05cqw);
  background-position:0 1.2cqw;padding:1.6cqw 1.8cqw 1.2cqw;font-family:"Patrick Hand",cursive;color:#2b2622}
.surat .kpd{font-size:1.75cqw;line-height:2.05cqw}
.surat .isi{font-size:1.6cqw;line-height:2.05cqw;white-space:pre-wrap;flex:1;min-height:0;overflow:hidden;
  -webkit-mask:linear-gradient(#000 82%,transparent);mask:linear-gradient(#000 82%,transparent)}
.surat .dari{font-size:1.75cqw;line-height:2.05cqw;text-align:right;color:#b0305a}
.surat .lagi{font:600 1cqw/1 Fredoka,sans-serif;color:#b0305a;text-align:center;margin-top:.4cqw;letter-spacing:.06em}
.vid{position:absolute;z-index:4;overflow:hidden;background:#28222c;cursor:pointer}
.vid img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.vid .main{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:5cqw;height:5cqw;border-radius:50%;
  background:rgba(0,0,0,.55);border:.3cqw solid #fff;display:flex;align-items:center;justify-content:center}
.vid .main svg{width:44%;fill:#fff;margin-left:8%}
.vid .tiada{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;color:#f5d35c;font:600 2.2cqw/1.1 "Gochi Hand",cursive;cursor:default}
.kejut{position:absolute;z-index:4;overflow:hidden;cursor:pointer;background:#f6e7c8}
.kejut img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;filter:blur(1.2cqw) saturate(.8);transform:scale(1.15)}
.kejut .tutup{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:.6cqw;
  background:rgba(255,246,228,.35);font:600 1.5cqw/1.1 Fredoka,sans-serif;color:#b0305a;text-align:center}
.kejut .tutup b{font-size:4cqw;animation:goyang 2.4s ease-in-out infinite}
@keyframes goyang{0%,100%{transform:rotate(0)}10%{transform:rotate(-12deg)}20%{transform:rotate(10deg)}30%{transform:rotate(0)}}
.kejut.buka img{filter:none;transform:none;transition:.6s}.kejut.buka .tutup{opacity:0;transition:.4s}

/* daun yang diselak */
.daun{position:absolute;inset:0;transform-style:preserve-3d;z-index:50;pointer-events:none}
.daun .muka{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden}
.daun .bayang{position:absolute;inset:0;pointer-events:none;opacity:0}
.statik{position:absolute;inset:0;z-index:40;pointer-events:none}

/* UI */
#ui{position:fixed;left:0;right:0;bottom:max(12px,env(safe-area-inset-bottom));display:flex;justify-content:center;gap:12px;align-items:center;z-index:1000}
#ui button{background:rgba(255,255,255,.82);border:0;color:#6a4a3a;border-radius:999px;width:44px;height:44px;font-size:20px;cursor:pointer;box-shadow:0 3px 10px rgba(80,50,20,.25)}
#ui button:disabled{opacity:.35}
#kira{font:600 12px/1 Fredoka,sans-serif;letter-spacing:.1em;color:#6a4a3a;background:rgba(255,255,255,.7);padding:7px 12px;border-radius:999px;min-width:58px;text-align:center}
#atasUI{position:fixed;top:10px;left:0;right:0;display:flex;justify-content:space-between;padding:0 10px;z-index:1000;pointer-events:none}
#atasUI>*{pointer-events:auto}
.pil{background:rgba(255,255,255,.88);border:0;border-radius:999px;padding:7px 12px;font:600 11px/1 Fredoka,sans-serif;color:#6a4a3a;cursor:pointer}
#badge{background:#e9418a;color:#fff;font:700 10px/1 system-ui;letter-spacing:.12em;padding:7px 10px;border-radius:999px;display:none}
#alat{position:fixed;right:10px;bottom:72px;display:flex;flex-direction:column;gap:8px;z-index:1000}
#alat button{width:40px;height:40px;border-radius:50%;border:0;background:rgba(255,255,255,.82);color:#6a4a3a;font-size:16px;cursor:pointer;box-shadow:0 3px 10px rgba(80,50,20,.25)}
#petua{position:fixed;top:54px;left:0;right:0;text-align:center;z-index:1000;pointer-events:none;transition:opacity .6s}
#petua span{display:inline-block;background:rgba(255,255,255,.85);color:#6a4a3a;font:600 12px/1 Fredoka,sans-serif;padding:8px 14px;border-radius:999px}
#tapTxt{position:fixed;left:0;right:0;bottom:16%;text-align:center;z-index:1001;pointer-events:none;transition:opacity .5s}
#tapTxt span{display:inline-block;background:rgba(255,255,255,.9);color:#b0305a;font:600 15px/1.2 Fredoka,sans-serif;padding:11px 20px;border-radius:999px;
  box-shadow:0 6px 20px rgba(80,50,20,.25);animation:pul 2.2s ease-in-out infinite}
@keyframes pul{0%,100%{transform:scale(1)}50%{transform:scale(1.06)}}
body.buka #tapTxt{opacity:0}
body:not(.buka) #ui,body:not(.buka) #alat{opacity:0;pointer-events:none}
#tutupBuku{display:none}
#pusing{position:fixed;left:0;right:0;top:calc(50% + 39vw + 14px);text-align:center;z-index:1000;pointer-events:none;display:none}
#pusing span{display:inline-flex;align-items:center;gap:8px;background:rgba(255,255,255,.92);color:#b0305a;font:600 13px/1.25 Fredoka,sans-serif;
  padding:10px 16px;border-radius:14px;box-shadow:0 4px 14px rgba(80,50,20,.2)}
#pusing i{font-style:normal;font-size:22px;display:inline-block;animation:pusingFon 2.4s ease-in-out infinite}
@keyframes pusingFon{0%,30%{transform:rotate(0)}55%,85%{transform:rotate(-90deg)}100%{transform:rotate(0)}}
body.potret #pusing{display:block}
body.potret #tapTxt{bottom:auto;top:calc(50% - 39vw - 64px)}

.pop{position:fixed;inset:0;background:rgba(40,28,20,.8);z-index:1400;display:none;align-items:center;justify-content:center;padding:18px}
.pop.show{display:flex}
.pop .box{background:#fffdf6;color:#2b2622;border-radius:14px;max-width:460px;width:100%;max-height:84vh;overflow:auto;padding:24px 20px;position:relative;
  font-family:"Patrick Hand",cursive;line-height:1.5;font-size:19px;white-space:pre-wrap}
.pop .x{position:absolute;top:6px;right:10px;background:none;border:0;font-size:26px;color:#b0305a;cursor:pointer;font-family:system-ui}
.pop img,.pop iframe{width:100%;border-radius:10px;display:block;border:0}
.pop iframe{aspect-ratio:16/9}
#ralat{position:fixed;inset:0;display:none;align-items:center;justify-content:center;padding:24px;background:#e9dccb;z-index:1500;text-align:center;line-height:1.7;font-size:14px}
#muat{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:#e9dccb;z-index:1300}
.spin{width:30px;height:30px;border:3px solid #c98a6a;border-right-color:transparent;border-radius:50%;animation:sp .8s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
</style>

/* ---------- kamera (saiz + pan macam video) ---------- */
var kam=$('#kamera'), SW=0, SH=0, panT=0, panArah=1, panRaf=0, panX=0, panMax=0, panHenti=0;
function ukur(){
  var vw=innerWidth, vh=innerHeight, r=4/3;
  /* jurnal sentiasa muat penuh dalam skrin (pegun, tiada pan) — potret: tunjuk nota pusing telefon */
  SW=Math.min(vw, vh*r); SH=SW/r;
  document.body.classList.toggle('potret', vh>vw);
  kam.style.width=SW+'px'; kam.style.height=SH+'px';
  panMax=0;
  kam.style.top=Math.max(0,(vh-SH)/2)+'px';
  if(panMax===0){ kam.style.left=((vw-SW)/2)+'px'; } else kam.style.left='0px';
  letakPan();
}
function letakPan(){ kam.style.transform='translateX('+(-panX)+'px)'; }
function mulaPan(dari){ cancelAnimationFrame(panRaf); if(!panMax) return;
  if(cur===0){ panX=Math.max(0,Math.min(panMax,SW*0.535-innerWidth/2)); letakPan(); return; }   /* kulit: buku di tengah */
  panX = dari==='kanan' ? panMax : 0; panArah = dari==='kanan' ? -1 : 1; letakPan();
  var t0=performance.now()+900, lalu=null;
  (function f(now){ panRaf=requestAnimationFrame(f);
    if(now<t0||now<panHenti) { lalu=now; return; }
    var dt=lalu?Math.min(50,now-lalu):16; lalu=now;
    panX+=panArah*dt*0.035*(panMax/700+0.6);
    if(panX>=panMax){ panX=panMax; panArah=-1; panHenti=now+1800; }
    if(panX<=0){ panX=0; panArah=1; panHenti=now+1800; }
    letakPan(); })(performance.now());
}

/* ---------- papar & selak ---------- */
var adSekarang=null;
function papar(s){
  kam.innerHTML=''; adSekarang=binaAdegan(s); kam.appendChild(adSekarang); cur=s; kira();
}
function kira(){ $('#kira').textContent=(cur===0?'⌂':cur)+' / 7'; $('#prev').disabled=cur<=1; $('#next').textContent=cur>=N_AD-1?'⟲':'›'; }
function klip(el,x0,y0,x1,y1){ el.style.clipPath='inset('+y0+'% '+(100-x1)+'% '+(100-y1)+'% '+x0+'%)'; el.style.webkitClipPath=el.style.clipPath; }
function lubang(el,x0,y0,x1,y1){   /* semua kecuali kotak */
  var p='polygon(evenodd,0 0,100% 0,100% 100%,0 100%,0 0,'+x0+'% '+y0+'%,'+x0+'% '+y1+'%,'+x1+'% '+y1+'%,'+x1+'% '+y0+'%,'+x0+'% '+y0+'%)';
  el.style.clipPath=p; el.style.webkitClipPath=p;
}
function selak(arah,laju,cb){
  if(anim) return; var ke=cur+arah; if(ke<1||ke>=N_AD){ if(cb)cb(); return; }
  anim=true; var A=cur, B=ke, bA=BUKU[A], bB=BUKU[B], T0=laju||900;
  cancelAnimationFrame(panRaf);
  var tapak=binaAdegan(B);                         /* bawah: adegan baru */
  var statik=binaAdegan(A); statik.classList.add('statik');
  var daun=document.createElement('div'); daun.className='daun';
  var depan=binaAdegan(A); depan.classList.add('muka');
  var blkg=binaAdegan(B); blkg.classList.add('muka');
  var gx=arah>0?bA.g:bA.g;
  if(arah>0){
    lubang(statik,bA.g,bA.y0,bA.x1,bA.y1);          /* adegan lama tanpa muka kanan */
    klip(depan,bA.g,bA.y0,bA.x1,bA.y1);              /* daun depan = muka kanan lama */
    klip(blkg,bB.x0,bB.y0,bB.g,bB.y1);               /* daun belakang = muka kiri baru */
  }else{
    lubang(statik,bA.x0,bA.y0,bA.g,bA.y1);
    klip(depan,bA.x0,bA.y0,bA.g,bA.y1);
    klip(blkg,bB.g,bB.y0,bB.x1,bB.y1);
  }
  blkg.style.transformOrigin=gx+'% 50%'; blkg.style.transform='rotateY(180deg)';
  var bay=document.createElement('div'); bay.className='bayang';
  daun.appendChild(depan); daun.appendChild(blkg); daun.appendChild(bay);
  daun.style.transformOrigin=gx+'% 50%';
  kam.innerHTML=''; kam.appendChild(tapak); kam.appendChild(statik); kam.appendChild(daun);
  var t0=performance.now();
  (function f(now){ var p=Math.min(1,(now-t0)/T0); var e=p<.5?2*p*p:1-Math.pow(-2*p+2,2)/2;
    var deg=(arah>0?-1:1)*180*e;
    daun.style.transform='rotateY('+deg+'deg)';
    var sn=Math.sin(e*Math.PI);
    statik.style.filter='brightness('+(1-.18*sn)+')';
    if(p<1) requestAnimationFrame(f);
    else { kam.innerHTML=''; adSekarang=tapak; kam.appendChild(tapak); cur=B; anim=false; kira();
      if(!laju) mulaPan(arah>0?'kiri':'kanan'); if(cb) cb(); }
  })(t0);
}

function bukaJurnal(){
  dahBuka=true; kunciKlik=performance.now()+1200; document.body.classList.add('buka');
  if(audio&&!muzikOn) toggleMuzik();
  var A=adSekarang, B=binaAdegan(1); B.style.opacity='0'; B.style.transition='opacity .8s'; kam.appendChild(B);
  A.style.transition='transform .9s cubic-bezier(.5,0,.3,1),opacity .9s'; A.style.transformOrigin='35% 50%';
  requestAnimationFrame(function(){ A.style.transform='perspective(1800px) rotateY(-75deg) scale(1.05)'; A.style.opacity='0'; B.style.opacity='1'; });
  setTimeout(function(){ kam.innerHTML=''; adSekarang=B; B.style.transition=''; kam.appendChild(B); cur=1; kira(); mulaPan('kiri');
    setTimeout(function(){ $('#petua').style.opacity='0'; },3500); },950);
}
/* hujung: selak laju (riffle) lalu tutup ke kulit */
function tutupJurnal(){
  if(anim) return;
  (function langkah(){ if(cur>1) selak(-1,230,langkah); else {
    var A=adSekarang, B=binaAdegan(0); B.style.opacity='0'; B.style.transition='opacity .7s'; kam.appendChild(B);
    requestAnimationFrame(function(){ B.style.opacity='1'; });
    setTimeout(function(){ kam.innerHTML=''; adSekarang=B; B.style.transition=''; kam.appendChild(B); cur=0; kira();
      dahBuka=false; document.body.classList.remove('buka'); mulaPan('kiri'); },750);
  } })();
}

var sx=null, sy=0, st=0, pX0=0;
$('#pentas').addEventListener('pointerdown',function(e){ sx=e.clientX; sy=e.clientY; st=performance.now(); pX0=panX; });
$('#pentas').addEventListener('pointermove',function(e){ if(sx===null||!panMax||anim) return; var dx=e.clientX-sx;

/* ---------- muat ---------- */
function ralat(t){ $('#muat').style.display='none'; $('#ralat').style.display='flex'; $('#ralat').innerHTML=t; }
function mula(){ $('#muat').style.display='none'; sediaFoto(); sediaMuzik(); pakaiBahasa(); ukur(); papar(0); mulaPan('kiri'); }
(function init(){
  var q=new URLSearchParams(location.search); var id=q.get('id')||q.get('kad')||location.hash.replace('#','');
  if(q.get('preview')==='1'){ try{ D=JSON.parse(localStorage.getItem('gk_preview')); }catch(e){ D=null; }
    if(!D) return ralat(T('takdePratonton')); $('#badge').style.display=''; mula(); return; }
  if(q.get('demo')==='1'||!id){ D=demoData(); $('#badge').style.display=''; $('#badge').textContent='DEMO'; mula(); return; }
  if(!db) return ralat(T('dbGagal'));
  db.from('cards').select('card_data,paid').eq('id',id).single().then(function(r){
    if(r.error) throw r.error; if(r.data.paid!==true){ ralat(T('belum')); return; }
    if(r.data.card_data&&r.data.card_data.tamat){ ralat('Kad ini telah tamat tempoh (link aktif 2 bulan). · This card has expired (links stay active for 2 months).'); return; }
    D=r.data.card_data||{}; mula();
  }).catch(function(){ ralat(T('tiada')); });
})();
