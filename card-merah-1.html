<!DOCTYPE html>
<html lang="ms">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,user-scalable=no">
<title>Happy Birthday</title>
<link href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Caveat:wght@400;600&family=Playfair+Display:ital,wght@0,400;0,600;1,400&family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">
<script src="https://unpkg.com/@supabase/supabase-js@2"></script>

<style>
:root{--red:#a8121c;--red-d:#8c0d16;--cream:#f6f1e4;--paper:#fdfaf2;--gold:#c9a227;--ink:#33201d}
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{width:100%;height:100%;overflow:hidden;font-family:'Poppins',sans-serif;background:var(--red)}
img{display:block;max-width:100%}
.tored{filter:brightness(0) saturate(100%) invert(11%) sepia(96%) saturate(3800%) hue-rotate(350deg) brightness(90%) contrast(100%)}

#loading{position:fixed;inset:0;background:var(--cream);display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:999;gap:.8rem}
.ld-h{font-size:2.6rem;animation:beat 1.1s ease-in-out infinite}
@keyframes beat{0%,100%{transform:scale(1)}50%{transform:scale(1.18)}}
.ld-t{font-size:.74rem;color:var(--red);letter-spacing:.16em;text-transform:uppercase}

.scr{position:fixed;inset:0;display:none;opacity:0;transition:opacity .5s;overflow-y:auto;overflow-x:hidden}
.scr.on{display:block;opacity:1}
.in{min-height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:26px 20px;position:relative}

/* COVER */
#cover{background:var(--red)}
#cover .frame{position:absolute;inset:13px;background:var(--cream);display:flex;flex-direction:column;
  align-items:center;justify-content:center;padding:22px 16px;overflow:hidden}
.cv-t{font-family:'Great Vibes',cursive;font-size:clamp(2.5rem,12vw,3.8rem);color:var(--red);line-height:1;
  text-align:center;margin-bottom:clamp(14px,4vh,26px)}
.cv-h{font-family:'Playfair Display',serif;font-style:italic;font-size:clamp(.72rem,3vw,.86rem);color:#9c6a6a;
  margin-top:clamp(14px,4vh,24px);animation:blink 2.2s ease-in-out infinite}
@keyframes blink{0%,100%{opacity:.5}50%{opacity:1}}
.envwrap{position:relative;width:min(74vw,300px);cursor:pointer;transition:transform .5s cubic-bezier(.22,1,.36,1)}
.envwrap img{width:100%;filter:drop-shadow(0 14px 26px rgba(120,10,20,.22));transition:opacity .55s}
.envwrap .eo{position:absolute;inset:0;opacity:0}
.envwrap.open .ec{opacity:0}
.envwrap.open .eo{opacity:1}
.envwrap.open{transform:scale(1.07)}
.envwrap:active{transform:scale(.97)}
.doo{position:absolute;pointer-events:none;opacity:.55}
.d1{left:4%;bottom:7%;width:clamp(58px,16vw,84px)}
.d2{right:5%;bottom:12%;width:clamp(50px,14vw,72px)}
.d3{right:7%;top:7%;width:clamp(42px,12vw,58px);opacity:.35}

/* MENU */
#menu{background:var(--red)}
.mn-t{font-family:'Great Vibes',cursive;font-size:clamp(2.1rem,10vw,3rem);color:#fff;text-align:center;
  margin-bottom:clamp(22px,6vh,40px);text-shadow:0 3px 18px rgba(0,0,0,.22)}
.mn-g{display:flex;gap:clamp(8px,3.5vw,22px);justify-content:center;align-items:flex-end;flex-wrap:wrap;width:100%;max-width:540px}
.mn-i{flex:1 1 88px;max-width:140px;background:none;border:none;cursor:pointer;display:flex;flex-direction:column;
  align-items:center;gap:11px;padding:5px;transition:transform .25s}
.mn-i:active{transform:scale(.93)}
.mn-i:hover{transform:translateY(-5px)}
.mn-a{width:100%;aspect-ratio:1;display:flex;align-items:center;justify-content:center}
.mn-a img,.mn-a svg{max-height:100%;width:auto;filter:drop-shadow(0 8px 16px rgba(0,0,0,.3))}
.mn-l{font-family:'Playfair Display',serif;font-size:clamp(.7rem,3vw,.86rem);color:#fff;letter-spacing:.03em}

/* SLIDES */
.sl{background:var(--red)}
.sh{font-family:'Great Vibes',cursive;font-size:clamp(1.8rem,8vw,2.6rem);color:#fff;text-align:center;
  line-height:1.15;margin-bottom:clamp(14px,4vh,24px);text-shadow:0 3px 16px rgba(0,0,0,.22)}
.backm{position:fixed;top:13px;left:13px;z-index:60;background:rgba(255,255,255,.14);border:1px solid rgba(255,255,255,.3);
  color:#fff;font-size:.66rem;letter-spacing:.08em;padding:8px 15px;border-radius:40px;cursor:pointer;
  backdrop-filter:blur(6px);display:none;font-family:'Poppins'}
.backm.on{display:block}

/* MUSIC */
.vw{position:relative;width:100%;max-width:520px;display:flex;align-items:center;justify-content:center;padding:6px 0}
.vinyl{position:absolute;left:-4%;width:min(56vw,232px);aspect-ratio:1;border-radius:50%;
  background:repeating-radial-gradient(circle at center,#101010 0 2px,#1d1d1d 2px 4px);
  box-shadow:0 14px 32px rgba(0,0,0,.45);animation:spin 9s linear infinite;animation-play-state:paused}
.vinyl.go{animation-play-state:running}
@keyframes spin{to{transform:rotate(360deg)}}
.vinyl::after{content:'';position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);width:34%;aspect-ratio:1;
  border-radius:50%;background:radial-gradient(circle,#e0333d,#a8121c);box-shadow:inset 0 0 0 3px rgba(0,0,0,.22)}
.vinyl::before{content:'';position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);width:7%;aspect-ratio:1;
  border-radius:50%;background:var(--cream);z-index:2}
.ytb{position:relative;z-index:3;width:min(72vw,320px);aspect-ratio:16/9;border-radius:6px;overflow:hidden;
  box-shadow:0 12px 28px rgba(0,0,0,.42);background:#000;margin-left:17%}
.ytb iframe{width:100%;height:100%;border:0;display:block}
.notes{position:absolute;right:1%;top:4%;font-size:1.4rem;color:rgba(255,255,255,.6);animation:fl 3s ease-in-out infinite}
@keyframes fl{0%,100%{transform:translateY(0) rotate(-6deg)}50%{transform:translateY(-12px) rotate(8deg)}}

/* FLOWER */
.fs{position:relative;width:100%;max-width:560px;display:flex;align-items:center;justify-content:center;padding:8px 0}
.bq{width:min(44vw,178px);filter:drop-shadow(0 14px 26px rgba(0,0,0,.34))}
.fl-l{font-family:'Great Vibes',cursive;font-size:1.5rem;color:rgba(255,255,255,.85);text-align:center;margin-top:8px}
.stick{position:absolute;background:var(--paper);color:var(--ink);font-family:'Playfair Display',serif;
  font-size:clamp(.58rem,2.4vw,.71rem);padding:7px 10px;max-width:42%;line-height:1.35;
  box-shadow:0 5px 14px rgba(0,0,0,.3)}
.stick:nth-of-type(1){top:5%;left:0;transform:rotate(-3deg)}
.stick:nth-of-type(2){top:3%;right:0;transform:rotate(3deg)}
.stick:nth-of-type(3){bottom:18%;left:-2%;transform:rotate(2deg)}
.stick:nth-of-type(4){bottom:10%;right:-1%;transform:rotate(-3deg)}

/* LETTER */
.note{position:relative;background:var(--paper);width:min(84vw,400px);padding:clamp(20px,5vw,30px) clamp(18px,5vw,26px);
  box-shadow:0 16px 36px rgba(0,0,0,.34);font-family:'Caveat',cursive;font-size:clamp(1rem,4.2vw,1.18rem);
  color:#2f2320;line-height:1.62;white-space:pre-line;max-height:52vh;overflow-y:auto;
  clip-path:polygon(0 1.2%,4% 0,12% 1%,26% .2%,42% 1.4%,60% .3%,76% 1.2%,92% .2%,100% 1.6%,99% 20%,100% 42%,99.2% 66%,100% 88%,98.6% 99%,84% 98.4%,66% 99.6%,48% 98.6%,30% 99.8%,14% 98.8%,2% 99.4%,.6% 78%,1.4% 52%,.4% 28%)}
.nstrip{display:flex;gap:clamp(8px,3vw,14px);justify-content:center;flex-wrap:wrap;margin-top:clamp(16px,4vh,24px)}
.nstrip .np{background:var(--paper);padding:5px 5px 14px;box-shadow:0 8px 18px rgba(0,0,0,.34);width:clamp(74px,22vw,104px)}
.nstrip .np:nth-child(1){transform:rotate(-3deg)}
.nstrip .np:nth-child(2){transform:rotate(2deg)}
.nstrip .np:nth-child(3){transform:rotate(-1.5deg)}
.nstrip .np img{width:100%;aspect-ratio:1;object-fit:cover}
.nheart{margin-top:14px;width:clamp(36px,10vw,50px);opacity:.6}

/* SCRAP */
.scrap{position:relative;width:100%;max-width:500px;aspect-ratio:1/1.05;margin:4px 0}
.gh{position:absolute;background:repeating-linear-gradient(90deg,rgba(255,255,255,.88) 0 8px,rgba(255,255,255,.5) 8px 16px),
  repeating-linear-gradient(0deg,rgba(232,120,128,.88) 0 8px,rgba(232,120,128,.5) 8px 16px);
  background-blend-mode:multiply;box-shadow:0 8px 20px rgba(0,0,0,.26)}
.g1{left:2%;top:15%;width:46%;height:22%;transform:rotate(-2deg);
  clip-path:polygon(0 0,100% 0,100% 86%,92% 100%,78% 88%,60% 100%,44% 87%,28% 99%,12% 88%,0 99%)}
.g2{left:38%;top:25%;width:44%;height:30%;transform:rotate(2deg);
  clip-path:polygon(0 4%,10% 0,26% 5%,44% 0,62% 5%,80% 0,100% 4%,100% 100%,0 100%)}
.pola{position:absolute;background:var(--paper);padding:5px 5px 15px;box-shadow:0 10px 22px rgba(0,0,0,.4)}
.pola img{width:100%;aspect-ratio:1;object-fit:cover}
.pola::before{content:'';position:absolute;top:-9px;left:50%;transform:translateX(-50%);width:19px;height:13px;
  background:linear-gradient(#dadada,#a8a8a8);border-radius:3px 3px 1px 1px;box-shadow:0 2px 4px rgba(0,0,0,.3)}
.pl1{left:40%;top:17%;width:33%;transform:rotate(1deg)}
.pl2{left:4%;bottom:5%;width:30%;transform:rotate(-4deg)}
.strip{position:absolute;right:2%;top:7%;width:23%;display:flex;flex-direction:column;gap:5px}
.strip img{width:100%;aspect-ratio:3/4;object-fit:cover;border:2px solid var(--paper);box-shadow:0 5px 12px rgba(0,0,0,.34)}
.sq{position:absolute;left:14%;top:43%;width:30%;aspect-ratio:1;border:6px solid rgba(255,255,255,.2);transform:rotate(-2deg)}

/* PHOTO */
#s-photo .in{padding:0 0 15vh;justify-content:flex-end}
#ph-full{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;z-index:0;cursor:zoom-in}
.phbg{position:absolute;inset:0;z-index:1;pointer-events:none}
.phbg::after{content:'';position:absolute;inset:0;background:linear-gradient(180deg,rgba(0,0,0,.3),rgba(0,0,0,.1) 40%,rgba(0,0,0,.58))}
.pht{position:relative;z-index:2;text-align:center;padding:24px}
.pht h2{font-family:'Great Vibes',cursive;font-size:clamp(2.1rem,11vw,3.3rem);color:#fff;line-height:1.1;text-shadow:0 4px 26px rgba(0,0,0,.6)}
.pht p{font-family:'Playfair Display',serif;font-style:italic;font-size:clamp(.8rem,3.4vw,1rem);color:rgba(255,255,255,.93);margin-top:12px;text-shadow:0 2px 12px rgba(0,0,0,.6)}
.phd{font-family:'Playfair Display',serif;font-size:.68rem;color:rgba(255,255,255,.8);letter-spacing:.2em;margin-bottom:10px}
.phcake{position:absolute;right:5%;bottom:6%;width:clamp(74px,22vw,112px);z-index:2;filter:drop-shadow(0 10px 20px rgba(0,0,0,.5))}

/* MUSIC BAR */
#mbar{position:fixed;bottom:0;left:0;right:0;z-index:200;background:rgba(58,6,10,.93);backdrop-filter:blur(14px);
  border-top:1px solid rgba(255,255,255,.14);padding:.5rem .9rem;display:none;align-items:center;gap:.7rem}
#mbar.on{display:flex}
.mb-d{width:23px;height:23px;border-radius:50%;flex-shrink:0;background:conic-gradient(#e0333d,#f6f1e4,#e0333d)}
.mb-d.sp{animation:spin 2.6s linear infinite}
.mb-t{font-size:.58rem;color:rgba(255,255,255,.7);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:33%;font-style:italic}
.mb-p{flex:1;height:3px;background:rgba(255,255,255,.15);border-radius:2px;cursor:pointer;min-width:34px}
.mb-f{height:100%;background:var(--gold);border-radius:2px;width:0}
.mb-b{background:rgba(255,255,255,.1);border:none;border-radius:50%;width:24px;height:24px;color:#fff;font-size:.62rem;cursor:pointer;flex-shrink:0}

.pvb{position:fixed;top:9px;left:50%;transform:translateX(-50%);z-index:900;background:rgba(0,0,0,.55);color:#fff;
  font-size:.56rem;letter-spacing:.14em;padding:5px 13px;border-radius:40px;backdrop-filter:blur(6px);pointer-events:none}
.cfw{position:fixed;inset:0;pointer-events:none;z-index:150;overflow:hidden}
.cfp{position:absolute;top:-30px;animation:cf linear infinite}
@keyframes cf{0%{transform:translateY(-30px) rotate(0);opacity:1}100%{transform:translateY(112vh) rotate(680deg);opacity:0}}
</style>
</head>

function go(id){
  document.querySelectorAll('.scr').forEach(s=>s.classList.remove('on'));
  const el=document.getElementById(id); el.classList.add('on'); el.scrollTop=0; cur=id;
  document.getElementById('backm').classList.toggle('on', id!=='cover'&&id!=='menu');
  const v=document.getElementById('vinyl');
  if(id==='s-music'){ mountYT(); v.classList.add('go'); } else if(v){ v.classList.remove('go'); }
  if(id==='menu') setupMusic();
}
let envOpened=false;
function openEnv(){
  if(envOpened)return; envOpened=true;
  document.getElementById('env').classList.add('open');
  setupMusic();
  setTimeout(confetti,500);
  setTimeout(()=>go('menu'),1600);
}

function renderCard(){
  const t=D.title||'Happy Birthday!';
  document.getElementById('cv-t').textContent=t;
  document.getElementById('ntext').textContent=D.story||D.wishes||'';
  const ns=document.getElementById('nstrip'); ns.innerHTML='';
  [D.p1_img,D.p2_img,D.p3_img].filter(Boolean).slice(0,3).forEach(src=>{
    const w=document.createElement('div'); w.className='np';
    const i=document.createElement('img'); i.src=src; w.appendChild(i); ns.appendChild(w);});
  const fs=document.getElementById('fs');
  fs.querySelectorAll('.stick').forEach(e=>e.remove());
  (D.wishes||'').split('\n').map(s=>s.trim()).filter(Boolean).slice(0,4).forEach(txt=>{
    const s=document.createElement('div'); s.className='stick'; s.textContent=txt; fs.appendChild(s);});
  if(D.quote) document.getElementById('fl-h').textContent=D.quote;
  if(D.author) document.getElementById('fl-l').textContent=D.author;
  document.getElementById('sp1').src=D.p1_img||D.cake_img||'';
  document.getElementById('sp2').src=D.p2_img||D.story_img||'';
  const st=document.getElementById('sstrip'); st.innerHTML='';
  const more=[D.p3_img,D.p4_img,D.p5_img,D.p6_img,D.story_img,D.cake_img].filter(Boolean);
  more.slice(0,4).forEach(s=>{const i=document.createElement('img');i.src=s;st.appendChild(i);});
  const hero=D.surprise_img||D.cake_img||D.story_img||'';
  if(hero){
    var pf=document.getElementById('ph-full'); pf.src=hero; pf.style.display='block';
    if(window.GKLightbox) setTimeout(function(){GKLightbox.attach();},300);
  }
  document.getElementById('pht').textContent=t+(D.subtitle?(' '+D.subtitle):'');
  document.getElementById('phs').textContent=D.surprise_msg||'';
  if(D.bday){const d=new Date(D.bday.replace(' ','T')); if(!isNaN(d))document.getElementById('phd').textContent=d.toLocaleDateString('en-GB',{day:'2-digit',month:'short',year:'numeric'});}
  document.getElementById('loading').style.display='none';
  if(window.GKAlbum) GKAlbum.init(D);
  go('cover');
}

let ytMounted=false;
function mountYT(){
  if(ytMounted)return;
  const id=ytId(D.video_yt||D.yt), box=document.getElementById('ytb');
  if(!id){box.style.display='none';return;}
  box.innerHTML=`<iframe src="https://www.youtube.com/embed/${id}?playsinline=1&rel=0" allow="accelerometer;autoplay;clipboard-write;encrypted-media;gyroscope;picture-in-picture" allowfullscreen></iframe>`;
  ytMounted=true;
}

let mode=null,ytp=null,ytReady=false,playing=false,audio=null,mDone=false;
function setupMusic(){
  if(mDone)return; mDone=true;
  document.getElementById('mb-t').textContent='♪ '+(D.mtitle||'Lagu Kita');
  if(D.mp3){
    mode='mp3'; audio=document.getElementById('mp3-player'); audio.src=D.mp3;
    document.getElementById('mbar').classList.add('on');
    audio.addEventListener('timeupdate',()=>{if(audio.duration)document.getElementById('mb-f').style.width=(audio.currentTime/audio.duration*100)+'%';});
    audio.addEventListener('play',()=>setP(true)); audio.addEventListener('pause',()=>setP(false));
    audio.play().catch(()=>{});
  }else if(D.yt){
    const id=ytId(D.yt); if(!id)return;
    mode='yt'; document.getElementById('mbar').classList.add('on');
    const s=document.createElement('script'); s.src='https://www.youtube.com/iframe_api'; document.head.appendChild(s);
    window.onYouTubeIframeAPIReady=()=>{ytp=new YT.Player('yt-root',{width:'1',height:'1',videoId:id,
      playerVars:{autoplay:1,controls:0,disablekb:1,fs:0,rel:0,playsinline:1},
      events:{onReady:()=>{ytReady=true;try{ytp.playVideo()}catch(e){}},
        onStateChange:e=>{if(e.data===1){setP(true);bar()}else if(e.data===2||e.data===0){setP(false)}}}});};
  }
  armRetry();
}
function setP(o){playing=o;document.getElementById('mb-d').classList.toggle('sp',o);document.getElementById('mb-b').textContent=o?'⏸':'▶';}
function togM(){if(mode==='mp3'&&audio){playing?audio.pause():audio.play()}else if(mode==='yt'&&ytp&&ytReady){playing?ytp.pauseVideo():ytp.playVideo()}}
function seekM(e){const r=e.currentTarget.getBoundingClientRect(),p=(e.clientX-r.left)/r.width;
  if(mode==='mp3'&&audio&&audio.duration)audio.currentTime=p*audio.duration;
  else if(mode==='yt'&&ytp&&ytReady)ytp.seekTo(p*ytp.getDuration(),true);}
function bar(){if(mode!=='yt'||!playing||!ytp||!ytReady)return;
  document.getElementById('mb-f').style.width=(ytp.getCurrentTime()/ytp.getDuration()*100)+'%';setTimeout(bar,800);}
function armRetry(){const t=()=>{if(playing)return;
  if(mode==='mp3'&&audio){audio.play().catch(()=>{})}else if(mode==='yt'&&ytp&&ytReady){try{ytp.playVideo()}catch(e){}}};
  ['pointerdown','touchstart','click'].forEach(ev=>document.addEventListener(ev,t,{passive:true}));}

function confetti(){
  const c=document.getElementById('cfw'); c.innerHTML='';
  const it=['🤍','❤️','🎉','✨','🎊'];
  for(let i=0;i<26;i++){const d=document.createElement('div');d.className='cfp';d.textContent=it[i%it.length];
    d.style.cssText=`left:${Math.random()*100}vw;font-size:${.8+Math.random()*.8}rem;animation-duration:${2.4+Math.random()*3}s;animation-delay:${Math.random()*1.4}s`;c.appendChild(d);}
  setTimeout(()=>{c.innerHTML=''},7000);
}
function showErr(m){const l=document.getElementById('loading');l.style.display='flex';
  l.innerHTML=`<div style="font-size:2.4rem">💔</div><p style="color:#a8121c;font-size:.84rem;text-align:center;padding:0 1.6rem;line-height:1.6">${m}</p>`;}
function badge(){const b=document.createElement('div');b.className='pvb';b.textContent='PRATONTON';document.body.appendChild(b);}

async function init(){
  const p=new URLSearchParams(location.search);
  if(p.get('preview')==='1'){
    try{D=JSON.parse(localStorage.getItem('gk_preview'));}catch(_e){D=null;}
    if(!D)D=DEMO; renderCard(); badge(); return;
  }
  const id=p.get('id');
  if(!id){ D=DEMO; renderCard(); badge(); return; }
  if(!db){ showErr('Sambungan ke pangkalan data gagal. Sila refresh halaman.'); return; }
  try{
    const{data,error}=await db.from('cards').select('card_data,paid').eq('id',id).single();
    if(error)throw error;
    if(data.paid!==true){ showErr('Kad ini belum diaktifkan. Sila selesaikan pembayaran untuk membuka kad.'); return; }
    D=data.card_data; renderCard();
  }catch(e){ showErr('Kad tidak dijumpai atau telah tamat tempoh.'); }
}
init();
