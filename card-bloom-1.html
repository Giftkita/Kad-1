<!DOCTYPE html>
<html lang="ms">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>A Bouquet for You</title>
<script src="https://unpkg.com/@supabase/supabase-js@2"></script>
<script>if(!window.supabase){document.write('<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"><\/script>');}</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Caveat+Brush&family=Dancing+Script:wght@600;700&family=Playfair+Display:ital,wght@0,500;1,400;1,500&family=Poppins:wght@500;600&display=swap" rel="stylesheet">
<!--
  GiftKita — Kad Hari Jadi "A Bouquet for You" (template: bloom)
  Rujukan: TikTok @flowers_the_bloom — tiru sebijik. Design: 6 halaman Canva (26 Sep 2026).
  Aliran: kotak hadiah → ketik → tudung tercampak, bunga meletup penuh skrin → gugur →
          4 muka kolaj (Favorite person · XOXO · surat · kucing) → kaki "Buat kad anda sendiri".
  card_data: template, nama, pengirim, tajuk, surat, f1, f2 (+ f1_pos, f2_pos), video,
             surprise_img (+ surprise_img_pos), surprise, yt | mp3, lang
  Koordinat slot: blok SLOT di bawah (peratus dari latar 1240×1748, l/t = titik TENGAH).
-->
<style>
:root{--u:min(1vw,5.2px)}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{background:#6d0811}
body{font-family:'Playfair Display',Georgia,serif;color:#fff;overflow-x:hidden;min-height:100vh}
body.kunci{overflow:hidden;height:100vh;height:100svh}
#latar{position:fixed;inset:0;z-index:0;background:#7a0912 center/cover no-repeat}
#latar::after{content:"";position:absolute;inset:0;background:rgba(60,0,8,.35)}

/* ═══ INTRO ═══ */
#intro{position:fixed;inset:0;z-index:50;display:flex;flex-direction:column;align-items:center;justify-content:center;
  background:radial-gradient(ellipse 80% 70% at 55% 58%,#cc1a42 0%,#b01238 38%,#8e0b2c 72%,#5c0619 100%);transition:opacity 1.1s ease}
#intro.pudar{opacity:0;pointer-events:none}
#hadiah{position:relative;width:min(44vw,220px);margin-top:12vh;cursor:pointer;animation:apung 2.6s ease-in-out infinite;
  filter:drop-shadow(0 16px 18px rgba(60,0,15,.45))}
#hadiah img{display:block;width:100%;pointer-events:none;-webkit-user-drag:none;user-select:none}
#hadiah .tudung{position:absolute;left:-11.5%;top:0;width:123%;margin-top:-47%;transform-origin:50% 80%;
  transition:transform 1s cubic-bezier(.2,.7,.3,1),opacity 1s}
#hadiah.goncang{animation:goncang .38s ease}
#hadiah.buka .tudung{transform:translate(-22%,-140%) rotate(-32deg);opacity:0}
#hadiah.hilang{transition:opacity .8s .4s,transform 1.2s;opacity:0;transform:translateY(30px) scale(.9)}
@keyframes apung{0%,100%{transform:translateY(0)}50%{transform:translateY(-9px)}}
@keyframes goncang{0%,100%{transform:rotate(0)}20%{transform:rotate(-7deg) scale(1.04)}45%{transform:rotate(6deg) scale(1.06)}70%{transform:rotate(-4deg)}}
#untuk{margin-top:min(11vh,84px);font-family:'Dancing Script',cursive;font-weight:600;font-size:clamp(1.6rem,6.6vw,2.2rem);
  color:#fff;opacity:0;transform:translateY(8px);transition:opacity 1.4s ease .9s,transform 1.4s ease .9s;text-shadow:0 2px 10px rgba(60,0,15,.35)}
#intro.sedia #untuk{opacity:1;transform:none}
#petunjuk{position:absolute;bottom:calc(env(safe-area-inset-bottom,0px) + 34px);left:0;right:0;text-align:center;
  font:italic 500 12px/1 'Playfair Display',serif;color:rgba(255,255,255,.7);letter-spacing:.04em;opacity:0;transition:opacity 1s}
#petunjuk.on{opacity:1}

/* ═══ DINDING BUNGA ═══ */
#dinding{position:fixed;inset:0;z-index:60;pointer-events:none;overflow:hidden}
.fl{position:absolute;left:0;top:0;will-change:transform,opacity;-webkit-user-drag:none}

/* ═══ KAD (4 muka) ═══ */
#kad{position:relative;z-index:1;width:calc(var(--u)*100);margin:0 auto;opacity:0;transition:opacity 1.2s ease;box-shadow:0 0 60px rgba(0,0,0,.45)}
#kad.on{opacity:1}
.muka{position:relative;width:100%;aspect-ratio:1240/1748;overflow:hidden}
.muka>.lt{position:absolute;inset:0;width:100%;height:100%;display:block;-webkit-user-drag:none}
.muka+.muka{margin-top:-1px}
.slot{position:absolute;transform:translate(-50%,-50%) rotate(var(--r,0deg));overflow:hidden}
.foto{cursor:pointer}
.foto img,.vid img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:block}
.kosong{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;color:rgba(160,60,90,.35);font-size:calc(var(--u)*7)}
.vid{cursor:pointer;background:#e9dde6}
.vid .main{position:absolute;left:50%;top:50%;width:calc(var(--u)*10);height:calc(var(--u)*10);transform:translate(-50%,-50%);border-radius:50%;
  background:rgba(142,12,24,.88);box-shadow:0 4px 14px rgba(0,0,0,.35);display:flex;align-items:center;justify-content:center}
.vid .main::after{content:"";margin-left:8%;border-left:calc(var(--u)*3.2) solid #fff;border-top:calc(var(--u)*2) solid transparent;border-bottom:calc(var(--u)*2) solid transparent}
.vid .lbl{position:absolute;left:0;right:0;bottom:6%;text-align:center;font:600 calc(var(--u)*2.4) Poppins,sans-serif;color:#fff;text-shadow:0 1px 4px rgba(0,0,0,.6)}
.label{position:absolute;transform:translate(-50%,-50%) rotate(-3deg);display:flex;align-items:center;justify-content:center;text-align:center;
  font-family:'Caveat Brush',cursive;color:#8d1a20;font-size:calc(var(--u)*10.5);line-height:.95;white-space:pre-line;text-shadow:1px 1px 0 rgba(90,10,15,.25)}
.meterai{position:absolute;transform:translate(-50%,-50%);display:flex;align-items:center;justify-content:center;
  font:italic 500 calc(var(--u)*8.5)/1 'Playfair Display',serif;color:#6e0816;text-shadow:-1px -1px 0 rgba(255,140,150,.45),1px 1px 1px rgba(40,0,6,.5);pointer-events:none}
.surat{cursor:pointer;padding:calc(var(--u)*5) calc(var(--u)*4.5) calc(var(--u)*4) calc(var(--u)*4.5);overflow:hidden}
.surat .dari{font-family:'Dancing Script',cursive;font-weight:600;font-size:calc(var(--u)*4.4);line-height:1.45;color:#f4f1ec;margin-top:calc(var(--u)*3)}
.surat .isi{font-family:'Playfair Display',serif;font-style:italic;font-size:calc(var(--u)*2.7);line-height:1.6;color:#eeeae4;margin-top:calc(var(--u)*5);
  white-space:pre-line;display:-webkit-box;-webkit-line-clamp:15;-webkit-box-orient:vertical;overflow:hidden;padding-right:calc(var(--u)*3)}
.surat .baca{position:absolute;right:calc(var(--u)*9);bottom:calc(var(--u)*3.5);font:italic 500 calc(var(--u)*2.5) 'Playfair Display',serif;color:rgba(255,255,255,.6)}
.kejut{cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center}
.kejut b{font-family:'Dancing Script',cursive;font-weight:700;font-size:calc(var(--u)*4.4);color:#fff4e8;line-height:1}
.kejut span{font:600 calc(var(--u)*2.2) Poppins,sans-serif;color:rgba(255,240,230,.85);margin-top:calc(var(--u)*.8);animation:denyut 1.6s ease-in-out infinite}
@keyframes denyut{50%{opacity:.45}}
.kaki{position:absolute;left:0;right:0;top:76%;text-align:center}
#hujung{height:calc(env(safe-area-inset-bottom,0px) + 90px)}
.kaki a{display:inline-block;font-family:'Playfair Display',serif;font-weight:500;font-size:calc(var(--u)*5);color:#fff;text-decoration:none;
  padding:calc(var(--u)*2) calc(var(--u)*6);border-radius:999px;background:rgba(255,235,238,.2);border:1px solid rgba(255,255,255,.3);
  backdrop-filter:blur(3px);-webkit-backdrop-filter:blur(3px);box-shadow:0 6px 16px rgba(40,0,6,.3)}
.kaki small{display:block;margin-top:calc(var(--u)*2.2);font-size:calc(var(--u)*2.9);color:rgba(255,255,255,.8)}
.kaki small b{font-weight:600;color:#fff}
.muka .masuk{opacity:0;transition:opacity 1s ease .2s}
.muka.in .masuk{opacity:1}

#skrol{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom,0px) + 18px);z-index:20;transform:translateX(-50%);
  color:rgba(255,255,255,.85);font-size:24px;opacity:0;transition:opacity .8s;pointer-events:none;animation:turun 1.6s ease-in-out infinite}
#skrol.on{opacity:1}
@keyframes turun{50%{margin-bottom:-8px}}

/* bahasa */
#bhs{position:fixed;top:10px;right:10px;z-index:900;display:flex;background:rgba(255,255,255,.92);border-radius:30px;padding:3px;box-shadow:0 2px 10px rgba(0,0,0,.25)}
#bhs button{border:0;background:transparent;color:#8e0c18;font:700 .68rem Poppins,sans-serif;padding:5px 11px;border-radius:20px;cursor:pointer}
#bhs button.on{background:#8e0c18;color:#fff}

/* surat penuh */
#suratP{position:fixed;inset:0;z-index:800;background-color:#434247;background-size:300px 300px;display:none;overflow-y:auto;-webkit-overflow-scrolling:touch;cursor:pointer}
#suratP.on{display:block;animation:bukaS .55s cubic-bezier(.2,.8,.3,1)}
@keyframes bukaS{from{opacity:0;transform:scale(.55)}}
#suratP .dlm{position:relative;max-width:40em;margin:0 auto;padding:max(8vh,54px) 26px 80px}
#suratP .kpd{text-align:center;font-family:'Dancing Script',cursive;font-weight:700;font-size:clamp(1.7rem,7.5vw,2.4rem);color:#f4f1ec}
#suratP .msj{margin-top:max(7vh,36px);font-family:'Playfair Display',serif;font-style:italic;font-size:clamp(1rem,4.3vw,1.2rem);line-height:1.75;color:#efebe5;white-space:pre-line}
#suratP .ttd{margin-top:28px;text-align:right;font-family:'Dancing Script',cursive;font-weight:600;font-size:clamp(1.3rem,5.6vw,1.7rem);color:#f4f1ec}
#suratP .tt{position:fixed;left:0;right:0;bottom:calc(env(safe-area-inset-bottom,0px) + 16px);text-align:center;font:italic 12px 'Playfair Display',serif;color:rgba(255,255,255,.5);pointer-events:none}

/* popup kejutan, video, lightbox */
.lap{position:fixed;inset:0;z-index:820;background:rgba(30,0,6,.9);display:none;align-items:center;justify-content:center;padding:20px}
.lap.on{display:flex;animation:muncul .45s ease}
@keyframes muncul{from{opacity:0}}
.lap .x{position:absolute;top:58px;right:16px;width:38px;height:38px;border-radius:50%;border:1px solid rgba(255,255,255,.3);background:rgba(255,255,255,.12);color:#fff;cursor:pointer;font-size:15px;z-index:2}
#kjBox{width:min(88vw,380px);background:#fbf5ee;border-radius:14px;padding:22px 20px 24px;text-align:center;color:#5a1a22;box-shadow:0 20px 50px rgba(0,0,0,.5);animation:naik .6s cubic-bezier(.2,.8,.3,1.2)}
@keyframes naik{from{transform:translateY(40px) scale(.8);opacity:0}}
#kjBox h3{font-family:'Dancing Script',cursive;font-size:2rem;color:#b3142e}
#kjBox .pf{margin:14px auto 0;width:82%;background:#fff;padding:8px 8px 34px;box-shadow:0 8px 18px rgba(80,0,20,.25);transform:rotate(-2deg)}
#kjBox .pf div{width:100%;aspect-ratio:1;overflow:hidden;position:relative}
#kjBox .pf img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
#kjBox p{margin-top:16px;font-style:italic;font-size:1rem;line-height:1.6;white-space:pre-line}
#vidBox{width:min(94vw,720px);aspect-ratio:16/9;background:#000;border-radius:8px;overflow:hidden}
#vidBox iframe{width:100%;height:100%;border:0}
#lb img{max-width:92%;max-height:88%;border-radius:4px;box-shadow:0 20px 50px rgba(0,0,0,.5)}
.hati{position:fixed;z-index:830;pointer-events:none;font-size:22px;animation:jatuh 2.4s ease-in forwards}
@keyframes jatuh{to{transform:translateY(110vh) rotate(260deg);opacity:.2}}
.tagpv{position:fixed;top:10px;left:50%;transform:translateX(-50%);z-index:850;background:rgba(0,0,0,.4);color:#fff;font:500 .53rem Poppins,sans-serif;letter-spacing:.18em;padding:5px 13px;border-radius:40px;pointer-events:none}
.gagal{position:fixed;inset:0;z-index:900;display:flex;align-items:center;justify-content:center;padding:24px;text-align:center;background:radial-gradient(ellipse at 50% 55%,#b01238,#5c0619);font:15px/1.7 Georgia,serif;color:#fde}
@media(prefers-reduced-motion:reduce){#hadiah{animation:none}}
</style>
</head>
<body class="kunci">
<div id="latar"></div>
<div id="bhs"><button id="bMS" onclick="setBhs('ms')">BM</button><button id="bEN" onclick="setBhs('en')">EN</button></div>

<div id="intro">
  <div id="hadiah" role="button" aria-label="Buka hadiah"><img id="iKotak" alt=""><img id="iTudung" class="tudung" alt=""></div>
  <div id="untuk"></div>
  <div id="petunjuk"></div>
</div>
<div id="dinding"></div>

<main id="kad">
  <section class="muka" id="m1"><img class="lt" id="lt1" alt="">
    <div class="label masuk" id="tajuk"></div>
    <div class="slot foto" id="sP1"></div>
  </section>
  <section class="muka" id="m2"><img class="lt" id="lt2" alt="">
    <div class="slot foto" id="sP2"></div>
    <div class="slot vid" id="sVid"></div>
  </section>
  <section class="muka" id="m3"><img class="lt" id="lt3" alt="">
    <div class="slot surat" id="sSurat"><div class="dari masuk" id="kDari"></div><div class="isi masuk" id="kIsi"></div><div class="baca" id="kBaca"></div></div>
    <div class="meterai" id="meterai"></div>
    <div class="slot kejut" id="sKejut"><b id="kjT"></b><span id="kjS"></span></div>
  </section>
  <section class="muka" id="m4"><img class="lt" id="lt4" alt="">
    <div class="kaki"><a href="index.html" id="kakiLink"></a><small>Made with <b>GiftKita</b></small></div>
  </section>
</main>
<div id="hujung"></div>
<div id="skrol">⌄</div>

<div id="suratP" onclick="tutupSurat()"><div class="dlm"><div class="kpd" id="sKpd"></div><div class="msj" id="sMsj"></div><div class="ttd" id="sTtd"></div></div><div class="tt" id="sTt"></div></div>
<div class="lap" id="lapKj" onclick="if(event.target===this)tutupLap('lapKj')"><button class="x" onclick="tutupLap('lapKj')">&#10005;</button>
  <div id="kjBox"><h3 id="kjH"></h3><div class="pf" id="kjPf"><div><img id="kjImg" alt=""></div></div><p id="kjMsg"></p></div></div>
<div class="lap" id="lapVid" onclick="if(event.target===this)tutupVideo()"><button class="x" onclick="tutupVideo()">&#10005;</button><div id="vidBox"></div></div>
<div class="lap" id="lb" onclick="if(event.target===this)tutupLap('lb')"><button class="x" onclick="tutupLap('lb')">&#10005;</button><img id="lbimg" alt=""></div>

<audio id="mp3" loop></audio>

/* ═══ ANIMASI: hadiah → letupan bunga → gugur ═══ */
var dibuka=false;
function pilih(){var t=0,k;for(k in BERAT)t+=BERAT[k];var r=Math.random()*t;for(k in BERAT){r-=BERAT[k];if(r<=0)return k;}return 'b00';}
function bunga(sz){var e=new Image();e.src=ASET[pilih()];e.className='fl';e.alt='';e.style.width=e.style.height=sz+'px';e.style.objectFit='contain';return e;}
function bukaHadiah(){
  if(dibuka)return;dibuka=true;muzik();              /* muzik TERUS dalam gesture (Seksyen 8.3) */
  $('petunjuk').classList.remove('on');
  var g=$('hadiah');g.style.animation='none';void g.offsetWidth;g.style.animation='';g.classList.add('goncang');
  setTimeout(function(){g.classList.add('buka');letup();},380);
}
function letup(){
  var W=innerWidth,H=innerHeight,dd=$('dinding');
  var r=$('iKotak').getBoundingClientRect(),bx=r.left+r.width*.5,by=r.top+r.height*.2;
  var cell=Math.max(70,Math.min(W,H)/3.9),cols=Math.ceil(W/cell)+1,rows=Math.ceil(H/cell)+1,sen=[];
  for(var y=0;y<rows;y++)for(var x=0;x<cols;x++)for(var k=0;k<2;k++)sen.push({tx:x*cell+rnd(-.45,.45)*cell,ty:y*cell+rnd(-.45,.45)*cell,sz:cell*rnd(1.05,1.6)});
  for(var i=0;i<Math.round(sen.length*.3);i++)sen.push({tx:rnd(0,W),ty:rnd(0,H),sz:cell*rnd(.7,1.1)});
  sen.sort(function(){return Math.random()-.5;});
  var akhir=0,maxD=Math.hypot(W,H);
  sen.forEach(function(f){var e=bunga(f.sz);dd.appendChild(e);f.el=e;
    var h=f.sz/2,delay=Math.hypot(f.tx-bx,f.ty-by)/maxD*650+rnd(0,380),r0=rnd(-120,120);f.r1=rnd(-35,35);
    var mx=bx+(f.tx-bx)*.35,my=Math.min(by,f.ty)-H*.1*Math.random();
    f.T=function(x,y,s,rot){return 'translate('+(x-h).toFixed(1)+'px,'+(y-h).toFixed(1)+'px) scale('+s+') rotate('+rot.toFixed(1)+'deg)';};
    e.animate([{transform:f.T(bx,by,.06,r0),opacity:0},{opacity:1,offset:.12},{transform:f.T(mx,my,.55,(r0+f.r1)/2),offset:.45},{transform:f.T(f.tx,f.ty,1,f.r1),opacity:1}],
      {duration:1150,delay:delay,easing:'cubic-bezier(.25,.8,.35,1)',fill:'both'});
    akhir=Math.max(akhir,delay+1150);});
  setTimeout(function(){$('hadiah').classList.add('hilang');},500);
  setTimeout(function(){gugur(sen);},akhir+750);
}
function gugur(sen){
  var H=innerHeight,panjang=0;
  $('intro').classList.add('pudar');$('kad').classList.add('on');
  sen.forEach(function(f){var d=rnd(0,420)+(1-f.ty/H)*120,t=rnd(1300,2100);
    f.el.animate([{transform:f.T(f.tx,f.ty,1,f.r1),opacity:1},{opacity:1,offset:.7},{transform:f.T(f.tx+rnd(-50,50),f.ty+H*1.05+rnd(0,220),.92,f.r1+rnd(-140,140)),opacity:0}],
      {duration:t,delay:d,easing:'cubic-bezier(.5,0,.75,.55)',fill:'forwards'});panjang=Math.max(panjang,d+t);});
  setTimeout(siapKad,900);
  setTimeout(function(){var dd=$('dinding');if(dd)dd.remove();var i=$('intro');if(i)i.remove();},panjang+100);
}
function siapKad(){
  document.body.classList.remove('kunci');
  var io=('IntersectionObserver' in window)?new IntersectionObserver(function(es){es.forEach(function(e){if(e.isIntersecting){e.target.classList.add('in');io.unobserve(e.target);}});},{threshold:.15}):null;
  [].forEach.call(document.querySelectorAll('.muka'),function(m){if(io)io.observe(m);else m.classList.add('in');});
  var sk=$('skrol');sk.classList.add('on');
  window.addEventListener('scroll',function h(){if(scrollY>40){sk.classList.remove('on');window.removeEventListener('scroll',h);}},{passive:true});
  try{if(window.GKAlbum)GKAlbum.init({title:T('untuk')+' '+(D.nama||''),subtitle:(D.tajuk||'Favorite person').replace(/\n/g,' '),
    story:D.surat||'',author:D.pengirim?'— '+D.pengirim:'',p1_img:D.f1,p2_img:D.f2,story_img:D.surprise_img,surprise_msg:D.surprise||''});}catch(e){}
}

/* ═══ muzik (YouTube tersembunyi atau MP3) ═══ */
var mode=null,ytp=null,ytOk=false,siapM=false,dihenti=false;
function muzik(){if(siapM||!D)return;siapM=true;
  if(D.mp3){mode='mp3';var a=$('mp3');a.src=D.mp3;a.play().catch(function(){});}
  else if(D.yt){var id=ytId(D.yt);if(!id)return;mode='yt';
    if(window.YT&&YT.Player)buatYT(id);
    else{var s=document.createElement('script');s.src='https://www.youtube.com/iframe_api';document.head.appendChild(s);window.onYouTubeIframeAPIReady=function(){buatYT(id);};}}
  ['pointerdown','touchstart','click'].forEach(function(ev){document.addEventListener(ev,function(){if(!dihenti)sambungMuzik();},{passive:true});});
}
function buatYT(id){ytp=new YT.Player('yt-root',{width:'1',height:'1',videoId:id,playerVars:{autoplay:1,controls:0,disablekb:1,fs:0,rel:0,playsinline:1,loop:1,playlist:id},
  events:{onReady:function(){ytOk=true;if(!dihenti)try{ytp.playVideo();}catch(e){}}}});}
function hentiMuzik(){dihenti=true;if(mode==='mp3')$('mp3').pause();else if(ytp&&ytOk)try{ytp.pauseVideo();}catch(e){}}
function sambungMuzik(){dihenti=false;if(mode==='mp3'){var a=$('mp3');if(a.paused)a.play().catch(function(){});}
  else if(mode==='yt'&&ytp&&ytOk){try{if(ytp.getPlayerState()!==1)ytp.playVideo();}catch(e){}}}
