var SUS={B:{x:0,min:0,max:0},K:{x:0,min:0,max:0}};
function letak(id,asp){ var W=innerWidth,H=innerHeight, w,h, s=SUS[id], el=$('#d'+id);
  if(W/H<=asp*1.12){ h=H; w=H*asp; if(w<W){ w=W; h=W/asp; } s.min=Math.min(0,W-w); s.max=0; }
  else { h=H; w=H*asp; s.min=s.max=(W-w)/2; }
  el.style.width=w+'px'; el.style.height=h+'px'; s.w=w; s.h=h; s.top=(H-h)/2;
  if(s.x0==null) s.x=(W-w)/2; s.x=Math.max(s.min,Math.min(s.max,s.x)); geser(id); }
function geser(id){ var s=SUS[id]; $('#d'+id).style.transform='translate('+s.x+'px,'+s.top+'px)'; if(id==='B') panah(); }
function panKe(px,anim){ var s=SUS.B, W=innerWidth; s.x0=1; s.x=Math.max(s.min,Math.min(s.max,W/2-px/100*s.w)); var el=$('#dB'); if(anim){ el.style.transition='transform .9s cubic-bezier(.4,0,.2,1)'; setTimeout(function(){ el.style.transition=''; },950); } geser('B'); }

  if(fasa===2) HS.forEach(function(p,i){ if(dah[i]) return; var x=s.x+p[0]/100*s.w; if(x<30) kiri++; else if(x>W-30) kanan++; });
  $('#pKiri').classList.toggle('on',kiri>0); $('#pKanan').classList.toggle('on',kanan>0);
  $('#pKiri').textContent='‹ ✨'+kiri; $('#pKanan').textContent='✨'+kanan+' ›'; }

(function seret(){ var b=$('#bilik'), m=null, gerak=false;

  addEventListener('pointermove',function(e){ if(!m) return; var dx=e.clientX-m.x; if(Math.abs(dx)>8) gerak=true; if(gerak&&SUS.B.min<SUS.B.max-1){ SUS.B.x0=1; SUS.B.x=Math.max(SUS.B.min,Math.min(SUS.B.max,m.ox+dx)); geser('B'); } });
  addEventListener('pointerup',function(){ setTimeout(function(){ gerak=false; },0); m=null; });

function fotoDemo(n){ var W=720,H=540,c=document.createElement('canvas'); c.width=W; c.height=H; var x=c.getContext('2d'), topi=n%3!==1;
  var P=[['#fde2e4','#f4acb7','#9d4edd'],['#e2ece9','#a8d5ba','#2d6a4f'],['#fff1e6','#f8c8a0','#b5651d'],['#dbe7f6','#9cb8e0','#1f3b7a'],['#fbe7ef','#e7a3ae','#8e3b46'],['#f1e8d6','#d9c39a','#5e4b3c']][n%6];
  var g=x.createLinearGradient(0,0,0,H); g.addColorStop(0,P[0]); g.addColorStop(1,P[1]); x.fillStyle=g; x.fillRect(0,0,W,H);
  x.fillStyle='rgba(255,255,255,.35)'; x.beginPath(); x.arc(W*(.2+(n%3)*.3),H*.25,90,0,7); x.fill(); x.fillStyle='rgba(0,0,0,.08)'; x.fillRect(0,H*.8,W,H*.2);
  var N=n%2?3:2, X=N===2?[W*.38,W*.62]:[W*.26,W*.5,W*.74];
  for(var i=0;i<N;i++){ var cx=X[i], cy=H*.56, s=1-(i%2)*.06;
    x.fillStyle=topi?'#1a1a2e':[P[2],'#1f3b7a','#b5651d'][i]; x.beginPath(); x.ellipse(cx,cy+150*s,82*s,130*s,0,Math.PI,0); x.fill();
    x.fillStyle=i===1?'#c96b6b':'#3b2a20'; x.beginPath(); x.arc(cx,cy-12*s,46*s,0,7); x.fill(); x.fillRect(cx-46*s,cy-12*s,92*s,60*s);
    x.fillStyle='#f2c9a0'; x.beginPath(); x.arc(cx,cy-4*s,34*s,0,7); x.fill();
    if(topi){ x.fillStyle='#1a1a2e'; x.beginPath(); x.moveTo(cx-60*s,cy-50*s); x.lineTo(cx,cy-74*s); x.lineTo(cx+60*s,cy-50*s); x.lineTo(cx,cy-28*s); x.fill(); x.strokeStyle='#d9b44a'; x.lineWidth=4; x.beginPath(); x.moveTo(cx+40*s,cy-50*s); x.lineTo(cx+46*s,cy-12*s); x.stroke(); } }
  return c.toDataURL('image/jpeg',0.8); }
