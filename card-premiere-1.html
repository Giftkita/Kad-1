/* mic: kesan tiupan (bunyi kuat & berterusan) */
var micS=null;
$('#btnMic').onclick=function(e){ e.stopPropagation(); if(fasa!=='popcorn') return; var m=this;
  if(!navigator.mediaDevices||!navigator.mediaDevices.getUserMedia){ m.textContent=T('micX'); return; }
  navigator.mediaDevices.getUserMedia({audio:true}).then(function(st){ micS=st; m.textContent='🎤 …';
    var C=new (window.AudioContext||window.webkitAudioContext)(), an=C.createAnalyser(); an.fftSize=1024; C.createMediaStreamSource(st).connect(an);
    var buf=new Float32Array(an.fftSize), kuat=0;
    (function dengar(){ if(fasa!=='popcorn'){ tutupMic(); try{C.close();}catch(e){} return; }
      an.getFloatTimeDomainData(buf); var r=0; for(var i=0;i<buf.length;i++) r+=buf[i]*buf[i]; r=Math.sqrt(r/buf.length);
      kuat = r>0.09 ? kuat+1 : Math.max(0,kuat-1);
      if(kuat>8){ tutupMic(); try{C.close();}catch(e){} tiupLilin(); return; }
      requestAnimationFrame(dengar); })();
  }).catch(function(){ m.textContent=T('micX'); });
};
function tutupMic(){ if(micS){ micS.getTracks().forEach(function(t){t.stop();}); micS=null; } }
function tiupLilin(){
  if(fasa!=='popcorn') return; fasa='kejut'; tutupMic(); $('#pPanggung').style.opacity='0'; $('#btnMic').style.display='none';

/* lagu Happy Birthday (melodi tradisional) — kotak muzik WebAudio */
var laguC=null;
function lagu(){
  var sambung=muzikOn; if(muzikOn) toggleMuzik();
  try{ var C=new (window.AudioContext||window.webkitAudioContext)(); laguC=C; }catch(e){ return; }
  var N={G4:392,A4:440,B4:493.88,C5:523.25,D5:587.33,E5:659.25,F5:698.46,G5:783.99};
  var M=[['G4',.75],['G4',.25],['A4',1],['G4',1],['C5',1],['B4',2],['G4',.75],['G4',.25],['A4',1],['G4',1],['D5',1],['C5',2],
         ['G4',.75],['G4',.25],['G5',1],['E5',1],['C5',1],['B4',1],['A4',2],['F5',.75],['F5',.25],['E5',1],['C5',1],['D5',1],['C5',3]];
  var t=C.currentTime+.15, bt=.42;
  M.forEach(function(n){ var f=N[n[0]], d=n[1]*bt;
    [1,2,3].forEach(function(h,i){ var o=C.createOscillator(), g=C.createGain(); o.type=i?'sine':'triangle'; o.frequency.value=f*h;
      var v0=[.22,.06,.03][i]; g.gain.setValueAtTime(0,t); g.gain.linearRampToValueAtTime(v0,t+.012); g.gain.exponentialRampToValueAtTime(.0005,t+Math.max(.5,d*1.6));
      o.connect(g); g.connect(C.destination); o.start(t); o.stop(t+Math.max(.55,d*1.7)); });
    t+=d; });
  setTimeout(function(){ try{C.close();}catch(e){} laguC=null; if(sambung&&!muzikOn) toggleMuzik(); },(t-C.currentTime+1)*1000);
}

    if(!D) return ralat(T('takdePratonton')); $('#badge').style.display=''; mula(); return; }
  if(q.get('demo')==='1'||!id){ D=demoData(); $('#badge').style.display=''; $('#badge').textContent='DEMO'; mula(); return; }
  if(!db) return ralat(T('dbGagal'));
  db.from('cards').select('card_data,paid').eq('id',id).single().then(function(r){
    if(r.error) throw r.error; if(r.data.paid!==true){ ralat(T('belum')); return; }
    if(r.data.card_data&&r.data.card_data.tamat){ ralat('Kad ini telah tamat tempoh (link aktif 2 bulan). · This card has expired (links stay active for 2 months).'); return; }
    D=r.data.card_data||{}; mula();
  }).catch(function(){ ralat(T('tiada')); });
})();
</script>
</body>
