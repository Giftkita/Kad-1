<html lang="ms">
<head>

<!--
  GiftKita — Kad Anniversary "Bouquet Berkunci" (template: kunci) — tiru video TikTok @flowers_the_bloom (30 Sep 2026)
  Aliran: skrin kunci (kod 4 digit) → banjir bunga → hati bunga "this is for you" → sampul peach → papan berselerak
          (kad YouTube, pemain lagu, 4 polaroid scratch, kad "for you", peta, jambangan, tag) → tekan setiap satu.
  card_data: template, dari, untuk, kod, petunjuk, kad, tag, tempat, f1..f4, yt, lagu, artis, video, lang
-->
<style>
:root{--ink:#6b2a36;--merah:#b3263c}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;overflow:hidden}
body{font-family:Poppins,sans-serif;color:var(--ink);-webkit-user-select:none;user-select:none;background:#fbf6f1}
img{-webkit-user-drag:none;display:block}
button{font-family:inherit}
.sk{position:fixed;inset:0;display:none;overflow:hidden}
.sk.on{display:block}
.serif{font-family:'Cormorant Garamond',Georgia,serif}
.skrip{font-family:'Great Vibes',cursive}
#tabir{position:fixed;inset:0;z-index:500;background:#2a1418;opacity:0;pointer-events:none;transition:opacity .5s}
#tabir.on{opacity:1;pointer-events:auto}

/* ── S0 kunci ── */
#s0{background:#fbf6f1 center/cover no-repeat}
#s0 .tgh{position:absolute;left:50%;top:36%;transform:translateX(-50%);width:min(80vw,340px);display:flex;flex-direction:column;align-items:center}
#s0 .fr{font:italic 500 clamp(1rem,4.6vw,1.2rem)/1.3 'Cormorant Garamond',serif;color:#7a2533;text-align:center}
#s0 .fr b{font-family:'Great Vibes',cursive;font-weight:400;font-size:1.45em;margin-left:4px}
#titik{display:flex;gap:14px;margin:16px 0 6px}
#titik i{width:17px;height:15px;display:block;transition:transform .25s cubic-bezier(.2,1.8,.4,1)}
#titik i svg{width:100%;height:100%;display:block}
#titik i path{fill:transparent;stroke:#c96e7c;stroke-width:2.2;transition:fill .2s,stroke .2s}
#titik i.isi{transform:scale(1.25)}
#titik i.isi path{fill:#c0283c;stroke:#c0283c}
#titik.betul i path{fill:#e0405a;stroke:#e0405a}
#titik.betul i{animation:degup .6s ease both}
#titik.betul i:nth-child(2){animation-delay:.08s}#titik.betul i:nth-child(3){animation-delay:.16s}#titik.betul i:nth-child(4){animation-delay:.24s}
@keyframes degup{40%{transform:scale(1.6)}100%{transform:scale(1.25)}}
#titik.salah{animation:goncang .45s}
@keyframes goncang{20%,60%{transform:translateX(-8px)}40%,80%{transform:translateX(8px)}}
#hint{font:italic 600 .9rem 'Cormorant Garamond',serif;color:#a0505e;min-height:1.2em;text-align:center;margin-bottom:16px}
#pad{display:grid;grid-template-columns:repeat(3,auto);gap:14px 22px;justify-content:center}
#pad button{position:relative;width:clamp(58px,17vw,70px);aspect-ratio:1;border-radius:50%;border:1px solid rgba(201,110,124,.35);cursor:pointer;
  background:radial-gradient(circle at 32% 26%,#fff 0,#fff7f8 38%,#fbe1e6 78%,#f5cdd5 100%);
  box-shadow:0 7px 16px rgba(170,40,64,.16),0 2px 4px rgba(170,40,64,.1),inset 0 2px 3px #fff,inset 0 -4px 8px rgba(192,40,60,.08);
  display:flex;flex-direction:column;align-items:center;justify-content:center;color:#9c2438;transition:transform .12s,box-shadow .12s;overflow:hidden}
#pad button b{font:500 clamp(1.5rem,6.6vw,1.85rem)/1 'Cormorant Garamond',Georgia,serif}
#pad button small{font:600 .44rem Poppins,sans-serif;letter-spacing:.22em;color:#c98a95;margin-top:1px;height:.6rem}
#pad button.kosong{visibility:hidden}
#pad button.padam{background:none;border:0;box-shadow:none;color:#b3404f}
#pad button.padam svg{width:26px;height:26px}
#pad button.tkn{transform:scale(.9);background:radial-gradient(circle at 32% 26%,#f47b8f 0,#d63a55 55%,#b3263c 100%);color:#fff;box-shadow:0 3px 8px rgba(170,40,64,.3),inset 0 2px 4px rgba(255,255,255,.35)}
#pad button.tkn small{color:#ffd3da}
#pad button.padam.tkn{background:none;box-shadow:none;color:#7a1a2c}
#pad .rpl{position:absolute;left:50%;top:50%;width:14px;height:14px;margin:-7px;border-radius:50%;background:rgba(255,255,255,.7);animation:rpl .45s ease-out forwards;pointer-events:none}
@keyframes rpl{to{transform:scale(6);opacity:0}}

/* ── S1 banjir bunga ── */
#banjir{position:fixed;inset:0;z-index:40;pointer-events:none}
#banjir img{position:absolute;will-change:transform,opacity}

/* ── S2 hati ── */
#s2{background:radial-gradient(ellipse at 50% 55%,#f9c2c9 0%,#f09aa6 40%,#e46a7c 100%)}
#s2 .kabur{position:absolute;opacity:.16;filter:blur(1.5px);animation:hanyut 9s ease-in-out infinite}
#s2 .ttl{position:absolute;left:0;right:0;top:calc(env(safe-area-inset-top,0px) + 11%);text-align:center;font:italic 500 clamp(1.3rem,6vw,1.7rem) 'Cormorant Garamond',serif;color:#fff4f5;opacity:0;transition:opacity 1s}
#hati{position:absolute;left:50%;top:52%;width:min(94vw,58vh);aspect-ratio:1;transform:translate(-50%,-50%)}
#hati img{position:absolute;transform:translate(-50%,-50%) scale(0);transition:transform .45s cubic-bezier(.2,1.5,.4,1),opacity .6s}
#hati img.on{transform:translate(-50%,-50%) scale(1) rotate(var(--r));animation:goyangB 2.8s ease-in-out infinite;animation-delay:var(--gd,0s)}
@keyframes goyangB{0%,100%{rotate:-7deg;scale:1}50%{rotate:7deg;scale:1.08}}
#hati.degup{animation:degupH 1.6s ease-in-out infinite}
@keyframes degupH{0%,100%{scale:1}12%{scale:1.035}24%{scale:1}36%{scale:1.025}}
#hati img.pergi{opacity:0;transform:translate(-50%,-50%) scale(1.3) rotate(var(--r))}
#hati .fr2{position:absolute;left:50%;top:55%;transform:translate(-50%,-50%);text-align:center;opacity:0;transition:opacity 1s;width:56%;line-height:1.15}
#hati .fr2 .lbl{display:block;margin:0 0 -4px}#hati .fr2>div+div{margin-top:6px}
.lbl{font:600 .62rem Poppins,sans-serif;letter-spacing:.2em;color:#8a2a3a;margin-right:6px;vertical-align:middle}
.nmS{font:400 clamp(1.4rem,6.5vw,1.9rem) 'Great Vibes',cursive;color:#7a1a2c;vertical-align:middle}
#s2 .on{opacity:1}

/* ── S3/S4 sampul & papan ── */
.peach{background:linear-gradient(180deg,#fdf3ea 0%,#fbe3d6 45%,#f4bfae 100%)}
#s3 .tpk{position:absolute;left:0;right:0;top:calc(env(safe-area-inset-top,0px) + 9%);text-align:center;font:500 .62rem Poppins,sans-serif;letter-spacing:.22em;color:#b58a80;text-transform:uppercase}
#s3 .blk{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);display:flex;flex-direction:column;align-items:center;gap:18px;width:min(76vw,330px)}
#samp{position:relative;width:100%;aspect-ratio:560/437;cursor:pointer;animation:apung 2.6s ease-in-out infinite}
#samp img{position:absolute;left:0;bottom:0;width:100%;filter:drop-shadow(0 12px 18px rgba(160,90,70,.22));transition:opacity .3s}
#samp .B{opacity:0}
#samp.buka .T{opacity:0}#samp.buka .B{opacity:1}
#samp.pergi{animation:none;opacity:0;transform:scale(.9);transition:opacity .5s,transform .5s}
@keyframes apung{50%{transform:translateY(-6px)}}
#s3 .blk .fr{font:500 .62rem Poppins,sans-serif;letter-spacing:.22em;color:#9a6f66}
#s3 .blk .fr .nmS{color:#6b3a36;font-size:clamp(1.5rem,7vw,2rem);margin-left:8px}

#s4{overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch}
#papanW{position:relative;margin:0 auto}
#papan{position:absolute;left:0;top:0;width:400px;transform-origin:0 0}
.bob{animation:apungB 4.6s ease-in-out infinite;animation-delay:var(--bd,0s)}
@keyframes apungB{50%{translate:0 -5px;rotate:.6deg}}
.pusing{position:absolute;pointer-events:none;opacity:.22;animation:hanyut linear infinite}
@keyframes hanyut{from{translate:0 0;rotate:0deg}50%{translate:14px -22px;rotate:25deg}to{translate:0 0;rotate:0deg}}
.brg{position:absolute;cursor:pointer;will-change:transform;transform:translate(-50%,-50%) rotate(var(--r))}
.brg.terbang{animation:terbang .8s cubic-bezier(.2,.85,.3,1.08) both}
@keyframes terbang{from{left:200px;top:45%;transform:translate(-50%,-50%) scale(.15) rotate(0);opacity:0}30%{opacity:1}}
.brg:active{filter:brightness(.96)}
.brg img{width:100%}
#s4 .tpk{position:absolute;left:0;right:0;text-align:center;font:500 .62rem Poppins,sans-serif;letter-spacing:.2em;color:#b07a70;text-transform:uppercase;z-index:30;pointer-events:none}
.pol{background:#fffaf6;padding:6% 6% 22%;box-shadow:0 8px 20px rgba(120,60,50,.18);border-radius:2px}
.pol .ph{position:relative;aspect-ratio:1;background:linear-gradient(160deg,#8e6f86,#c9a9b9 60%,#ead5de);display:flex;align-items:center;justify-content:center;overflow:hidden}
.pol .ph span{font:italic 600 17px 'Cormorant Garamond',serif;color:#fff;text-shadow:0 1px 3px rgba(0,0,0,.2)}
.pol .ph img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.pol.dah .ph span{display:none}
.ytk{background:#111;border-radius:14px;overflow:hidden;box-shadow:0 10px 24px rgba(0,0,0,.28);aspect-ratio:16/9;position:relative}
.ytk img{width:100%;height:100%;object-fit:cover;opacity:.9}
.ytk .pb{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:17%;aspect-ratio:1.4;background:#f00;border-radius:22%;display:flex;align-items:center;justify-content:center;color:#fff;font-size:.9rem}
.ytk .ft{position:absolute;right:8px;bottom:6px;font:600 .55rem Poppins,sans-serif;color:#fff;background:rgba(0,0,0,.55);padding:3px 6px;border-radius:4px}
.ytk .tt{position:absolute;left:8px;top:6px;right:8px;font:600 .6rem Poppins,sans-serif;color:#fff;text-shadow:0 1px 3px #000;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mzk{background:#181818;border-radius:14px;padding:10px;display:flex;gap:10px;align-items:center;box-shadow:0 10px 24px rgba(0,0,0,.3);color:#fff}
.mzk .art{width:22%;aspect-ratio:1;border-radius:6px;background:#7a1a2c center/cover;flex:none}
.mzk .inf{flex:1;min-width:0}
.mzk .t1{font:600 .72rem Poppins,sans-serif;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mzk .t2{font:500 .6rem Poppins,sans-serif;color:#b3b3b3;margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mzk .t3{display:inline-block;margin-top:6px;font:600 .52rem Poppins,sans-serif;color:#1ed760;border:1px solid #1ed760;border-radius:999px;padding:2px 6px}
.mzk .pp{width:30px;height:30px;border-radius:50%;background:#fff;color:#111;display:flex;align-items:center;justify-content:center;font-size:.75rem;flex:none}
.tagT{position:absolute;left:10%;right:10%;top:44%;text-align:center;font:400 19px/1.15 'Great Vibes',cursive;color:#7a3a30;transform:rotate(-4deg)}
.petaT{position:absolute;left:-10%;right:-10%;bottom:-17%;text-align:center;font:italic 600 13px 'Cormorant Garamond',serif;color:#7a3a30}

/* ── fokus ── */
#fok{position:fixed;inset:0;z-index:100;display:none;align-items:center;justify-content:center;background:radial-gradient(circle at 50% 48%,rgba(255,255,255,.96) 0,rgba(255,244,238,.85) 38%,rgba(248,208,196,.7) 100%);backdrop-filter:blur(2px)}
#fok.on{display:flex;animation:muncul .35s both}
@keyframes muncul{from{opacity:0}}
#fok .x{position:absolute;top:calc(env(safe-area-inset-top,0px) + 12px);right:14px;width:40px;height:40px;border-radius:50%;border:0;background:rgba(122,58,48,.12);color:#7a3a30;font-size:1.4rem;cursor:pointer;z-index:3}
#fokIsi{position:relative;display:flex;flex-direction:column;align-items:center;animation:naik .5s cubic-bezier(.2,1.2,.4,1) both}
@keyframes naik{from{transform:scale(.6) translateY(40px);opacity:0}}
.fkNota{margin-top:14px;font:italic 600 clamp(.95rem,4.3vw,1.15rem) 'Cormorant Garamond',serif;color:#7a3a30;text-align:center;max-width:80vw}
/* kad flip */
.flip{position:relative;width:min(74vw,330px);aspect-ratio:520/747;perspective:1200px;cursor:pointer}
.flip .in{position:absolute;inset:0;transition:transform .9s cubic-bezier(.4,.1,.2,1);transform-style:preserve-3d}
.flip.buka .in{transform:rotateY(180deg)}
.flip .m{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden}
.flip .m img{width:100%;height:100%;filter:drop-shadow(0 12px 24px rgba(120,60,50,.2))}
.flip .bl{transform:rotateY(180deg);background:#fffbf3;border-radius:14px;box-shadow:0 12px 24px rgba(120,60,50,.2);padding:14% 11% 10%;display:flex;flex-direction:column;align-items:center}
.flip .bl img{width:22%;height:auto;margin-bottom:10%;filter:none}
.flip .bl .ucap{font:italic 500 clamp(.95rem,4.3vw,1.15rem)/1.55 'Cormorant Garamond',serif;color:#4a3a36;text-align:center;white-space:pre-wrap;overflow-y:auto;flex:1}
.flip .bl .ttd{margin-top:8px;font:400 clamp(1.4rem,6vw,1.8rem) 'Great Vibes',cursive;color:#7a1a2c}
/* scratch */
.polF{width:min(76vw,330px)}
.polF canvas{position:absolute;inset:0;width:100%;height:100%;touch-action:none;transition:opacity .6s}
.cahaya{position:absolute;width:150%;aspect-ratio:1;left:-25%;top:-20%;background:radial-gradient(circle,rgba(255,255,255,.95) 0,rgba(255,255,255,0) 60%);z-index:-1;pointer-events:none}

/* ── bahasa, muzik, lapisan ── */
#bhs{position:fixed;top:calc(env(safe-area-inset-top,0px) + 10px);right:12px;z-index:150;display:flex;background:#fff;border:1.5px solid #efc7cf;border-radius:999px;overflow:hidden;box-shadow:0 4px 12px rgba(0,0,0,.1)}
#bhs button{border:0;background:#fff;color:#a0404f;padding:7px 12px;font:700 .68rem Poppins,sans-serif;cursor:pointer}
#bhs button.on{background:#b3263c;color:#fff}
#bMuzik{position:fixed;top:calc(env(safe-area-inset-top,0px) + 10px);right:112px;z-index:150;width:34px;height:34px;border-radius:50%;border:1.5px solid #efc7cf;background:#fff;color:#b3263c;font:700 1rem Poppins,sans-serif;cursor:pointer;display:none;box-shadow:0 4px 12px rgba(0,0,0,.1)}
#bMuzik.on{display:block}#bMuzik.main{animation:putarN 3s linear infinite}#bMuzik.henti{opacity:.5}
@keyframes putarN{to{transform:rotate(360deg)}}
.lap{position:fixed;inset:0;z-index:400;background:rgba(0,0,0,.92);display:none;align-items:center;justify-content:center;padding:20px}
.lap.on{display:flex}
.lap .x{position:absolute;top:calc(env(safe-area-inset-top,0px) + 12px);right:14px;width:40px;height:40px;border-radius:50%;border:0;background:rgba(255,255,255,.15);color:#fff;font-size:1.3rem;cursor:pointer}
#vidKotak{width:100%;max-width:640px;aspect-ratio:16/9;background:#000;position:relative;border-radius:8px;overflow:hidden}
#vidKotak iframe{position:absolute;inset:0;width:100%;height:100%;border:0}
.tagpv{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom,0px) + 4px);transform:translateX(-50%);z-index:160;background:rgba(0,0,0,.55);color:#fff;font:700 .58rem Poppins,sans-serif;letter-spacing:.14em;padding:4px 12px;border-radius:999px;pointer-events:none}
.gagal{position:fixed;inset:0;z-index:999;display:flex;align-items:center;justify-content:center;padding:24px;text-align:center;background:#fbf6f1;font:15px/1.7 Poppins,sans-serif;color:#6b2a36}
#gk-album-btn{bottom:auto!important;top:calc(env(safe-area-inset-top,0px) + 54px)!important;right:10px!important;padding:8px 12px!important;font-size:.64rem!important}
</style>
</head>
<body>
<div id="bhs"><button data-l="ms">BM</button><button data-l="en">EN</button></div>
<button id="bMuzik" onclick="togolMuzik()" aria-label="muzik">♪</button>
<div id="yt-root" style="position:fixed;left:-9999px;top:0;width:1px;height:1px;overflow:hidden"></div>

<!-- S0 kunci -->
<section class="sk on" id="s0">
  <div class="tgh">
    <div class="fr"><span data-t="dari">From:</span><b id="d0"></b><br><span data-t="untuk">For:</span><b id="u0"></b></div>
    <div id="titik"><i></i><i></i><i></i><i></i></div>
    <div id="hint"></div>
    <div id="pad"></div>
  </div>
</section>
<div id="banjir"></div>

<!-- S2 hati -->
<section class="sk" id="s2">
  <div class="ttl" data-t="ini">this is for you</div>
  <div id="hati"><div class="fr2"><div><span class="lbl" data-t="DARI">FROM</span><span class="nmS" id="d2"></span></div><div><span class="lbl" data-t="UNTUK">FOR</span><span class="nmS" id="u2"></span></div></div></div>
</section>

<!-- S3 sampul -->
<section class="sk peach" id="s3">
  <div class="tpk" data-t="tekanSampul">(tap the envelope)</div>
  <div class="blk">
    <div class="fr"><span data-t="DARI">FROM</span><span class="nmS" id="d3"></span></div>
    <div id="samp"><img class="B" id="eB" alt=""><img class="T" id="eT" alt=""></div>
    <div class="fr"><span data-t="UNTUK">FOR</span><span class="nmS" id="u3"></span></div>
  </div>
</section>

<!-- S4 papan -->
<section class="sk peach" id="s4">
  <div id="papanW"><div id="papan"><div class="tpk" data-t="tekanBrg">tap anything to open</div></div></div>
</section>

<div id="fok"><button class="x" onclick="tutupFok()">×</button><div id="fokIsi"></div></div>
<div class="lap" id="vidLap"><button class="x" onclick="tutupVideo()">×</button><div id="vidKotak"></div></div>

  x.globalCompositeOperation='destination-out';x.lineCap='round';x.lineJoin='round';x.lineWidth=r.width*.13;
