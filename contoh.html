*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%;background:#1b1518;overflow:hidden}
body{font-family:'Poppins',sans-serif;--c:#e56b8f}
#kad{position:fixed;left:0;right:0;top:0;bottom:calc(68px + env(safe-area-inset-bottom));width:100%;height:calc(100% - 68px - env(safe-area-inset-bottom));border:0;background:#fff}
#bar{position:fixed;left:0;right:0;bottom:0;height:calc(68px + env(safe-area-inset-bottom));padding:0 12px env(safe-area-inset-bottom);display:flex;align-items:center;gap:10px;background:#fffaf5;border-top:1px solid rgba(0,0,0,.08);box-shadow:0 -6px 20px rgba(0,0,0,.12);z-index:5}
#balik{flex:none;width:40px;height:40px;border-radius:50%;border:1.5px solid #eadccc;background:#fff;color:#6b4a1e;font-size:20px;line-height:1;display:flex;align-items:center;justify-content:center;text-decoration:none}
#info{flex:1;min-width:0;line-height:1.15}
#info small{display:block;font-size:.62rem;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--c)}
#info small.kod{font-size:.78rem;letter-spacing:.02em;text-transform:none;background:#fff1d6;color:#8a5a00;display:inline-block;padding:2px 8px;border-radius:99px;margin-bottom:2px;white-space:nowrap}
#info b{display:block;font:600 1.02rem/1.15 'Playfair Display',serif;color:#3a2f12;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#lagu{flex:none;width:40px;height:40px;border-radius:50%;border:1.5px solid #eadccc;background:#fff;color:var(--c);font-size:18px;display:none;align-items:center;justify-content:center;cursor:pointer}
#lagu.ada{display:flex}
#lagu.main{background:var(--c);color:#fff;border-color:var(--c);animation:dentum 1s ease-in-out infinite alternate}
@keyframes dentum{to{transform:scale(1.08)}}
#ytp{position:fixed;left:-20px;top:-20px;width:2px;height:2px;opacity:0;pointer-events:none}
#buat{flex:none;border:0;border-radius:99px;padding:12px 18px;font:700 .92rem/1 'Poppins',sans-serif;color:#fff;background:var(--c);box-shadow:0 4px 0 rgba(0,0,0,.18),0 8px 18px rgba(0,0,0,.18);text-decoration:none;white-space:nowrap;animation:denyut 1.6s ease-in-out 3s infinite}
#buat:active{transform:translateY(2px);box-shadow:0 2px 0 rgba(0,0,0,.18)}
@keyframes denyut{0%,100%{transform:scale(1)}50%{transform:scale(1.06)}}
#hint{position:fixed;left:50%;bottom:calc(84px + env(safe-area-inset-bottom));transform:translateX(-50%);z-index:6;background:rgba(30,22,26,.88);color:#fff;font:500 .82rem/1.3 'Poppins',sans-serif;padding:9px 16px;border-radius:99px;white-space:nowrap;pointer-events:none;transition:opacity .6s,transform .6s}
#hint.hilang{opacity:0;transform:translate(-50%,10px)}
#muat{position:fixed;inset:0 0 calc(68px + env(safe-area-inset-bottom));display:flex;align-items:center;justify-content:center;background:#fffaf5;z-index:4;transition:opacity .5s}

#muat i{width:42px;height:42px;border-radius:50%;border:4px solid #f1e4d6;border-top-color:var(--c);animation:pusing .8s linear infinite}

@media (min-width:700px){#bar{padding-left:24px;padding-right:24px}#buat{padding:13px 26px;font-size:1rem}}
@media (prefers-reduced-motion:reduce){#buat{animation:none}}

var LAGU_ID='2Vv-BfVoq4g';   /* lagu contoh (sama dengan contoh template baru) */
var HJ='apZ-FtdD4VE', AN='8xg3vE8Ie_E', CT=AN, GR=LAGU_ID;   /* hari jadi / anniversary / cinta / graduasi */
var TANPA_LAGU={bloom:HJ,lilin:HJ,parti:HJ,pinata:HJ,mixtape:HJ,photobooth:HJ,capit:HJ,

var P=null, siap=false, mahuMain=false, mainLagu=false, jedaVideo=false, mula=false;
function butang(){ var b=document.getElementById('lagu'); b.classList.toggle('main',mainLagu); b.textContent=mainLagu?'♪':'♪'; }
function main(){ mahuMain=true; if(siap&&P&&P.playVideo){ try{ P.playVideo(); }catch(e){} } }
function henti(){ mahuMain=false; if(siap&&P&&P.pauseVideo){ try{ P.pauseVideo(); }catch(e){} } mainLagu=false; butang(); }
function mulaLaguContoh(f){
  var tt=(new URLSearchParams(location.search).get('t')||'').toLowerCase(); LAGU_ID=TANPA_LAGU[tt]||LAGU_ID;
  var b=document.getElementById('lagu'); b.classList.add('ada');
  b.addEventListener('click',function(){ mula=true; if(mainLagu||mahuMain) henti(); else main(); });
  window.onYouTubeIframeAPIReady=function(){
    P=new YT.Player('ytpIn',{width:2,height:2,videoId:LAGU_ID,
      playerVars:{autoplay:0,controls:0,playsinline:1,loop:1,playlist:LAGU_ID,rel:0},
      events:{onReady:function(){ siap=true; try{P.setVolume(70);}catch(e){} if(mahuMain&&!jedaVideo) main(); },
              onStateChange:function(e){ mainLagu=(e.data===1); butang(); }}});
  };
  var sc=document.createElement('script'); sc.src='https://www.youtube.com/iframe_api'; document.head.appendChild(sc);
  /* tekan pertama dalam kad → lagu mula */
  function ikat(){ try{ var d=f.contentDocument; if(!d) return;
      d.addEventListener('pointerdown',function(){ if(!mula){ mula=true; main(); } },true);
      /* kad main video YouTube sendiri → jeda lagu contoh; video ditutup → sambung */
      var cek=function(){ var ada=!!d.querySelector('iframe[src*="youtube"]');
        if(ada&&!jedaVideo){ jedaVideo=true; if(mahuMain||mainLagu){ var m=mahuMain; henti(); mahuMain=m; } }
        else if(!ada&&jedaVideo){ jedaVideo=false; if(mahuMain) main(); } };
      new MutationObserver(cek).observe(d.documentElement,{childList:true,subtree:true,attributes:true,attributeFilter:['src']});
    }catch(e){} }
  f.addEventListener('load',ikat); if(f.contentDocument&&f.contentDocument.readyState==='complete') ikat();
  document.addEventListener('visibilitychange',function(){ if(document.hidden&&mainLagu){ var m=true; henti(); mahuMain=m; } else if(!document.hidden&&mahuMain&&!jedaVideo) main(); });
}
var L={ms:{label:'Contoh kad · cuba tekan',buat:'Buat kad ni 💌',hint:'Ni contoh je — cuba tekan-tekan 👆'},
       en:{label:'Example card · try it',buat:'Make this card 💌',hint:'This is just an example — tap around 👆'}};
(function(){
  var q=new URLSearchParams(location.search), t=(q.get('t')||'').toLowerCase();
  if(!/^[a-z0-9]{2,30}$/.test(t)){ location.replace('index.html'); return; }
  /* bahasa: ?lang= menang → pilihan tersimpan → zon masa (luar Malaysia = EN, sama macam GK-AUTO-EN) */
  var lang='ms', ql=(q.get('lang')||'').toLowerCase(), sv=null;
  try{ sv=localStorage.getItem('gk_lang'); }catch(e){}
  if(ql==='en'||ql==='ms') lang=ql;
  else if(sv==='en'||sv==='ms') lang=sv;
  else { try{ var tz=Intl.DateTimeFormat().resolvedOptions().timeZone||''; if(tz&&tz!=='Asia/Kuala_Lumpur'&&tz!=='Asia/Kuching') lang='en'; }catch(e){} }
  try{ if(ql||!sv) localStorage.setItem('gk_lang',lang); }catch(e){}   /* kad contoh & borang ikut bahasa sama */
  var x=L[lang], m=TEMA[t]||[t,t,'#e56b8f','index.html','card-'+t+'-1.html','buat-kad-'+t+'.html'], nama=lang==='en'?m[1]:m[0];
  document.documentElement.lang=lang; document.body.style.setProperty('--c',m[2]);
  document.title=(lang==='en'?'Example — ':'Contoh — ')+nama+' | GiftKita';
  /* bawa ref affiliate, cur (harga USD) & utm iklan ke borang / picker */
  var bw=new URLSearchParams(); ['ref','cur','utm_source','utm_medium','utm_campaign','utm_content','utm_term','fbclid','ttclid'].forEach(function(k){ var v=q.get(k); if(v) bw.set(k,v); });
  var sfx=bw.toString()?('?'+bw.toString()):'';
  var kd=KOD[t], lb=document.getElementById('label'); lb.textContent=kd?kd[lang==='en'?1:0]:x.label; if(kd) lb.classList.add('kod');
  document.getElementById('nama').textContent=nama;
  var b=document.getElementById('buat'); b.textContent=x.buat; b.href=m[5]+sfx;
  document.getElementById('balik').href=m[3]+sfx;
  var f=document.getElementById('kad'); f.onload=function(){ document.getElementById('muat').classList.add('hilang'); };
  f.src=m[4]+'?demo=1&lang='+lang;
  var h=document.getElementById('hint'); h.textContent=kd?(kd[lang==='en'?1:0]+(lang==='en'?' — try it 👆':' — cuba 👆')):x.hint; setTimeout(function(){ h.classList.add('hilang'); },4500);
  var it={contents:[{content_id:t,content_type:'product',content_name:nama}]};
  try{ window.GKPixel&&GKPixel.track('ViewContent',it); }catch(e){}
  b.addEventListener('click',function(){ try{ window.GKPixel&&GKPixel.track('ClickButton',it); }catch(e){} });
  /* ---------- LAGU CONTOH: kad yang data contoh dia tiada lagu → halaman ni yang main lagu ---------- */
  if(TANPA_LAGU[t]) mulaLaguContoh(f);
})();
</script>
