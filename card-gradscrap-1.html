<!--
  GiftKita — Kad Graduasi "Photobooth Graduasi Scrapbook" (template: gradscrap) — versi santai scrapbook Photobooth Retro (28 Sep 2026)
  Aliran: dewan arked malam, mesin photobooth → seret/ketik syiling ke slot → langsir terbuka, zum masuk booth →
          SNAP: lampu 3·2·1 → FLASH → gambar kenangan (4 = 1 jalur) → keluar, jalur dicetak dari slot, gambar "cuci" kelabu→sepia→warna →
          jalur seterusnya → syiling emas → kejutan (jalur emas 4 gaya) → kad ucapan vintage.
  card_data: template, nama, kursus, tahun, pengirim, s1_teks..s8_teks, s1_img..s8_img (+_pos), video, surat, surprise_img (+_pos), surprise, yt, lang
-->
<style>
:root{--ink:#2e3a59;--merah:#2e3a59;--mustard:#f2c14e;--krim:#fbf3e4;--teal:#a8c3a0;--emas:#f2c14e;--maroon:#e8a7a7;--kraf:#d8b98c}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;overflow:hidden}
body{font-family:Poppins,sans-serif;color:var(--ink);-webkit-user-select:none;user-select:none;background:#d49a5e}
img{-webkit-user-drag:none;display:block}
button{font-family:inherit}
#laman{position:fixed;inset:0;overflow:hidden;background:#d49a5e center bottom/cover no-repeat;transform-origin:50% 50%;transition:transform 1.1s cubic-bezier(.6,0,.3,1),filter 1.1s}
#laman.zum{filter:brightness(.35) sepia(.3)}
#laman>*{position:absolute}
#booth{z-index:5}
#booth>img{width:100%;height:100%;filter:drop-shadow(0 12px 14px rgba(90,50,20,.35));pointer-events:none}
#booth>*{position:absolute}
#papan{display:flex;align-items:center;justify-content:center;font-family:'Patrick Hand',Caveat,cursive;color:var(--merah);letter-spacing:.03em;rotate:-2deg;text-shadow:0 2px 0 rgba(122,20,40,.25);white-space:nowrap;border-radius:6%/18%}
#papan.hidup{animation:goyangP 3s ease-in-out infinite}
@keyframes goyangP{50%{rotate:1deg}}
@keyframes neon{0%,18%,22%,100%{color:#1d3157;text-shadow:0 0 6px rgba(255,220,140,.9),0 0 16px rgba(255,200,90,.6)}20%{color:#6b7fa8;text-shadow:none}}
#booth::after{display:none;content:"";position:absolute;left:8%;right:8%;top:1%;height:17%;border-radius:12%/30%;box-shadow:0 0 40px 10px rgba(255,200,90,.28);pointer-events:none;animation:bulb 1.6s ease-in-out infinite}
@keyframes bulb{50%{box-shadow:0 0 60px 18px rgba(255,200,90,.45)}}
#langsir{transform-origin:6% 0;transition:transform 1s cubic-bezier(.6,0,.3,1);filter:drop-shadow(3px 4px 5px rgba(90,50,20,.3));pointer-events:none}
#langsir.buka{transform:scaleX(.26)}
#klip{overflow:hidden;pointer-events:none}
#klip .jal{position:absolute;left:0;top:0;width:100%}
#koin{z-index:9;cursor:grab;touch-action:none;filter:drop-shadow(0 8px 10px rgba(0,0,0,.45))}
#koin img{width:100%;animation:putar 2.2s linear infinite}
@keyframes putar{0%{transform:rotateY(0)}50%{transform:rotateY(180deg)}100%{transform:rotateY(360deg)}}
#koin.emas img{filter:drop-shadow(0 0 12px rgba(255,220,120,.95)) drop-shadow(0 0 22px rgba(255,190,70,.8))}
#koin.seret img{animation:none}
#koin.tiada{display:none}
.dinding{z-index:4;cursor:pointer;filter:drop-shadow(0 8px 8px rgba(0,0,0,.45))}
.dinding::before{content:"";position:absolute;left:50%;top:-6px;width:34%;height:14px;translate:-50% 0;background:rgba(242,177,52,.85);z-index:2;rotate:-4deg}
#jari{position:fixed;z-index:14;pointer-events:none;font-size:34px;opacity:0;transition:opacity .3s}
#jari.on{opacity:1}
/* atas & bawah */
#atas{position:fixed;left:0;right:0;top:calc(env(safe-area-inset-top,0px) + 86px);z-index:15;text-align:center;padding:0 18px;pointer-events:none;transition:opacity .5s}
.tajuk{position:relative;display:inline-block;font:400 clamp(1.5rem,7vw,2.2rem)/1.1 'Patrick Hand',Caveat,cursive;color:#2e3a59;background:#fbf3e4;padding:8px 18px 6px;rotate:-2deg;box-shadow:0 6px 12px rgba(90,50,20,.3)}
.tajuk::before{content:"";position:absolute;left:50%;top:-10px;width:70px;height:20px;translate:-50% 0;rotate:3deg;background:repeating-linear-gradient(45deg,rgba(232,167,167,.9) 0 6px,rgba(251,243,228,.9) 6px 12px)}
.sub{font:500 clamp(.72rem,3vw,.88rem) Poppins,sans-serif;color:#2e3a59;margin-top:12px;background:rgba(251,243,228,.92);color:#2e3a59;border:1.5px dashed #a8c3a0;display:inline-block;padding:3px 12px;border-radius:999px}
#bawah{position:fixed;left:0;right:0;bottom:calc(env(safe-area-inset-bottom,0px) + 18px);z-index:15;display:flex;flex-direction:column;align-items:center;gap:8px;padding:0 16px;pointer-events:none}
#bawah>*{pointer-events:auto}
#hint{font:400 clamp(1rem,4.4vw,1.2rem) 'Patrick Hand',Caveat,cursive;color:var(--ink);background:var(--krim);border:2px dashed #a8c3a0;border-radius:999px;padding:7px 15px;text-align:center;display:none;box-shadow:0 4px 14px rgba(0,0,0,.35)}
#hint.on{display:block;animation:apungH 2.4s ease-in-out infinite}
@keyframes apungH{50%{translate:0 -5px}}
.pil{border:2px dashed rgba(46,58,89,.35);border-radius:14px;padding:11px 24px;font:400 1.15rem 'Patrick Hand',Caveat,cursive;cursor:pointer;color:#2e3a59;background:#f2c14e;box-shadow:0 5px 0 #c99a2e,0 10px 18px rgba(90,50,20,.3);rotate:-1deg}
.pil.p2{background:var(--krim);color:#2e3a59;box-shadow:0 5px 0 #d8b98c}
.pil.emas{background:#e8a7a7;color:#2e3a59;box-shadow:0 5px 0 #c77f7f}
.pil:active{translate:0 3px}
.pil:disabled{opacity:.5}
.btnB{display:flex;gap:10px;flex-wrap:wrap;justify-content:center;margin-top:16px}
#confetti{position:fixed;inset:0;z-index:90;pointer-events:none}
#flash{position:fixed;inset:0;z-index:89;background:#fff;opacity:0;pointer-events:none}
/* dalam booth */
#dalam{position:fixed;inset:0;z-index:30;display:none;flex-direction:column;align-items:center;justify-content:flex-start;padding:calc(env(safe-area-inset-top,0px) + 58px) 16px calc(env(safe-area-inset-bottom,0px) + 18px);background:#e9d3ab radial-gradient(circle,rgba(46,58,89,.12) 1.2px,transparent 1.6px) 0 0/18px 18px}
#dalam.on{display:flex;animation:muncul .6s ease}
@keyframes muncul{from{opacity:0}}
#dalam .tir{position:absolute;top:0;height:100%;width:22vw;max-width:140px;object-fit:cover;object-position:0 0;pointer-events:none;filter:drop-shadow(0 0 10px rgba(90,50,20,.3))}
#kam{position:relative;flex:none;z-index:2}
#kam>img{width:100%;filter:drop-shadow(0 12px 18px rgba(0,0,0,.5))}
#kam .mt{position:absolute;border-radius:50%;background:radial-gradient(circle,#fff7cf,#ffd24a 45%,rgba(255,190,40,0) 72%);opacity:0;transition:opacity .15s;mix-blend-mode:screen}
#kam .mt.on{opacity:1}
#kam .fl{position:absolute;border-radius:6px;background:rgba(255,255,255,.95);opacity:0;box-shadow:0 0 40px 20px #fff}
#layar{position:relative;flex:none;margin-top:18px;border-radius:2px;background:#fbf3e4;rotate:1.5deg;box-shadow:0 0 0 10px #fff,0 0 0 11px rgba(0,0,0,.08),0 10px 24px rgba(0,0,0,.5);overflow:hidden;z-index:2;display:flex;align-items:center;justify-content:center}
#layar .ft{position:absolute;inset:0;background:#222 center/cover no-repeat;cursor:zoom-in;animation:muncul .4s}
#layar .kira{font:400 clamp(4.5rem,26vw,8rem) 'Patrick Hand',Caveat,cursive;color:#e8a7a7;text-shadow:3px 3px 0 #2e3a59;animation:kira .9s ease-out both}
@keyframes kira{from{scale:2.2;opacity:0}40%{opacity:1}to{scale:.9;opacity:.9}}
#layar .sedia{font:400 1.2rem 'Patrick Hand',cursive;color:#2e3a59;text-align:center;padding:10px}
#kapD{position:relative;z-index:2;margin-top:18px;min-height:2.4em;max-width:min(88vw,420px);text-align:center;font:700 clamp(1.25rem,5.6vw,1.65rem)/1.2 Caveat,cursive;color:#2e3a59}
#ktD{position:relative;z-index:2;font:400 1rem 'Patrick Hand',Caveat,cursive;letter-spacing:.12em;color:#2e3a59;margin-top:14px}
#bSnap{position:relative;z-index:2;margin-top:auto;width:96px;height:96px;border-radius:50%;border:6px solid #fff;background:radial-gradient(circle at 35% 30%,#f7b8b8,#e8a7a7 55%,#c77f7f);color:#2e3a59;font:400 1.3rem 'Patrick Hand',Caveat,cursive;box-shadow:0 8px 0 #9a5a5a,0 0 0 6px rgba(242,177,52,.35),0 12px 30px rgba(0,0,0,.5);cursor:pointer;flex:none}
#bSnap:active{translate:0 4px;box-shadow:0 4px 0 #9a5a5a}
#bSnap.denyut{animation:denyut 1.4s ease-in-out infinite}
@keyframes denyut{50%{box-shadow:0 8px 0 #9a5a5a,0 0 0 16px rgba(242,177,52,.15),0 12px 30px rgba(0,0,0,.5)}}
#bSnap:disabled{opacity:.55;animation:none}
#bCetak{position:relative;z-index:2;margin-top:auto;display:none}
/* slot gambar */
.slt{position:absolute;overflow:hidden;background:#e8dcc4 center/cover no-repeat}
.slt.nota{display:flex;align-items:center;justify-content:center;text-align:center;background:#fff4dc;padding:6%;font:700 1rem/1.1 Caveat,cursive;color:var(--ink);word-break:break-word}
.slt.kosong{background:#f3e3c2 radial-gradient(circle,#f2b134 0 12%,transparent 13%) center/28% 28%}
.slt.vid::after{content:"▶";position:absolute;left:50%;top:50%;translate:-50% -50%;width:34%;aspect-ratio:1;border-radius:50%;background:rgba(255,255,255,.9);color:var(--merah);display:flex;align-items:center;justify-content:center;font-size:.9em}
.slt .im{position:absolute;inset:0;background:#e8dcc4 center/cover no-repeat}
.cuci{animation:cuci 4.5s ease-out both}
@keyframes cuci{0%{filter:grayscale(1) brightness(1.9) contrast(.35) blur(1px)}45%{filter:grayscale(.2) sepia(.85) brightness(1.2) contrast(.8)}100%{filter:none}}
.gaya1{filter:sepia(.75) contrast(1.05)}.gaya2{filter:grayscale(1) contrast(1.15)}.gaya3{filter:saturate(1.5) hue-rotate(-12deg) brightness(1.05)}
.jal{position:relative;container-type:inline-size}
.jal>img{position:relative;width:100%;z-index:2;pointer-events:none}
.jal .slt{z-index:1}
.jal .cap{position:absolute;left:6%;right:6%;bottom:2.5%;height:15%;z-index:3;display:flex;align-items:center;justify-content:center;text-align:center;font:400 .9rem/1.05 'Patrick Hand',Caveat,cursive;font-size:9cqw;color:#2e3a59;letter-spacing:.04em;overflow:hidden}
.jal.e .cap{color:#fbf3e4}
.jal .stk{position:absolute;z-index:4;pointer-events:none;filter:drop-shadow(0 2px 3px rgba(0,0,0,.2))}
/* lapisan */
.lap{position:fixed;inset:0;z-index:80;display:none;align-items:center;justify-content:center;flex-direction:column;padding:16px;background:rgba(60,40,20,.72);-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px)}
.lap.on{display:flex;animation:muncul .35s ease}
.no{font:400 1.1rem 'Patrick Hand',Caveat,cursive;letter-spacing:.14em;color:#fbf3e4;margin-bottom:10px;text-align:center}
#jalBox{position:relative;animation:terbang .8s cubic-bezier(.2,1.2,.4,1)}
@keyframes terbang{from{translate:0 40vh;rotate:-12deg;scale:.3}}
#jalBox .jal{filter:drop-shadow(0 16px 26px rgba(0,0,0,.55))}
#jalBox .slt{cursor:zoom-in}
#jalKap{margin-top:12px;color:rgba(255,241,214,.75);font-size:.78rem;text-align:center}
#isiK{position:relative;border-radius:2px;overflow:hidden;box-shadow:0 0 0 10px #fff,0 16px 30px rgba(0,0,0,.5);animation:muncul .4s}
#isiK .ft{position:absolute;inset:0;background:#222 center/cover no-repeat}
#isiK.nota{background:#fff4dc;display:flex;align-items:center;justify-content:center;text-align:center;padding:8%;font:700 1.6rem/1.3 Caveat,cursive;color:var(--ink);white-space:pre-line;overflow-y:auto}
#isiKap{margin-top:22px;max-width:min(88vw,420px);text-align:center;font:700 clamp(1.3rem,6vw,1.8rem)/1.2 Caveat,cursive;color:var(--krim);white-space:pre-line}
#vidLap .box{position:relative;width:min(92vw,560px);aspect-ratio:16/9;border-radius:12px;overflow:hidden;background:#000}
#vidLap iframe{position:absolute;inset:0;width:100%;height:100%;border:0}
#senarai{display:flex;gap:14px;flex-wrap:wrap;justify-content:center;max-width:min(92vw,480px)}
#senarai .jal{cursor:pointer;filter:drop-shadow(0 8px 12px rgba(0,0,0,.5))}
#sk2{position:fixed;inset:0;z-index:70;display:none;flex-direction:column;align-items:center;justify-content:center;padding:calc(env(safe-area-inset-top,0px) + 86px) 14px calc(env(safe-area-inset-bottom,0px) + 20px);background:#e9d3ab radial-gradient(circle,rgba(46,58,89,.12) 1.2px,transparent 1.6px) 0 0/18px 18px}
#sk2.on{display:flex;animation:muncul .5s ease}
#sk2 .tajuk{margin-bottom:22px;font-size:clamp(1.3rem,6vw,1.9rem)}
#kadBox{position:relative;animation:naik 1s cubic-bezier(.2,.8,.3,1) both}
@keyframes naik{from{opacity:0;translate:0 80px;rotate:4deg}}
#kadBox>img{width:100%;filter:drop-shadow(0 14px 26px rgba(0,0,0,.5))}
#suratTx{position:absolute;overflow-y:auto;font:600 clamp(1.05rem,4.6vw,1.32rem)/1.38 Caveat,cursive;color:var(--ink);white-space:pre-line;padding:2% 3%;-webkit-overflow-scrolling:touch}
#suratTx .ttd{margin-top:14px;text-align:right;color:#c7666f}
#suratTx .kep{font:400 1.4em/1.2 'Patrick Hand',Caveat,cursive;color:#2e3a59;text-align:center;margin-bottom:10px}
#toss{position:fixed;inset:0;z-index:88;pointer-events:none;display:none;align-items:center;justify-content:center}
#toss.on{display:flex}
#toss .tt2{font:400 clamp(2.6rem,13vw,4.2rem) 'Patrick Hand',Caveat,cursive;color:#fbf3e4;text-shadow:3px 3px 0 #2e3a59,0 0 24px rgba(0,0,0,.25);animation:tossT 2.6s ease both}
@keyframes tossT{0%{scale:.3;opacity:0}20%{scale:1.1;opacity:1}30%,80%{scale:1;opacity:1}100%{opacity:0}}
.topi{position:fixed;z-index:88;pointer-events:none;width:64px;filter:drop-shadow(0 6px 8px rgba(0,0,0,.3))}
/* umum */
#bhs{position:fixed;top:10px;right:10px;z-index:95;display:flex;background:rgba(251,243,228,.95);border-radius:30px;padding:3px;border:1.5px dashed #a8c3a0}
#bhs button{border:0;background:transparent;color:#2e3a59;font:600 .68rem Poppins,sans-serif;padding:5px 11px;border-radius:20px;cursor:pointer}
#bhs button.on{background:#f2c14e;color:#2e3a59}
#bMuzik{position:fixed;top:10px;left:10px;z-index:95;width:34px;height:34px;border-radius:50%;border:1px solid var(--mustard);background:rgba(251,243,228,.95);color:#2e3a59;font-size:15px;cursor:pointer;display:none}
#bMuzik.on{display:block}#bMuzik.henti{opacity:.5;text-decoration:line-through}
#gk-album-btn{bottom:auto!important;top:calc(env(safe-area-inset-top,0px) + 48px)!important;right:10px!important;padding:8px 12px!important;font-size:.64rem!important}
.tagpv{position:fixed;top:14px;left:50%;translate:-50% 0;z-index:95;background:rgba(242,177,52,.3);color:#fff;font:500 .5rem Poppins,sans-serif;letter-spacing:.18em;padding:4px 10px;border-radius:40px;pointer-events:none}
.gagal{position:fixed;inset:0;z-index:999;display:flex;align-items:center;justify-content:center;padding:24px;text-align:center;background:#e9d3ab;font:15px/1.7 Poppins,sans-serif;color:#2e3a59}
#lb{z-index:1000;background:rgba(20,4,10,.96);padding:0;touch-action:none;overflow:hidden}
#lb img{max-width:100vw;max-height:100vh;transform-origin:0 0;will-change:transform;-webkit-user-drag:none}
#lb .tt{position:absolute;left:0;right:0;bottom:calc(env(safe-area-inset-bottom,0px) + 16px);text-align:center;font:italic 12px Poppins,sans-serif;color:rgba(255,255,255,.6);pointer-events:none}
.x{position:fixed;right:14px;top:14px;width:32px;height:32px;border-radius:50%;border:0;background:var(--krim);color:var(--ink);font-size:14px;cursor:pointer;z-index:3}
</style>

  <img class="tir" id="tirL" alt="" style="left:0"><img class="tir" id="tirR" alt="" style="right:0;transform:scaleX(-1)">

/* ═══ CONFETTI ═══ */
var CF=[],cfRaf=null;
function confetti(x,y,arah,n){var c=$('confetti');c.width=innerWidth;c.height=innerHeight;var W=['#f2c14e','#e8a7a7','#a8c3a0','#9bb7d4','#fbf3e4','#2e3a59'];
  for(var i=0;i<n;i++){var a=(arah===0?rnd(0,Math.PI*2):-Math.PI/2+arah*.45+rnd(-.5,.5)),v=rnd(7,16);CF.push({x:x,y:y,vx:Math.cos(a)*v,vy:Math.sin(a)*v,w:rnd(6,11),h:rnd(4,8),r:rnd(0,6),vr:rnd(-.3,.3),c:W[i%W.length],t:0});}
  if(!cfRaf)(function f(){var ctx=c.getContext('2d');ctx.clearRect(0,0,c.width,c.height);CF=CF.filter(function(p){p.t++;p.vy+=.28;p.vx*=.985;p.x+=p.vx;p.y+=p.vy;p.r+=p.vr;
    ctx.save();ctx.translate(p.x,p.y);ctx.rotate(p.r);ctx.fillStyle=p.c;ctx.fillRect(-p.w/2,-p.h/2,p.w,p.h*Math.abs(Math.cos(p.t*.12)));ctx.restore();return p.y<c.height+30&&p.t<400;});
    cfRaf=CF.length?requestAnimationFrame(f):null;if(!CF.length)ctx.clearRect(0,0,c.width,c.height);})();}

/* ═══ BUNYI ═══ */
var AC=null;
function bunyiInit(){try{AC=AC||new (window.AudioContext||window.webkitAudioContext)();if(AC.state==='suspended')AC.resume();}catch(e){}}
function nota(f,t0,d,jenis,v,f2){var o=AC.createOscillator(),g=AC.createGain();o.type=jenis||'sine';o.frequency.setValueAtTime(f,t0);if(f2)o.frequency.exponentialRampToValueAtTime(f2,t0+d*.8);o.connect(g);g.connect(AC.destination);
  g.gain.setValueAtTime(.0001,t0);g.gain.exponentialRampToValueAtTime(v||.05,t0+.01);g.gain.exponentialRampToValueAtTime(.0001,t0+d);o.start(t0);o.stop(t0+d+.02);}
function hingar(t0,d,v,fq,jenis){var n=AC.sampleRate*d,b=AC.createBuffer(1,n,AC.sampleRate),x=b.getChannelData(0);for(var i=0;i<n;i++)x[i]=(Math.random()*2-1)*Math.pow(1-i/n,2);
  var s=AC.createBufferSource(),g=AC.createGain(),fl=AC.createBiquadFilter();fl.type=jenis||'lowpass';fl.frequency.value=fq||1200;s.buffer=b;s.connect(fl);fl.connect(g);g.connect(AC.destination);g.gain.value=v||.15;s.start(t0);}
function bunyi(j){try{bunyiInit();var t=AC.currentTime;
  if(j==='ting'){nota(1976,t,.5,'sine',.08);nota(2637,t+.06,.6,'sine',.05);}
  else if(j==='koin'){for(var i=0;i<4;i++)hingar(t+i*.07,.05,.18,3000,'bandpass');}
  else if(j==='langsir'){hingar(t,.7,.12,900,'bandpass');}

/* lightbox: cubit zum, seret, dwiketik; ketik sekali (tanpa zum) = tutup */
var LB={s:1,x:0,y:0};
function lbBuka(src){var im=$('lbimg');im.src=src;LB={s:1,x:0,y:0};lbTerap();$('lbTt').textContent=T('lbTt');$('lb').classList.add('on');}
function lbTerap(){$('lbimg').style.transform='translate('+LB.x+'px,'+LB.y+'px) scale('+LB.s+')';}
(function(){var lb=$('lb'),im=$('lbimg'),pts={},d0=0,s0=1,c0=null,x0=0,y0=0,gerak=false,lastTap=0,tapT=0;
  function pusat(){var k=Object.keys(pts);if(k.length<2)return null;var a=pts[k[0]],b=pts[k[1]];return{x:(a.x+b.x)/2,y:(a.y+b.y)/2,d:Math.hypot(a.x-b.x,a.y-b.y)};}
  lb.addEventListener('pointerdown',function(e){if(e.target.closest('.x'))return;pts[e.pointerId]={x:e.clientX,y:e.clientY};try{lb.setPointerCapture(e.pointerId);}catch(_){}
    var p=pusat();if(p){d0=p.d;s0=LB.s;c0=p;x0=LB.x;y0=LB.y;}else{x0=LB.x;y0=LB.y;c0={x:e.clientX,y:e.clientY};}gerak=false;tapT=Date.now();});
  lb.addEventListener('pointermove',function(e){if(!pts[e.pointerId])return;pts[e.pointerId]={x:e.clientX,y:e.clientY};var p=pusat();
    if(p){var s=Math.max(1,Math.min(5,s0*p.d/d0));var r=im.getBoundingClientRect();
      /* zum ke arah titik cubit: kekalkan titik bawah jari */
      var px=(c0.x-(x0+im.offsetLeft))/s0,py=(c0.y-(y0+im.offsetTop))/s0;
      LB.s=s;LB.x=p.x-im.offsetLeft-px*s;LB.y=p.y-im.offsetTop-py*s;gerak=true;lbTerap();}
    else if(LB.s>1){var dx=e.clientX-c0.x,dy=e.clientY-c0.y;if(Math.hypot(dx,dy)>6)gerak=true;LB.x=x0+dx;LB.y=y0+dy;lbTerap();}});
  function lepas(e){if(!pts[e.pointerId])return;delete pts[e.pointerId];
    if(Object.keys(pts).length===0){var t=Date.now();
      if(!gerak&&t-tapT<300){if(t-lastTap<320){/* dwiketik: zum 2.5x ke titik / reset */
          if(LB.s>1){LB={s:1,x:0,y:0};}else{var s=2.5,px=e.clientX-im.offsetLeft,py=e.clientY-im.offsetTop;LB={s:s,x:px-px*s,y:py-py*s};}lbTerap();lastTap=0;}
        else{lastTap=t;setTimeout(function(){if(lastTap===t&&LB.s===1)tutupLap('lb');},320);}}
      if(LB.s===1){LB.x=0;LB.y=0;lbTerap();}}
    else{var k=Object.keys(pts)[0];c0={x:pts[k].x,y:pts[k].y};x0=LB.x;y0=LB.y;}}
  lb.addEventListener('pointerup',lepas);lb.addEventListener('pointercancel',lepas);
})();
