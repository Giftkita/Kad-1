<!--
  GiftKita — Kad Anniversary "You Got a Mail" (template: mail) — tiru video TikTok @ares.recos (30 Sep 2026)
  Aliran: sampul merah + wax hati → polaroid "Happy Anniversary" → menu 4 pelekat (kamera / CD / ros / surat hati)
          → kolaj 7 gambar · pemain muzik + piring berputar · jambangan ros + 6 nota · surat tulisan tangan → End: polaroid akhir (+ video).
  card_data: template, nama, tarikh, p0, f1..f7, tahun, n1..n6, yt, s_tempat, s_tarikh, s_untuk, surat, pengirim, p_akhir, petikan, sumber, video, lang
-->
<style>
:root{--merah:#B10D32;--merah2:#a42127;--krim:#F9F0EA;--ink:#1c1c1c;--sw:10.3vw;--sc:5.5vw}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;overflow:hidden}
body{font-family:Poppins,sans-serif;color:var(--ink);-webkit-user-select:none;user-select:none;background:#fff}
body::before{content:"";position:fixed;inset:0;z-index:0;background:repeating-linear-gradient(90deg,var(--krim) 0 var(--sc),#fff var(--sc) var(--sw));background-position:var(--off,0) 0}
img{-webkit-user-drag:none;display:block}
button{font-family:inherit}
.sk{position:fixed;inset:0;z-index:1;display:none;flex-direction:column;align-items:center;justify-content:center;padding:calc(env(safe-area-inset-top,0px) + 56px) 16px calc(env(safe-area-inset-bottom,0px) + 24px);overflow:hidden}
.sk.on{display:flex}
#tabir{position:fixed;inset:0;z-index:500;background:#fff;opacity:0;pointer-events:none;transition:opacity .4s}
#tabir.on{opacity:1;pointer-events:auto}
.serif{font-family:'Playfair Display',Georgia,serif}
.skrip{font-family:'Mrs Saint Delafield',cursive;color:var(--merah2)}
.tulis{font-family:'Dancing Script',cursive}
.mesin{font-family:'Special Elite',monospace}
.ital{font:italic 500 clamp(1rem,4.6vw,1.25rem) 'Playfair Display',serif;color:var(--ink);text-align:center}

/* ── butang ── */
.bEnd{width:min(80vw,340px);border:0;border-radius:14px 14px 0 0;padding:15px 0 20px;font:600 clamp(1.15rem,5.2vw,1.4rem) 'Playfair Display',serif;color:#fff;background:var(--merah);box-shadow:0 8px 22px rgba(177,13,50,.35);cursor:pointer;margin-top:18px}
.bEnd:active{transform:translateY(2px)}
.klik{width:64px;height:64px;border-radius:50%;border:0;background:var(--merah);color:#fff;font:700 .95rem/1 'Dancing Script',cursive;cursor:pointer;box-shadow:0 6px 16px rgba(177,13,50,.4);animation:denyut 1.6s ease-in-out infinite;display:flex;align-items:center;justify-content:center;text-align:center;line-height:.95;transform:rotate(-8deg)}
.klik.fx{position:fixed;right:18px;bottom:calc(env(safe-area-inset-bottom,0px) + 22px);z-index:20}
@keyframes denyut{50%{transform:rotate(-8deg) scale(1.08)}}

/* ── S0 sampul ── */
#s0 .tj{font:700 clamp(1.5rem,7vw,2.1rem) 'Playfair Display',serif;letter-spacing:.02em;text-align:center;margin-bottom:6px}
#s0 .sub{margin-top:26px}
.samp{position:relative;width:min(88vw,400px);aspect-ratio:760/529;margin-top:min(20vw,92px);cursor:pointer;transition:transform .45s cubic-bezier(.4,0,.2,1),opacity .45s}
.samp img.e{position:absolute;left:0;bottom:0;width:100%;filter:drop-shadow(0 16px 22px rgba(90,5,18,.32));transition:opacity .3s}
.samp img.eB{opacity:0}
.samp .wax{position:absolute;left:50%;top:69%;width:25%;transform:translate(-50%,-50%);z-index:5;filter:drop-shadow(0 4px 6px rgba(0,0,0,.35));animation:denyut2 1.5s ease-in-out infinite}
.samp.buka .eT{opacity:0}.samp.buka .eB{opacity:1}
.samp.buka .wax{animation:waxPop .35s ease-in forwards}
@keyframes waxPop{to{transform:translate(-50%,-50%) scale(1.45);opacity:0}}
.samp.pergi{opacity:0;transform:scale(.92)}
@keyframes denyut2{50%{transform:translate(-50%,-50%) scale(1.08)}}

/* ── polaroid ── */
.polaroid{position:relative;background:#fff;padding:5% 5% 20%;box-shadow:0 10px 30px rgba(0,0,0,.18);width:100%}
.polaroid .ph{width:100%;aspect-ratio:1;background:#eee;overflow:visible;display:flex;align-items:center;justify-content:center}
.polaroid .ph img{width:100%;height:100%;object-fit:cover}
.polaroid.bw .ph img{filter:grayscale(1) contrast(1.05)}
.polaroid .nm{position:absolute;left:0;right:0;bottom:5%;text-align:center;font:700 clamp(1.1rem,6.4vw,1.7rem) Poppins,sans-serif;letter-spacing:.14em;text-transform:uppercase;color:#111}
.polaroid .tape{position:absolute;right:-9%;top:-3%;width:32%;height:8%;background:rgba(226,208,180,.75);rotate:38deg;box-shadow:0 1px 3px rgba(0,0,0,.15)}
.polaroid .hati{position:absolute;left:50%;top:76.5%;translate:-50% -50%;rotate:-12deg;color:var(--merah);font-size:clamp(1rem,5vw,1.4rem)}

/* ── S1 ── */
#s1{justify-content:center;gap:0}
#s1 .tarikh{font:400 clamp(.95rem,4.2vw,1.15rem) 'Special Elite',monospace;color:var(--merah);margin-bottom:14px;text-align:center}
#s1 .hap{align-self:flex-start;font-size:clamp(3rem,14vw,4.4rem);line-height:.9;margin:0 0 6px 7vw}
#s1 .ann{align-self:flex-end;font-size:clamp(3rem,14vw,4.4rem);line-height:.9;margin:6px 5vw 0 0}
#s1 .polaroid{width:min(58vw,260px);transform:rotate(-2deg)}
#s1 .klik{margin-top:26px}
#s1 .ph{background:#111}
#s1 .nm span{display:inline-block}
#s1 .a1{animation:none}
#s1.main .klik{animation:muncul .3s both,denyut 1.6s .4s ease-in-out infinite}
#s1.main #polUtama{animation:dariKB .55s .25s cubic-bezier(.2,.9,.3,1) both}
#s1.main #p0{animation:dariKA .6s .1s cubic-bezier(.2,.9,.3,1) both}
#s1.main .tarikh{animation:dedah .5s .55s ease-out both}
#s1.main .hati{animation:pop .4s .85s cubic-bezier(.2,1.6,.4,1) both}
#s1.main .nm span{animation:dariBawah .45s .8s cubic-bezier(.2,.9,.3,1) both}
#s1.main .tape{animation:dariKanan .45s 1s cubic-bezier(.2,.9,.3,1) both}
#s1.main .hap{animation:dariKiri .5s 1.15s cubic-bezier(.2,.9,.3,1) both}
#s1.main .ann{animation:dariKanan .5s 1.3s cubic-bezier(.2,.9,.3,1) both}
@keyframes muncul{from{opacity:0}to{opacity:1}}
@keyframes dariKB{from{transform:translate(55vw,45vh) rotate(18deg);opacity:0}to{transform:rotate(-2deg);opacity:1}}
@keyframes dariKA{from{transform:translate(-70vw,-35vh) rotate(-16deg)}to{transform:none}}
@keyframes dedah{from{clip-path:inset(0 0 0 100%)}to{clip-path:inset(0 0 0 0)}}
@keyframes dariBawah{from{transform:translateY(45vh);opacity:0}to{transform:none;opacity:1}}
@keyframes dariKanan{from{transform:translateX(70vw);opacity:0}}
@keyframes dariKiri{from{transform:translateX(-70vw);opacity:0}}
.masuk{opacity:0;transform:translateY(16px) scale(.96);animation:masuk .7s cubic-bezier(.2,.8,.2,1) forwards}
@keyframes masuk{to{opacity:1;transform:none}}

/* ── S2 menu ── */
#s2 .grid{display:grid;grid-template-columns:1fr 1fr;gap:6vw 4vw;width:min(86vw,400px);margin-bottom:30px}
#s2 .grid .stk{aspect-ratio:1;display:flex;align-items:center;justify-content:center;cursor:pointer;opacity:0;transform:scale(.3);transition:transform .25s}
#s2 .grid .stk.pop{animation:pop .4s cubic-bezier(.2,1.3,.4,1) forwards}
#s2 .grid .stk img{width:88%;height:88%;object-fit:contain;filter:drop-shadow(0 6px 10px rgba(0,0,0,.18))}
#s2 .grid .stk:active{transform:scale(.92)}
#s2 .grid .stk{position:relative}
#s2 .grid .stk.habis::after{content:'✓';position:absolute;right:6%;top:6%;width:24px;height:24px;border-radius:50%;background:var(--merah);color:#fff;font:700 .75rem/24px Poppins,sans-serif;text-align:center;box-shadow:0 2px 6px rgba(0,0,0,.25)}
@keyframes pop{from{opacity:0;transform:scale(0)}to{opacity:1;transform:none}}

/* ── halaman gambar penuh (kolaj / ros) ── */
.penuh{padding:0!important;justify-content:center}
.penuh .bg{position:relative;width:min(100vw,calc(100dvh * .7072));aspect-ratio:1000/1414;background-size:100% 100%;background-repeat:no-repeat;-webkit-mask-image:linear-gradient(180deg,transparent 0,#000 5%,#000 95%,transparent 100%);mask-image:linear-gradient(180deg,transparent 0,#000 5%,#000 95%,transparent 100%)}
.kp{position:absolute;inset:0;background-size:100% 100%;opacity:0;will-change:transform}
#kolaj.siap{background-image:var(--kolaj)}
#kolaj.siap .kp{display:none}
.slot{position:absolute;overflow:hidden;background:#f6e3e8;cursor:pointer;opacity:0;transform:scale(.85);transition:opacity .5s,transform .5s cubic-bezier(.2,1.2,.4,1)}
.slot.on{opacity:1;transform:none}
.slot img{width:100%;height:100%;object-fit:cover}
.slot.kosong{background:repeating-linear-gradient(45deg,#f6e3e8 0 6px,#fbeef1 6px 12px)}
.np{position:absolute;opacity:0;transform:scale(.7);transition:opacity .3s,transform .35s cubic-bezier(.2,1.4,.4,1)}
.np.on{opacity:1;transform:none}
#s5.main #ros{animation:muncul .5s both}
.tksl{position:absolute;display:flex;align-items:center;justify-content:center;text-align:center;padding:2% 3%;line-height:1.1;overflow:hidden;opacity:0;transform:translateY(8px);transition:opacity .5s,transform .5s}
.tksl.on{opacity:1;transform:none}
#kSince{font:700 clamp(1.1rem,6vw,1.6rem) 'Dancing Script',cursive;color:#3a2a2e;transform:rotate(-3deg)}
#kUcap{position:absolute;font:700 clamp(1rem,5vw,1.35rem)/1.05 'Dancing Script',cursive;color:#fff;text-align:center;transform:rotate(9deg);text-shadow:0 1px 2px rgba(0,0,0,.35);opacity:0;transition:opacity .6s}
#kUcap.on{opacity:1}
.nota{font-family:'Dancing Script',cursive;font-weight:700;color:#222;white-space:nowrap;padding:0 2%}

/* ── S4 muzik ── */
#s4 .box{position:relative;width:min(72vw,340px);margin-left:-16vw;z-index:2}
#s4 .pl{background:var(--merah);padding:4% 4% 3%;box-shadow:0 12px 30px rgba(0,0,0,.22)}
#s4 .yt{position:relative;width:100%;aspect-ratio:16/9;background:#1a0a0e;overflow:hidden}
#s4 .yt iframe{position:absolute;inset:0;width:100%;height:100%;border:0}
#s4 .yt .tiada{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;color:#f3c2cf;font-size:.8rem;gap:6px}
#s4 .ctl{display:flex;justify-content:center;gap:14px;color:#fff;font-size:.7rem;margin-top:10px;opacity:.9}
#s4 .bar{display:flex;align-items:center;gap:6px;margin-top:8px}
#s4 .eq{flex:1;display:flex;align-items:flex-end;gap:2px;height:34px}
#s4 .eq i{flex:1;background:#fff;border-radius:1px;height:20%;animation:eq 1s ease-in-out infinite}
#s4 .eq i:nth-child(odd){animation-duration:.8s}#s4 .eq i:nth-child(3n){animation-duration:1.3s}#s4 .eq i:nth-child(5n){animation-duration:.6s}
@keyframes eq{0%,100%{height:15%}50%{height:var(--h,80%)}}
#s4 .play{width:34px;height:34px;border-radius:50%;background:#fff;color:var(--merah);display:flex;align-items:center;justify-content:center;font-size:.9rem;font-weight:700}
#s4 .lpW{position:absolute;width:72%;right:-40%;top:0;z-index:-1}
#s4.main .pl{animation:muncul .7s both}
#s4.main .lpW{animation:lpKeluar .9s .35s cubic-bezier(.2,.8,.2,1) both}
@keyframes lpKeluar{from{transform:translateX(-55%);opacity:.2}to{transform:none;opacity:1}}
#s4 .lp{width:100%;animation:putar 4s linear infinite;filter:drop-shadow(0 6px 14px rgba(0,0,0,.25))}
@keyframes putar{to{transform:rotate(360deg)}}
#s4 .tjLagu{margin-top:22px;font:600 .8rem Poppins,sans-serif;color:#7a2434;text-align:center;letter-spacing:.06em}

/* ── S6 surat ── */
#s6{padding-left:8vw;padding-right:8vw;justify-content:center}
.gelombang{position:absolute;width:38vw;height:22vw;opacity:.85;pointer-events:none}
.jalur{position:absolute;left:0;top:calc(env(safe-area-inset-top,0px) + 44px);width:52vw;height:16px;background:repeating-linear-gradient(-55deg,#e8a3ae 0 3px,transparent 3px 8px);opacity:.9}
#s6.main .gelombang,#s6.main .jalur{animation:muncul .6s both}
#s6.main .kn{animation:muncul .6s .25s both}
#s6.main .dear{animation:muncul .5s .45s both}
#s6.main .ttd>span:first-child{animation:muncul .5s .7s both}
#s6.main .ttd .skrip{animation:lukis 1.1s 1.1s ease-in-out both}
@keyframes lukis{from{clip-path:inset(0 100% 0 0)}to{clip-path:inset(0 -10% 0 0)}}
.gelombang.a{left:2vw;top:calc(env(safe-area-inset-top,0px) + 48px)}
.gelombang.b{right:-8vw;top:calc(env(safe-area-inset-top,0px) + 70px);transform:rotate(-8deg);width:30vw}
.gelombang.c{left:-2vw;bottom:12%;transform:rotate(6deg)}
#s6 .kn{align-self:flex-end;text-align:right;font-size:clamp(1.5rem,7vw,2rem);line-height:1;margin-bottom:26px}
#s6 .dear{align-self:flex-start;font:400 clamp(.85rem,4vw,1.05rem) 'Special Elite',monospace;letter-spacing:.14em;margin-bottom:14px}
#s6 .dear .skrip{font-size:clamp(1.5rem,7vw,2rem);letter-spacing:0;margin-left:8px;vertical-align:-4px}
#s6 .isi{font:500 clamp(1.05rem,4.9vw,1.3rem)/1.5 'Dancing Script',cursive;color:#1e1e1e;text-align:center;max-width:100%;white-space:pre-wrap;min-height:6em}
#s6 .isi .kur{display:inline-block;width:2px;height:1em;background:#333;vertical-align:-2px;animation:kelip .8s steps(1) infinite}
@keyframes kelip{50%{opacity:0}}
#s6 .ttd{align-self:flex-end;text-align:right;margin-top:26px;font:500 clamp(1.1rem,5vw,1.4rem) 'Dancing Script',cursive;color:#1e1e1e}
#s6 .ttd .skrip{display:block;font-size:clamp(2.2rem,10vw,3rem);line-height:.9;margin-top:6px;transform:rotate(-6deg)}

/* ── S7 akhir ── */
#s7 .polaroid{width:min(84vw,380px);padding:4% 4% 6%;transform:rotate(-1.5deg)}
#s7 .polaroid .ph{aspect-ratio:4/3;overflow:hidden}
#s7.main .polaroid{animation:ayun 1.3s cubic-bezier(.3,.7,.3,1) both}
#s7.main .nmA{animation:muncul .6s .55s both}
#s7.main .ayat{animation:muncul .6s .8s both}#s7.main .smb{animation:muncul .6s .95s both}#s7.main .bVid{animation:muncul .6s 1.2s both}
@keyframes ayun{0%{transform:translateY(40px) rotate(7deg) scale(.9);opacity:0}35%{transform:rotate(-4deg);opacity:1}60%{transform:rotate(2.2deg)}80%{transform:rotate(-2.4deg)}100%{transform:rotate(-1.5deg)}}
#s7 .nmA{position:absolute;left:50%;top:-8%;transform:translateX(-50%) rotate(-8deg);font:400 clamp(2.6rem,13vw,3.8rem)/1 Pacifico,cursive;color:var(--merah);text-shadow:0 2px 0 #fff,0 0 8px #fff;white-space:nowrap;z-index:2}
#s7 .ayat{margin-top:22px;font:700 clamp(.78rem,3.7vw,.95rem)/1.35 Poppins,sans-serif;text-transform:uppercase;text-align:center;max-width:min(84vw,380px);color:#151515}
#s7 .smb{margin-top:8px;font:600 clamp(.72rem,3.4vw,.88rem) Poppins,sans-serif;color:var(--merah);text-align:center;letter-spacing:.04em}
#s7 .bVid{margin-top:22px;border:0;border-radius:999px;padding:11px 22px;font:600 .88rem Poppins,sans-serif;background:var(--merah);color:#fff;box-shadow:0 6px 16px rgba(177,13,50,.35);cursor:pointer}

/* ── bahasa, lapisan ── */
#bhs{position:fixed;top:calc(env(safe-area-inset-top,0px) + 10px);right:12px;z-index:60;display:flex;background:#fff;border:1.5px solid #e9cdd4;border-radius:999px;overflow:hidden;box-shadow:0 4px 12px rgba(0,0,0,.12)}
#bhs button{border:0;background:#fff;color:#a06;padding:7px 12px;font:700 .68rem Poppins,sans-serif;cursor:pointer}
#bhs button.on{background:var(--merah);color:#fff}
#bMenu{position:fixed;top:calc(env(safe-area-inset-top,0px) + 10px);left:12px;z-index:60;display:none;border:1.5px solid #e9cdd4;background:#fff;border-radius:999px;padding:7px 12px;font:700 .68rem Poppins,sans-serif;color:#a06;cursor:pointer}
#bMenu.on{display:block}
.lap{position:fixed;inset:0;z-index:400;background:rgba(0,0,0,.92);display:none;align-items:center;justify-content:center;padding:20px}
.lap.on{display:flex}
.lap .x{position:absolute;top:calc(env(safe-area-inset-top,0px) + 12px);right:14px;width:40px;height:40px;border-radius:50%;border:0;background:rgba(255,255,255,.15);color:#fff;font-size:1.3rem;cursor:pointer}
#lbimg{max-width:100%;max-height:88%;border-radius:8px;transform-origin:0 0;touch-action:none}
#lbTt{position:absolute;bottom:calc(env(safe-area-inset-bottom,0px) + 14px);left:0;right:0;text-align:center;color:#bbb;font-size:.7rem}
#vidKotak{width:100%;max-width:640px;aspect-ratio:16/9;background:#000;position:relative;border-radius:8px;overflow:hidden}
#vidKotak iframe{position:absolute;inset:0;width:100%;height:100%;border:0}
.tagpv{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom,0px) + 8px);transform:translateX(-50%);z-index:70;background:rgba(0,0,0,.6);color:#fff;font:700 .6rem Poppins,sans-serif;letter-spacing:.14em;padding:5px 12px;border-radius:999px;pointer-events:none}
.gagal{position:fixed;inset:0;z-index:999;display:flex;align-items:center;justify-content:center;padding:24px;text-align:center;background:var(--krim);font:15px/1.7 Poppins,sans-serif;color:#4a2a33}
#gk-album-btn{bottom:calc(env(safe-area-inset-bottom,0px) + 96px)!important}
</style>
</head>
<body>
<div id="bhs"><button data-l="ms">BM</button><button data-l="en">EN</button></div>
<button id="bMenu" onclick="keMenu()">‹ Menu</button>

<!-- S0 sampul -->
<section class="sk on" id="s0">
  <div class="tj" data-t="mail">YOU GOT A MAIL!</div>
  <div class="samp" id="samp">
    <img class="e eB" id="eB" alt=""><img class="e eT" id="eT" alt="">
    <img class="wax" id="wax" alt="">
  </div>
  <div class="ital sub" data-t="bukaHati">Click the heart to open it.</div>
</section>

<!-- S1 polaroid -->
<section class="sk" id="s1">
  <div class="tarikh a1" id="tarikh"></div>
  <div class="skrip hap a1" data-t="happy">Happy</div>
  <div class="polaroid bw a1" id="polUtama"><div class="tape a1"></div><div class="ph"><img class="a1" id="p0" alt=""></div><div class="hati a1">❤</div><div class="nm"><span class="a1" id="nm0"></span></div></div>
  <div class="skrip ann a1" data-t="anniv">Anniversary</div>
  <button class="klik a1" onclick="ke('s2')" data-t="klik">click here</button>
</section>

<!-- S2 menu -->
<section class="sk" id="s2">
  <div class="grid">
    <div class="stk" data-k="kamera" onclick="bukaBab('s3')"><img alt=""></div>
    <div class="stk" data-k="cd" onclick="bukaBab('s4')"><img alt=""></div>
    <div class="stk" data-k="ros" onclick="bukaBab('s5')"><img alt=""></div>
    <div class="stk" data-k="surat" onclick="bukaBab('s6')"><img alt=""></div>
  </div>
  <div class="ital" data-t="pilih">Click one to proceed…</div>
  <button class="bEnd" onclick="ke('s7')" data-t="end">End</button>
</section>

<!-- S3 kolaj -->
<section class="sk penuh" id="s3"><div class="bg" id="kolaj"><div class="tksl" id="kSince"></div><div id="kUcap" data-t="ucap">happy anniversary to you!</div></div></section>

<!-- S4 muzik -->
<section class="sk" id="s4">
  <div class="box">
    <div class="pl">
      <div class="yt" id="ytBox"></div>

/* lightbox */
var LB={s:1,x:0,y:0};
function lbBuka(src){var im=$('lbimg');im.src=src;LB={s:1,x:0,y:0};lbTerap();$('lb').classList.add('on');}
function lbTerap(){$('lbimg').style.transform='translate('+LB.x+'px,'+LB.y+'px) scale('+LB.s+')';}
(function(){var lb=$('lb'),im=$('lbimg'),pts={},d0=0,s0=1,c0=null,x0=0,y0=0,gerak=false,lastTap=0,tapT=0;
  function pusat(){var k=Object.keys(pts);if(k.length<2)return null;var a=pts[k[0]],b=pts[k[1]];return{x:(a.x+b.x)/2,y:(a.y+b.y)/2,d:Math.hypot(a.x-b.x,a.y-b.y)};}
  lb.addEventListener('pointerdown',function(e){if(e.target.closest('.x'))return;pts[e.pointerId]={x:e.clientX,y:e.clientY};try{lb.setPointerCapture(e.pointerId);}catch(_){}
    var p=pusat();if(p){d0=p.d;s0=LB.s;c0=p;x0=LB.x;y0=LB.y;}else{x0=LB.x;y0=LB.y;c0={x:e.clientX,y:e.clientY};}gerak=false;tapT=Date.now();});
  lb.addEventListener('pointermove',function(e){if(!pts[e.pointerId])return;pts[e.pointerId]={x:e.clientX,y:e.clientY};var p=pusat();
    if(p){var s=Math.max(1,Math.min(5,s0*p.d/d0));var px=(c0.x-(x0+im.offsetLeft))/s0,py=(c0.y-(y0+im.offsetTop))/s0;LB.s=s;LB.x=p.x-im.offsetLeft-px*s;LB.y=p.y-im.offsetTop-py*s;gerak=true;lbTerap();}
    else if(LB.s>1){var dx=e.clientX-c0.x,dy=e.clientY-c0.y;if(Math.hypot(dx,dy)>6)gerak=true;LB.x=x0+dx;LB.y=y0+dy;lbTerap();}});
  function lepas(e){if(!pts[e.pointerId])return;delete pts[e.pointerId];
    if(Object.keys(pts).length===0){var t=Date.now();
      if(!gerak&&t-tapT<300){if(t-lastTap<320){if(LB.s>1){LB={s:1,x:0,y:0};}else{var s=2.5,px=e.clientX-im.offsetLeft,py=e.clientY-im.offsetTop;LB={s:s,x:px-px*s,y:py-py*s};}lbTerap();lastTap=0;}
        else{lastTap=t;setTimeout(function(){if(lastTap===t&&LB.s===1)tutupLap('lb');},320);}}
      if(LB.s===1){LB.x=0;LB.y=0;lbTerap();}}
    else{var k=Object.keys(pts)[0];c0={x:pts[k].x,y:pts[k].y};x0=LB.x;y0=LB.y;}}
  lb.addEventListener('pointerup',lepas);lb.addEventListener('pointercancel',lepas);
})();
