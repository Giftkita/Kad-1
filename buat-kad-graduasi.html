<!DOCTYPE html>
<html lang="ms">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Pilih Tema — Kad Graduasi 🎓</title>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&family=Playfair+Display:wght@700&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Poppins',sans-serif;background:linear-gradient(135deg,#f3ecdc,#e8dcc2,#f3ecdc);min-height:100vh;padding:26px 18px 44px}
.g-head{text-align:center;max-width:520px;margin:6px auto 22px}
.g-title{font-family:'Playfair Display',serif;font-size:1.9rem;color:#1d3157;line-height:1.1}
.g-sub{font-size:.9rem;color:#8a7350;margin-top:6px}
.back{display:block;text-align:center;font-size:.8rem;color:#8a6a3f;margin-bottom:14px;text-decoration:none}
.g-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:14px;max-width:720px;margin:0 auto}
.g-card{border-radius:18px;overflow:hidden;background:#fff;border:1.5px solid #e6d9bd;cursor:pointer;transition:.2s;text-decoration:none;display:block}
.g-card:hover{transform:translateY(-3px);box-shadow:0 14px 32px rgba(29,49,87,.18);border-color:#c9a55a}
.g-card:active{transform:scale(.97)}
.g-card .gp{height:112px;display:flex;align-items:center;justify-content:center;font-size:2.4rem;position:relative}
.g-card .gm{padding:10px 12px 12px}
.g-card h3{font-size:.92rem;font-weight:600;color:#1d3157}
.g-card span{font-size:.72rem;color:#8a7350}
.g-badge{position:absolute;top:8px;right:8px;font-size:.55rem;font-weight:700;letter-spacing:.03em;padding:3px 8px;border-radius:50px;z-index:2;background:#e8f7ee;color:#1a9e54}
.g-glow{position:absolute;inset:0;background:radial-gradient(ellipse at 50% 40%,rgba(255,255,255,.25),transparent 60%)}
.gp-hadiah{background:linear-gradient(160deg,#1d3157,#2c4a7d 55%,#c9a55a)}
.gp-skrol{background:linear-gradient(160deg,#0f1e38,#1c3157 45%,#e7c877)}
</style>
</head>
<body>
<a class="back" href="index.html">‹ Kembali ke Homepage</a>
<div class="g-head">
  <h2 class="g-title">Pilih Tema Kad 🎓</h2>
  <p class="g-sub">Dua gaya berbeza. Pilih satu untuk mula.</p>
</div>
<div class="g-grid">
  <a class="g-card" href="buat-kad-graduasi-hadiah.html">
    <div class="gp gp-hadiah"><span class="g-badge">TERSEDIA</span>🎁<div class="g-glow"></div></div>
    <div class="gm"><h3>Kotak Hadiah</h3><span>Buka kotak, kad keluar</span></div>
  </a>
  <a class="g-card" href="buat-kad-skrol.html">
    <div class="gp gp-skrol"><span class="g-badge">BARU</span>📜<div class="g-glow"></div></div>
    <div class="gm"><h3>Skrol Ijazah</h3><span>Tarik reben, skrol terbuka</span></div>
  </a>
</div>
</body>
</html>
