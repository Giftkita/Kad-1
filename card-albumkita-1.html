  var lf=daun(geo,'0% 50%',dp,bl); isi.appendChild(lf); isi.appendChild(cincin());
  if(n===0){ dahBuka=true; kunciKlik=performance.now()+1400; document.body.classList.add('buka'); buku.classList.remove('tutup'); if(audio&&!muzikOn) toggleMuzik(); }
  jalan(n===0?1300:1000,function(p){ var e=ease(p);
    lf.style.transform='rotateY('+(-180*e)+'deg)';
    dp.style.filter='brightness('+(1-.3*e)+')'; bl.style.filter='brightness('+(.7+.3*e)+')';
  },function(){ anim=false; kunciKlik=performance.now()+300; lukis(n+1); });
}
function selakBelakang(){
  if(anim) return; var n=sp; if(n<=1) return;
  anim=true; var A=SPREAD[n], B=SPREAD[n-1];
  isi.innerHTML=''; isi.appendChild(papan());
  isi.appendChild(binaHal(B.L,'L')); isi.appendChild(binaHal(A.R,'R'));
  var dp=binaHal(A.L,'L'), bl=binaHal(B.R,'R');
  var lf=daun(GEO.L,'100% 50%',dp,bl); isi.appendChild(lf); isi.appendChild(cincin());
  jalan(1000,function(p){ var e=ease(p);
    lf.style.transform='rotateY('+(180*e)+'deg)';
    dp.style.filter='brightness('+(1-.3*e)+')'; bl.style.filter='brightness('+(.7+.3*e)+')';
  },function(){ anim=false; kunciKlik=performance.now()+300; lukis(n-1); });
}

/* ---------- mekanisme atas satu muka ---------- */
function bukaMeka(m,lama,side){
  var parts=MEKA[m]; anim=true;
  var W=lama.offsetWidth, H=lama.offsetHeight, geo={x:parseFloat(lama.style.left),y:parseFloat(lama.style.top),w:parseFloat(lama.style.width),h:parseFloat(lama.style.height)};
  BUKA[m]=true; var baru=binaHal(m,side,geo); BUKA[m]=false; baru.style.opacity='0';
  isi.insertBefore(baru,lama);
  lama.querySelectorAll('.denyut').forEach(function(d){d.remove();});
  lubangBanyak(lama,parts,W,H);
  var kp=parts.map(function(o){ var k=binaHal(m,side,geo); k.classList.add('keping'); k.querySelectorAll('.denyut').forEach(function(d){d.remove();});
    k.style.zIndex=30;
    klipRect(k,o); k.style.transformOrigin={kiri:o.x0+'% 50%',kanan:o.x1+'% 50%',atas:'50% '+o.y0+'%',bawah:'50% '+o.y1+'%'}[o.e];
    isi.insertBefore(k,lama.nextSibling); return {el:k,o:o}; });
  jalan(1500,function(p){ var e=ease(Math.min(1,p*1.1));
    kp.forEach(function(k){ var d=k.o.e, deg=e*(d==='kiri'?-118:d==='kanan'?118:d==='atas'?122:-122);
      k.el.style.transform='perspective('+(W*1.6)+'px) '+(d==='kiri'||d==='kanan'?'rotateY(':'rotateX(')+deg+'deg)';
      k.el.style.filter='brightness('+(1-.25*Math.sin(e*Math.PI/1.4))+')';
      k.el.style.opacity=String(p<.6?1:Math.max(0,1-(p-.6)/.3)); });
    var q=Math.max(0,Math.min(1,(p-.4)/.5)); baru.style.opacity=String(q); lama.style.opacity=String(1-q);
  },function(){ BUKA[m]=true; anim=false; kunciKlik=performance.now()+350; lukis(sp); });
}
/* poket muka 5 → kad foto atas meja */
function tarikPoket(lama){
  anim=true; lama.querySelectorAll('.denyut').forEach(function(d){d.remove();});
  var kad=[];
  for(var i=0;i<3;i++){ var c=document.createElement('div'); c.className='kadKeluar';
    c.style.left=(26+i*2)+'%'; c.style.top=(20-i)+'%'; c.style.width=(42-i*2)+'%'; c.style.height='28%'; c.style.zIndex=29-i;
    lama.appendChild(c); kad.push(c); }
  jalan(1200,function(p){
    kad.forEach(function(c,i){ var q=Math.max(0,Math.min(1,(p-i*.12)/.6)), e=ease(q);
      c.style.transform='translateY('+(-e*(70+i*12))+'%) rotate('+((i-1)*e*9)+'deg) scale('+(1+e*.25)+')'; c.style.opacity=String(q>0?1:0); });
  },function(){ anim=false; tunjukAkhir(); });
}
function tunjukAkhir(){
  var av=$('#akhirV'); av.innerHTML=''; var ak=document.createElement('div'); ak.className='ak'; ak.style.aspectRatio=String(ASPK[10]); ak.style.setProperty('--asp',ASPK[10]);
  isiHal(ak,10); av.appendChild(ak); av.style.opacity='0'; av.classList.add('show'); diAkhir=true; anim=true;
  jalan(800,function(p){ av.style.opacity=String(p); buku.style.opacity=String(1-p); },function(){ anim=false; kunciKlik=performance.now()+400; selepas(); });
}
function tutupAkhir(cb){ var av=$('#akhirV'); anim=true;
  jalan(600,function(p){ av.style.opacity=String(1-p); buku.style.opacity=String(p); },function(){ av.classList.remove('show'); buku.style.opacity=''; diAkhir=false; anim=false; if(cb) cb(); else selepas(); }); }
function tutupAlbum(){
  tutupAkhir(function(){ BUKA={1:false,3:false,5:false,7:false}; dahBuka=false; document.body.classList.remove('buka');
    isi.style.opacity='0'; lukis(0); jalan(700,function(p){ isi.style.opacity=String(p); },function(){ isi.style.opacity=''; }); });
}
function seterus(){
  if(anim) return;
  if(diAkhir) return tutupAlbum();
  if(sp===SPREAD.length-1){ var r=isi.querySelectorAll('.hal')[1]; return tarikPoket(r); }
  selakDepan();
}
function sebelum(){ if(anim) return; if(diAkhir) return tutupAkhir(); selakBelakang(); }
$('#next').onclick=function(){ seterus(); };
$('#prev').onclick=function(){ sebelum(); };
addEventListener('keydown',function(e){ if(e.key==='ArrowRight') seterus(); if(e.key==='ArrowLeft') sebelum(); });
var sx=null, sy=0;
$('#pentas').addEventListener('pointerdown',function(e){ sx=e.clientX; sy=e.clientY; });
$('#pentas').addEventListener('pointerup',function(e){ if(sx===null) return; var dx=e.clientX-sx, dy=e.clientY-sy; sx=null;
  if(Math.abs(dx)>50 && Math.abs(dx)>Math.abs(dy)){ if(dx<0) seterus(); else sebelum(); return; }
  if(Math.abs(dx)<10&&Math.abs(dy)<10&&sp===0&&!diAkhir&&!anim&&performance.now()>=kunciKlik) selakDepan();
});
var rs; addEventListener('resize',function(){ clearTimeout(rs); rs=setTimeout(ukur,140); });

/* ---------- popup ---------- */
function buka(id){ $('#'+id).classList.add('show'); }
document.addEventListener('click',function(e){
  if(e.target.hasAttribute&&e.target.hasAttribute('data-tutup')){ var p=e.target.closest('.pop'); p.classList.remove('show'); if(p.id==='popVideo') $('#videoIsi').innerHTML=''; }
  if(e.target.classList&&e.target.classList.contains('pop')){ e.target.classList.remove('show'); if(e.target.id==='popVideo') $('#videoIsi').innerHTML=''; }
});
['popUcap','popVideo','popKejut','ui','alat','atasUI'].forEach(function(id){ var el=document.getElementById(id); if(el) el.addEventListener('pointerup',function(e){ e.stopPropagation(); }); });
function bukaSurat(){ $('#ucapPenuh').textContent=(v('to')?T('kpd')+' '+v('to')+',\n\n':'')+ucapan()+(v('from')?'\n\n— '+v('from'):''); buka('popUcap'); }
function mainVideo(){ var id=ytId(v('video')); if(!id) return; if(muzikOn) toggleMuzik();
  $('#videoIsi').innerHTML='<iframe src="https://www.youtube.com/embed/'+id+'?autoplay=1" allow="autoplay; encrypted-media" allowfullscreen></iframe>'; buka('popVideo'); }
function bukaKejutan(){
  var h='', ks=v('surprise_img')||(fotoUntuk('f2')||{}).src||'';
  if(ks) h+='<img src="'+esc(ks)+'" alt="">';
  if(v('surprise')) h+='<div style="margin-top:12px;text-align:center">'+esc(v('surprise'))+'</div>';
  $('#kejutIsi').innerHTML=h; buka('popKejut'); letup();
}
function letup(){ var w=['#e9418a','#f5d35c','#a9dcd4','#c9b2e6','#f2a7b9','#f4b07a'];
  for(var i=0;i<50;i++){ var c=document.createElement('div');
    c.style.cssText='position:fixed;z-index:1500;left:50%;top:45%;width:8px;height:12px;border-radius:2px;pointer-events:none;background:'+w[i%6];
    document.body.appendChild(c); var a=Math.random()*Math.PI*2, j=120+Math.random()*220;
    c.animate([{transform:'translate(0,0) rotate(0)',opacity:1},{transform:'translate('+Math.cos(a)*j+'px,'+(Math.sin(a)*j+220)+'px) rotate('+(Math.random()*720)+'deg)',opacity:0}],{duration:1400+Math.random()*700,easing:'cubic-bezier(.2,.7,.4,1)',fill:'forwards'});
    setTimeout(function(x){return function(){x.remove();};}(c),2300); } }

/* ---------- muzik ---------- */
function sediaMuzik(){
  if(v('mp3')){ audio=new Audio(v('mp3')); audio.loop=true; }
  else if(ytId(v('yt'))){ var f=document.createElement('iframe'); f.style.cssText='position:fixed;width:1px;height:1px;opacity:0;pointer-events:none;left:-10px';
    f.allow='autoplay'; document.body.appendChild(f); var yid=ytId(v('yt'));
    audio={ play:function(){ f.src='https://www.youtube.com/embed/'+yid+'?autoplay=1&loop=1&playlist='+yid; }, pause:function(){ f.src=''; } }; }
  if(!audio) $('#bMuzik').style.display='none';
}
function toggleMuzik(){ if(!audio) return; muzikOn=!muzikOn; try{ muzikOn?audio.play():audio.pause(); }catch(e){}
  $('#bMuzik').style.background=muzikOn?'#f5d35c':'rgba(255,255,255,.86)'; }
$('#bMuzik').onclick=toggleMuzik;
$('#bAlbum').onclick=function(){ if(window.GKAlbum&&GKAlbum.open) GKAlbum.open(); };

/* ---------- bahasa ---------- */
function pakaiBahasa(){ document.documentElement.lang=lang;
  $('#pusing b').innerHTML=T('pusing'); if(D&&!anim){ if(diAkhir) tunjukAkhir(); else lukis(sp); } }
$('#lang').onclick=function(){ lang=(lang==='ms')?'en':'ms'; try{localStorage.setItem('gk_lang',lang);}catch(e){} pakaiBahasa(); };
try{ var _l=localStorage.getItem('gk_lang'); if(_l==='en'||_l==='ms') lang=_l; }catch(e){}

/* ---------- demo ---------- */
function fotoDemo(n){ var c=document.createElement('canvas'); c.width=480; c.height=600; var x=c.getContext('2d');
  var a=['#f2a7b9','#a9dcd4','#f5d35c','#9cc3e6','#c9b2e6','#f4b07a'][n%6];
  var g=x.createLinearGradient(0,0,480,600); g.addColorStop(0,a); g.addColorStop(1,'#fbf3e2'); x.fillStyle=g; x.fillRect(0,0,480,600);
  x.fillStyle='rgba(255,255,255,.85)'; x.beginPath(); x.arc(180,230,60,0,7); x.arc(300,230,60,0,7); x.fill();
  x.fillStyle='rgba(90,50,60,.75)'; x.beginPath(); x.ellipse(180,560,110,150,0,Math.PI,0); x.ellipse(300,560,110,150,0,Math.PI,0); x.fill();
  x.fillStyle='rgba(90,50,60,.9)'; x.font='bold 30px system-ui'; x.textAlign='center'; x.fillText('GAMBAR '+n,240,360);
  return c.toDataURL('image/jpeg',0.75); }
function demoData(){ var d={to:'Aina',from:'Hakim',tarikh:'sejak 14.02.2021',
  surprise:(lang==='en')?'Here\'s to forever, together 💗':'Untuk selamanya, bersama 💗', video:'https://www.youtube.com/watch?v=2Vv-BfVoq4g', yt:'', mp3:'', pos:{}};
  for(var i=1;i<=JUMLAH_FOTO;i++) d['f'+i]=fotoDemo(i); d.surprise_img=fotoDemo(30); return d; }

/* ---------- muat ---------- */
function ralat(t){ $('#muat').style.display='none'; $('#ralat').style.display='flex'; $('#ralat').innerHTML=t; }
function mula(){ $('#muat').style.display='none'; buku.style.backgroundImage='url('+MEJA+')'; $('#kabur').style.backgroundImage='url('+MEJA+')'; $('#pusing b').innerHTML=T('pusing'); sediaFoto(); sediaMuzik(); ukur(); lukis(0); }
(function init(){
  var q=new URLSearchParams(location.search); var id=q.get('id')||q.get('kad')||location.hash.replace('#','');
  if(q.get('preview')==='1'){ try{ D=JSON.parse(localStorage.getItem('gk_preview')); }catch(e){ D=null; }
    if(!D) return ralat(T('takdePratonton')); $('#badge').style.display=''; mula(); return; }
  if(q.get('demo')==='1'||!id){ D=demoData(); $('#badge').style.display=''; $('#badge').textContent='DEMO'; mula(); return; }
  if(!db) return ralat(T('dbGagal'));
  db.from('cards').select('card_data,paid').eq('id',id).single().then(function(r){
    if(r.error) throw r.error; if(r.data.paid!==true){ ralat(T('belum')); return; }
    if(r.data.card_data&&r.data.card_data.tamat){ ralat('Kad ini telah tamat tempoh (link aktif 2 bulan). · This card has expired (links stay active for 2 months).'); return; }
    D=r.data.card_data||{}; mula();
  }).catch(function(){ ralat(T('tiada')); });
})();
