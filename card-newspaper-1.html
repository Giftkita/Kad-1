<!DOCTYPE html>
<html lang="ms">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>The Graduate Times 📰</title>
<script src="https://unpkg.com/@supabase/supabase-js@2"></script>
<script>if(!window.supabase){document.write('<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"><\/script>');}</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,500;0,700;1,500;1,600&family=Special+Elite&family=Oswald:wght@500;600;700&family=Poppins:wght@400;500;600&display=swap" rel="stylesheet">
<!--
  GiftKita — Kad Graduasi "The Graduate Times" (template: newspaper) — enjin sama dengan Yin & Yang / Sunflower
  Reka sendiri (tema akhbar vintaj). Design: 5 halaman Canva (27 Sep 2026).
  Aliran: dinding helaian akhbar → komet kapal terbang kertas → helaian masuk semula → tersingkap →
          akhbar berlipat (ketik) → muka depan berpusing masuk (tajuk + gambar utama) → ketik → babak kolaj:
          muka depan kecil (ketik = baca semula), keratan EXTRA! EXTRA! (ketik = terbalik), 4 foto hitam-putih
          "Gosok saya" (gosok → berwarna), TV NOW SHOWING (video), mesin taip (mesej ditaip), kad lagu, peta, kejutan.
  card_data: template, nama, pengirim, tajuk, utama (+_pos), surat, skrol_msg, p1..p4 (+ _pos), video, yt|mp3, song, artist,
             peta:{img,pins:[{x,y,img,title,place,date}]}, suara, surprise_img (+_pos), surprise, lang
-->
<style>
:root{--u:min(1vw,5.4px)}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;overflow:hidden;background:#d9c9a3}
body{font-family:'Playfair Display',Georgia,serif;color:#1e1b18;-webkit-user-select:none;user-select:none}
img{-webkit-user-drag:none}

/* latar */
.latar{position:fixed;inset:0}
#latarRose{background:radial-gradient(ellipse 70% 60% at 45% 55%,#f6efdf 0%,#e6d9bb 40%,#c9b58a 78%,#6e5c40 135%)}
#latarPeach{background:radial-gradient(ellipse 85% 75% at 50% 45%,#f4ecda 0%,#e7dcc2 55%,#cdbb92 105%,#8f7a55 140%);opacity:0;transition:opacity 1s}
#latarUtama{background:repeating-linear-gradient(0deg,rgba(60,50,35,.035) 0 1px,transparent 1px 7px),radial-gradient(ellipse 80% 70% at 50% 35%,#f5eedd 0%,#ebe0c6 42%,#d8c7a0 82%,#9c8660 125%);opacity:0;transition:opacity 1.2s}

/* intro bunga */
#bunga{position:fixed;inset:0;z-index:40;pointer-events:none;overflow:hidden}
.fl{position:absolute;left:0;top:0;will-change:transform,opacity}
.asap{position:fixed;z-index:39;border-radius:50%;pointer-events:none;background:radial-gradient(circle,rgba(170,155,125,.55),rgba(170,155,125,0) 70%);filter:blur(4px)}
#langkau{position:fixed;inset:0;z-index:45}

/* sampul */
#skSampul{position:fixed;inset:0;z-index:20;display:flex;flex-direction:column;align-items:center;justify-content:center;opacity:0;pointer-events:none;transition:opacity .9s}
#skSampul.on{opacity:1;pointer-events:auto}
#skSampul.pergi{opacity:0;pointer-events:none;transition:opacity .8s .5s}
.ketikTeks{position:absolute;top:calc(env(safe-area-inset-top,0px) + 58px);left:0;right:0;text-align:center;font:500 11px/1 'Special Elite',serif;letter-spacing:.22em;color:#3a332a;text-transform:uppercase}
#skSampul .drp{transition:opacity .4s}
#skSampul.buka .drp,#skSampul.buka .ketikTeks{opacity:0}
.drp{font:400 11px 'Special Elite',serif;letter-spacing:.22em;color:#3a332a;text-transform:uppercase;display:flex;align-items:baseline;gap:10px}
.drp i{font:italic 600 clamp(1.4rem,6vw,1.9rem) 'Playfair Display',serif;letter-spacing:0;text-transform:none;color:#1e1b18}
#sampulBox{position:relative;width:min(84vw,440px);margin:22px 0 26px;cursor:pointer;animation:apung 3s ease-in-out infinite}
#sampulBox img{display:block;width:100%}
#sampulBox .buka{position:absolute;left:0;bottom:0;width:100%;opacity:0}
#sampulBox .kadNaik{position:absolute;left:23%;width:54%;bottom:12%;opacity:0;z-index:-1}
#sampulBox.dibuka{animation:none}
#sampulBox.dibuka .tutup{opacity:0;transform:scale(1.25) rotate(6deg);transition:opacity .55s,transform .6s cubic-bezier(.3,.7,.3,1)}
#sampulBox.dibuka .buka{opacity:1;transition:opacity .35s}
#sampulBox.dibuka .kadNaik{opacity:1;transform:translateY(-42%);transition:transform 1s cubic-bezier(.2,.8,.3,1) .35s,opacity .3s .3s}
@keyframes apung{50%{transform:translateY(-8px)}}

/* babak utama */
#pentas{position:fixed;left:0;top:0;transform-origin:0 0;z-index:10;opacity:0;pointer-events:none;transition:opacity 1s,filter .5s}
#pentas.on{opacity:1;pointer-events:auto}
#pentas.kabur{filter:blur(6px) saturate(.8);opacity:.45}
.ob{position:absolute;touch-action:none;transform:translate(var(--x,0px),var(--y,0px)) rotate(var(--r,0deg)) scale(var(--s,1));
  transition:transform .9s cubic-bezier(.2,.8,.3,1.1),opacity .6s;filter:drop-shadow(0 8px 12px rgba(40,30,20,.28))}
.ob{cursor:grab}
.ob.seret{transition:none;cursor:grabbing;z-index:60}
#pentas.angkat .ob:not(.seret){filter:blur(5px) saturate(.85);opacity:.45;transition:filter .35s,opacity .35s,transform .9s cubic-bezier(.2,.8,.3,1.1)}
.ob.sorok{opacity:0}
#pentas:not(.masuk) .ob{--s:.4;opacity:0}
.ob img.sp{display:block;width:100%;pointer-events:none}
/* pemegang seret (butang bulat ikon 4 titik, macam video) */
.pg{position:absolute;right:-9px;top:-9px;width:26px;height:26px;border-radius:50%;background:#fff;box-shadow:0 2px 6px rgba(40,30,20,.3);cursor:grab;touch-action:none;z-index:5;
  display:flex;align-items:center;justify-content:center}
.pg::before{content:"";width:12px;height:12px;background:radial-gradient(circle,#7a6a52 2.4px,transparent 2.6px) 0 0/6px 6px}
.pg:active{cursor:grabbing}
.ob.kiri .pg{right:auto;left:-9px}
#oSampul{cursor:pointer;filter:drop-shadow(0 10px 18px rgba(40,30,20,.3))}
/* kad flip */
#oKad{perspective:1400px;filter:none;cursor:pointer}
#oKad .dalam{position:relative;width:100%;transform-style:preserve-3d;transition:transform .9s cubic-bezier(.3,.7,.3,1)}
#oKad.balik .dalam{transform:rotateY(180deg)}
#oKad .muka{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;filter:drop-shadow(0 8px 12px rgba(40,30,20,.28))}
#oKad .muka.d{position:relative}
#oKad .muka.b{transform:rotateY(180deg)}
#oKad .pusing{position:absolute;left:50%;top:calc(var(--u)*-2.5);transform:translateX(-50%);white-space:nowrap;z-index:3;pointer-events:none;
  background:rgba(255,255,255,.88);color:#3a332a;border-radius:999px;padding:calc(var(--u)*1.3) calc(var(--u)*3);font:italic 600 calc(var(--u)*2.8) 'Playfair Display',serif;
  box-shadow:0 3px 10px rgba(40,30,20,.2);animation:pusingDenyut 1.8s ease-in-out infinite;transition:opacity .4s}
#oKad.balik .pusing,#oKad.sudah .pusing{opacity:0}
@keyframes pusingDenyut{50%{transform:translateX(-50%) scale(1.06)}}
#oKad .muka img{display:block;width:100%;height:100%}
#msj{position:absolute;overflow:hidden;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:0 4%;
  font-family:'Special Elite',serif;color:#2e2822;line-height:1.55;white-space:pre-line}
#msj .ttd{display:block;align-self:stretch;margin-top:.6em;font-style:italic;text-align:right;white-space:nowrap}
/* polaroid kecil */
.pol{cursor:pointer}
.pol .ft{position:absolute;overflow:hidden;background:#d9d0bf}
.pol .ft img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.pol .ft img{transition:filter 1s}
.pol:not(.siap) .ft img{filter:grayscale(1) sepia(.35) contrast(1.08) brightness(.97)}
.pol .ft .tutup{position:absolute;left:8%;right:8%;bottom:9%;padding:3% 0;background:rgba(244,236,218,.94);border:1px solid #b3261e;text-align:center;transform:rotate(-2deg);
  font:calc(var(--u)*2.3)/1 'Special Elite',monospace;letter-spacing:.08em;color:#b3261e;text-transform:uppercase;transition:opacity .6s}
.pol.siap .ft .tutup{opacity:0}
.pol .no{position:absolute;left:10%;bottom:4.5%;font:500 calc(var(--u)*1.7) 'Special Elite',serif;color:#7a6a52}
.pol .kosong{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;color:rgba(150,90,100,.35);font-size:calc(var(--u)*6)}
/* polaroid dibesarkan (gosok) */
#besar{position:fixed;inset:0;z-index:60;display:none}
#besar.on{display:block}
#besar:not(.vid) #bVid,#besar.vid #bPol{display:none}
#besar .sinar{position:absolute;left:50%;top:50%;width:80vmin;height:80vmin;transform:translate(-50%,-50%);border-radius:50%;background:radial-gradient(circle,rgba(255,248,230,.75),rgba(255,248,230,0) 65%);pointer-events:none}
#bPol{position:absolute;left:0;top:0;transform-origin:0 0;filter:drop-shadow(0 14px 24px rgba(40,30,20,.35))}
#bPol>img{display:block;width:100%}
#bPol .pg{cursor:default}
#bFt{position:absolute;overflow:hidden;background:#d9d0bf}
#bFt img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
#bFt canvas{position:absolute;inset:0;width:100%;height:100%;touch-action:none;cursor:crosshair;transition:opacity .7s}
#bNo{position:absolute;left:10%;bottom:4.5%;font:500 12px 'Special Elite',serif;color:#7a6a52}
/* kad video dibesarkan */
#bVid{position:absolute;left:0;top:0;transform-origin:0 0;background:#111;border-radius:14px;overflow:hidden;box-shadow:0 18px 40px rgba(30,24,18,.45);aspect-ratio:16/9}
#bVid iframe{position:absolute;inset:0;width:100%;height:100%;border:0}
#bVid .tt{position:absolute;left:0;right:0;bottom:-34px;text-align:center;font:italic 500 13px 'Playfair Display',serif;color:rgba(40,34,28,.8);pointer-events:none}
/* kad video */
#oVid{cursor:pointer}
#oVid .tvi{position:absolute;overflow:hidden;background:#222 center/cover no-repeat;border-radius:8%/10%}
#oVid .tvi::after{content:"";position:absolute;inset:0;background:repeating-linear-gradient(0deg,rgba(0,0,0,.18) 0 1px,transparent 1px 3px),radial-gradient(ellipse at 50% 50%,transparent 55%,rgba(0,0,0,.45))}
#oVid .mn{position:absolute;transform:translate(-50%,-50%);width:calc(var(--u)*11);height:calc(var(--u)*7.6);border-radius:calc(var(--u)*2.2);background:#e62117;z-index:2}
#oVid .mn::after{content:"";position:absolute;left:40%;top:28%;border-left:calc(var(--u)*3.2) solid #fff;border-top:calc(var(--u)*1.8) solid transparent;border-bottom:calc(var(--u)*1.8) solid transparent}
#oVid .tj{display:none}
/* kad lagu */
#oLagu{background:#121212;border-radius:calc(var(--u)*2.4);padding:calc(var(--u)*2.2);display:flex;align-items:center;gap:calc(var(--u)*2.4);color:#fff;font-family:Poppins,sans-serif}
#oLagu .cv{flex:0 0 calc(var(--u)*11);height:calc(var(--u)*11);border-radius:calc(var(--u)*1.2);background:linear-gradient(135deg,#d9c9a3,#b3261e) center/cover}
#oLagu .tx{flex:1;min-width:0}
#oLagu .t1{font-weight:600;font-size:calc(var(--u)*2.7);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#oLagu .t2{font-size:calc(var(--u)*2.2);color:#b3b3b3;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:2px}
#oLagu .eq{display:flex;gap:2px;align-items:flex-end;height:calc(var(--u)*2.4);margin-top:calc(var(--u)*1)}
#oLagu .eq i{width:3px;background:#d9c9a3;height:30%}
#oLagu.main .eq i{animation:eq .9s ease-in-out infinite}
#oLagu .eq i:nth-child(2){animation-delay:.2s}#oLagu .eq i:nth-child(3){animation-delay:.4s}#oLagu .eq i:nth-child(4){animation-delay:.1s}
@keyframes eq{50%{height:100%}}
#oLagu .bt{flex:0 0 calc(var(--u)*8);height:calc(var(--u)*8);border-radius:50%;background:#fff;border:0;position:relative;cursor:pointer}
#oLagu .bt::after{content:"";position:absolute;left:38%;top:28%;border-left:calc(var(--u)*2.8) solid #121212;border-top:calc(var(--u)*1.8) solid transparent;border-bottom:calc(var(--u)*1.8) solid transparent}
#oLagu.main .bt::after{left:32%;top:30%;width:calc(var(--u)*2.8);height:calc(var(--u)*3.4);border:0;border-left:calc(var(--u)*.9) solid #121212;border-right:calc(var(--u)*.9) solid #121212;box-sizing:border-box}
/* peta */
#oPeta{background:#f4ecda;border-radius:calc(var(--u)*2.4);padding:calc(var(--u)*2.4);font-family:'Playfair Display',serif}
#oPeta .kp{display:flex;align-items:flex-end;justify-content:space-between;margin-bottom:calc(var(--u)*1.6)}
#oPeta small{display:block;font:500 calc(var(--u)*1.5) Poppins,sans-serif;letter-spacing:.2em;color:#7a6a52}
#oPeta b{font:600 calc(var(--u)*4.2)/1 'Playfair Display',serif;color:#1e1b18}
#oPeta .zm{display:flex;gap:4px}
#oPeta .zm button{width:calc(var(--u)*5);height:calc(var(--u)*5);border-radius:50%;border:0;background:#1e1b18;color:#fff;font:600 calc(var(--u)*3)/1 Poppins,sans-serif;cursor:pointer}
#oPeta .bingkai{position:relative;overflow:hidden;border-radius:calc(var(--u)*1.4)}
#oPeta .dlm{position:relative;transform-origin:50% 50%;transition:transform .4s}
#oPeta .dlm img{display:block;width:100%}
.pin{position:absolute;width:calc(var(--u)*7);height:calc(var(--u)*7);transform:translate(-50%,-100%);cursor:pointer;z-index:2}
.pin span{position:absolute;inset:0;border-radius:50%;border:2px solid #fff;background:#d9c9a3 center/cover;box-shadow:0 3px 8px rgba(0,0,0,.35)}
.pin::after{content:"";position:absolute;left:50%;bottom:-5px;width:9px;height:9px;background:#b3261e;border:2px solid #fff;border-radius:50%;transform:translateX(-50%)}

/* pelekat kejutan (kunci sampai semua polaroid digosok) */
#oKejut{cursor:pointer;background:#f4ecda;border-radius:calc(var(--u)*2.4);padding:calc(var(--u)*2) calc(var(--u)*2.4);text-align:center;font-family:'Playfair Display',serif;border:2px dashed #b3261e}
#oKejut .ik{font-size:calc(var(--u)*7);line-height:1}
#oKejut b{display:block;font:italic 600 calc(var(--u)*3.2)/1.1 'Playfair Display',serif;color:#b3261e;margin-top:calc(var(--u)*.8)}
#oKejut small{display:block;font:500 calc(var(--u)*2) Poppins,sans-serif;color:#7a6a52;margin-top:calc(var(--u)*.6)}
#oKejut.buka{border-style:solid;border-color:#d9c9a3;background:#fff}
#oKejut.goyang{animation:goyang .5s ease}
@keyframes goyang{20%{transform:translate(var(--x,0px),var(--y,0px)) rotate(calc(var(--r) - 8deg))}60%{transform:translate(var(--x,0px),var(--y,0px)) rotate(calc(var(--r) + 8deg))}}
/* skrol ucapan */
#oSkrol{cursor:pointer}
.pusing2{position:absolute;left:50%;top:calc(var(--u)*-9);transform:translateX(-50%);white-space:nowrap;pointer-events:none;
  background:rgba(255,255,255,.9);color:#3a332a;border-radius:999px;padding:calc(var(--u)*1.3) calc(var(--u)*3);font:italic 600 calc(var(--u)*3.4) 'Playfair Display',serif;
  box-shadow:0 3px 10px rgba(40,30,20,.2);animation:pusingDenyut 1.8s ease-in-out infinite;transition:opacity .4s}
.sudah .pusing2{opacity:0}
#oSampul .pusing2{top:calc(var(--u)*-6)}
#lapSk{z-index:950;flex-direction:column}
#skBox{position:relative;width:min(86vw,390px);display:flex;flex-direction:column;align-items:center;filter:drop-shadow(0 18px 30px rgba(30,24,18,.4))}
#skBox .gl{position:relative;width:112%;height:26px;border-radius:13px;z-index:2;background:linear-gradient(180deg,#5a534b 0%,#2a2622 45%,#0f0d0b 100%);box-shadow:inset 0 2px 3px rgba(255,255,255,.18)}
#skBox .gl::before,#skBox .gl::after{content:"";position:absolute;top:-4px;width:22px;height:34px;border-radius:6px;background:linear-gradient(180deg,#3a3530,#0e0c0a)}
#skBox .gl::before{left:-14px}#skBox .gl::after{right:-14px}
#skKertas+.gl{display:none}
#skKertas{width:100%;max-height:0;overflow:hidden;background:#fbf8ef;background-image:linear-gradient(90deg,transparent 11%,rgba(179,38,30,.25) 11%,rgba(179,38,30,.25) calc(11% + 1px),transparent calc(11% + 1px)),
  repeating-linear-gradient(180deg,transparent 0 27px,rgba(90,110,140,.13) 27px 28px);transition:max-height 1.3s cubic-bezier(.3,.7,.3,1) .35s;margin-top:-8px;
  box-shadow:inset 0 10px 12px -8px rgba(0,0,0,.35)}
#lapSk.buka #skKertas{max-height:70vh}
#skDlm{padding:26px 24px 30px 17%;text-align:left;max-height:70vh;overflow-y:auto;opacity:0;transition:opacity .5s 1s}
#lapSk.buka #skDlm{opacity:1}
#skDlm .ik{font-size:26px;line-height:1}
#skDlm h3{font:700 1.5rem/1.15 'Playfair Display',serif;color:#1e1b18;margin:8px 0 4px}
#skDlm .gar{width:40%;height:2px;margin:8px 0 12px;background:#b3261e}
#skDlm p{font:.98rem/28px 'Special Elite',monospace;color:#1e1b18;white-space:pre-line;min-height:56px}
#skDlm p .kur{display:inline-block;width:.55em;height:1.05em;margin-left:1px;vertical-align:-2px;background:#1e1b18;animation:kelip .8s steps(1) infinite}
@keyframes kelip{50%{opacity:0}}
#skDlm .ttd{margin-top:16px;font:italic 600 1.2rem 'Playfair Display',serif;color:#b3261e;text-align:right;transition:opacity .8s}
#skReben{display:none}
#lapSk .tt2{margin-top:18px;font:italic 13px 'Playfair Display',serif;color:rgba(40,30,20,.7)}
/* lapisan */
.lap{position:fixed;inset:0;z-index:80;display:none;align-items:center;justify-content:center;padding:20px;background:rgba(40,32,24,.45);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px)}
.lap.on{display:flex;animation:muncul .4s ease}
@keyframes muncul{from{opacity:0}}
.x{position:absolute;right:-10px;top:-10px;width:30px;height:30px;border-radius:50%;border:0;background:#fff;color:#3a332a;box-shadow:0 3px 10px rgba(0,0,0,.2);font-size:14px;cursor:pointer;z-index:5}
#pinBox,#kjBox{position:relative;width:min(80vw,300px);background:#f4ecda;border-radius:18px;padding:12px 12px 16px;box-shadow:0 20px 50px rgba(30,24,18,.35);animation:naik .5s cubic-bezier(.2,.8,.3,1.2)}
#pinBox .gm,#kjBox .gm{width:100%;aspect-ratio:1.2;border-radius:12px;background:#e6dcc6 center/cover}
#pinBox .tr{margin-top:10px;font:500 10px Poppins,sans-serif;letter-spacing:.14em;color:#7a6a52}
#pinBox h4{font:600 1.6rem/1.1 'Playfair Display',serif;color:#1e1b18;margin-top:2px}
#pinBox .tp{font:italic 500 1rem 'Playfair Display',serif;color:#3a332a}
.vn{margin-top:12px;display:flex;align-items:center;gap:10px;background:#fff;border-radius:40px;padding:6px 12px 6px 6px;box-shadow:0 2px 8px rgba(40,30,20,.1)}
.vn button{flex:0 0 34px;height:34px;border-radius:50%;border:0;background:#1e1b18;color:#fff;font-size:12px;cursor:pointer}
.vn .gl{flex:1;display:flex;gap:2px;align-items:center;height:22px}
.vn .gl i{flex:1;background:#d9c8c1;border-radius:2px}
.vn .gl i.on{background:#1e1b18}
.vn .ms{font:500 11px Poppins,sans-serif;color:#3a332a;min-width:30px;text-align:right}
.vn b{display:block;font:600 12px Poppins,sans-serif;color:#1e1b18}
#kjBox{text-align:center}
#kjBox h3{font:italic 600 1.9rem 'Playfair Display',serif;color:#b3261e;margin:4px 0 10px}
#kjBox p{margin-top:12px;font:italic 1rem/1.6 'Special Elite',serif;color:#2e2822;white-space:pre-line}
#lb{z-index:1000;background:rgba(20,16,12,.94);padding:0;touch-action:none;overflow:hidden}
#lb img{max-width:100vw;max-height:100vh;border-radius:0;box-shadow:none;transform-origin:0 0;will-change:transform;-webkit-user-drag:none}
#lb .tt{position:absolute;left:0;right:0;bottom:calc(env(safe-area-inset-bottom,0px) + 16px);text-align:center;font:italic 13px 'Playfair Display',serif;color:rgba(255,255,255,.6);pointer-events:none}
#lb .x{position:fixed;right:14px;top:14px;background:rgba(255,255,255,.9);z-index:2}
#pinBox .gm,#kjBox .gm{cursor:zoom-in}
.hati{position:fixed;z-index:90;pointer-events:none;animation:jatuh 2.6s ease-in forwards}
@keyframes jatuh{to{transform:translateY(110vh) rotate(260deg);opacity:.2}}
#hint{position:fixed;left:0;right:0;bottom:calc(env(safe-area-inset-bottom,0px) + 14px);z-index:30;text-align:center;font:italic 500 13px 'Playfair Display',serif;color:rgba(40,34,28,.75);opacity:0;transition:opacity 1s;pointer-events:none}
#hint.on{opacity:1}
#bhs{position:fixed;top:10px;right:10px;z-index:95;display:flex;background:rgba(255,255,255,.85);border-radius:30px;padding:3px;box-shadow:0 2px 10px rgba(40,30,20,.2)}
#bhs button{border:0;background:transparent;color:#3a332a;font:600 .68rem Poppins,sans-serif;padding:5px 11px;border-radius:20px;cursor:pointer}
#bhs button.on{background:#3a332a;color:#fff}
.tagpv{position:fixed;top:10px;left:50%;transform:translateX(-50%);z-index:95;background:rgba(0,0,0,.35);color:#fff;font:500 .53rem Poppins,sans-serif;letter-spacing:.18em;padding:5px 13px;border-radius:40px;pointer-events:none}
.gagal{position:fixed;inset:0;z-index:99;display:flex;align-items:center;justify-content:center;padding:24px;text-align:center;background:#efe6d2;font:16px/1.7 'Special Elite',serif;color:#1e1b18}
#oKad .pusing{top:auto;bottom:calc(var(--u)*-4)}
/* muka depan akhbar */
.md{position:relative}
.md>img.sp{display:block;width:100%;pointer-events:none}
.mdT{position:absolute;display:flex;align-items:center;justify-content:center;text-align:center;overflow:hidden;padding:0 1%}
.mdT span{display:block;font-family:Oswald,'Arial Narrow',sans-serif;font-weight:700;text-transform:uppercase;line-height:1.02;color:#1e1b18;letter-spacing:.01em}
.mdF{position:absolute;overflow:hidden;background:#cfc6b4}
.mdF img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;filter:grayscale(1) sepia(.18) contrast(1.1)}
.mdF .ksg{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:2em;opacity:.35}
#lapMD{position:fixed;inset:0;z-index:70;display:none;flex-direction:column;align-items:center;justify-content:center;gap:18px;padding:16px;cursor:pointer}
#lapMD.on{display:flex}
#lapMD.kabur{background:rgba(40,32,24,.45);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px)}
#mdBesar{filter:drop-shadow(0 18px 36px rgba(30,24,18,.45));opacity:0}
#mdBesar .mdF{cursor:zoom-in}
#mdTt{font:600 13px 'Special Elite',monospace;letter-spacing:.06em;color:#1e1b18;background:rgba(255,255,255,.88);border-radius:999px;padding:8px 18px;box-shadow:0 3px 10px rgba(30,24,18,.2);opacity:0;transition:opacity .6s}
#mdTt.on{opacity:1;animation:pusingDenyut2 1.8s ease-in-out infinite}
@keyframes pusingDenyut2{50%{transform:scale(1.06)}}
.ketikTeks,.drp{font-family:'Special Elite',monospace}
</style>

var introSiap=false,tmr=[];

function intro(){
  var W=innerWidth,H=innerHeight,bx=$('bunga'),cell=Math.max(72,Math.min(W,H)/3.6);
  /* 1. dinding penuh */
  var dind=[];
  for(var y=-.3;y<H/cell+1;y+=.62)for(var x=-.3;x<W/cell+1;x+=.62){var sz=cell*rnd(1.1,1.5),e=bungaEl(sz);var px=x*cell+rnd(-20,20),py=y*cell+rnd(-20,20),r=rnd(-40,40);
    e.style.transform=TR(px,py,sz,1,r);bx.appendChild(e);dind.push({e:e,x:px,y:py,sz:sz,r:r});}
  later(function(){dind.forEach(function(f){var a=Math.atan2(f.y-H/2,f.x-W/2),d=Math.max(W,H);
    f.e.animate([{transform:TR(f.x,f.y,f.sz,1,f.r),opacity:1},{transform:TR(f.x+Math.cos(a)*d*.8,f.y+Math.sin(a)*d*.8,f.sz,1.4,f.r+rnd(-90,90)),opacity:0}],{duration:rnd(600,900),easing:'cubic-bezier(.5,0,.8,.6)',fill:'forwards'});});
    later(function(){dind.forEach(function(f){f.e.remove();});},950);},700);
  /* 2. komet peony */
  later(function(){var sz=Math.min(W,H)*.42,e=bungaEl(sz,'pesawat');bx.appendChild(e);
    var x0=-sz*.6,y0=H*.88,x1=W*.8,y1=H*.26,t0=performance.now(),dur=1500;
    (function langkah(t){var p=Math.min(1,(t-t0)/dur),q=1-Math.pow(1-p,2),x=x0+(x1-x0)*q,y=y0+(y1-y0)*q;
      e.style.transform=TR(x,y,sz,.8+.2*q,-26+q*14);
      if(p<.92&&Math.random()<.9){var s=document.createElement('div');s.className='asap';var r=sz*rnd(.2,.36);s.style.width=s.style.height=r+'px';
        s.style.left=(x-r/2+rnd(-sz*.15,sz*.15))+'px';s.style.top=(y-r/2+rnd(-sz*.15,sz*.15))+'px';document.body.appendChild(s);
        s.animate([{opacity:.9,transform:'scale(.6)'},{opacity:0,transform:'scale(2.2)'}],{duration:1100,easing:'ease-out',fill:'forwards'});setTimeout(function(){s.remove();},1150);}
      if(p<1)requestAnimationFrame(langkah);else e.animate([{opacity:1},{opacity:0,transform:TR(x,y,sz,1.1,10)}],{duration:500,fill:'forwards'});})(t0);
  },1300);
  /* 3. bunga masuk satu-satu, longgok dari bawah */
  later(function(){var sen=[];
    for(var y=H/cell+1;y>-.6;y-=.62)for(var x=-.3;x<W/cell+1;x+=.62)sen.push({x:x*cell+rnd(-24,24),y:y*cell+rnd(-24,24),sz:cell*rnd(1.1,1.55),r:rnd(-40,40)});
    var n=sen.length;
    sen.forEach(function(f,i){var e=bungaEl(f.sz);bx.appendChild(e);f.e=e;var dari=Math.random();
      var sx=dari<.5?rnd(-.2,1.2)*W:(dari<.75?-f.sz:W+f.sz),sy=dari<.5?H+f.sz:rnd(.3,1)*H;
      e.animate([{transform:TR(sx,sy,f.sz,.5,f.r-90),opacity:0},{opacity:1,offset:.25},{transform:TR(f.x,f.y,f.sz,1,f.r),opacity:1}],
        {duration:900,delay:i/n*2800+rnd(0,250),easing:'cubic-bezier(.2,.8,.3,1)',fill:'both'});});
    /* 4. tersingkap ke atas */
    later(function(){$('latarPeach').style.opacity=1;$('skSampul').classList.add('on');
      sen.forEach(function(f){f.e.animate([{transform:TR(f.x,f.y,f.sz,1,f.r)},{transform:TR(f.x+rnd(-30,30),f.y-H*1.15,f.sz,1,f.r+rnd(-40,40))}],
        {duration:1300,delay:(1-f.y/H)*200+rnd(0,300),easing:'cubic-bezier(.6,0,.4,1)',fill:'forwards'});});
      later(function(){bx.innerHTML='';selesaiIntro();},1900);},3900);
  },2900);
  $('langkau').onclick=function(){langkau();};
}

var zTop=20,AMBANG=9;
function seretan(el,ketik){
  var id=null,sx,sy,bx,by,gerak=false;
  function mula(e,paksa){if(e.target.closest('button,iframe,.pin'))return;id=e.pointerId;sx=e.clientX;sy=e.clientY;
    bx=parseFloat(el.style.getPropertyValue('--x'))||0;by=parseFloat(el.style.getPropertyValue('--y'))||0;gerak=false;el.style.zIndex=++zTop;
    if(paksa)angkat();}
  function angkat(){gerak=true;el.classList.add('seret');$('pentas').classList.add('angkat');try{el.setPointerCapture(id);}catch(_){}}
  el.addEventListener('pointerdown',function(e){var pg=e.target.closest('.pg');mula(e,!!pg);if(pg)e.preventDefault();});
  el.addEventListener('pointermove',function(e){if(e.pointerId!==id)return;var dx=e.clientX-sx,dy=e.clientY-sy;
    if(!gerak&&Math.hypot(dx,dy)>AMBANG)angkat();
    if(gerak){e.preventDefault();el.style.setProperty('--x',(bx+dx/SKALA)+'px');el.style.setProperty('--y',(by+dy/SKALA)+'px');}});
  function lepas(e){if(e.pointerId!==id)return;id=null;var g=gerak;gerak=false;el.classList.remove('seret');$('pentas').classList.remove('angkat');
    if(!g&&ketik&&!e.target.closest('.pg,button,iframe'))ketik(e);}
  el.addEventListener('pointerup',lepas);el.addEventListener('pointercancel',function(e){if(e.pointerId!==id)return;id=null;gerak=false;el.classList.remove('seret');$('pentas').classList.remove('angkat');});
}

  if(el.classList.contains('siap')){lbBuka(D[k]);return;}

  $('bImg').src=D[k];$('bImg').style.objectPosition=D[k+'_pos']||'50% 50%';$('bNo').textContent=el.querySelector('.no').textContent;
  /* saiz akhir: 62vmin lebar maks, muat tinggi */
  var W=innerWidth,H=innerHeight,bw=Math.min(W*.68,H*.66/POL_R,340),bh=bw*POL_R;b.style.width=bw+'px';
  var r0=el.getBoundingClientRect(),x1=(W-bw)/2,y1=(H-bh)/2;

    {duration:650,easing:'cubic-bezier(.2,.8,.3,1)',fill:'forwards'});
  setTimeout(function(){var cv=$('bCv'),r=ft.getBoundingClientRect(),dp=Math.min(2,devicePixelRatio||1);
    cv.width=r.width*dp;cv.height=r.height*dp;cv.style.opacity=1;var c=cv.getContext('2d');c.setTransform(dp,0,0,dp,0,0);
    var w=r.width,h=r.height,src=D[k],pos=(D[k+'_pos']||'50% 50%').split(' ').map(parseFloat),disentuh=false;
    function lapis(im){c.save();c.globalCompositeOperation='source-over';c.fillStyle='#cfc6b4';c.fillRect(0,0,w,h);
      if(im&&im.naturalWidth){var sk=Math.max(w/im.naturalWidth,h/im.naturalHeight),dw=im.naturalWidth*sk,dh=im.naturalHeight*sk,dx=(w-dw)*((pos[0]||50)/100),dy=(h-dh)*((isNaN(pos[1])?50:pos[1])/100);
        c.filter='grayscale(1) sepia(.35) contrast(1.08)';var fOk=c.filter&&c.filter!=='none';c.drawImage(im,dx,dy,dw,dh);c.filter='none';
        if(!fOk){try{var id=c.getImageData(0,0,cv.width,cv.height),d=id.data;for(var i=0;i<d.length;i+=4){var y=.3*d[i]+.59*d[i+1]+.11*d[i+2];d[i]=Math.min(255,y*1.07+10);d[i+1]=y*.97+4;d[i+2]=y*.82;}c.putImageData(id,0,0);}
          catch(_){c.fillStyle='rgba(120,100,70,.6)';c.fillRect(0,0,w,h);}}}
      c.fillStyle='rgba(30,25,20,.17)';for(var yy=2;yy<h;yy+=5)for(var xx=(yy%10<5?2:4.5);xx<w;xx+=5)c.fillRect(xx,yy,1.5,1.5);
      var bh=Math.max(22,h*.14);c.translate(w/2,h*.8);c.rotate(-.035);c.fillStyle='rgba(244,236,218,.95)';c.fillRect(-w*.42,-bh/2,w*.84,bh);
      c.strokeStyle='#b3261e';c.lineWidth=1.5;c.strokeRect(-w*.42+3,-bh/2+3,w*.84-6,bh-6);
      c.fillStyle='#b3261e';c.font=Math.round(bh*.46)+'px "Special Elite",monospace';c.textAlign='center';c.textBaseline='middle';c.fillText(T('scratch').toUpperCase()+' ✦',0,1);
      c.restore();c.globalCompositeOperation='destination-out';c.lineCap='round';c.lineJoin='round';c.lineWidth=w*.16;}
    lapis(null);
    (function muat(cors){var im=new Image();if(cors)im.crossOrigin='anonymous';im.onload=function(){if(!disentuh)lapis(im);};im.onerror=function(){if(cors)muat(false);};im.src=src;})(!/^data:/.test(src||''));
    /* liputan gosok dikira guna grid (tak perlu getImageData — selamat walau gambar dari domain lain) */
    var GC=18,GR=Math.max(8,Math.round(GC*h/w)),grid={},gn=0;
    function tanda(x,y){var rad=c.lineWidth/2;for(var gy=0;gy<GR;gy++)for(var gx=0;gx<GC;gx++){var cx=(gx+.5)*w/GC,cy=(gy+.5)*h/GR;
      if(!grid[gx+','+gy]&&Math.hypot(cx-x,cy-y)<rad){grid[gx+','+gy]=1;gn++;}}}
    function jalur(x0,y0,x1,y1){var d=Math.hypot(x1-x0,y1-y0),n=Math.max(1,Math.ceil(d/(c.lineWidth/4)));for(var i=0;i<=n;i++)tanda(x0+(x1-x0)*i/n,y0+(y1-y0)*i/n);}
    var aktif=false,lx,ly,siap=false,kira=0;
    function pt(e){var bb=cv.getBoundingClientRect();return[e.clientX-bb.left,e.clientY-bb.top];}

/* lightbox: cubit zum, seret, dwiketik; ketik sekali (tanpa zum) = tutup */
var LB={s:1,x:0,y:0};
function lbBuka(src){var im=$('lbimg');im.src=src;LB={s:1,x:0,y:0};lbTerap();$('lbTt').textContent=T('lbTt');$('lb').classList.add('on');}
function lbTerap(){$('lbimg').style.transform='translate('+LB.x+'px,'+LB.y+'px) scale('+LB.s+')';}
(function(){var lb=$('lb'),im=$('lbimg'),pts={},d0=0,s0=1,c0=null,x0=0,y0=0,gerak=false,lastTap=0,tapT=0;
  function pusat(){var k=Object.keys(pts);if(k.length<2)return null;var a=pts[k[0]],b=pts[k[1]];return{x:(a.x+b.x)/2,y:(a.y+b.y)/2,d:Math.hypot(a.x-b.x,a.y-b.y)};}
  lb.addEventListener('pointerdown',function(e){if(e.target.closest('.x'))return;pts[e.pointerId]={x:e.clientX,y:e.clientY};try{lb.setPointerCapture(e.pointerId);}catch(_){}
    var p=pusat();if(p){d0=p.d;s0=LB.s;c0=p;x0=LB.x;y0=LB.y;}else{x0=LB.x;y0=LB.y;c0={x:e.clientX,y:e.clientY};}gerak=false;tapT=Date.now();});
  lb.addEventListener('pointermove',function(e){if(!pts[e.pointerId])return;pts[e.pointerId]={x:e.clientX,y:e.clientY};var p=pusat();
    if(p){var s=Math.max(1,Math.min(5,s0*p.d/d0));var r=im.getBoundingClientRect();
      /* zum ke arah titik cubit: kekalkan titik bawah jari */
      var px=(c0.x-(x0+im.offsetLeft))/s0,py=(c0.y-(y0+im.offsetTop))/s0;
      LB.s=s;LB.x=p.x-im.offsetLeft-px*s;LB.y=p.y-im.offsetTop-py*s;gerak=true;lbTerap();}
    else if(LB.s>1){var dx=e.clientX-c0.x,dy=e.clientY-c0.y;if(Math.hypot(dx,dy)>6)gerak=true;LB.x=x0+dx;LB.y=y0+dy;lbTerap();}});
  function lepas(e){if(!pts[e.pointerId])return;delete pts[e.pointerId];
    if(Object.keys(pts).length===0){var t=Date.now();
      if(!gerak&&t-tapT<300){if(t-lastTap<320){/* dwiketik: zum 2.5x ke titik / reset */
          if(LB.s>1){LB={s:1,x:0,y:0};}else{var s=2.5,px=e.clientX-im.offsetLeft,py=e.clientY-im.offsetTop;LB={s:s,x:px-px*s,y:py-py*s};}lbTerap();lastTap=0;}
        else{lastTap=t;setTimeout(function(){if(lastTap===t&&LB.s===1)tutupLap('lb');},320);}}
      if(LB.s===1){LB.x=0;LB.y=0;lbTerap();}}
    else{var k=Object.keys(pts)[0];c0={x:pts[k].x,y:pts[k].y};x0=LB.x;y0=LB.y;}}
  lb.addEventListener('pointerup',lepas);lb.addEventListener('pointercancel',lepas);
})();
