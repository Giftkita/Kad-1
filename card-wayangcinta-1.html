function kiraTurun(){
  var k=$('#kira'), n=3; k.style.display='flex';
  (function satu(){ $('#kiraN').textContent=n; var t0=performance.now();
    (function f(now){ var p=Math.min(1,(now-t0)/1000); $('#bul').style.setProperty('--d',(p*360)+'deg'); if(p<1) requestAnimationFrame(f);
      else { n--; if(n>0) satu(); else { k.style.display='none'; mainSlaid(0); } } })(t0); })();
}
function mainSlaid(i){
  clearTimeout(tmr);
  if(i>=SLAID.length){ tamatTayang(); return; }
  if(si>=0&&SLAID[si]) SLAID[si].el.classList.remove('on');
  si=i; var S=SLAID[i]; S.el.classList.add('on'); var im=S.el.querySelector('img'); im.style.animation='none'; im.offsetWidth; im.style.animation='';
  var b=$('#babak'), s=$('#sarikata'); b.textContent=T('babak')+' '+S.bab; b.style.opacity='1';
  s.style.opacity='0'; clearTimeout(capT); capT=setTimeout(function(){ s.textContent=S.cap; s.style.opacity=S.cap?'1':'0'; },500);
  tmr=setTimeout(function(){ mainSlaid(si+1); },5200);
}

  h.style.left=(p[0]+(Math.random()-.5)*6)+'%'; h.style.top=p[1]+'%'; h.style.fontSize=(2.4+Math.random()*2.4)+'cqw'; h.style.color=['#ff8fab','#ffc2d1','#ff5c8a'][j%3]; $('#aPanggung').appendChild(h);
  h.animate([{opacity:0,transform:'translate(-50%,0) scale(.4)'},{opacity:1,offset:.2},{opacity:0,transform:'translate('+(-50+(Math.random()-.5)*200)+'%,'+(-300-Math.random()*200)+'%) scale(1)'}],{duration:2600+Math.random()*900,delay:j*160,easing:'ease-out'}).onfinish=function(){h.remove();}; })(j); } }

    h.animate([{transform:'translate(0,0) scale(.3)',opacity:0},{opacity:1,offset:.15},{transform:'translate('+dx+'cqw,'+(-40-Math.random()*40)+'cqw) scale(1)',opacity:0}],{duration:2200+Math.random()*1200,delay:j*70,easing:'ease-out',fill:'forwards'});

(function init(){
  var q=new URLSearchParams(location.search); var id=q.get('id')||q.get('kad')||location.hash.replace('#','');
  if(q.get('preview')==='1'){ try{ D=JSON.parse(localStorage.getItem('gk_preview')); }catch(e){ D=null; }
    if(!D) return ralat(T('takdePratonton')); $('#badge').style.display=''; mula(); return; }
  if(q.get('demo')==='1'||!id){ D=demoData(); $('#badge').style.display=''; $('#badge').textContent='DEMO'; mula(); return; }
  if(!db) return ralat(T('dbGagal'));
  db.from('cards').select('card_data,paid').eq('id',id).single().then(function(r){
    if(r.error) throw r.error; if(r.data.paid!==true){ ralat(T('belum')); return; }
    if(r.data.card_data&&r.data.card_data.tamat){ ralat('Kad ini telah tamat tempoh (link aktif 2 bulan). · This card has expired (links stay active for 2 months).'); return; }
    D=r.data.card_data||{}; mula();
  }).catch(function(){ ralat(T('tiada')); });
})();
