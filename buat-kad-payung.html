<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{font-family:system-ui,-apple-system,'Segoe UI',sans-serif;background:linear-gradient(180deg,#e6e9f7,#fbf3f6);color:#3a2028;line-height:1.5;padding:0 0 40px}
.wrap{max-width:560px;margin:0 auto;padding:0 16px}
header{background:rgba(255,255,255,.75);padding:26px 16px 22px;text-align:center;border-bottom:1px solid rgba(74,90,154,.15);margin-bottom:18px;position:relative}
header h1{font-family:Georgia,serif;font-size:1.4rem;color:#2F3A6A;margin-bottom:4px}
header p{font-size:.86rem;color:#8a5c68}
#lang{position:absolute;top:14px;right:14px;background:#fff;border:1px solid rgba(74,90,154,.3);border-radius:999px;padding:6px 12px;font-size:12px;color:#2F3A6A;cursor:pointer}
.sec{background:rgba(255,255,255,.92);border:1px solid rgba(74,90,154,.15);border-radius:14px;padding:16px;margin-bottom:14px}
.sec h2{font-family:Georgia,serif;font-size:1.02rem;margin-bottom:3px;color:#2F3A6A}
.sec .hint{font-size:.78rem;color:#9a7a84;margin-bottom:12px}
label{display:block;font-size:.8rem;font-weight:600;color:#6b4a54;margin:10px 0 4px}
input[type=text],input[type=url],textarea{width:100%;padding:10px 12px;font-size:.92rem;font-family:inherit;border:1px solid rgba(74,90,154,.3);border-radius:10px;background:#fff;color:#3a2028}
textarea{min-height:110px;resize:vertical;line-height:1.55}
input:focus,textarea:focus{outline:2px solid #4A5A9A;outline-offset:1px}
.row{display:flex;gap:8px}.row>*{flex:1;min-width:0}
.kapIn{margin-top:4px!important;font-size:.8rem!important;padding:7px 9px!important}
.fotoGrid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:10px}
.fotoSlot{aspect-ratio:1;border:1.5px dashed rgba(74,90,154,.4);border-radius:10px;background:#f4f6fd;display:grid;place-items:center;cursor:pointer;overflow:hidden;position:relative}
.fotoSlot img{width:100%;height:100%;object-fit:cover}
.fotoSlot span{font-size:.7rem;color:#a07a86;text-align:center;padding:4px;line-height:1.25}
.fotoSlot .del{position:absolute;top:3px;right:3px;background:rgba(0,0,0,.55);color:#fff;border:0;width:20px;height:20px;border-radius:50%;font-size:13px;cursor:pointer;line-height:1}
.utama{border-color:#4A5A9A;background:#e8ecfa}
.nota{font-size:.76rem;color:#9a7a84;margin-top:8px}
.kod{letter-spacing:.5em;font-size:1.3rem!important;text-align:center;font-weight:700}
.kira{font-size:.72rem;color:#9a7a84;text-align:right;margin-top:4px}
#gk-pratonton,#gk-bayar{margin-top:16px}
.amaran{padding:14px 16px;background:#ffebee;border:1.5px solid #ef9a9a;border-radius:12px;font-size:.82rem;color:#c62828}
</style>
</head>
<body>
<button id="lang">BM / EN</button>
<header>
  <h1 id="hTajuk"></h1>
  <p id="hSub"></p>
</header>

<div class="wrap">
  <div class="sec">
    <h2 id="s1"></h2>
    <div class="hint" id="s1h"></div>
    <div class="row">
      <div><label id="lNama"></label><input type="text" id="fUntuk" maxlength="14" placeholder="Aina"></div>
      <div><label id="lPengirim"></label><input type="text" id="fDari" maxlength="14" placeholder="Danial"></div>
    </div>
    <label id="lPembuka"></label><input type="text" id="fPembuka" maxlength="40">
  </div>

  <div class="sec">
    <h2 id="s2"></h2>
    <div class="hint" id="s2h"></div>
    <div class="fotoGrid" id="fotoGrid"></div>
    <input type="file" id="fotoInput" accept="image/*" multiple style="display:none">
    <div class="nota" id="s2n"></div>
    <div id="kapWrap"></div>
  </div>

  <div class="sec">
    <h2 id="s3"></h2>
    <div class="hint" id="s3h"></div>
    <textarea id="fUcapan" maxlength="320"></textarea>
    <div class="kira"><span id="kiraUcapan">0</span>/320</div>
    <label id="lPenutup"></label><input type="text" id="fPenutup" maxlength="44">
  </div>

  <div class="sec">
    <h2 id="s6"></h2>
    <div class="hint" id="s6h"></div>
    <input type="url" id="fYt" placeholder="https://www.youtube.com/watch?v=...">
  </div>

  <div class="sec">
    <h2 id="s7"></h2>
    <div class="hint" id="s7h"></div>
    <input type="url" id="fVideo" placeholder="https://www.youtube.com/watch?v=...">
  </div>

  <div id="gk-pratonton"></div>
  <div id="gk-bayar"></div>
</div>

<script src="gk-bayar.js"></script>
<script>
var lang='ms';
var L={
 ms:{hTajuk:'Kad Anniversary — Payung Berdua ☔',hSub:'Malam hujan, dia datang dengan payung, hujan jadi hati, lopak air pantulkan kenangan, pelangi & ucapan',
     s1:'Untuk siapa',s1h:'Nama korang berdua keluar bila hujan bertukar jadi hati.',lNama:'Untuk (nama penerima)',lPengirim:'Daripada',lPembuka:'Ayat pembuka (pilihan)',pPembuka:'Malam tu hujan…',
     s2:'Kenangan dalam lopak air',s2h:'2–6 gambar. Setiap kali dia tekan lopak air, gambar seterusnya muncul dengan riak air. Kapsyen pendek pilihan.',s2n:'Tekan mana-mana kotak untuk pilih gambar. Boleh pilih beberapa sekali gus.',kap:'Kapsyen gambar',
     s3:'Ucapan selepas hujan',s3h:'Ditaip huruf demi huruf bila pelangi muncul. Kosongkan untuk guna ayat lalai.',pUcapan:'Malam tu aku cuma ada satu payung, dan kamu...',lPenutup:'Ayat penutup (pilihan)',pPenutup:'Selepas hujan, sentiasa ada kita 🌈',
     s6:'Lagu',s6h:'Main sendiri bila dia tekan payung. Guna link YouTube.',
     s7:'Video YouTube',s7h:'Pilihan — butang video keluar paling akhir selepas ucapan.',
     g:['Gambar 1','Gambar 2','Gambar 3','Gambar 4','Gambar 5','Gambar 6']},
 en:{hTajuk:'Anniversary Card — Under One Umbrella ☔',hSub:'A rainy night, he comes with an umbrella, rain turns to hearts, a puddle reflects your memories, a rainbow & a note',
     s1:'Who it is for',s1h:'Both your names appear when the rain turns into hearts.',lNama:'For (their name)',lPengirim:'From',lPembuka:'Opening line (optional)',pPembuka:'That night, it rained…',
     s2:'Memories in the puddle',s2h:'2–6 photos. Each tap on the puddle shows the next photo with a ripple. Short captions optional.',s2n:'Tap any box to choose photos. You can pick several at once.',kap:'Photo caption',
     s3:'Note after the rain',s3h:'Typed letter by letter when the rainbow appears. Leave blank to use the default.',pUcapan:'That night I only had one umbrella, and you...',lPenutup:'Closing line (optional)',pPenutup:'After the rain, there is always us 🌈',
     s6:'Song',s6h:'Plays by itself when they tap the umbrella. Use a YouTube link.',
     s7:'YouTube video',s7h:'Optional — the video button appears last, after the note.',
     g:['Photo 1','Photo 2','Photo 3','Photo 4','Photo 5','Photo 6']}
};
function $(i){return document.getElementById(i);}
function pasangTeks(){
  var t=L[lang];
  Object.keys(t).forEach(function(k){var e=$(k);if(e&&typeof t[k]==='string')e.textContent=t[k];});
  $('fPembuka').placeholder=t.pPembuka;$('fUcapan').placeholder=t.pUcapan;$('fPenutup').placeholder=t.pPenutup;
  binaFoto();
}
$('lang').onclick=function(){lang=(lang==='ms')?'en':'ms';try{localStorage.setItem('gk_lang',lang);}catch(e){}pasangTeks();};
try{var _l=localStorage.getItem('gk_lang');if(_l==='en'||_l==='ms')lang=_l;}catch(e){}
function val(id){var e=$(id);return e?e.value.trim():'';}

/* gambar + kapsyen */
var BIL_FOTO=6,fotoData=new Array(BIL_FOTO).fill(''),kapData=new Array(BIL_FOTO).fill(''),sasarSlot=0;
function simpanKap(){for(var i=0;i<BIL_FOTO;i++){var e=$('fK'+i);if(e)kapData[i]=e.value;}}
function binaFoto(){simpanKap();var t=L[lang],g=$('fotoGrid'),h='';
  for(var i=0;i<BIL_FOTO;i++){h+='<div class="fotoSlot'+(i<2?' utama':'')+'" data-i="'+i+'">'+(fotoData[i]?'<img src="'+fotoData[i]+'"><button class="del" data-del="'+i+'">&times;</button>':'<span>'+t.g[i]+'</span>')+'</div>';}
  g.innerHTML=h;
  var k='';for(var i=0;i<BIL_FOTO;i++){if(!fotoData[i])continue;k+='<label>'+t.kap+' '+(i+1)+'</label><input type="text" class="kapIn" id="fK'+i+'" maxlength="36">';}
  $('kapWrap').innerHTML=k;for(var i=0;i<BIL_FOTO;i++){var e=$('fK'+i);if(e)e.value=kapData[i]||'';}
  [].forEach.call(g.querySelectorAll('.fotoSlot'),function(s){s.onclick=function(e){if(e.target.hasAttribute('data-del'))return;sasarSlot=+s.getAttribute('data-i');$('fotoInput').click();};});
  [].forEach.call(g.querySelectorAll('[data-del]'),function(b){b.onclick=function(e){e.stopPropagation();var j=+b.getAttribute('data-del');fotoData[j]='';kapData[j]='';binaFoto();};});}
$('fotoInput').onchange=function(){var fs=[].slice.call(this.files||[]);if(!fs.length)return;var slot=sasarSlot,sisa=fs.length;
  fs.forEach(function(f,k){var idx=slot+k;if(idx>=BIL_FOTO){sisa--;return;}kecilkan(f,function(u){fotoData[idx]=u;sisa--;if(sisa<=0)binaFoto();});});this.value='';};
/* resize 800px, kualiti .78 — 6 gambar, had baris Supabase */
function kecilkan(file,cb){var r=new FileReader();r.onload=function(){var im=new Image();im.onload=function(){var mx=800,w=im.width,h=im.height;
  if(w>mx||h>mx){if(w>h){h=Math.round(h*mx/w);w=mx;}else{w=Math.round(w*mx/h);h=mx;}}var c=document.createElement('canvas');c.width=w;c.height=h;c.getContext('2d').drawImage(im,0,0,w,h);cb(c.toDataURL('image/jpeg',0.78));};im.src=r.result;};r.readAsDataURL(file);}
$('fUcapan').oninput=function(){$('kiraUcapan').textContent=this.value.length;};

/* collectData — MESTI sync */
function collectData(){simpanKap();
  var d={template:'payung'};
  d.untuk=val('fUntuk');d.dari=val('fDari');d.pembuka=val('fPembuka');
  for(var i=0;i<6;i++){d['f'+(i+1)]=fotoData[i]||'';d['k'+(i+1)]=fotoData[i]?(kapData[i]||'').trim():'';}
  d.ucapan=$('fUcapan').value.trim();d.penutup=val('fPenutup');d.yt=val('fYt');d.video=val('fVideo');d.lang=lang;
  return d;
}
if(window.GKBayar){GKBayar.mount({el:'gk-bayar',previewEl:'gk-pratonton',viewer:'card-payung-1.html',collect:collectData,produk:'Kad Anniversary Payung Berdua',qr:true});}
else{$('gk-bayar').innerHTML='<div class="amaran">Fail <b>gk-bayar.js</b> tidak dijumpai. Pastikan ia di root repo, bukan dalam folder api.</div>';}
pasangTeks();
</script>
</body>
</html>
