<!--

  Aliran: jalan malam hujan, dia berdiri seorang → tekan payung → dia datang, berdua bawah payung → hujan jadi hati
          → lopak air pantul gambar kenangan (tekan = riak + gambar seterusnya) → hujan berhenti, subuh, pelangi, ucapan → video.
  card_data: template, untuk, dari, pembuka, f1..f6, k1..k6, ucapan, penutup, yt, video, lang

<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;overflow:hidden;background:#141a30}
body{font-family:Poppins,sans-serif;color:#fff;-webkit-user-select:none;user-select:none}
img{-webkit-user-drag:none;display:block}
button{font-family:inherit}
#pentas{position:fixed;inset:0;overflow:hidden}
#latar{position:absolute;background:center/100% 100% no-repeat}
#subuh{position:absolute;inset:0;background:linear-gradient(180deg,rgba(255,160,190,.62) 0,rgba(255,196,160,.45) 32%,rgba(255,220,190,.18) 58%,rgba(255,220,190,0) 75%);mix-blend-mode:screen;opacity:0;transition:opacity 5s ease}
#subuh.on{opacity:1}
#gelap{position:absolute;inset:0;background:radial-gradient(ellipse at 50% 30%,rgba(10,14,34,0) 0,rgba(10,14,34,.35) 100%);transition:opacity 5s}
#gelap.off{opacity:0}
.glow{position:absolute;border-radius:50%;transform:translate(-50%,-50%);background:radial-gradient(circle,rgba(255,226,150,.55) 0,rgba(255,200,120,.22) 35%,rgba(255,200,120,0) 70%);mix-blend-mode:screen;animation:denyutL 3.2s ease-in-out infinite;transition:opacity 4s}
@keyframes denyutL{0%,100%{opacity:.85}45%{opacity:1}50%{opacity:.7}55%{opacity:1}}
.glow.malap{opacity:.15!important;animation:none}
#hujan{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
.wtk{position:absolute;transform:translate(-50%,-100%);transform-origin:50% 100%}
.wtk img{width:100%}
#cewek{animation:gigil .18s linear infinite alternate}
@keyframes gigil{from{margin-left:-1px}to{margin-left:1px}}
#cewek.tenang{animation:none}
#cowok{cursor:pointer}
#cowok .jalan{animation:bob .42s ease-in-out infinite alternate}
@keyframes bob{from{transform:translateY(0) rotate(-1.5deg)}to{transform:translateY(-6px) rotate(1.5deg)}}
#berdua{opacity:0;transition:opacity .8s}
#berdua.on{opacity:1}
#berdua .kmb{animation:kembang .9s cubic-bezier(.2,1.5,.4,1) both;transform-origin:50% 100%}
@keyframes kembang{0%{transform:scaleY(.94) scaleX(.97)}60%{transform:scaleY(1.03)}100%{transform:none}}
#berdua .ayun{animation:ayun 4s ease-in-out infinite;transform-origin:50% 100%}
@keyframes ayun{50%{transform:rotate(1.2deg) translateY(-2px)}}
#kucing{transition:transform .6s}
#kucing .rg{transform-origin:50% 100%}
#kucing .rg.regang{animation:regang 1.6s ease-in-out}
@keyframes regang{30%{transform:scaleX(1.12) scaleY(.88)}60%{transform:scaleX(.95) scaleY(1.08)}}
.gelembung{position:absolute;left:70%;top:-18%;background:#fff;color:#6a4a5a;font:700 .7rem Poppins,sans-serif;padding:4px 9px;border-radius:12px;white-space:nowrap;opacity:0;transform:scale(.4);transition:opacity .3s,transform .4s cubic-bezier(.2,1.6,.4,1)}
.gelembung.on{opacity:1;transform:none}
/* teks */
#atas{position:absolute;left:0;right:0;top:calc(env(safe-area-inset-top,0px) + 11%);text-align:center;padding:0 24px;pointer-events:none;z-index:20}
#pembuka{font:italic 500 clamp(1.3rem,6.2vw,1.8rem)/1.2 'Cormorant Garamond',serif;color:#f4ecff;text-shadow:0 2px 12px rgba(0,0,0,.6);opacity:0;transition:opacity 1.4s}
#pembuka.on{opacity:1}
#nama{font:700 clamp(2rem,10vw,2.9rem)/1 Caveat,cursive;color:#ffd1e2;text-shadow:0 2px 14px rgba(0,0,0,.55),0 0 20px rgba(255,150,190,.5);opacity:0;transform:translateY(10px);transition:opacity 1.2s,transform 1.2s}
#nama.on{opacity:1;transform:none}
#hint{position:absolute;left:50%;bottom:calc(env(safe-area-inset-bottom,0px) + 26px);transform:translateX(-50%);z-index:30;background:rgba(255,255,255,.14);border:1px solid rgba(255,255,255,.35);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);color:#fff;font:500 .76rem Poppins,sans-serif;padding:9px 18px;border-radius:999px;white-space:nowrap;animation:denyutH 1.8s ease-in-out infinite;transition:opacity .5s}
@keyframes denyutH{50%{transform:translateX(-50%) scale(1.06)}}
#hint.off{opacity:0;pointer-events:none}
/* lopak */
#lopak{position:absolute;left:50%;transform:translate(-50%,-50%) scale(0);transition:transform 1.2s cubic-bezier(.2,1.2,.3,1),opacity 1s;z-index:6;cursor:pointer}
#lopak.on{transform:translate(-50%,-50%) scale(1)}
#lopak.pergi{opacity:0;pointer-events:none}
#air{position:absolute;inset:0;border-radius:50%;overflow:hidden;background:radial-gradient(ellipse at 50% 40%,rgba(120,140,200,.55),rgba(30,40,80,.75));box-shadow:inset 0 6px 18px rgba(255,255,255,.25),inset 0 -8px 20px rgba(0,0,0,.35),0 0 0 2px rgba(255,255,255,.12)}
#air .ft{position:absolute;left:8%;right:8%;top:6%;bottom:6%;background:center/cover;border-radius:50%;opacity:0;transition:opacity .9s;filter:url(#riakF) saturate(.95) brightness(.95)}
#air .ft.on{opacity:.92}
#air .pantul{position:absolute;left:50%;top:-2%;width:44%;transform:translateX(-50%) scaleY(-1);opacity:.28;filter:url(#riakF) blur(.6px);-webkit-mask:linear-gradient(to top,#000 0,transparent 70%);mask:linear-gradient(to top,#000 0,transparent 70%)}
#air .kilat{position:absolute;inset:0;border-radius:50%;background:linear-gradient(160deg,rgba(255,255,255,.28) 0,rgba(255,255,255,0) 35%,rgba(255,255,255,0) 70%,rgba(255,255,255,.12) 100%);pointer-events:none}
.gelang{position:absolute;border-radius:50%;border:2px solid rgba(255,255,255,.7);transform:translate(-50%,-50%) scale(0);pointer-events:none;animation:gelang 1.3s ease-out forwards}
@keyframes gelang{to{transform:translate(-50%,-50%) scale(1);opacity:0}}
#bot{position:absolute;width:15%;top:40%;left:-18%;animation:hanyut 13s linear infinite;pointer-events:none;z-index:2}
#bot img{width:100%;animation:oleng 2.2s ease-in-out infinite}
@keyframes hanyut{from{left:-18%}to{left:104%}}
@keyframes oleng{50%{transform:rotate(6deg) translateY(-3px)}}
#kap{position:absolute;left:50%;transform:translateX(-50%);z-index:21;font:700 clamp(1.15rem,5.6vw,1.5rem)/1.2 Caveat,cursive;color:#fff;text-align:center;text-shadow:0 2px 10px rgba(0,0,0,.7);opacity:0;transition:opacity .7s;width:86%;pointer-events:none}
#kap.on{opacity:1}
#titikG{position:absolute;left:50%;transform:translateX(-50%);display:flex;gap:6px;z-index:21}
#titikG i{width:7px;height:7px;border-radius:50%;background:rgba(255,255,255,.35);transition:background .3s,transform .3s}
#titikG i.on{background:#ffd1e2;transform:scale(1.3)}
#bBesar{position:absolute;z-index:22;width:38px;height:38px;border-radius:50%;border:1px solid rgba(255,255,255,.4);background:rgba(255,255,255,.16);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);color:#fff;font-size:1rem;cursor:pointer;display:none}
#bBesar.on{display:block}
/* pelangi & ucapan */
#pelangi{position:absolute;left:50%;transform:translateX(-50%);clip-path:inset(0 100% 0 0);transition:clip-path 3s cubic-bezier(.4,0,.2,1),opacity 2s;opacity:.95;z-index:3}
#pelangi.on{clip-path:inset(0 0 0 0)}
#pelangi img{width:100%}
#kertas{position:absolute;left:5%;right:5%;bottom:calc(env(safe-area-inset-bottom,0px) + 14px);z-index:25;background:rgba(255,250,245,.93);border-radius:18px;padding:18px 18px 16px;color:#5a4250;box-shadow:0 12px 40px rgba(20,10,30,.35);transform:translateY(120%);transition:transform 1s cubic-bezier(.2,1,.3,1)}
#kertas.on{transform:none}
#kertas .uc{font:500 clamp(1.1rem,5.2vw,1.35rem)/1.35 Caveat,cursive;white-space:pre-wrap;min-height:4em;max-height:34vh;overflow:auto}
#kertas .uc .kursor{display:inline-block;width:2px;height:1em;background:#d0678e;vertical-align:-2px;animation:kelip .7s steps(2) infinite}
@keyframes kelip{to{opacity:0}}
#kertas .ttd{font:700 clamp(1.3rem,6vw,1.7rem) Caveat,cursive;color:#c94a7c;text-align:right;margin-top:4px}
#kertas .pen{font:italic 600 clamp(1rem,4.6vw,1.2rem) 'Cormorant Garamond',serif;color:#7a5a8a;text-align:center;margin-top:10px;opacity:0;transition:opacity 1.2s}
#kertas .pen.on{opacity:1}
#bVideo{display:none;margin:12px auto 0;border:0;border-radius:999px;padding:11px 22px;font:600 .86rem Poppins,sans-serif;color:#fff;background:linear-gradient(135deg,#ff5a5f,#e5242b);box-shadow:0 8px 20px rgba(229,36,43,.3);cursor:pointer}
#bVideo.on{display:block;animation:muncul .5s both}
@keyframes muncul{from{opacity:0;transform:translateY(10px)}}
/* bahasa, muzik, lapisan */
#bhs{position:fixed;top:calc(env(safe-area-inset-top,0px) + 10px);right:12px;z-index:150;display:flex;background:rgba(255,255,255,.14);border:1px solid rgba(255,255,255,.35);border-radius:999px;overflow:hidden;backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px)}
#bhs button{border:0;background:transparent;color:#fff;padding:7px 12px;font:700 .68rem Poppins,sans-serif;cursor:pointer}
#bhs button.on{background:#ffd1e2;color:#5a3a58}
#bMuzik{position:fixed;top:calc(env(safe-area-inset-top,0px) + 10px);right:112px;z-index:150;width:34px;height:34px;border-radius:50%;border:1px solid rgba(255,255,255,.35);background:rgba(255,255,255,.14);color:#fff;font:700 1rem Poppins,sans-serif;cursor:pointer;display:none;backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px)}
#bMuzik.on{display:block}#bMuzik.main{animation:putarN 3s linear infinite}#bMuzik.henti{opacity:.5}
@keyframes putarN{to{transform:rotate(360deg)}}
.lap{position:fixed;inset:0;z-index:400;background:rgba(10,12,24,.94);display:none;align-items:center;justify-content:center;padding:20px}
.lap.on{display:flex}
.lap .x{position:absolute;top:calc(env(safe-area-inset-top,0px) + 12px);right:14px;width:40px;height:40px;border-radius:50%;border:0;background:rgba(255,255,255,.15);color:#fff;font-size:1.3rem;cursor:pointer;z-index:2}
#vidKotak{width:100%;max-width:640px;aspect-ratio:16/9;background:#000;position:relative;border-radius:8px;overflow:hidden}
#vidKotak iframe{position:absolute;inset:0;width:100%;height:100%;border:0}
#galImg{max-width:92vw;max-height:74vh;border-radius:10px;box-shadow:0 10px 40px rgba(0,0,0,.5);animation:muncul .35s both}
#galKap{position:absolute;left:0;right:0;bottom:calc(env(safe-area-inset-bottom,0px) + 24px);text-align:center;font:700 1.3rem Caveat,cursive;color:#fff;padding:0 20px}
.gnav{position:absolute;top:50%;transform:translateY(-50%);width:44px;height:44px;border-radius:50%;border:0;background:rgba(255,255,255,.15);color:#fff;font-size:1.4rem;cursor:pointer}
.tagpv{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom,0px) + 4px);transform:translateX(-50%);z-index:160;background:rgba(0,0,0,.55);color:#fff;font:700 .58rem Poppins,sans-serif;letter-spacing:.14em;padding:4px 12px;border-radius:999px;pointer-events:none}
.gagal{position:fixed;inset:0;z-index:999;display:flex;align-items:center;justify-content:center;padding:24px;text-align:center;background:#1e2a4a;font:15px/1.7 Poppins,sans-serif;color:#fff}
#gk-album-btn{bottom:auto!important;top:calc(env(safe-area-inset-top,0px) + 54px)!important;right:10px!important;padding:8px 12px!important;font-size:.64rem!important}
</style>
</head>
