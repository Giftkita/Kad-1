 ms:{kap:['Selamat hari jadi! 📷 Senyum lebar-lebar hari ni!','Kenangan kita yang paling best 💕','Terima kasih sebab selalu buat aku gelak 😂','Hari kita pergi bercuti ✈️','Semoga semua impian kamu tercapai ✨'],

function t(k){return TX[LANG][k];}
function $(i){return document.getElementById(i);}
/* model sebab: {teks, ubah, img, pos} */
var R=[];for(var i=0;i<5;i++)R.push({teks:'',ubah:false,img:null,pos:null});
var RT=1;
function binaMedan(){var g=$('gKap'),L=LALAI[LANG];g.innerHTML='';
  R.forEach(function(r,j){if(!r.ubah)r.teks=L.kap[j]||'';
    var d=document.createElement('div');d.className='kap';d.innerHTML='<b class="kt"><span>'+t('kap')+' #'+(j+1)+'</span><button type="button" class="buang">✕ '+t('buang')+'</button></b><div class="kf"></div><textarea maxlength="160"></textarea>';
    var x=d.querySelector('textarea');x.value=r.teks;x.placeholder=t('phTeks');x.oninput=function(){r.teks=x.value;r.ubah=true;kiraSaiz();};
    d.querySelector('.buang').onclick=function(){R.splice(j,1);if(!R.length)R.push({teks:'',ubah:true,img:null,pos:null});binaMedan();};
    d.querySelector('.kf').appendChild(kotakR(r,j+1));g.appendChild(d);});
  $('bTambah').textContent=t('tambah');$('bTambah').disabled=R.length>=MAKS;$('bTambah').style.opacity=R.length>=MAKS?.5:1;kiraSaiz();}
$('bTambah').onclick=function(){if(R.length>=MAKS){alert(t('maks'));return;}R.push({teks:'',ubah:true,img:null,pos:null});binaMedan();var ts=document.querySelectorAll('#gKap textarea');ts[ts.length-1].focus();};
function setLang(l){LANG=l;try{localStorage.setItem('gk_lang',l);}catch(e){}document.documentElement.lang=l;
  $('bMS').classList.toggle('on',l==='ms');$('bEN').classList.toggle('on',l==='en');
  document.querySelectorAll('[data-i]').forEach(function(e){var v=TX[l][e.getAttribute('data-i')];if(v!=null)e.textContent=v;});
  document.querySelectorAll('[data-ph]').forEach(function(e){var v=TX[l][e.getAttribute('data-ph')];if(v!=null)e.placeholder=v;});
  if(!$('fSurat').dataset.ubah)$('fSurat').value=LALAI[l].surat;
  binaMedan();renderKejut();if(window.GKBayar&&GKBayar.lang)GKBayar.lang();}
$('fSurat').addEventListener('input',function(){$('fSurat').dataset.ubah='1';});

/* isi gambar ke sebab yang belum ada gambar, bermula dari baris 'mula'; tambah baris kalau perlu (maks 20); proses satu-satu */
function isiBanyak(files,mula){mula=mula||0;var sasar=[];for(var j=mula;j<R.length;j++)if(!R[j].img)sasar.push(R[j]);for(var j=0;j<mula;j++)if(!R[j].img)sasar.push(R[j]);
  while(sasar.length<files.length&&R.length<MAKS){var r={teks:'',ubah:true,img:null,pos:null};R.push(r);sasar.push(r);}
  if(!sasar.length){alert(t('penuhSlot'));return;}
  var lebih=Math.max(0,files.length-sasar.length);files=files.slice(0,sasar.length);var n=0,p=$('proses');
  (function satu(){if(n>=files.length){p.textContent='';binaMedan();if(lebih)alert(lebih+t('lebih'));return;}
    p.textContent=t('proses')+' '+(n+1)+'/'+files.length+'…';var r=sasar[n];
    resize(files[n],760,.8,function(d){r.img=d;n++;if(n%3===0)binaMedan();satu();});})();}
function resize(file,maxW,q,cb){var r=new FileReader();r.onload=function(ev){var im=new Image();im.onload=function(){var s=Math.min(1,maxW/Math.max(im.width,im.height)),w=Math.round(im.width*s),h=Math.round(im.height*s);
  var c=document.createElement('canvas');c.width=w;c.height=h;c.getContext('2d').drawImage(im,0,0,w,h);cb(c.toDataURL('image/jpeg',q));};im.src=ev.target.result;};r.readAsDataURL(file);}
/* petak gambar: o = objek yang ada .img/.pos */
function petak(o,label,num,onPilih,onBuang){var el=document.createElement('div');el.className='th';el.style.aspectRatio=RT;
  if(o.img){var p=o.pos||{x:50,y:50};el.innerHTML='<img src="'+o.img+'" style="object-position:'+p.x+'% '+p.y+'%"><div class="num">'+num+'</div><button type="button" class="del">✕</button>';
    el.querySelector('.del').onclick=function(e){e.stopPropagation();o.img=null;o.pos=null;onBuang();};el.querySelector('img').onclick=function(){bukaAdj(o,onBuang);};}
  else{el.textContent='📷 '+label;var i=document.createElement('input');i.type='file';i.accept='image/*';i.multiple=!!onPilih.banyak;i.onchange=function(){if(i.files.length)onPilih([].slice.call(i.files));};el.appendChild(i);}
  return el;}
function kotakR(r,num){var f=function(fs){isiBanyak(fs,R.indexOf(r));};f.banyak=true;return petak(r,t('foto'),num,f,binaMedan);}
var KJ={img:null,pos:null};
function renderKejut(){var gk=$('gKejut');gk.innerHTML='';gk.appendChild(petak(KJ,t('fKejut'),'✨',function(fs){resize(fs[0],760,.8,function(d){KJ.img=d;renderKejut();});},renderKejut));kiraSaiz();}
var adj=null;
function bukaAdj(o,siap){var box=$('adjBox'),im=$('adjImg'),bw=Math.min(280,innerWidth-40),bh=bw/RT;box.style.width=bw+'px';box.style.height=bh+'px';im.src=o.img;$('adj').classList.add('on');
  im.onload=function(){var s=Math.max(bw/im.naturalWidth,bh/im.naturalHeight),dw=im.naturalWidth*s,dh=im.naturalHeight*s,p=o.pos||{x:50,y:50};im.style.width=dw+'px';im.style.height=dh+'px';
    adj={o:o,siap:siap,dw:dw,dh:dh,bw:bw,bh:bh,x:-(p.x/100)*(dw-bw),y:-(p.y/100)*(dh-bh)};im.style.left=adj.x+'px';im.style.top=adj.y+'px';};}
(function(){var im=$('adjImg'),d=false,sx,sy,ox,oy;im.onpointerdown=function(e){if(!adj)return;d=true;sx=e.clientX;sy=e.clientY;ox=adj.x;oy=adj.y;};
  addEventListener('pointermove',function(e){if(!d)return;adj.x=Math.min(0,Math.max(adj.bw-adj.dw,ox+e.clientX-sx));adj.y=Math.min(0,Math.max(adj.bh-adj.dh,oy+e.clientY-sy));im.style.left=adj.x+'px';im.style.top=adj.y+'px';});
  addEventListener('pointerup',function(){d=false;});})();
$('adjOk').onclick=function(){if(!adj)return;adj.o.pos={x:Math.round(adj.dw>adj.bw?-adj.x/(adj.dw-adj.bw)*100:50),y:Math.round(adj.dh>adj.bh?-adj.y/(adj.dh-adj.bh)*100:50)};$('adj').classList.remove('on');var s=adj.siap;adj=null;s();};

/* ── kumpul data (SYNC, return terus) ── */
function collect(){
  var D={template:'photobooth',umur:$('fUmur').value.replace(/\D/g,'').slice(0,3),pengirim:$('fFrom').value.trim(),nama:$('fFor').value.trim(),surat:$('fSurat').value,
    surprise:$('fKejut').value.trim(),video:$('fVideo').value.trim(),lang:LANG};
  var n=0;R.forEach(function(r){var tx=(r.teks||'').trim();if(!tx&&!r.img)return;n++;if(tx)D['s'+n+'_teks']=tx;if(r.img){D['s'+n+'_img']=r.img;if(r.pos)D['s'+n+'_img_pos']=r.pos.x+'% '+r.pos.y+'%';}});
  if(KJ.img){D.surprise_img=KJ.img;if(KJ.pos)D.surprise_img_pos=KJ.pos.x+'% '+KJ.pos.y+'%';}
  D.yt=$('fYT').value.trim();
  return D;
}
function kiraSaiz(){if(!$('fSurat'))return;var kb=JSON.stringify(collect()).length/1024,el=$('saiz');el.textContent=t('saiz')+(kb/1024).toFixed(2)+' MB'+(kb>3800?t('berat'):'');el.classList.toggle('berat',kb>3800);}
['fFrom','fFor','fSurat','fKejut','fYT','fVideo','fUmur'].forEach(function(i){$(i).addEventListener('input',kiraSaiz);});
$('fBanyak').onchange=function(e){var fs=[].slice.call(e.target.files);e.target.value='';if(fs.length)isiBanyak(fs,0);};
$('btnPreview').onclick=function(){try{localStorage.setItem('gk_preview',JSON.stringify(collect()));}catch(e){alert(t('penuh'));return;}window.open('card-photobooth-1.html?preview=1','_blank');};

if(window.GKBayar){GKBayar.mount({el:'gk-bayar',previewEl:'gk-pratonton',viewer:'card-photobooth-1.html',collect:collect,produk:'Photobooth Retro',qr:true});}
else{$('gk-bayar').innerHTML='<div style="padding:14px 16px;background:#ffebee;border:1.5px solid #ef9a9a;border-radius:12px;font-size:.82rem;color:#c62828">Fail <b>gk-bayar.js</b> tidak dijumpai. Pastikan ia di root repo, bukan dalam folder api.</div>';}
try{if(localStorage.getItem('gk_lang')==='en')LANG='en';}catch(e){}
setLang(LANG);
</script>
