<!DOCTYPE html>
<html lang="ms">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Pilih Tema — Kad Hari Jadi 🎂</title>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&family=Dancing+Script:wght@700&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Poppins',sans-serif;background:linear-gradient(135deg,#fce4ec,#f8bbd0,#fce4ec);min-height:100vh;padding:26px 18px 44px}
.g-head{text-align:center;max-width:520px;margin:6px auto 22px}
.g-title{font-family:'Dancing Script',cursive;font-size:2.1rem;color:#c2185b;line-height:1.1}
.g-sub{font-size:.9rem;color:#8a5a6c;margin-top:6px}
.back{display:block;text-align:center;font-size:.8rem;color:#a07;margin-bottom:14px}
.g-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:14px;max-width:720px;margin:0 auto}
.g-card{border-radius:18px;overflow:hidden;background:#fff;border:1.5px solid #ffd6e6;cursor:pointer;transition:.2s;text-decoration:none;display:block}
.g-card:hover{transform:translateY(-3px);box-shadow:0 14px 32px rgba(233,30,99,.18);border-color:#e91e63}
.g-card:active{transform:scale(.97)}
.g-card .gp{height:112px;display:flex;align-items:center;justify-content:center;font-size:2.4rem;position:relative}
.g-card .gm{padding:10px 12px 12px}
.g-card h3{font-size:.92rem;font-weight:600;color:#3a2330}
.g-card span{font-size:.72rem;color:#a07}
.g-badge{position:absolute;top:8px;right:8px;font-size:.55rem;font-weight:700;letter-spacing:.03em;padding:3px 8px;border-radius:50px;z-index:2;background:#e8f7ee;color:#1a9e54}
.g-glow{position:absolute;inset:0;background:radial-gradient(ellipse at 50% 40%,rgba(255,255,255,.25),transparent 60%)}
.gp-scrap{background:#e3a9bd;background-image:repeating-linear-gradient(45deg,rgba(176,58,91,.25),rgba(176,58,91,.25) 8px,transparent 8px,transparent 16px)}
.gp-merah{background:linear-gradient(160deg,#8c0d16,#a8121c 55%,#c4262f)}
.gp-butterfly{background:linear-gradient(160deg,#e8c5c0,#efe4cf 45%,#9bb87a)}
</style>
</head>
<body>
<a class="back" href="index.html">‹ Kembali ke Homepage</a>
<div class="g-head">
  <h2 class="g-title">Pilih Tema Kad 🎂</h2>
  <p class="g-sub">Setiap tema ada design tersendiri. Pilih satu untuk mula.</p>
</div>
<div class="g-grid">
  <a class="g-card" href="buat-kad-scrapbook.html">
    <div class="gp gp-scrap"><span class="g-badge">TERSEDIA</span>📖<div class="g-glow"></div></div>
    <div class="gm"><h3>Scrapbook</h3><span>Aesthetic</span></div>
  </a>
  <a class="g-card" href="buat-kad-merah.html">
    <div class="gp gp-merah"><span class="g-badge">TERSEDIA</span>💌<div class="g-glow"></div></div>
    <div class="gm"><h3>Merah Klasik</h3><span>Elegant</span></div>
  </a>
  <a class="g-card" href="buat-kad-butterfly.html">
    <div class="gp gp-butterfly"><span class="g-badge">TERSEDIA</span>🦋<div class="g-glow"></div></div>
    <div class="gm"><h3>Butterfly</h3><span>Rama-rama &amp; surat</span></div>
  </a>
</div>
</body>
</html>
