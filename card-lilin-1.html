<!--
  GiftKita — Kad Birthday "Tiup Lilin" (template: lilin) — reka sendiri (27 Sep 2026)
  Aliran: bilik gelap, kek + lilin nombor umur (dilukis kod) menyala → buat hajat → TIUP ke mikrofon (atau ketik api) →
          api padam satu-satu + asap → lampu menyala, bunting, belon, confetti, melodi Happy Birthday →
          potong kek → hirisan satu-satu (gambar + ucapan / video) → hadiah → kejutan → kad ucapan.
  card_data: template, nama, umur, pengirim, s1_teks..s10_teks, s1_img..s10_img (+_pos), video, surat, surprise_img (+_pos), surprise, yt|mp3, lang
-->
<style>
:root{--pink:#f7a8c4;--emas:#e6c27a;--ink:#5a2f4a}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;overflow:hidden}
body{font-family:Poppins,sans-serif;color:var(--ink);-webkit-user-select:none;user-select:none;background:#1a1030}
img{-webkit-user-drag:none;display:block}
button{font-family:inherit}
#latar{position:fixed;inset:0;background:radial-gradient(ellipse 90% 60% at 50% 35%,#ffe9f2 0%,#ffd6e6 40%,#f3c4e0 70%,#d9b8ef 100%)}
#latar::before{content:"";position:absolute;inset:0;background:radial-gradient(circle,rgba(255,255,255,.55) 2px,transparent 2.5px) 0 0/34px 34px;opacity:.5}
#meja{position:absolute;left:-5%;right:-5%;bottom:0;border-radius:50% 50% 0 0/16px 16px 0 0;background:linear-gradient(#fff6fa,#ffe1ee 30%,#f9cfe0);box-shadow:0 -6px 18px rgba(170,90,130,.18) inset,0 -2px 0 #fff}
#meja::before{content:"";position:absolute;left:0;right:0;top:0;height:22px;background:radial-gradient(circle at 14px -4px,transparent 12px,#fbd3e3 13px) 0 0/28px 22px repeat-x;opacity:.9}
#pentas{position:fixed;inset:0;overflow:hidden}
#pentas>*{position:absolute}
.hias{pointer-events:none;filter:drop-shadow(0 8px 10px rgba(140,70,110,.25))}
#bunting{left:-3%;width:106%;top:-40%;transition:top 1s cubic-bezier(.3,1.4,.5,1);transform-origin:50% 0;animation:ayun 5s ease-in-out infinite}
body.terang #bunting{top:calc(env(safe-area-inset-top,0px) + 44px)}
@keyframes ayun{50%{rotate:.8deg}}
.belonN{transition:translate 2.4s cubic-bezier(.2,.8,.3,1);translate:0 120vh}
body.terang .belonN{translate:0 0}
.belonN img{width:100%;animation:apung 4s ease-in-out infinite}
@keyframes apung{50%{translate:0 -12px;rotate:2deg}}
#kek{z-index:4;cursor:pointer}
#kek>img{width:100%;filter:drop-shadow(0 16px 18px rgba(140,70,110,.28))}
#kek.goyang{animation:goyang .4s}
@keyframes goyang{30%{translate:-4px 0}70%{translate:4px 0}}
#lilinG{position:absolute;display:flex;align-items:flex-end;justify-content:center;gap:2%;translate:-50% -100%;z-index:6}
.lil{position:relative;display:flex;flex-direction:column;align-items:center;cursor:pointer}
.dg{font:700 1px/0.78 Fredoka,Poppins,sans-serif;color:transparent;background:linear-gradient(100deg,#e97aa8 0%,#ffd3e4 35%,#f7a8c4 55%,#e47fa9 100%);-webkit-background-clip:text;background-clip:text;-webkit-text-stroke:.035em #e6c27a;filter:drop-shadow(0 3px 2px rgba(120,50,90,.3));padding-top:.06em;position:relative}
.dg::after{content:attr(data-g);position:absolute;inset:0;padding-top:.06em;color:transparent;-webkit-text-stroke:0;background:radial-gradient(circle,#fff 1px,transparent 1.6px) 0 0/9px 11px,radial-gradient(circle,rgba(230,194,122,.9) 1px,transparent 1.5px) 4px 5px/13px 9px;-webkit-background-clip:text;background-clip:text;opacity:.8}
.lil img.bt{height:100%}
.sumbu{width:3px;background:linear-gradient(#3a2a2a 0 28%,#e2cfae 28%);box-shadow:0 0 0 .5px rgba(120,80,60,.35);border-radius:2px;flex:0 0 auto}
.api{position:absolute;left:50%;translate:-50% 0;transform-origin:50% 90%;border-radius:50% 50% 50% 50%/62% 62% 38% 38%;background:radial-gradient(ellipse 45% 55% at 50% 72%,#fff 0 22%,#fff2a8 38%,#ffc24d 60%,#ff8a3a 78%,rgba(255,120,40,0) 100%);animation:kelip .16s ease-in-out infinite alternate;z-index:2;transition:opacity .35s,scale .35s}
.api::before{content:"";position:absolute;left:50%;top:55%;width:360%;aspect-ratio:1;translate:-50% -50%;border-radius:50%;background:radial-gradient(circle,rgba(255,200,110,.55),rgba(255,180,90,0) 65%);animation:nadi 1.6s ease-in-out infinite;pointer-events:none}
.api.padam{opacity:0;scale:.2 .1}
@keyframes kelip{from{transform:skewX(-2deg) scaleY(1)}to{transform:skewX(3deg) scaleY(1.07)}}
@keyframes nadi{50%{opacity:.7;scale:1.08}}
.asap{position:fixed;z-index:7;width:14px;height:14px;border-radius:50%;background:rgba(200,200,210,.55);filter:blur(4px);pointer-events:none;animation:asap 2.2s ease-out forwards}
@keyframes asap{to{translate:var(--dx) -120px;scale:4;opacity:0}}
#gelap{position:fixed;inset:0;z-index:5;pointer-events:none;background:radial-gradient(circle at var(--x,50%) var(--y,40%),rgba(18,8,30,.18) 0,rgba(18,8,30,.55) calc(var(--r,160px)*.55),rgba(14,6,26,.94) var(--r,160px));transition:opacity 1.4s}
body.terang #gelap{opacity:0}
#atas{position:absolute;left:0;right:0;top:calc(env(safe-area-inset-top,0px) + 54px);z-index:8;text-align:center;padding:0 18px;pointer-events:none;transition:top 1s}
body.terang #atas{top:calc(env(safe-area-inset-top,0px) + 54px + var(--bh,0px))}
.tajuk{font:700 clamp(1.5rem,7vw,2.3rem)/1.1 Fredoka,Poppins,sans-serif;color:#fff;-webkit-text-stroke:1.2px #e46aa6;text-shadow:0 3px 0 #e46aa6,0 6px 18px rgba(228,106,166,.45);transition:opacity 1s}
body:not(.terang) .tajuk{opacity:.35;-webkit-text-stroke:0;text-shadow:0 0 12px rgba(255,200,120,.35);color:#ffe7c2}
.sub{font:500 clamp(.76rem,3.2vw,.92rem) Poppins,sans-serif;color:#8a4f78;margin-top:6px}
body:not(.terang) .sub{color:#d9c1e6;opacity:.8}
#kaunter{display:none;margin:10px auto 0;width:max-content;background:rgba(255,255,255,.75);border:1px solid #f3c4dc;border-radius:999px;padding:5px 13px;font:600 .78rem Fredoka,Poppins,sans-serif;color:#b0508a}
#kaunter.on{display:block}
#bawah{position:absolute;left:0;right:0;bottom:calc(env(safe-area-inset-bottom,0px) + 22px);z-index:9;display:flex;flex-direction:column;align-items:center;gap:10px;padding:0 16px;pointer-events:none}
#bawah>*{pointer-events:auto}
#hint{font:600 clamp(.82rem,3.6vw,.98rem) Fredoka,Poppins,sans-serif;color:#fff;background:rgba(40,20,60,.55);border-radius:999px;padding:8px 16px;text-align:center;display:none;-webkit-backdrop-filter:blur(4px);backdrop-filter:blur(4px)}
body.terang #hint{background:rgba(255,255,255,.8);color:#b0508a}
#hint.on{display:block;animation:apung 2.4s ease-in-out infinite}
#meter{width:min(60vw,220px);height:10px;border-radius:6px;background:rgba(255,255,255,.2);overflow:hidden;display:none}
#meter.on{display:block}
#meter i{display:block;height:100%;width:0;background:linear-gradient(90deg,#9fd8ff,#fff);transition:width .08s}
.pil{border:0;border-radius:999px;padding:13px 28px;font:600 .95rem Fredoka,Poppins,sans-serif;cursor:pointer;color:#fff;background:linear-gradient(135deg,#ff9cc8,#f0a35e);box-shadow:0 6px 0 #c0668f,0 10px 22px rgba(192,102,143,.35);animation:denyut 1.8s ease-in-out infinite}
.pil.p2{background:#fff;color:#b0508a;box-shadow:0 4px 0 #f0c3d8;animation:none}
.pil:active{translate:0 3px}
@keyframes denyut{50%{scale:1.05}}
#hajat{position:fixed;inset:0;z-index:60;display:none;flex-direction:column;align-items:center;justify-content:center;background:rgba(10,4,20,.9);color:#ffe7c2;text-align:center;padding:24px;gap:14px}
#hajat.on{display:flex;animation:muncul .6s ease}
#hajat .b{font:700 clamp(1.8rem,8vw,2.6rem)/1.1 Caveat,cursive}
#hajat .t{font:500 .9rem Poppins,sans-serif;color:#d9c1e6}
#hajat .tt{font-size:1.6rem;letter-spacing:.3em;animation:denyut 1s ease-in-out infinite}
#pisau{z-index:7;pointer-events:none;opacity:0}
#garisP{position:absolute;z-index:5;width:3px;background:linear-gradient(rgba(255,255,255,.95),rgba(255,255,255,.2));box-shadow:0 0 6px #fff;transform-origin:50% 0;scale:1 0;pointer-events:none}
#hadiah{z-index:6;cursor:pointer;opacity:.9}
#hadiah img{width:100%}
#hadiah.goyang{animation:hgoyang 1.2s ease-in-out infinite}
@keyframes hgoyang{0%,60%,100%{rotate:0}70%{rotate:-8deg}80%{rotate:7deg}90%{rotate:-4deg}}
#hadiahLbl{position:absolute;left:50%;bottom:104%;translate:-50% 0;white-space:nowrap;background:linear-gradient(135deg,#ff9cc8,#f0a35e);color:#fff;border-radius:999px;padding:6px 12px;font:600 .74rem Fredoka,Poppins,sans-serif;display:none;box-shadow:0 4px 12px rgba(192,102,143,.4)}
#hadiah.goyang #hadiahLbl{display:block}
#confetti{position:fixed;inset:0;z-index:70;pointer-events:none}
.terbang{position:fixed;z-index:50;pointer-events:none;filter:drop-shadow(0 8px 10px rgba(120,50,90,.3))}

/* lapisan */
.lap{position:fixed;inset:0;z-index:80;display:none;align-items:center;justify-content:center;flex-direction:column;padding:16px;background:rgba(255,236,245,.8);-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px)}
.lap.on{display:flex;animation:muncul .35s ease}
@keyframes muncul{from{opacity:0}}
.no{font:600 .72rem Fredoka,Poppins,sans-serif;letter-spacing:.2em;color:#c0668f;margin-bottom:10px;text-align:center}
.bkBox{position:relative;animation:timbul .7s cubic-bezier(.2,1.3,.4,1)}
@keyframes timbul{from{scale:.3;rotate:-10deg;opacity:0}}
.bkBox>img{position:relative;width:100%;z-index:2;pointer-events:none;filter:drop-shadow(0 12px 22px rgba(140,70,110,.3))}
.bkBox .ft{position:absolute;z-index:1;background:#f5e6ee center/cover no-repeat;cursor:zoom-in}
.bkBox .main{position:absolute;left:50%;top:50%;width:64px;height:64px;margin:-32px 0 0 -32px;border-radius:50%;background:rgba(255,255,255,.92);z-index:3;cursor:pointer}
.bkBox .main::after{content:"";position:absolute;left:25px;top:20px;border:12px solid transparent;border-left:20px solid #e46aa6;border-right:0}
.nTx{position:absolute;z-index:3;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;overflow-y:auto;padding:3%}
.nTx .t{font:700 1.7rem/1.25 Caveat,cursive;color:var(--ink);white-space:pre-line;word-break:break-word}
.kap{margin-top:14px;max-width:min(86vw,420px);text-align:center;font:700 clamp(1.3rem,6vw,1.8rem)/1.2 Caveat,cursive;color:var(--ink);white-space:pre-line}
.btnB{display:flex;gap:10px;flex-wrap:wrap;justify-content:center;margin-top:16px}
#vidLap .box{position:relative;width:min(92vw,560px);aspect-ratio:16/9;border-radius:12px;overflow:hidden;background:#000}
#vidLap iframe{position:absolute;inset:0;width:100%;height:100%;border:0}

/* 2 — kad ucapan */
#sk2{position:fixed;inset:0;z-index:40;display:none;flex-direction:column;align-items:center;justify-content:center;padding:calc(env(safe-area-inset-top,0px) + 54px) 14px calc(env(safe-area-inset-bottom,0px) + 20px);background:radial-gradient(ellipse at 50% 40%,#fff3f8,#ffd9e8 60%,#e9cdf5)}
#sk2.on{display:flex;animation:muncul .5s ease}
#sk2 .tajuk{font-size:clamp(1.3rem,6vw,1.9rem);margin-bottom:12px}
#kadBox{position:relative;animation:naik 1s cubic-bezier(.2,.8,.3,1) both}
@keyframes naik{from{opacity:0;translate:0 80px}}
#kadBox>img{width:100%;filter:drop-shadow(0 12px 24px rgba(140,70,110,.3))}
#suratTx{position:absolute;overflow-y:auto;font:600 clamp(1.05rem,4.6vw,1.32rem)/1.38 Caveat,cursive;color:var(--ink);white-space:pre-line;padding:2% 3%;-webkit-overflow-scrolling:touch}
#suratTx .ttd{margin-top:14px;text-align:right;color:#d0508f}

/* umum */
#bhs{position:fixed;top:10px;right:10px;z-index:95;display:flex;background:rgba(255,255,255,.75);border-radius:30px;padding:3px;border:1px solid #f3c4dc}
#bhs button{border:0;background:transparent;color:#b0508a;font:600 .68rem Poppins,sans-serif;padding:5px 11px;border-radius:20px;cursor:pointer}
#bhs button.on{background:#f08ab8;color:#fff}
#bMuzik{position:fixed;top:10px;left:10px;z-index:95;width:34px;height:34px;border-radius:50%;border:1px solid #f3c4dc;background:rgba(255,255,255,.75);color:#d0508f;font-size:15px;cursor:pointer;display:none}
#bMuzik.on{display:block}#bMuzik.henti{opacity:.5;text-decoration:line-through}
#gk-album-btn{bottom:auto!important;top:calc(env(safe-area-inset-top,0px) + 48px)!important;right:10px!important;padding:8px 12px!important;font-size:.64rem!important}
.tagpv{position:fixed;top:12px;left:50%;transform:translateX(-50%);z-index:95;background:rgba(176,80,138,.3);color:#fff;font:500 .53rem Poppins,sans-serif;letter-spacing:.18em;padding:5px 13px;border-radius:40px;pointer-events:none}
.gagal{position:fixed;inset:0;z-index:999;display:flex;align-items:center;justify-content:center;padding:24px;text-align:center;background:#ffe9f2;font:15px/1.7 Poppins,sans-serif;color:var(--ink)}
#lb{z-index:1000;background:rgba(40,16,34,.95);padding:0;touch-action:none;overflow:hidden}
#lb img{max-width:100vw;max-height:100vh;transform-origin:0 0;will-change:transform;-webkit-user-drag:none}
#lb .tt{position:absolute;left:0;right:0;bottom:calc(env(safe-area-inset-bottom,0px) + 16px);text-align:center;font:italic 12px Poppins,sans-serif;color:rgba(255,255,255,.6);pointer-events:none}
.x{position:fixed;right:14px;top:14px;width:32px;height:32px;border-radius:50%;border:0;background:rgba(255,255,255,.9);color:#5a2f4a;font-size:14px;cursor:pointer;z-index:3}
</style>

<body>

var CF=[],cfRaf=null;
function confetti(x,y,arah,n){var c=$('confetti');c.width=innerWidth;c.height=innerHeight;var W=['#f7a8c4','#ffe08a','#a8dbff','#cdb6f5','#aee6cf','#e6c27a','#ff8fb8'];
  for(var i=0;i<n;i++){var a=(arah===0?rnd(0,Math.PI*2):-Math.PI/2+arah*.35+rnd(-.6,.6)),v=rnd(6,15);CF.push({x:x,y:y,vx:Math.cos(a)*v,vy:Math.sin(a)*v,w:rnd(6,11),h:rnd(4,8),r:rnd(0,6),vr:rnd(-.3,.3),c:W[i%W.length],t:0});}
  if(!cfRaf)(function f(){var ctx=c.getContext('2d');ctx.clearRect(0,0,c.width,c.height);CF=CF.filter(function(p){p.t++;p.vy+=.28;p.vx*=.985;p.x+=p.vx;p.y+=p.vy;p.r+=p.vr;
    ctx.save();ctx.translate(p.x,p.y);ctx.rotate(p.r);ctx.fillStyle=p.c;ctx.fillRect(-p.w/2,-p.h/2,p.w,p.h*Math.abs(Math.cos(p.t*.12)));ctx.restore();return p.y<c.height+30&&p.t<400;});
    cfRaf=CF.length?requestAnimationFrame(f):null;if(!CF.length)ctx.clearRect(0,0,c.width,c.height);})();}

var AC=null;
function bunyiInit(){try{AC=AC||new (window.AudioContext||window.webkitAudioContext)();if(AC.state==='suspended')AC.resume();}catch(e){}}
function nota(f,t0,d,jenis,v){var o=AC.createOscillator(),g=AC.createGain();o.type=jenis||'sine';o.frequency.setValueAtTime(f,t0);o.connect(g);g.connect(AC.destination);
  g.gain.setValueAtTime(.0001,t0);g.gain.exponentialRampToValueAtTime(v||.05,t0+.01);g.gain.exponentialRampToValueAtTime(.0001,t0+d);o.start(t0);o.stop(t0+d+.02);}
function hingar(t0,d,v,fq){var n=AC.sampleRate*d,b=AC.createBuffer(1,n,AC.sampleRate),x=b.getChannelData(0);for(var i=0;i<n;i++)x[i]=(Math.random()*2-1)*(1-i/n);
  var s=AC.createBufferSource(),g=AC.createGain(),fl=AC.createBiquadFilter();fl.type='lowpass';fl.frequency.value=fq||1200;s.buffer=b;s.connect(fl);fl.connect(g);g.connect(AC.destination);g.gain.value=v||.15;s.start(t0);}
function bunyi(j){try{bunyiInit();var t=AC.currentTime;
  if(j==='fuh')hingar(t,.35,.12,900);
  else if(j==='pop'){hingar(t,.12,.35,3000);[523,784,1047].forEach(function(f,i){nota(f,t+.05+i*.06,.3,'triangle',.04);});}
  else if(j==='suis'){nota(180,t,.06,'square',.05);}
  else if(j==='potong')hingar(t,.5,.06,2500);
  else if(j==='ting')[1568,2093].forEach(function(f,i){nota(f,t+i*.1,.5);});
  else if(j==='ajaib')[1047,1319,1568,2093,2637].forEach(function(f,i){nota(f,t+i*.09,.7,'sine',.04);});
  }catch(e){}}

var LB={s:1,x:0,y:0};
function lbBuka(src){var im=$('lbimg');im.src=src;LB={s:1,x:0,y:0};lbTerap();$('lbTt').textContent=T('lbTt');$('lb').classList.add('on');}
function lbTerap(){$('lbimg').style.transform='translate('+LB.x+'px,'+LB.y+'px) scale('+LB.s+')';}
(function(){var lb=$('lb'),im=$('lbimg'),pts={},d0=0,s0=1,c0=null,x0=0,y0=0,gerak=false,lastTap=0,tapT=0;
  function pusat(){var k=Object.keys(pts);if(k.length<2)return null;var a=pts[k[0]],b=pts[k[1]];return{x:(a.x+b.x)/2,y:(a.y+b.y)/2,d:Math.hypot(a.x-b.x,a.y-b.y)};}
  lb.addEventListener('pointerdown',function(e){if(e.target.closest('.x'))return;pts[e.pointerId]={x:e.clientX,y:e.clientY};try{lb.setPointerCapture(e.pointerId);}catch(_){}
    var p=pusat();if(p){d0=p.d;s0=LB.s;c0=p;x0=LB.x;y0=LB.y;}else{x0=LB.x;y0=LB.y;c0={x:e.clientX,y:e.clientY};}gerak=false;tapT=Date.now();});
  lb.addEventListener('pointermove',function(e){if(!pts[e.pointerId])return;pts[e.pointerId]={x:e.clientX,y:e.clientY};var p=pusat();
    if(p){var s=Math.max(1,Math.min(5,s0*p.d/d0));var r=im.getBoundingClientRect();
      /* zum ke arah titik cubit: kekalkan titik bawah jari */
      var px=(c0.x-(x0+im.offsetLeft))/s0,py=(c0.y-(y0+im.offsetTop))/s0;
      LB.s=s;LB.x=p.x-im.offsetLeft-px*s;LB.y=p.y-im.offsetTop-py*s;gerak=true;lbTerap();}
    else if(LB.s>1){var dx=e.clientX-c0.x,dy=e.clientY-c0.y;if(Math.hypot(dx,dy)>6)gerak=true;LB.x=x0+dx;LB.y=y0+dy;lbTerap();}});
  function lepas(e){if(!pts[e.pointerId])return;delete pts[e.pointerId];
    if(Object.keys(pts).length===0){var t=Date.now();
      if(!gerak&&t-tapT<300){if(t-lastTap<320){/* dwiketik: zum 2.5x ke titik / reset */
          if(LB.s>1){LB={s:1,x:0,y:0};}else{var s=2.5,px=e.clientX-im.offsetLeft,py=e.clientY-im.offsetTop;LB={s:s,x:px-px*s,y:py-py*s};}lbTerap();lastTap=0;}
        else{lastTap=t;setTimeout(function(){if(lastTap===t&&LB.s===1)tutupLap('lb');},320);}}
