<!DOCTYPE html>
<html lang="ms">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,user-scalable=no">
<title>Buku Kita</title>
<link href="https://fonts.googleapis.com/css2?family=Caveat:wght@500;700&family=Playfair+Display:wght@600&family=Poppins:wght@400;500;600&display=swap" rel="stylesheet">
<script src="https://unpkg.com/@supabase/supabase-js@2"></script>

<style>
:root{--merah:#c9223c;--merah2:#8e1224;--pink:#f26d8f;--pink2:#ffc2d4;--dakwat:#241a1c}
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;overflow:hidden}
body{font-family:'Poppins',sans-serif;color:var(--dakwat);line-height:1.5;
 background:radial-gradient(ellipse 130% 90% at 50% 0%,#6b1220,#3a0a12 72%)}
img{display:block;max-width:100%}
#load{position:fixed;inset:0;z-index:900;display:flex;flex-direction:column;align-items:center;
 justify-content:center;gap:14px;color:#f6cfd6;background:#3a0a12}
.ring{width:38px;height:38px;border:2px solid rgba(246,207,214,.25);border-top-color:var(--pink);
 border-radius:50%;animation:spin 1s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
#load p{font-size:.66rem;letter-spacing:.26em;text-transform:uppercase;opacity:.65}
#kulit{position:fixed;inset:0;z-index:800;display:none;align-items:center;justify-content:center;
 padding:10px 8px;background:radial-gradient(ellipse 130% 90% at 50% 0%,#7a1622,#4c0d15 72%)}
#kulit.on{display:flex}
.kulit-buku{position:relative;width:min(96vw,600px);aspect-ratio:1;
 border-radius:4px 10px 10px 4px;overflow:hidden;box-shadow:0 22px 48px rgba(60,10,18,.55)}
.kulit-buku>img.bgk{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.kulit-buku>img.kulit-foto{position:absolute;object-fit:cover;z-index:2;cursor:zoom-in}
.kulit-teks{position:absolute;left:6%;right:6%;bottom:4%;z-index:3;text-align:center}
#k-tajuk{font-family:'Playfair Display',serif;font-size:clamp(1.2rem,4.4vw,2rem);color:#fff;
 line-height:1.1;text-shadow:0 2px 6px rgba(0,0,0,.4)}
#k-sub{font-size:clamp(.5rem,1.5vw,.78rem);letter-spacing:.24em;text-transform:uppercase;
 color:rgba(255,255,255,.8);text-shadow:0 1px 3px rgba(0,0,0,.4)}
.buka{margin-top:2.4%;border:1.5px solid rgba(255,255,255,.6);background:rgba(255,255,255,.16);
 backdrop-filter:blur(4px);color:#fff;font-family:inherit;font-size:clamp(.62rem,1.9vw,.9rem);
 font-weight:600;letter-spacing:.06em;padding:2.4% 6%;border-radius:50px;cursor:pointer;transition:.25s}
.buka:active{transform:scale(.95)}
#buku{position:fixed;inset:0;display:none;align-items:center;justify-content:center;
 perspective:1900px;padding:10px 8px 68px}
#buku.on{display:flex}
#buku::before,#buku::after{content:'';position:absolute;width:min(96vw,600px);aspect-ratio:1;
 border-radius:4px 10px 10px 4px;background:#2c0a10;box-shadow:0 22px 44px rgba(30,5,10,.5)}
#buku::before{transform:translate(4px,5px) rotate(.4deg)}
#buku::after{transform:translate(8px,9px) rotate(.9deg);background:#210710}
.helaian{position:absolute;width:min(96vw,600px);aspect-ratio:1;transform-style:preserve-3d;
 transform-origin:left center;transition:transform .85s cubic-bezier(.33,.02,.28,1);will-change:transform}
.helaian.belum{transform:rotateY(0)}
.helaian.lepas{transform:rotateY(-178deg)}
.muka{position:absolute;inset:0;border-radius:4px 10px 10px 4px;overflow:hidden;
 backface-visibility:hidden;box-shadow:0 20px 44px rgba(30,5,10,.5);background:#3a0a12}
.muka .bg{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.belakang{position:absolute;inset:0;border-radius:10px 4px 4px 10px;transform:rotateY(180deg);
 backface-visibility:hidden;background:#3a0a12;box-shadow:inset 0 0 40px rgba(0,0,0,.35)}
.slot{position:absolute;z-index:3}
.slot.foto{object-fit:cover;border:.6vmin solid #fffdfa;box-shadow:0 .5vmin 1.4vmin rgba(30,5,10,.4);
 cursor:zoom-in;transition:transform .2s}
.slot.foto:active{transform:scale(.98)}
.slot.kosong{background:rgba(255,255,255,.16);border:1px dashed rgba(255,200,210,.35)}
.slot.ucap{display:flex;flex-direction:column;padding:4% 4.5%;overflow:hidden;
 background:#fffaf5;border-radius:2px;box-shadow:0 .6vmin 1.6vmin rgba(30,5,10,.35)}
.slot.ucap .teks{flex:1;overflow-y:auto;font-family:'Caveat',cursive;
 font-size:clamp(.72rem,2vw,1.25rem);line-height:1.5;color:#3f2226;white-space:pre-line}
.slot.ucap .drp{text-align:right;font-family:'Caveat',cursive;
 font-size:clamp(.66rem,1.8vw,1.1rem);color:var(--merah);padding-top:2%}
.slot.vid{cursor:pointer;overflow:hidden;border:.6vmin solid #fffdfa;box-shadow:0 .5vmin 1.4vmin rgba(30,5,10,.4)}
.slot.vid img{width:100%;height:100%;object-fit:cover;filter:brightness(.8)}
.slot.vid .play{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);
 width:15%;aspect-ratio:1;border-radius:50%;background:#e2263c;display:flex;align-items:center;
 justify-content:center;box-shadow:0 .4vmin 1.4vmin rgba(0,0,0,.45);animation:denyut 2.2s ease-in-out infinite}
@keyframes denyut{0%,100%{transform:translate(-50%,-50%) scale(1)}50%{transform:translate(-50%,-50%) scale(1.09)}}
.slot.vid .play::after{content:'';border-left:.6em solid #fff;border-top:.38em solid transparent;
 border-bottom:.38em solid transparent;font-size:min(3.2vw,1.1rem);margin-left:.2em}
.slot.vid .cap{position:absolute;left:0;right:0;bottom:4%;text-align:center;color:#fff;
 font-size:clamp(.48rem,1.4vw,.74rem);letter-spacing:.14em;text-transform:uppercase;
 text-shadow:0 1px 4px rgba(0,0,0,.6);pointer-events:none}
.slot.kejut{perspective:900px}
.hadiah{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;
 justify-content:center;z-index:3;cursor:pointer;transform-style:preserve-3d;transition:.5s}
.hadiah .badan{position:relative;width:52%;aspect-ratio:1/.82;
 background:linear-gradient(160deg,#f0688f 0%,#c9223c 55%,#8e1224 100%);border-radius:3px;
 box-shadow:inset -8% 0 0 rgba(0,0,0,.14),0 1vmin 2.4vmin rgba(30,5,10,.4);
 transition:transform .7s cubic-bezier(.34,1.3,.5,1)}
.hadiah .reben-v{position:absolute;left:50%;top:0;bottom:0;width:15%;transform:translateX(-50%);
 background:linear-gradient(90deg,#ffd9e2,#fff 45%,#ffc2d4)}
.hadiah .penutup{position:absolute;top:calc(50% - 26%);width:60%;aspect-ratio:1/.3;
 background:linear-gradient(160deg,#f6899f,#c9223c 60%,#8e1224);border-radius:3px;
 box-shadow:0 .6vmin 1.6vmin rgba(30,5,10,.35);transform-origin:50% 100%;
 transition:transform .8s cubic-bezier(.4,1.5,.5,1),opacity .8s;z-index:4}
.hadiah .reben-h{position:absolute;left:50%;top:0;bottom:0;width:13%;transform:translateX(-50%);
 background:linear-gradient(90deg,#ffd9e2,#fff 45%,#ffc2d4)}
.hadiah .bunga{position:absolute;left:50%;top:-38%;width:34%;aspect-ratio:1;transform:translateX(-50%);
 background:radial-gradient(circle at 50% 50%,#fff 26%,transparent 27%),
  radial-gradient(circle at 22% 40%,#ffc2d4 30%,transparent 31%),
  radial-gradient(circle at 78% 40%,#ffc2d4 30%,transparent 31%),
  radial-gradient(circle at 50% 82%,#f6899f 26%,transparent 27%)}
.hadiah .bayang{position:absolute;bottom:16%;width:54%;height:5%;border-radius:50%;
 background:rgba(30,5,10,.3);filter:blur(3px);transition:.7s}
.hadiah .ajak{position:absolute;bottom:4%;font-family:'Caveat',cursive;
 font-size:clamp(.7rem,2vw,1.2rem);color:#fff;text-shadow:0 1px 3px rgba(0,0,0,.4)}
.hadiah.goyang .badan{animation:gy .55s ease}
@keyframes gy{0%,100%{transform:rotate(0)}20%{transform:rotate(-5deg)}60%{transform:rotate(5deg)}}
.hadiah.buka .penutup{transform:translateY(-190%) rotateX(-58deg) rotateZ(14deg);opacity:0}
.hadiah.buka .badan{transform:translateY(14%) scale(.9)}
.hadiah.buka .bayang{transform:scale(.8);opacity:.5}
.hadiah.buka .ajak{opacity:0;transition:.3s}
.hadiah.hilang{opacity:0;visibility:hidden;transition:.5s .35s}
.pecah{position:absolute;inset:0;pointer-events:none;overflow:hidden;z-index:5}
.pecah i{position:absolute;left:50%;top:46%;width:2.2%;height:3.4%;border-radius:1px;
 opacity:0;animation:letup 1.1s ease-out forwards}
@keyframes letup{0%{opacity:1;transform:translate(-50%,-50%) rotate(0)}
 100%{opacity:0;transform:translate(calc(-50% + var(--dx)),calc(-50% + var(--dy))) rotate(var(--r))}}
.slot.kejut .dalam{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;
 justify-content:center;gap:2.5%;padding:3%;opacity:0;transform:translateY(22%) scale(.82);
 transition:opacity .7s .1s,transform .8s cubic-bezier(.3,1.4,.5,1) .1s;pointer-events:none}
.slot.kejut .dalam.on{opacity:1;transform:none;pointer-events:auto}
.slot.kejut .dalam img{width:auto;max-width:80%;max-height:72%;object-fit:contain;
 border:.8vmin solid #fffdfa;box-shadow:0 .8vmin 2vmin rgba(30,5,10,.4);cursor:zoom-in}
.slot.kejut .dalam p{font-family:'Caveat',cursive;font-size:clamp(.85rem,2.4vw,1.4rem);
 flex-shrink:0;text-align:center;color:#3f2226}
#lb{position:fixed;inset:0;z-index:950;background:rgba(15,5,8,.96);display:none;
 align-items:center;justify-content:center;overflow:hidden;touch-action:none;-webkit-user-select:none;user-select:none}
#lb.on{display:flex}
#lb img{max-width:100%;max-height:100%;transform-origin:center;will-change:transform;pointer-events:none}
#lb .tutupL{position:absolute;top:calc(env(safe-area-inset-top,0px) + 12px);right:14px;width:38px;height:38px;
 border-radius:50%;border:1px solid rgba(255,255,255,.3);background:rgba(255,255,255,.14);color:#fff;
 font-size:.95rem;cursor:pointer;z-index:3}
#lb .anak{position:absolute;top:50%;transform:translateY(-50%);width:40px;height:40px;border-radius:50%;
 border:1px solid rgba(255,255,255,.28);background:rgba(255,255,255,.13);color:#fff;font-size:1.15rem;
 cursor:pointer;z-index:3}
#lb .kiri{left:12px}#lb .kanan{right:12px}
#lb .kira{position:absolute;bottom:calc(env(safe-area-inset-bottom,0px) + 16px);left:0;right:0;
 text-align:center;color:rgba(255,255,255,.72);font-size:.7rem;letter-spacing:.1em;pointer-events:none}
#nav{position:fixed;left:0;right:0;bottom:0;z-index:200;display:none;align-items:center;gap:11px;
 padding:10px 15px calc(10px + env(safe-area-inset-bottom,0px));
 background:rgba(50,10,16,.92);backdrop-filter:blur(12px)}
#nav.on{display:flex}
#nav button{background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.25);color:#fff;
 width:36px;height:36px;border-radius:50%;cursor:pointer;font-size:1rem;flex-shrink:0}
#nav button:disabled{opacity:.25}
.tengah{flex:1;display:flex;align-items:center;gap:9px;min-width:0}
.disc{width:19px;height:19px;border-radius:50%;flex-shrink:0;
 background:conic-gradient(var(--pink),var(--merah),var(--pink))}
.disc.go{animation:spin 3s linear infinite}
#mname{font-size:.63rem;color:rgba(255,255,255,.7);white-space:nowrap;overflow:hidden;
 text-overflow:ellipsis;flex:1;min-width:0}
#kira{font-size:.61rem;letter-spacing:.12em;color:rgba(255,255,255,.55);flex-shrink:0}
#vidbox{position:fixed;inset:0;z-index:700;background:rgba(20,5,8,.95);display:none;
 align-items:center;justify-content:center;padding:16px}
#vidbox.on{display:flex}
#vidbox iframe{width:100%;max-width:640px;aspect-ratio:16/9;border:0;border-radius:8px}
#vidbox .tutupbtn{position:absolute;top:14px;right:16px;width:38px;height:38px;border-radius:50%;
 border:1px solid rgba(255,255,255,.3);background:rgba(255,255,255,.12);color:#fff;cursor:pointer}
.tagpv{position:fixed;top:10px;left:50%;transform:translateX(-50%);z-index:850;background:rgba(0,0,0,.4);
 color:#fff;font-size:.53rem;letter-spacing:.18em;padding:5px 13px;border-radius:40px;pointer-events:none}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

</style>
</head>

      }
    });
    return '<div class="helaian belum" data-i="'+i+'"><div class="muka">'+isi+'</div>'+
           '<div class="belakang"></div></div>';
  }).join('');
  document.getElementById('buku').innerHTML=html;
  jumlah=PETA.halaman.length;

  var kf=document.getElementById('kfoto');
  if(D.f1){ kf.src=D.f1; kf.style.cssText='display:block;left:'+KSLOT.x+'%;top:'+KSLOT.y+'%;width:'+KSLOT.w+'%;height:'+KSLOT.h+'%'; kf.onclick=function(){lbBuka(D.f1)}; }
  document.getElementById('k-tajuk').textContent=D.tajuk||'Us';
  document.getElementById('k-sub').textContent=D.sub||'';
  document.getElementById('load').style.display='none';
  document.getElementById('kulit').classList.add('on');
  lbKumpul();
  if(window.GKAlbum) GKAlbum.init(petaAlbum());
}
function petaAlbum(){

         quote:D.kejut_msg||'',surprise_msg:D.kejut_msg||''};

}
function papar(){
  var hs=document.querySelectorAll('.helaian');
  for(var i=0;i<hs.length;i++){
    hs[i].classList.toggle('lepas',i<muka); hs[i].classList.toggle('belum',i>=muka);
    hs[i].style.zIndex=(i<muka)?(10+i):(jumlah-i+20);
  }
  document.getElementById('kira').textContent=(muka+1)+' / '+jumlah;
  document.getElementById('prev').disabled=(muka===0);
  document.getElementById('next').disabled=(muka===jumlah-1);
}
function selak(a){var b=muka+a; if(b<0||b>=jumlah)return; muka=b; papar();}
(function(){var x0=null,y0=null;
 document.addEventListener('touchstart',function(e){x0=e.touches[0].clientX;y0=e.touches[0].clientY},{passive:true});
 document.addEventListener('touchend',function(e){ if(x0===null)return;
  var dx=e.changedTouches[0].clientX-x0,dy=e.changedTouches[0].clientY-y0; x0=null;
  if(Math.abs(dx)>55&&Math.abs(dx)>Math.abs(dy)*1.3) selak(dx<0?1:-1);},{passive:true});
 document.addEventListener('keydown',function(e){if(e.key==='ArrowRight')selak(1);if(e.key==='ArrowLeft')selak(-1)});
})();
var dibuka=false;
function bukaBuku(){ if(dibuka)return; dibuka=true; muzik();
  var k=document.getElementById('kulit'); k.classList.add('pergi');
  setTimeout(function(){k.style.display='none';document.getElementById('buku').classList.add('on');
    document.getElementById('nav').classList.add('on');papar();},1100);}

/* ── lightbox ── */
var lbi=0,lbS=1,lbX=0,lbY=0,_d0=0,_s0=1,_px=0,_py=0,_sx=0,_sy=0,_pinch=false;
function lbKumpul(){ LB=[]; for(var i=1;i<=20;i++){ if(D['f'+i]) LB.push(D['f'+i]); }
  if(D.kejut_img && LB.indexOf(D.kejut_img)<0) LB.push(D.kejut_img); }
function lbBuka(src){ if(!LB.length) lbKumpul(); var i=LB.indexOf(src);
  if(i<0){ LB.push(src); i=LB.length-1; } lbi=i; lbPapar(); document.getElementById('lb').classList.add('on'); }
function lbPapar(){ document.getElementById('lbimg').src=LB[lbi]; lbS=1;lbX=0;lbY=0; lbGuna();
  document.getElementById('lbkira').textContent=LB.length>1?(lbi+1)+' / '+LB.length:'';
  var t=LB.length>1?'block':'none';
  document.querySelector('#lb .kiri').style.display=t; document.querySelector('#lb .kanan').style.display=t; }
function lbGuna(){ document.getElementById('lbimg').style.transform='translate('+lbX+'px,'+lbY+'px) scale('+lbS+')'; }
function lbGerak(d){ if(LB.length<2)return; lbi=(lbi+d+LB.length)%LB.length; lbPapar(); }
function lbTutup(){ document.getElementById('lb').classList.remove('on'); }
(function(){var el=document.getElementById('lb'); if(!el) return;
  function jarak(t){var a=t[0],b=t[1];return Math.hypot(a.clientX-b.clientX,a.clientY-b.clientY);}
  el.addEventListener('touchstart',function(e){
    if(e.touches.length===2){_pinch=true;_d0=jarak(e.touches);_s0=lbS;}
    else if(e.touches.length===1){_pinch=false;_sx=e.touches[0].clientX;_sy=e.touches[0].clientY;_px=lbX;_py=lbY;}},{passive:true});
  el.addEventListener('touchmove',function(e){
    if(_pinch&&e.touches.length===2){ e.preventDefault();
      lbS=Math.min(5,Math.max(1,_s0*(jarak(e.touches)/_d0))); if(lbS===1){lbX=0;lbY=0;} lbGuna();
    }else if(e.touches.length===1&&lbS>1){ e.preventDefault();
      lbX=_px+(e.touches[0].clientX-_sx); lbY=_py+(e.touches[0].clientY-_sy); lbGuna(); }},{passive:false});
  el.addEventListener('touchend',function(e){ if(_pinch){_pinch=false;return;} if(lbS>1)return;
    var dx=e.changedTouches[0].clientX-_sx; if(Math.abs(dx)>60) lbGerak(dx<0?1:-1); },{passive:true});
  var akhir=0;
  el.addEventListener('click',function(e){
    if(e.target!==document.getElementById('lbimg')&&e.target!==el) return;
    var kini=Date.now();
    if(kini-akhir<300){ lbS=lbS>1?1:2.6; lbX=0;lbY=0; lbGuna(); }
    else if(e.target===el && lbS===1){ lbTutup(); } akhir=kini; });
  document.addEventListener('keydown',function(e){
    if(!document.getElementById('lb').classList.contains('on'))return;
    if(e.key==='Escape')lbTutup(); if(e.key==='ArrowRight')lbGerak(1); if(e.key==='ArrowLeft')lbGerak(-1); });
})();

function bukaKejut(){
  var h=document.getElementById('hadiah'); if(!h||h.dataset.buka)return;
  h.dataset.buka='1'; h.classList.add('goyang');
  setTimeout(function(){ h.classList.remove('goyang'); h.classList.add('buka'); pecahConfetti();
    setTimeout(function(){ h.classList.add('hilang'); document.getElementById('kdalam').classList.add('on'); },520);
  },560);
}
function pecahConfetti(){
  var c=document.getElementById('kpecah'); if(!c||c.dataset.dah)return; c.dataset.dah='1';
  var w=['#c9223c','#f26d8f','#ffc2d4','#8e1224','#fff'];
  for(var i=0;i<26;i++){ var el=document.createElement('i');
    var a=Math.random()*Math.PI*2, j=40+Math.random()*130;
    el.style.background=w[i%w.length];
    el.style.setProperty('--dx',Math.cos(a)*j+'px'); el.style.setProperty('--dy',(Math.sin(a)*j-40)+'px');
    el.style.setProperty('--r',(Math.random()*720-360)+'deg'); el.style.animationDelay=(Math.random()*.18)+'s';
    c.appendChild(el); }
}
function mainVideo(id){ var v=document.getElementById('vidbox');
  v.querySelector('.frame').innerHTML='<iframe src="https://www.youtube.com/embed/'+id+
  '?autoplay=1&rel=0&playsinline=1" allow="autoplay; encrypted-media" allowfullscreen></iframe>';

var mode=null,ytp=null,ytOk=false,main=false,audio=null,siap=false;
function muzik(){ if(siap)return; siap=true;
  document.getElementById('mname').textContent='\u266A '+(D.mtitle||'Lagu Kita');
  if(D.mp3){ mode='mp3'; audio=document.getElementById('mp3'); audio.src=D.mp3;
    audio.addEventListener('play',function(){setP(true)}); audio.addEventListener('pause',function(){setP(false)});
    audio.play().catch(function(){}); }
  else if(D.yt){ var id=ytId(D.yt); if(!id)return; mode='yt';
    var s=document.createElement('script'); s.src='https://www.youtube.com/iframe_api'; document.head.appendChild(s);
    window.onYouTubeIframeAPIReady=function(){ytp=new YT.Player('yt-root',{width:'1',height:'1',videoId:id,
      playerVars:{autoplay:1,controls:0,disablekb:1,fs:0,rel:0,playsinline:1},
      events:{onReady:function(){ytOk=true;try{ytp.playVideo()}catch(e){}},
        onStateChange:function(e){if(e.data===1)setP(true);else if(e.data===2||e.data===0)setP(false)}}})};}
  ['pointerdown','touchstart'].forEach(function(ev){document.addEventListener(ev,function(){ if(main)return;
    if(mode==='mp3'&&audio)audio.play().catch(function(){});
    else if(mode==='yt'&&ytp&&ytOk){try{ytp.playVideo()}catch(e){}}},{passive:true})});}
function setP(o){main=o;document.getElementById('disc').classList.toggle('go',o);}
function gagal(msg){var l=document.getElementById('load');l.style.display='flex';

  'text-align:center;opacity:.9;line-height:1.6;color:#fff">'+esc2(msg)+'</p>';}
function badge(){var b=document.createElement('div');b.className='tagpv';b.textContent='PRATONTON';document.body.appendChild(b);}
(function init(){var p=new URLSearchParams(location.search);
  if(p.get('preview')==='1'){ try{D=JSON.parse(localStorage.getItem('gk_preview'))}catch(e){D=null}
    if(!D||!Object.keys(D).length)D=DEMO; bina(); badge(); return;}

})();
