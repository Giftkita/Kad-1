<!DOCTYPE html>
<html lang="ms">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,user-scalable=no">
<title>Untuk Kita 💑</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,600;1,400;1,600&family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">
<script src="https://unpkg.com/@supabase/supabase-js@2"></script>
<script>if(!window.supabase){document.write('<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"><\/script>');}</script>
<style>
:root{
  --plum:#241021; --wine:#5e2140; --rose:#c96a86; --blush:#f7dde4;
  --gold:#d9a441; --cream:#fdf7f2; --ink:#2b1520;
}
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{font-family:'Poppins',sans-serif;background:var(--plum);color:var(--cream);line-height:1.65;overflow-x:hidden}
img{display:block;max-width:100%}
.disp{font-family:'Cormorant Garamond',serif;font-weight:600;line-height:1.1}

/* ── memuatkan ── */
#load{position:fixed;inset:0;z-index:900;background:var(--plum);display:flex;flex-direction:column;
  align-items:center;justify-content:center;gap:14px}
.ring{width:44px;height:44px;border:2px solid rgba(247,221,228,.25);border-top-color:var(--gold);border-radius:50%;animation:spin 1s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
#load p{font-size:.74rem;letter-spacing:.24em;text-transform:uppercase;color:rgba(247,221,228,.55)}

/* ── kunci pembuka ── */
#lock{position:fixed;inset:0;z-index:800;display:none;flex-direction:column;align-items:center;justify-content:center;
  gap:22px;padding:30px;text-align:center;
  background:radial-gradient(ellipse 80% 60% at 50% 35%,#4a1a34,var(--plum) 70%)}
#lock.on{display:flex}
#lock.away{animation:lockOut 1s .35s ease forwards}
@keyframes lockOut{to{opacity:0;transform:scale(1.18);visibility:hidden}}
.lk-names{font-size:clamp(2.1rem,9vw,3.4rem);color:var(--cream)}
.lk-names em{font-style:italic;color:var(--gold);display:block;font-size:.55em;margin:.1em 0}
.knot{width:min(56vw,220px);aspect-ratio:1;border-radius:50%;border:1px solid rgba(217,164,65,.5);
  display:flex;align-items:center;justify-content:center;cursor:pointer;position:relative;
  background:rgba(255,255,255,.03);transition:transform .4s}
.knot:active{transform:scale(.95)}
.knot::before{content:'';position:absolute;inset:14px;border-radius:50%;border:1px dashed rgba(217,164,65,.3)}
.knot span{font-size:clamp(2.4rem,11vw,3.6rem)}
.lk-hint{font-size:.74rem;letter-spacing:.2em;text-transform:uppercase;color:rgba(247,221,228,.5);animation:pulse 2.4s ease-in-out infinite}
@keyframes pulse{0%,100%{opacity:.45}50%{opacity:1}}

/* ── aliran cerita ── */
main{display:none}
main.on{display:block}
.pane{min-height:100svh;display:flex;flex-direction:column;align-items:center;justify-content:center;
  padding:64px 22px;position:relative;text-align:center}
.eyebrow{font-size:.68rem;letter-spacing:.26em;text-transform:uppercase;color:var(--gold);margin-bottom:14px}
.pane h2{font-size:clamp(1.9rem,7.5vw,3rem);margin-bottom:12px}
.pane p{max-width:34rem;color:rgba(247,221,228,.82);font-size:.94rem}

/* muka depan */
#p-cover{background:radial-gradient(ellipse 90% 65% at 50% 20%,#59203c,var(--plum) 72%)}
#p-cover .amp{font-style:italic;color:var(--gold);font-size:.5em;display:block;margin:.08em 0}
.since{margin-top:20px;font-size:.76rem;letter-spacing:.18em;text-transform:uppercase;color:rgba(247,221,228,.6)}

/* pengiraan */
#p-count{background:var(--wine)}
.tally{display:flex;gap:10px;flex-wrap:wrap;justify-content:center;margin-top:8px}
.tal{background:rgba(0,0,0,.22);border:1px solid rgba(217,164,65,.28);border-radius:14px;
  padding:16px 14px;min-width:76px}
.tal b{display:block;font-family:'Cormorant Garamond',serif;font-size:2rem;color:var(--cream);line-height:1}
.tal span{display:block;font-size:.6rem;letter-spacing:.16em;text-transform:uppercase;color:rgba(247,221,228,.55);margin-top:6px}

/* perjalanan */
#p-road{background:var(--cream);color:var(--ink)}
#p-road .eyebrow{color:var(--rose)}
#p-road p{color:#6a4a58}
.road{margin-top:22px;width:100%;max-width:32rem;text-align:left;position:relative;padding-left:30px}
.road::before{content:'';position:absolute;left:9px;top:6px;bottom:6px;width:1px;background:rgba(201,106,134,.35)}
.stop{position:relative;padding-bottom:26px}
.stop:last-child{padding-bottom:0}
.stop::before{content:'';position:absolute;left:-26px;top:7px;width:11px;height:11px;border-radius:50%;
  background:var(--rose);box-shadow:0 0 0 4px var(--cream)}
.stop time{display:block;font-size:.68rem;letter-spacing:.16em;text-transform:uppercase;color:var(--rose)}
.stop h3{font-family:'Cormorant Garamond',serif;font-size:1.35rem;margin:2px 0 4px}
.stop img{width:100%;border-radius:12px;margin-top:9px;aspect-ratio:4/3;object-fit:cover}

/* galeri */
#p-gal{background:var(--plum)}
.gal{display:grid;grid-template-columns:1fr 1fr;gap:10px;width:100%;max-width:30rem;margin-top:20px}
.gal img{width:100%;aspect-ratio:1;object-fit:cover;border-radius:14px;border:1px solid rgba(217,164,65,.22)}
.gal img:first-child:nth-last-child(3){grid-column:span 2;aspect-ratio:16/10}

/* surat */
#p-note{background:var(--cream);color:var(--ink)}
#p-note .eyebrow{color:var(--rose)}
.paper{background:#fff;border-radius:4px;padding:clamp(24px,6vw,38px);max-width:34rem;width:100%;
  box-shadow:0 20px 50px rgba(43,21,32,.16);text-align:left;
  font-family:'Cormorant Garamond',serif;font-size:clamp(1.05rem,3.6vw,1.22rem);line-height:1.85;
  white-space:pre-line;color:#3a2430;max-height:56svh;overflow-y:auto}
.sign{margin-top:18px;font-family:'Cormorant Garamond',serif;font-style:italic;font-size:1.1rem;color:var(--rose);text-align:right}

/* penutup */
#p-end{background:radial-gradient(ellipse 80% 60% at 50% 45%,#5e2140,var(--plum) 74%)}
.vow{font-family:'Cormorant Garamond',serif;font-style:italic;font-size:clamp(1.5rem,6vw,2.3rem);
  max-width:26rem;color:var(--cream)}
.vow::before{content:'“';color:var(--gold);font-size:1.4em;line-height:0;vertical-align:-.28em;margin-right:.06em}
.vow::after{content:'”';color:var(--gold);font-size:1.4em;line-height:0;vertical-align:-.28em;margin-left:.04em}

/* bar muzik */
#bar{position:fixed;left:0;right:0;bottom:0;z-index:200;display:none;align-items:center;gap:12px;
  padding:10px 16px calc(10px + env(safe-area-inset-bottom,0px));
  background:rgba(20,8,17,.9);backdrop-filter:blur(14px);border-top:1px solid rgba(217,164,65,.22)}
#bar.on{display:flex}
.disc{width:24px;height:24px;border-radius:50%;flex-shrink:0;
  background:conic-gradient(var(--gold),var(--rose),var(--gold))}
.disc.go{animation:spin 3s linear infinite}
#bar .nm{font-size:.68rem;color:rgba(247,221,228,.7);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:34%}
.track{flex:1;height:2px;background:rgba(255,255,255,.14);cursor:pointer;min-width:40px}
.fill{height:100%;background:var(--gold);width:0}
#bar button{background:none;border:1px solid rgba(217,164,65,.4);color:var(--cream);width:28px;height:28px;
  border-radius:50%;cursor:pointer;font-size:.62rem;flex-shrink:0}

.tagpv{position:fixed;top:10px;left:50%;transform:translateX(-50%);z-index:850;background:rgba(0,0,0,.5);
  color:#fff;font-size:.56rem;letter-spacing:.16em;padding:5px 13px;border-radius:40px;pointer-events:none}
.petals{position:fixed;inset:0;pointer-events:none;z-index:150;overflow:hidden}
.pt{position:absolute;top:-24px;animation:fall linear infinite}
@keyframes fall{to{transform:translateY(112svh) rotate(560deg);opacity:0}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>

<div id="load"><div class="ring"></div><p>Memuatkan</p></div>

<div id="lock">
  <div class="lk-names disp" id="lk-names">Kita<em>&amp;</em>Selamanya</div>
  <div class="knot" id="knot"><span>🤍</span></div>
  <p class="lk-hint">Ketuk untuk buka</p>
</div>

<main id="story">
  <section class="pane" id="p-cover">
    <p class="eyebrow" id="c-eyebrow">Untuk kita</p>
    <h1 class="disp" style="font-size:clamp(2.2rem,9vw,3.6rem)" id="c-names">Kita<span class="amp">&amp;</span>Selamanya</h1>
    <p id="c-tag">Terima kasih kerana masih di sini.</p>
    <p class="since" id="c-since"></p>
  </section>

  <section class="pane" id="p-count">
    <p class="eyebrow">Sejak hari itu</p>
    <h2 class="disp">Kita dah sejauh ini</h2>
    <div class="tally" id="tally"></div>
    <p style="margin-top:16px;font-size:.8rem;color:rgba(247,221,228,.6)" id="count-note"></p>
  </section>

  <section class="pane" id="p-road">
    <p class="eyebrow">Perjalanan</p>
    <h2 class="disp">Detik yang kita simpan</h2>
    <div class="road" id="road"></div>
  </section>

  <section class="pane" id="p-gal">
    <p class="eyebrow">Album</p>
    <h2 class="disp">Gambar kita</h2>
    <div class="gal" id="gal"></div>
  </section>

  <section class="pane" id="p-note">
    <p class="eyebrow">Surat</p>
    <h2 class="disp">Ada sesuatu nak cakap</h2>
    <div class="paper" id="paper"></div>
    <p class="sign" id="sign"></p>
  </section>

  <section class="pane" id="p-end">
    <p class="vow disp" id="vow">Sampai bila-bila.</p>
  </section>
</main>

<div id="bar">
  <div class="disc" id="disc"></div>
  <span class="nm" id="mname">♪</span>
  <div class="track" onclick="seek(event)"><div class="fill" id="fill"></div></div>
  <button id="pbtn" onclick="toggle()">▶</button>
</div>
<div id="yt-root" style="position:fixed;bottom:-300px;left:-300px;width:1px;height:1px;overflow:hidden"></div>
<audio id="mp3" loop></audio>
<div class="petals" id="petals"></div>

<script>
var SB_URL='https://lejpuajafuenlfvlovfg.supabase.co';
var SB_KEY='sb_publishable_igFE4w_dz4ZF99wH1LeBKg_JL5kFoZ0';
var db=null; try{ if(window.supabase&&window.supabase.createClient) db=window.supabase.createClient(SB_URL,SB_KEY);}catch(e){}

var D={};

var DEMO={
  nama_a:'Aisyah', nama_b:'Danial',
  tarikh_mula:'2021-03-14',
  tagline:'Empat tahun, dan aku masih pilih kamu.',
  m1_date:'Mac 2021', m1_txt:'Kali pertama kita jumpa di kedai kopi kecil itu.',
  m2_date:'Disember 2022', m2_txt:'Perjalanan pertama kita berdua. Hujan sepanjang jalan, tapi kita ketawa je.',
  m3_date:'Ogos 2024', m3_txt:'Hari kita putuskan untuk teruskan, apa pun jadi.',
  surat:'Aku tak pandai cakap benda macam ni depan-depan.\n\nTapi setiap hari dengan kamu tu terasa mudah. Bukan sebab takde masalah, tapi sebab kamu ada masa aku hadap semua tu.\n\nTerima kasih sebab tak pernah lepas tangan.',
  janji:'Sampai bila-bila, dan lepas tu pun.',
  mtitle:'Lagu Kita'
};

function esc(s){return String(s==null?'':s).replace(/[&<>]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;'}[c];});}

function render(){
  var a=D.nama_a||'Kita', b=D.nama_b||'Selamanya';
  document.getElementById('lk-names').innerHTML=esc(a)+'<em>&amp;</em>'+esc(b);
  document.getElementById('c-names').innerHTML=esc(a)+'<span class="amp">&amp;</span>'+esc(b);
  if(D.tagline) document.getElementById('c-tag').textContent=D.tagline;

  var start=D.tarikh_mula?new Date(D.tarikh_mula+'T00:00:00'):null;
  if(start&&!isNaN(start)){
    document.getElementById('c-since').textContent='Bersama sejak '+
      start.toLocaleDateString('ms-MY',{day:'numeric',month:'long',year:'numeric'});
    tick(start);
  }else{
    document.getElementById('p-count').style.display='none';
  }

  var road=document.getElementById('road'), any=false, html='';
  for(var i=1;i<=3;i++){
    var t=D['m'+i+'_txt'], dt=D['m'+i+'_date'], im=D['m'+i+'_img'];
    if(!t&&!im) continue;
    any=true;
    html+='<div class="stop">'
      + (dt?'<time>'+esc(dt)+'</time>':'')
      + (t?'<h3>'+esc(t)+'</h3>':'')
      + (im?'<img src="'+im+'" alt="">':'')
      + '</div>';
  }
  if(any){ road.innerHTML=html; } else { document.getElementById('p-road').style.display='none'; }

  var gal=document.getElementById('gal'), pics=[];
  for(var g=1;g<=4;g++){ if(D['g'+g+'_img']) pics.push(D['g'+g+'_img']); }
  if(pics.length){
    gal.innerHTML=pics.map(function(s){return '<img src="'+s+'" alt="">';}).join('');
  }else{ document.getElementById('p-gal').style.display='none'; }

  if(D.surat){
    document.getElementById('paper').textContent=D.surat;
    document.getElementById('sign').textContent='— '+a;
  }else{ document.getElementById('p-note').style.display='none'; }

  document.getElementById('vow').textContent=D.janji||'Sampai bila-bila.';

  document.getElementById('load').style.display='none';
  document.getElementById('lock').classList.add('on');
}

function tick(start){
  var wrap=document.getElementById('tally');
  function step(){
    var ms=Date.now()-start.getTime();
    if(ms<0) ms=0;
    var d=Math.floor(ms/864e5);
    var y=Math.floor(d/365), rem=d-y*365, mo=Math.floor(rem/30), dd=rem-mo*30;
    var h=Math.floor(ms%864e5/36e5), mi=Math.floor(ms%36e5/6e4);
    var box=[[y,'Tahun'],[mo,'Bulan'],[dd,'Hari'],[h,'Jam'],[mi,'Minit']];
    wrap.innerHTML=box.map(function(x){return '<div class="tal"><b>'+x[0]+'</b><span>'+x[1]+'</span></div>';}).join('');
    document.getElementById('count-note').textContent=d.toLocaleString('ms-MY')+' hari bersama.';
    setTimeout(step,30000);
  }
  step();
}

/* ── buka kunci ── */
var opened=false;
document.getElementById('knot').onclick=function(){
  if(opened) return; opened=true;
  setupMusic();
  petals();
  var lk=document.getElementById('lock');
  lk.classList.add('away');
  setTimeout(function(){ lk.style.display='none'; document.getElementById('story').classList.add('on'); },1200);
};

function petals(){
  var c=document.getElementById('petals'), it=['🌸','🤍','🌷','✨'];
  for(var i=0;i<14;i++){
    var p=document.createElement('div'); p.className='pt';
    p.textContent=it[i%it.length];
    p.style.cssText='left:'+(Math.random()*100)+'vw;font-size:'+(.7+Math.random()*.8)+'rem;opacity:'+(.4+Math.random()*.4)
      +';animation-duration:'+(7+Math.random()*7)+'s;animation-delay:-'+(Math.random()*8)+'s';
    c.appendChild(p);
  }
}

/* ── muzik ── */
var mode=null,ytp=null,ytOk=false,playing=false,audio=null,done=false;
function ytId(u){var m=(u||'').match(/(?:youtu\.be\/|[?&]v=|\/shorts\/|\/embed\/|\/live\/)([a-zA-Z0-9_-]{11})/);return m?m[1]:null;}
function setupMusic(){
  if(done) return; done=true;
  document.getElementById('mname').textContent='♪ '+(D.mtitle||'Lagu Kita');
  if(D.mp3){
    mode='mp3'; audio=document.getElementById('mp3'); audio.src=D.mp3;
    document.getElementById('bar').classList.add('on');
    audio.addEventListener('timeupdate',function(){ if(audio.duration) document.getElementById('fill').style.width=(audio.currentTime/audio.duration*100)+'%'; });
    audio.addEventListener('play',function(){setP(true)});
    audio.addEventListener('pause',function(){setP(false)});
    audio.play().catch(function(){});
  }else if(D.yt){
    var id=ytId(D.yt); if(!id) return;
    mode='yt'; document.getElementById('bar').classList.add('on');
    var s=document.createElement('script'); s.src='https://www.youtube.com/iframe_api'; document.head.appendChild(s);
    window.onYouTubeIframeAPIReady=function(){
      ytp=new YT.Player('yt-root',{width:'1',height:'1',videoId:id,
        playerVars:{autoplay:1,controls:0,disablekb:1,fs:0,rel:0,playsinline:1},
        events:{onReady:function(){ytOk=true;try{ytp.playVideo()}catch(e){}},
          onStateChange:function(e){ if(e.data===1){setP(true);bar()} else if(e.data===2||e.data===0){setP(false)} }}});
    };
  }
  ['pointerdown','touchstart','click'].forEach(function(ev){
    document.addEventListener(ev,function(){
      if(playing) return;
      if(mode==='mp3'&&audio) audio.play().catch(function(){});
      else if(mode==='yt'&&ytp&&ytOk){ try{ytp.playVideo()}catch(e){} }
    },{passive:true});
  });
}
function setP(o){playing=o;document.getElementById('disc').classList.toggle('go',o);document.getElementById('pbtn').textContent=o?'❚❚':'▶';}
function toggle(){ if(mode==='mp3'&&audio){playing?audio.pause():audio.play()} else if(mode==='yt'&&ytp&&ytOk){playing?ytp.pauseVideo():ytp.playVideo()} }
function seek(e){var r=e.currentTarget.getBoundingClientRect(),p=(e.clientX-r.left)/r.width;
  if(mode==='mp3'&&audio&&audio.duration)audio.currentTime=p*audio.duration;
  else if(mode==='yt'&&ytp&&ytOk)ytp.seekTo(p*ytp.getDuration(),true);}
function bar(){ if(mode!=='yt'||!playing||!ytp||!ytOk)return;
  document.getElementById('fill').style.width=(ytp.getCurrentTime()/ytp.getDuration()*100)+'%'; setTimeout(bar,900); }

function fail(msg){
  var l=document.getElementById('load');
  l.style.display='flex';
  l.innerHTML='<div style="font-size:2.2rem">🥀</div><p style="letter-spacing:0;text-transform:none;font-size:.9rem;'
    +'max-width:20rem;text-align:center;color:rgba(247,221,228,.8)">'+esc(msg)+'</p>';
}
function badge(){var b=document.createElement('div');b.className='tagpv';b.textContent='PRATONTON';document.body.appendChild(b);}

(function init(){
  var p=new URLSearchParams(location.search);
  if(p.get('preview')==='1'){
    try{ D=JSON.parse(localStorage.getItem('gk_preview')); }catch(e){ D=null; }
    if(!D) D=DEMO;
    render(); badge(); return;
  }
  var id=p.get('id');
  if(!id){ D=DEMO; render(); badge(); return; }
  if(!db){ fail('Sambungan ke pangkalan data gagal. Sila refresh halaman.'); return; }
  db.from('cards').select('card_data,paid').eq('id',id).single().then(function(r){
    if(r.error) throw r.error;
    if(r.data.paid!==true){ fail('Kad ini belum diaktifkan. Sila selesaikan pembayaran untuk membukanya.'); return; }
    D=r.data.card_data; render();
  }).catch(function(){ fail('Kad tidak dijumpai atau telah tamat tempoh.'); });
})();
</script>
</body>
</html>
