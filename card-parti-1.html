<!--

  card_data: template, nama, umur, pengirim, f1_teks..f5_teks, f1_img..f5_img (+_pos), b1_teks..b5_teks, video, surat, surprise_img (+_pos), surprise, yt|mp3, lang

<style>
:root{--ink:#5a2f4a}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;overflow:hidden}
body{font-family:Poppins,sans-serif;color:var(--ink);-webkit-user-select:none;user-select:none;background:#120a1c}
img{-webkit-user-drag:none;display:block}
button{font-family:inherit}
#bilik{position:fixed;inset:0;overflow:hidden}
#dinding{position:absolute;left:0;right:0;top:0;height:72%;background:
  radial-gradient(ellipse 70% 50% at 50% 12%,rgba(255,244,214,.55),rgba(255,244,214,0) 70%),
  repeating-linear-gradient(90deg,#fde3ec 0 26px,#fff4f0 26px 52px)}
#dinding::after{content:"";position:absolute;left:0;right:0;bottom:0;height:14px;background:linear-gradient(#fff,#f2d7e0);box-shadow:0 2px 6px rgba(120,60,80,.2)}
#lantai{position:absolute;left:0;right:0;bottom:0;top:72%;background:repeating-linear-gradient(90deg,rgba(120,70,40,.12) 0 2px,transparent 2px 70px),linear-gradient(#e7c49d,#d6a877)}
#bilik>*:not(#dinding):not(#lantai){position:absolute}
.hias{pointer-events:none;filter:drop-shadow(0 8px 10px rgba(120,60,90,.25))}
#lampu{left:50%;translate:-50% 0;top:-2px;z-index:6}
#lampu img{width:100%}
#cahaya{position:absolute;left:50%;top:86%;width:340%;aspect-ratio:1;translate:-50% 0;background:radial-gradient(ellipse 50% 60% at 50% 0,rgba(255,240,190,.55),rgba(255,240,190,0) 70%);opacity:0;transition:opacity 1s;pointer-events:none}
body.terang #cahaya{opacity:1}
#bunting{top:-30%;transition:top 1s cubic-bezier(.3,1.4,.5,1);z-index:5;animation:ayun 5s ease-in-out infinite;transform-origin:50% 0}
body.terang #bunting{top:3%}
@keyframes ayun{50%{rotate:.8deg}}
#disko{z-index:11;top:-40%;transition:top 1.6s cubic-bezier(.3,1.2,.5,1) .6s}
body.terang #disko{top:0}
#disko img{width:100%;animation:pusing 4s linear infinite}
#disko{transform-origin:50% 0;animation:ayunD 3s ease-in-out infinite}
@keyframes ayunD{50%{rotate:2deg}}
#kilat{position:absolute;left:1.5%;width:97%;aspect-ratio:1;border-radius:50%;overflow:hidden;mix-blend-mode:screen;pointer-events:none;
  background-image:linear-gradient(90deg,transparent 0 38%,rgba(255,255,255,.75) 50%,transparent 62%),radial-gradient(circle,rgba(255,150,205,.95) 0 1.6px,transparent 2.6px),radial-gradient(circle,rgba(140,215,255,.95) 0 1.6px,transparent 2.6px),radial-gradient(circle,rgba(255,235,150,.95) 0 1.4px,transparent 2.4px),radial-gradient(circle,#fff 0 1.2px,transparent 2.2px);
  background-size:200% 100%,13px 11px,19px 15px,23px 17px,9px 13px;animation:tile 2.4s linear infinite;
  -webkit-mask:radial-gradient(circle,#000 50%,rgba(0,0,0,.5) 64%,transparent 72%);mask:radial-gradient(circle,#000 50%,rgba(0,0,0,.5) 64%,transparent 72%)}
@keyframes tile{from{background-position:130% 0,0 0,0 0,0 0,0 0}to{background-position:-30% 0,-52px 0,-76px 0,-92px 0,-36px 0}}
#sinar{position:absolute;z-index:9;mix-blend-mode:screen;width:300vmax;height:300vmax;translate:-50% -50%;pointer-events:none;opacity:0;transition:opacity 1.4s .9s;
  background:repeating-conic-gradient(from 0deg,rgba(255,90,170,.3) 0 2.5deg,transparent 2.5deg 18deg,rgba(60,170,255,.3) 18deg 20.5deg,transparent 20.5deg 36deg,rgba(255,200,40,.3) 36deg 38.5deg,transparent 38.5deg 54deg,rgba(150,100,255,.3) 54deg 56.5deg,transparent 56.5deg 72deg);
  -webkit-mask:radial-gradient(circle,#000 0,rgba(0,0,0,.6) 12%,transparent 34%);mask:radial-gradient(circle,#000 0,rgba(0,0,0,.75) 14%,transparent 38%);animation:putar 9s linear infinite}
body.terang #sinar{opacity:1}
#disko_gelap{position:absolute;inset:0;z-index:8;pointer-events:none;opacity:0;transition:opacity 1.6s .8s;
  background:radial-gradient(ellipse 62% 48% at 50% 44%,rgba(40,10,60,0) 0,rgba(40,10,60,.18) 38%,rgba(22,6,40,.62) 72%,rgba(12,3,26,.88) 100%)}
body.terang #disko_gelap{opacity:1}
@keyframes putar{to{rotate:360deg}}
@keyframes pusing{0%{filter:brightness(1) hue-rotate(0)}50%{filter:brightness(1.25) hue-rotate(40deg)}100%{filter:brightness(1) hue-rotate(0)}}
.titikD{position:absolute;left:0;top:0;border-radius:50%;pointer-events:none;opacity:0;z-index:10;mix-blend-mode:screen;transition:opacity 1s 1s}
body.terang .titikD{opacity:.9}
#papan{z-index:5}
#papan>img{width:100%;filter:drop-shadow(0 8px 12px rgba(120,60,90,.28))}
#papanTx{position:absolute;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;color:#fff;font:600 1px/1.12 Fredoka,Poppins,sans-serif;letter-spacing:.12em;text-shadow:0 1px 0 rgba(0,0,0,.35)}
#papanTx div{min-height:1.12em;white-space:nowrap}
.bk,.blon{position:absolute}
.bk{z-index:5;cursor:pointer;transform-origin:50% -8%}
.bk .ft{position:absolute;background:#f2e6ea center/cover no-repeat}
.bk>img{position:relative;width:100%;filter:drop-shadow(0 6px 8px rgba(120,60,90,.3));pointer-events:none}
.bk .tali{position:absolute;left:50%;top:-14%;width:1.5px;height:16%;background:#c9a15a}
.bk .tali::after{content:"";position:absolute;left:-3px;top:-4px;width:7px;height:7px;border-radius:50%;background:#e6c27a}
.bk.hayun{animation:hayun 1s ease-in-out}
@keyframes hayun{20%{rotate:8deg}45%{rotate:-6deg}70%{rotate:3deg}}
.bk.dah::before{content:"💖";position:absolute;right:-6%;top:-6%;z-index:3;font-size:18px}
.bk.nadi{animation:nadiB 1.6s ease-in-out infinite}
@keyframes nadiB{50%{scale:1.05;filter:drop-shadow(0 0 10px rgba(255,160,200,.9))}}
#suis{z-index:30;cursor:pointer;transition:left .9s cubic-bezier(.3,1.1,.4,1),top .9s cubic-bezier(.3,1.1,.4,1),width .9s cubic-bezier(.3,1.1,.4,1)}

body:not(.terang) #suis{filter:drop-shadow(0 0 18px rgba(255,220,160,.55));animation:denyutS 1.8s ease-in-out infinite}
@keyframes denyutS{50%{filter:drop-shadow(0 0 30px rgba(255,220,160,.9))}}
#meja{z-index:6;pointer-events:none}
#cupcake,#hadiah{z-index:7}
#hadiah{cursor:pointer}
#hadiah img,#cupcake img{width:100%}
#hadiah.goyang{animation:hgoyang 1.2s ease-in-out infinite;z-index:12;filter:drop-shadow(0 0 14px rgba(255,200,230,.9))}
@keyframes hgoyang{0%,60%,100%{rotate:0}70%{rotate:-7deg}80%{rotate:6deg}90%{rotate:-3deg}}
#hadiahLbl{position:absolute;left:50%;bottom:102%;translate:-50% 0;white-space:nowrap;background:linear-gradient(135deg,#ff9cc8,#f0a35e);color:#fff;border-radius:999px;padding:6px 12px;font:600 .74rem Fredoka,Poppins,sans-serif;display:none;box-shadow:0 4px 12px rgba(192,102,143,.4)}
#hadiah.goyang #hadiahLbl{display:block}
.pop{z-index:7;pointer-events:none}
.blon{z-index:8;cursor:pointer;animation:apung var(--d,4s) ease-in-out infinite;transition:translate 2s cubic-bezier(.2,.8,.3,1),opacity .3s;translate:0 110vh}
body.terang .blon{translate:0 0}
.blon .bd{position:absolute;inset:0;border-radius:50% 50% 47% 47%/55% 55% 45% 45%;background:radial-gradient(circle at 32% 28%,rgba(255,255,255,.85) 0 7%,rgba(255,255,255,0) 18%),radial-gradient(circle at 45% 45%,var(--c) 30%,var(--c2) 100%);box-shadow:inset -4px -6px 10px rgba(0,0,0,.08)}
.blon .bd::after{content:"";position:absolute;left:50%;bottom:-6%;translate:-50% 0;border:5px solid transparent;border-bottom:7px solid var(--c2);border-top:0}
.blon .tl{position:absolute;left:50%;top:100%;width:1.2px;height:110%;background:linear-gradient(rgba(150,120,140,.7),rgba(150,120,140,0))}
@keyframes apung{50%{margin-top:-12px;rotate:3deg}}
.cebis{position:fixed;z-index:60;width:10px;height:7px;border-radius:3px;pointer-events:none;animation:cebis .7s ease-out forwards}
@keyframes cebis{to{translate:var(--dx) var(--dy);rotate:var(--dr);opacity:0}}
#gelap{position:fixed;inset:0;z-index:20;background:radial-gradient(circle at var(--x,50%) var(--y,50%),rgba(20,10,30,.6) 0,rgba(10,5,18,.985) 150px);transition:opacity 1s;pointer-events:none}
body.terang #gelap{opacity:0}
#shh{position:fixed;left:0;right:0;z-index:31;text-align:center;color:#f3e3ff;padding:0 20px;transition:opacity .5s;pointer-events:none}
#shh .b{font:700 clamp(1.8rem,8vw,2.6rem) Caveat,cursive}
#shh .t{font:500 .9rem Poppins,sans-serif;margin-top:6px;opacity:.85}
body.terang #shh{opacity:0}
#surprise{position:fixed;left:0;right:0;top:40%;z-index:40;text-align:center;font:700 clamp(3rem,16vw,5.4rem)/1 Fredoka,Poppins,sans-serif;color:#fff;-webkit-text-stroke:2px #e46aa6;text-shadow:0 5px 0 #e46aa6,0 9px 0 #b98af0,0 14px 26px rgba(185,138,240,.5);pointer-events:none;opacity:0;letter-spacing:.02em}
#surprise.on{animation:surp 2.6s cubic-bezier(.2,1.4,.4,1) forwards}
@keyframes surp{0%{opacity:0;scale:.2;rotate:-12deg}18%{opacity:1;scale:1.12;rotate:3deg}28%{scale:1;rotate:-2deg}80%{opacity:1;scale:1}100%{opacity:0;scale:1.4;translate:0 -30px}}
#bawah{position:fixed;left:0;right:0;bottom:calc(env(safe-area-inset-bottom,0px) + 18px);z-index:25;display:flex;flex-direction:column;align-items:center;gap:8px;padding:0 16px;pointer-events:none}
#bawah>*{pointer-events:auto}
#hint{font:600 clamp(.8rem,3.5vw,.95rem) Fredoka,Poppins,sans-serif;color:#b0508a;background:rgba(255,255,255,.88);border-radius:999px;padding:7px 15px;text-align:center;display:none;box-shadow:0 4px 12px rgba(120,60,90,.2)}
#hint.on{display:block;animation:apungH 2.4s ease-in-out infinite}
@keyframes apungH{50%{translate:0 -5px}}
#kaunter{position:fixed;left:50%;translate:-50% 0;top:calc(env(safe-area-inset-top,0px) + 12px);z-index:25;display:none;background:rgba(255,255,255,.88);border:1px solid #f3c4dc;border-radius:999px;padding:5px 13px;font:600 .74rem Fredoka,Poppins,sans-serif;color:#b0508a}
#kaunter.on{display:block}
.pil{border:0;border-radius:999px;padding:13px 28px;font:600 .95rem Fredoka,Poppins,sans-serif;cursor:pointer;color:#fff;background:linear-gradient(135deg,#ff9cc8,#b98af0);box-shadow:0 6px 0 #a0659a,0 10px 22px rgba(160,101,154,.35);animation:denyut 1.8s ease-in-out infinite}
.pil.p2{background:#fff;color:#b0508a;box-shadow:0 4px 0 #f0c3d8;animation:none}
.pil:active{translate:0 3px}
@keyframes denyut{50%{scale:1.05}}
#confetti{position:fixed;inset:0;z-index:45;pointer-events:none}

/* lapisan */
.lap{position:fixed;inset:0;z-index:80;display:none;align-items:center;justify-content:center;flex-direction:column;padding:16px;background:rgba(255,236,245,.82);-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px)}
.lap.on{display:flex;animation:muncul .35s ease}
@keyframes muncul{from{opacity:0}}
.no{font:600 .72rem Fredoka,Poppins,sans-serif;letter-spacing:.2em;color:#c0668f;margin-bottom:10px;text-align:center}
.bkBox{position:relative;animation:timbul .7s cubic-bezier(.2,1.3,.4,1)}
@keyframes timbul{from{scale:.3;rotate:-10deg;opacity:0}}
.bkBox>img{position:relative;width:100%;z-index:2;pointer-events:none;filter:drop-shadow(0 12px 22px rgba(140,70,110,.3))}
.bkBox .ft{position:absolute;z-index:1;background:#f5e6ee center/cover no-repeat;cursor:zoom-in}
.bkBox .main{position:absolute;left:50%;top:50%;width:64px;height:64px;margin:-32px 0 0 -32px;border-radius:50%;background:rgba(255,255,255,.92);z-index:3;cursor:pointer}
.bkBox .main::after{content:"";position:absolute;left:25px;top:20px;border:12px solid transparent;border-left:20px solid #e46aa6;border-right:0}
.nTx{position:absolute;z-index:3;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;overflow-y:auto;padding:3%}
.nTx .t{font:700 1.7rem/1.25 Caveat,cursive;color:var(--ink);white-space:pre-line;word-break:break-word}
.kap{margin-top:14px;max-width:min(86vw,420px);text-align:center;font:700 clamp(1.3rem,6vw,1.8rem)/1.2 Caveat,cursive;color:var(--ink);white-space:pre-line}
.btnB{display:flex;gap:10px;flex-wrap:wrap;justify-content:center;margin-top:16px}
#vidLap .box{position:relative;width:min(92vw,560px);aspect-ratio:16/9;border-radius:12px;overflow:hidden;background:#000}
#vidLap iframe{position:absolute;inset:0;width:100%;height:100%;border:0}

/* kad ucapan */
#sk2{position:fixed;inset:0;z-index:70;display:none;flex-direction:column;align-items:center;justify-content:center;padding:calc(env(safe-area-inset-top,0px) + 54px) 14px calc(env(safe-area-inset-bottom,0px) + 20px);background:radial-gradient(ellipse at 50% 40%,#fff3f8,#ffd9e8 60%,#e9cdf5)}
#sk2.on{display:flex;animation:muncul .5s ease}
.tajuk{font:700 clamp(1.3rem,6vw,1.9rem)/1.1 Fredoka,Poppins,sans-serif;color:#fff;-webkit-text-stroke:1.2px #e46aa6;text-shadow:0 3px 0 #e46aa6,0 6px 18px rgba(228,106,166,.45);margin-bottom:12px;text-align:center}
#kadBox{position:relative;animation:naik 1s cubic-bezier(.2,.8,.3,1) both}
@keyframes naik{from{opacity:0;translate:0 80px}}
#kadBox>img{width:100%;filter:drop-shadow(0 12px 24px rgba(140,70,110,.3))}
#suratTx{position:absolute;overflow-y:auto;font:600 clamp(1.05rem,4.6vw,1.32rem)/1.38 Caveat,cursive;color:var(--ink);white-space:pre-line;padding:2% 3%;-webkit-overflow-scrolling:touch}
#suratTx .ttd{margin-top:14px;text-align:right;color:#d0508f}

/* umum */
#bhs{position:fixed;top:10px;right:10px;z-index:95;display:flex;background:rgba(255,255,255,.75);border-radius:30px;padding:3px;border:1px solid #f3c4dc}
#bhs button{border:0;background:transparent;color:#b0508a;font:600 .68rem Poppins,sans-serif;padding:5px 11px;border-radius:20px;cursor:pointer}
#bhs button.on{background:#f08ab8;color:#fff}
#bMuzik{position:fixed;top:10px;left:10px;z-index:95;width:34px;height:34px;border-radius:50%;border:1px solid #f3c4dc;background:rgba(255,255,255,.75);color:#d0508f;font-size:15px;cursor:pointer;display:none}
#bMuzik.on{display:block}#bMuzik.henti{opacity:.5;text-decoration:line-through}
#gk-album-btn{bottom:auto!important;top:calc(env(safe-area-inset-top,0px) + 48px)!important;right:10px!important;padding:8px 12px!important;font-size:.64rem!important}
.tagpv{position:fixed;top:44px;left:50%;translate:-50% 0;z-index:95;background:rgba(176,80,138,.3);color:#fff;font:500 .5rem Poppins,sans-serif;letter-spacing:.18em;padding:4px 10px;border-radius:40px;pointer-events:none}
.gagal{position:fixed;inset:0;z-index:999;display:flex;align-items:center;justify-content:center;padding:24px;text-align:center;background:#ffe9f2;font:15px/1.7 Poppins,sans-serif;color:var(--ink)}
#lb{z-index:1000;background:rgba(40,16,34,.95);padding:0;touch-action:none;overflow:hidden}
#lb img{max-width:100vw;max-height:100vh;transform-origin:0 0;will-change:transform;-webkit-user-drag:none}
#lb .tt{position:absolute;left:0;right:0;bottom:calc(env(safe-area-inset-bottom,0px) + 16px);text-align:center;font:italic 12px Poppins,sans-serif;color:rgba(255,255,255,.6);pointer-events:none}
.x{position:fixed;right:14px;top:14px;width:32px;height:32px;border-radius:50%;border:0;background:rgba(255,255,255,.9);color:#5a2f4a;font-size:14px;cursor:pointer;z-index:3}

/* lightbox: cubit zum, seret, dwiketik; ketik sekali (tanpa zum) = tutup */
var LB={s:1,x:0,y:0};
function lbBuka(src){var im=$('lbimg');im.src=src;LB={s:1,x:0,y:0};lbTerap();$('lbTt').textContent=T('lbTt');$('lb').classList.add('on');}
function lbTerap(){$('lbimg').style.transform='translate('+LB.x+'px,'+LB.y+'px) scale('+LB.s+')';}
(function(){var lb=$('lb'),im=$('lbimg'),pts={},d0=0,s0=1,c0=null,x0=0,y0=0,gerak=false,lastTap=0,tapT=0;
  function pusat(){var k=Object.keys(pts);if(k.length<2)return null;var a=pts[k[0]],b=pts[k[1]];return{x:(a.x+b.x)/2,y:(a.y+b.y)/2,d:Math.hypot(a.x-b.x,a.y-b.y)};}
  lb.addEventListener('pointerdown',function(e){if(e.target.closest('.x'))return;pts[e.pointerId]={x:e.clientX,y:e.clientY};try{lb.setPointerCapture(e.pointerId);}catch(_){}
    var p=pusat();if(p){d0=p.d;s0=LB.s;c0=p;x0=LB.x;y0=LB.y;}else{x0=LB.x;y0=LB.y;c0={x:e.clientX,y:e.clientY};}gerak=false;tapT=Date.now();});
  lb.addEventListener('pointermove',function(e){if(!pts[e.pointerId])return;pts[e.pointerId]={x:e.clientX,y:e.clientY};var p=pusat();
    if(p){var s=Math.max(1,Math.min(5,s0*p.d/d0));var r=im.getBoundingClientRect();
      /* zum ke arah titik cubit: kekalkan titik bawah jari */
      var px=(c0.x-(x0+im.offsetLeft))/s0,py=(c0.y-(y0+im.offsetTop))/s0;
      LB.s=s;LB.x=p.x-im.offsetLeft-px*s;LB.y=p.y-im.offsetTop-py*s;gerak=true;lbTerap();}
    else if(LB.s>1){var dx=e.clientX-c0.x,dy=e.clientY-c0.y;if(Math.hypot(dx,dy)>6)gerak=true;LB.x=x0+dx;LB.y=y0+dy;lbTerap();}});
  function lepas(e){if(!pts[e.pointerId])return;delete pts[e.pointerId];
    if(Object.keys(pts).length===0){var t=Date.now();
      if(!gerak&&t-tapT<300){if(t-lastTap<320){/* dwiketik: zum 2.5x ke titik / reset */
          if(LB.s>1){LB={s:1,x:0,y:0};}else{var s=2.5,px=e.clientX-im.offsetLeft,py=e.clientY-im.offsetTop;LB={s:s,x:px-px*s,y:py-py*s};}lbTerap();lastTap=0;}
        else{lastTap=t;setTimeout(function(){if(lastTap===t&&LB.s===1)tutupLap('lb');},320);}}
      if(LB.s===1){LB.x=0;LB.y=0;lbTerap();}}
    else{var k=Object.keys(pts)[0];c0={x:pts[k].x,y:pts[k].y};x0=LB.x;y0=LB.y;}}
  lb.addEventListener('pointerup',lepas);lb.addEventListener('pointercancel',lepas);
})();
