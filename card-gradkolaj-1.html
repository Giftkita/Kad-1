#buku{position:fixed;perspective:3000px;transition:transform .9s cubic-bezier(.5,.05,.3,1)}
#buku.tutup{transform:translateX(-25%)}
.pane{position:absolute;top:0;width:50%;height:100%;overflow:hidden}
#pKiri{left:0;border-radius:1.2% 0 0 1.2%/0.85% 0 0 0.85%;box-shadow:-6px 10px 30px rgba(30,60,100,.28)}
#pKanan{left:50%;border-radius:0 1.2% 1.2% 0/0 0.85% 0.85% 0;box-shadow:6px 10px 30px rgba(30,60,100,.28)}
#buku.tutup #pKiri{visibility:hidden}
/* ketebalan buku: papan kulit keras + tumpukan helaian di tepi */
.papan{position:absolute;top:-2.4%;bottom:-3.6%;width:51.6%;background:#1d3f8a;background-image:repeating-linear-gradient(45deg,rgba(255,255,255,.04) 0 2px,transparent 2px 4px),linear-gradient(180deg,#26509e,#16336f);
  box-shadow:0 1.6vmin 3.2vmin rgba(40,25,10,.45),0 .4vmin .8vmin rgba(0,0,0,.35)}
#papKiri{left:-1.6%;border-radius:1.6% 0 0 1.6%/1.1% 0 0 1.1%}
#papKanan{right:-1.6%;border-radius:0 1.6% 1.6% 0/0 1.1% 1.1% 0}
#buku.tutup #papKiri{display:none}
.tumpuk{position:absolute;top:0;height:100%;width:50%;background:#f6f3ec;border-radius:inherit}
#tmpKiri{left:0}#tmpKanan{left:50%}
#buku.tutup #tmpKiri{display:none}
#daun{position:absolute;left:50%;top:0;width:50%;height:100%;transform-origin:0 50%;transform-style:preserve-3d;display:none;z-index:30}
#daun .muka{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;overflow:hidden}
#daun .blk{transform:rotateY(180deg)}
#daun .muka:after{content:'';position:absolute;inset:0;pointer-events:none;background:linear-gradient(90deg,rgba(0,0,0,.18),rgba(0,0,0,0) 30%)}
#daun .blk:after{background:linear-gradient(270deg,rgba(0,0,0,.18),rgba(0,0,0,0) 30%)}
#daun *{pointer-events:none!important}
.pane:after{content:'';position:absolute;top:0;bottom:0;width:8%;pointer-events:none}
#pKiri:after{right:0;background:linear-gradient(270deg,rgba(0,0,0,.16),rgba(0,0,0,0))}
#pKanan:after{left:0;background:linear-gradient(90deg,rgba(0,0,0,.16),rgba(0,0,0,0))}
#spiral{position:absolute;left:50%;top:2.5%;bottom:2.5%;width:4.2%;transform:translateX(-50%);z-index:40;display:flex;flex-direction:column;justify-content:space-between;pointer-events:none}
#spiral i{display:block;height:2.2%;border-radius:99px;background:linear-gradient(180deg,#fff3c4,#d9a93c 45%,#8a6418 80%,#c8963a);box-shadow:0 1px 2px rgba(0,0,0,.35)}
.hal{position:absolute;inset:0;container-type:inline-size;overflow:hidden;background:#eef0f3}
.hal>img.bg{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:block}
img{pointer-events:none}
.tl{position:absolute;left:-6cqw;white-space:nowrap;font:900 15cqw/1 "Playfair Display",serif;color:#5d9fcf;opacity:.16;pointer-events:none;letter-spacing:-.01em}
.tl.t{transform:rotate(180deg)}
.el{position:absolute}
.el>img.s{position:absolute;inset:0;width:100%;height:100%;display:block;filter:drop-shadow(0 .5cqw .7cqw rgba(30,40,60,.28))}
.ft{position:absolute;overflow:hidden;background:#cfd8e2;-webkit-mask-size:100% 100%;mask-size:100% 100%;cursor:zoom-in}
.ft img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.st{position:absolute;pointer-events:none}
.st img{width:100%;height:100%;display:block;filter:drop-shadow(0 .4cqw .5cqw rgba(30,40,60,.22))}
.on .st.g{animation:goyang 3.2s ease-in-out infinite}
@keyframes goyang{0%,100%{transform:rotate(var(--r)) scale(1)}50%{transform:rotate(calc(var(--r) + 7deg)) scale(1.07)}}
.rn{position:absolute;display:flex;flex-wrap:wrap;justify-content:center;align-items:center;gap:.5cqw;pointer-events:none;line-height:1;z-index:20}
.rn b{display:inline-flex;align-items:center;justify-content:center;padding:.2em .14em .12em;min-width:.72em;font-weight:400;box-shadow:.25cqw .4cqw .6cqw rgba(0,0,0,.28);
  clip-path:polygon(3% 6%,96% 0,100% 92%,5% 100%)}
.rn i{display:inline-block;width:.32em}
.senyap .rn b{animation:none!important}
.on .rn b{animation:popH .45s cubic-bezier(.3,1.6,.5,1) backwards}
@keyframes popH{from{transform:scale(0) rotate(-30deg);opacity:0}}

function letup(){ var w=['#f7c844','#e0453a','#2aa6a6','#6fb6e3','#f28baa','#1d3f8a'];
  for(var i=0;i<70;i++){ var c=document.createElement('div');
    c.style.cssText='position:fixed;z-index:1500;left:50%;top:40%;width:8px;height:12px;border-radius:2px;pointer-events:none;background:'+w[i%6];
    document.body.appendChild(c); var a=Math.random()*Math.PI*2, j=140+Math.random()*300;
    c.animate([{transform:'translate(0,0) rotate(0)',opacity:1},{transform:'translate('+Math.cos(a)*j+'px,'+(Math.sin(a)*j+280)+'px) rotate('+(Math.random()*720)+'deg)',opacity:0}],{duration:1600+Math.random()*900,easing:'cubic-bezier(.2,.7,.4,1)',fill:'forwards'});
    setTimeout(function(x){return function(){x.remove();};}(c),2700); } }

/* ---------- muzik ---------- */
function sediaMuzik(){
  if(v('mp3')){ audio=new Audio(v('mp3')); audio.loop=true; }
  else if(ytId(v('yt'))){ var f=document.createElement('iframe'); f.style.cssText='position:fixed;width:1px;height:1px;opacity:0;pointer-events:none;left:-10px';
    f.allow='autoplay'; document.body.appendChild(f); var yid=ytId(v('yt'));
    audio={ play:function(){ f.src='https://www.youtube.com/embed/'+yid+'?autoplay=1&loop=1&playlist='+yid; }, pause:function(){ f.src=''; } }; }
  if(!audio) $('#bMuzik').classList.add('hide');
}
var muzikMula=false;
function mulaMuzik(){ if(audio&&!muzikOn&&!muzikMula){ muzikMula=true; toggleMuzik(); } }
function toggleMuzik(){ if(!audio) return; muzikOn=!muzikOn; try{ muzikOn?audio.play():audio.pause(); }catch(e){}
  $('#bMuzik').style.background=muzikOn?'#6fb6e3':'#fff'; $('#bMuzik').style.color=muzikOn?'#fff':'#2a6fa3'; }
$('#bMuzik').onclick=toggleMuzik;
$('#bAlbum').onclick=function(){ if(window.GKAlbum&&GKAlbum.open) GKAlbum.open(); };

/* ---------- demo: ilustrasi graduan (bukan kotak kosong) ---------- */
function fotoDemo(n){ var W=720,H=540,c=document.createElement('canvas'); c.width=W; c.height=H; var x=c.getContext('2d');
  var P=[['#ffd6a5','#ff9a8b','#6a4c93'],['#a8e0ff','#5fb3e8','#1d3f8a'],['#fff1b8','#ffcf5c','#e0453a'],['#c9f2e3','#6fd0b8','#1f6f6b'],['#ffd1e1','#f59ac0','#7a3e8a'],['#e3e8ff','#9fb0ff','#2c3e8f']][n%6];
  var g=x.createLinearGradient(0,0,0,H); g.addColorStop(0,P[0]); g.addColorStop(1,P[1]); x.fillStyle=g; x.fillRect(0,0,W,H);
  x.fillStyle='rgba(255,255,255,.55)'; x.beginPath(); x.arc(W*.78,H*.22,60,0,7); x.fill();
  x.fillStyle='rgba(255,255,255,.35)'; for(var k=0;k<3;k++){ x.beginPath(); x.ellipse(120+k*230,90+k*30,70,22,0,0,7); x.fill(); }
  x.fillStyle='rgba(0,0,0,.12)'; x.fillRect(0,H*.7,W,H*.3);
  x.fillStyle=P[2]; x.globalAlpha=.25; x.fillRect(W*.08,H*.38,W*.34,H*.34); x.beginPath(); x.moveTo(W*.06,H*.38); x.lineTo(W*.25,H*.24); x.lineTo(W*.44,H*.38); x.fill(); x.globalAlpha=1;
  var bil=2+(n%3); for(var i=0;i<bil;i++){ var cx=W*(.3+i*.42/(bil-1||1)), cy=H*.62, s=.9+((n+i)%3)*.12;
    x.fillStyle='#1b1b2f'; x.beginPath(); x.ellipse(cx,cy+130*s,70*s,120*s,0,Math.PI,0); x.fill();
    x.fillStyle='#f2c9a0'; x.beginPath(); x.arc(cx,cy-10*s,34*s,0,7); x.fill();
    x.fillStyle='#1b1b2f'; x.beginPath(); x.moveTo(cx-56*s,cy-42*s); x.lineTo(cx,cy-64*s); x.lineTo(cx+56*s,cy-42*s); x.lineTo(cx,cy-22*s); x.fill();
    x.strokeStyle='#f7c844'; x.lineWidth=4; x.beginPath(); x.moveTo(cx,cy-44*s); x.lineTo(cx+44*s,cy-30*s); x.lineTo(cx+44*s,cy); x.stroke();
    if((n+i)%2){ x.strokeStyle='#1b1b2f'; x.lineWidth=16*s; x.lineCap='round'; x.beginPath(); x.moveTo(cx+40*s,cy+40*s); x.lineTo(cx+70*s,cy-60*s); x.stroke(); } }
  for(var t=0;t<3;t++){ var tx=W*(.15+t*.33), ty=H*(.12+(t%2)*.1); x.save(); x.translate(tx,ty); x.rotate((t-1)*.5); x.fillStyle='#1b1b2f'; x.fillRect(-28,-6,56,12); x.fillStyle='#f7c844'; x.fillRect(20,0,3,22); x.restore(); }
  var cf=['#f7c844','#e0453a','#2aa6a6','#fff','#f28baa']; for(var q=0;q<40;q++){ x.fillStyle=cf[q%5]; x.save(); x.translate(Math.random()*W,Math.random()*H*.6); x.rotate(Math.random()*3); x.fillRect(-4,-7,8,14); x.restore(); }
  return c.toDataURL('image/jpeg',0.8); }
function demoData(){ var d={to:'Nur Aisyah',from:'Mama & Abah',tahun:'2026',uni:'UiTM Shah Alam',kursus:'Ijazah Sarjana Muda Sains',
  k1:'Hana',k2:'Mira',k3:'Danish',k4:'Iqbal',surprise:(lang==='en')?'Proud of you, always 💙':'Bangga dengan kau, selalu 💙',video:'https://www.youtube.com/watch?v=2Vv-BfVoq4g',yt:'',mp3:'',pos:{}};
  for(var i=1;i<=16;i++) d['f'+i]=fotoDemo(i); d.surprise_img=fotoDemo(3); return d; }

    if(!D) return ralat(T('takdePratonton')); $('#badge').style.display=''; mula(); return; }
  if(q.get('demo')==='1'||!id){ D=demoData(); $('#badge').style.display=''; $('#badge').textContent='DEMO'; mula(); return; }
  if(!db) return ralat(T('dbGagal'));
  db.from('cards').select('card_data,paid').eq('id',id).single().then(function(r){
    if(r.error) throw r.error; if(r.data.paid!==true){ ralat(T('belum')); return; }

})();
