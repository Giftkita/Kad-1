<!DOCTYPE html>
<html lang="ms">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Pilih Tema — Kad Hari Jadi 🎂</title>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&family=Dancing+Script:wght@700&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Poppins',sans-serif;background:linear-gradient(135deg,#fce4ec,#f8bbd0,#fce4ec);min-height:100vh;padding:26px 18px 44px}
.g-head{text-align:center;max-width:520px;margin:6px auto 22px}
.g-title{font-family:'Dancing Script',cursive;font-size:2.1rem;color:#c2185b;line-height:1.1}
.g-sub{font-size:.9rem;color:#8a5a6c;margin-top:6px}
.back{display:block;text-align:center;font-size:.8rem;color:#a07;margin-bottom:14px}
.g-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:14px;max-width:720px;margin:0 auto}
.g-card{border-radius:18px;overflow:hidden;background:#fff;border:1.5px solid #ffd6e6;cursor:pointer;transition:.2s;text-decoration:none;display:block}
.g-card:hover{transform:translateY(-3px);box-shadow:0 14px 32px rgba(233,30,99,.18);border-color:#e91e63}
.g-card:active{transform:scale(.97)}
.g-card .gp{height:112px;display:flex;align-items:center;justify-content:center;font-size:2.4rem;position:relative}
.g-card .gm{padding:10px 12px 12px}
.g-card h3{font-size:.92rem;font-weight:600;color:#3a2330}
.g-card span{font-size:.72rem;color:#a07}
.g-badge{position:absolute;top:8px;right:8px;font-size:.55rem;font-weight:700;letter-spacing:.03em;padding:3px 8px;border-radius:50px;z-index:2;background:#e8f7ee;color:#1a9e54}
.g-glow{position:absolute;inset:0;background:radial-gradient(ellipse at 50% 40%,rgba(255,255,255,.25),transparent 60%)}
.gp-scrap{background:#e3a9bd;background-image:repeating-linear-gradient(45deg,rgba(176,58,91,.25),rgba(176,58,91,.25) 8px,transparent 8px,transparent 16px)}
.gp-merah{background:linear-gradient(160deg,#8c0d16,#a8121c 55%,#c4262f)}
.gp-butterfly{background:linear-gradient(160deg,#e8c5c0,#efe4cf 45%,#9bb87a)}
.gp-bloom{background:radial-gradient(ellipse at 50% 60%,#cc1a42,#8e0b2c 70%,#5c0619)}
.g-badge.baru{background:#fff3c4;color:#b86e00;left:8px;right:auto}

#lang{position:absolute;top:14px;right:14px;background:rgba(255,255,255,.9);border:1px solid rgba(0,0,0,.12);
  border-radius:999px;padding:6px 12px;font-size:12px;color:#5a4a42;cursor:pointer;font-family:inherit;z-index:5}
</style>
</head>
<body>
<button id="lang">BM / EN</button>
<a class="back" href="index.html" data-k="back">‹ Kembali ke Homepage</a>
<div class="g-head">
  <h2 class="g-title" data-k="tajuk">Pilih Tema Kad 🎂</h2>
  <p class="g-sub" data-k="sub">Setiap tema ada design tersendiri. Pilih satu untuk mula.</p>
</div>
<div class="g-grid">
  <a class="g-card" href="buat-kad-scrapbook.html">
    <div class="gp gp-scrap"><span class="g-badge" data-k="ada">TERSEDIA</span>📖<div class="g-glow"></div></div>
    <div class="gm"><h3 data-k="n1">Scrapbook</h3><span data-k="d1">Aesthetic</span></div>
  </a>
  <a class="g-card" href="buat-kad-merah.html">
    <div class="gp gp-merah"><span class="g-badge" data-k="ada">TERSEDIA</span>💌<div class="g-glow"></div></div>
    <div class="gm"><h3 data-k="n2">Merah Klasik</h3><span data-k="d2">Elegant</span></div>
  </a>
  <a class="g-card" href="buat-kad-butterfly.html">
    <div class="gp gp-butterfly"><span class="g-badge" data-k="ada">TERSEDIA</span>🦋<div class="g-glow"></div></div>
    <div class="gm"><h3 data-k="n3">Butterfly</h3><span data-k="d3">Rama-rama &amp; surat</span></div>
  </a>
  <a class="g-card" href="buat-kad-bloom.html">
    <div class="gp gp-bloom"><span class="g-badge baru" data-k="baru">BARU</span><span class="g-badge" data-k="ada">TERSEDIA</span>🎁<div class="g-glow"></div></div>
    <div class="gm"><h3 data-k="n4">A Bouquet for You</h3><span data-k="d4">Hadiah bunga &amp; kolaj</span></div>
  </a>
</div>

<script>
/* dwibahasa — kongsi pilihan dengan halaman lain melalui localStorage 'gk_lang' */
var L={
 ms:{title:'Pilih Tema — Kad Hari Jadi 🎂',back:'‹ Kembali ke Homepage',tajuk:'Pilih Tema Kad 🎂',
     sub:'Setiap tema ada design tersendiri. Pilih satu untuk mula.',ada:'TERSEDIA',baru:'BARU',
     n1:'Scrapbook',d1:'Aesthetic',n2:'Merah Klasik',d2:'Elegant',n3:'Butterfly',d3:'Rama-rama &amp; surat',n4:'A Bouquet for You',d4:'Hadiah bunga &amp; kolaj'},
 en:{title:'Choose a Theme — Birthday Card 🎂',back:'‹ Back to Homepage',tajuk:'Choose a Card Theme 🎂',
     sub:'Each theme has its own design. Pick one to start.',ada:'AVAILABLE',baru:'NEW',
     n1:'Scrapbook',d1:'Aesthetic',n2:'Classic Red',d2:'Elegant',n3:'Butterfly',d3:'Butterflies &amp; a letter',n4:'A Bouquet for You',d4:'Flower gift &amp; collage'}
};
var lang='ms'; try{var _l=localStorage.getItem('gk_lang'); if(_l==='en'||_l==='ms') lang=_l;}catch(e){}
function pakai(){
  document.documentElement.lang=lang;
  var d=L[lang];
  [].forEach.call(document.querySelectorAll('[data-k]'),function(el){
    var v=d[el.getAttribute('data-k')]; if(v!=null) el.innerHTML=v;
  });
  if(d.title) document.title=d.title;
}
document.getElementById('lang').onclick=function(){
  lang=(lang==='ms')?'en':'ms';
  try{localStorage.setItem('gk_lang',lang);}catch(e){}
  pakai();
};
pakai();
</script>
<script src="gk-notis.js" defer></script>
</body>
</html>
