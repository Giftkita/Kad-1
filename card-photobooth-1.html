<style>
:root{--ink:#4a1730;--merah:#d7263d;--mustard:#f2b134;--krim:#fff1d6;--teal:#2a9d8f}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;overflow:hidden}
body{font-family:Poppins,sans-serif;color:var(--ink);-webkit-user-select:none;user-select:none;background:#2a0c18}
img{-webkit-user-drag:none;display:block}
button{font-family:inherit}
#laman{position:fixed;inset:0;overflow:hidden;background:#3a1022 center bottom/cover no-repeat;transform-origin:50% 50%;transition:transform 1.1s cubic-bezier(.6,0,.3,1),filter 1.1s}
#laman.zum{filter:brightness(.2)}
#laman>*{position:absolute}
#booth{z-index:5}
#booth>img{width:100%;height:100%;filter:drop-shadow(0 18px 20px rgba(0,0,0,.5));pointer-events:none}
#booth>*{position:absolute}
#papan{display:flex;align-items:center;justify-content:center;font-family:Righteous,Fredoka,sans-serif;color:var(--merah);letter-spacing:.06em;text-shadow:0 2px 0 rgba(122,20,40,.25);white-space:nowrap;border-radius:6%/18%}
#papan.hidup{animation:neon 2.4s infinite}
@keyframes neon{0%,18%,22%,100%{color:var(--merah);text-shadow:0 0 6px rgba(255,120,120,.8),0 0 16px rgba(255,80,100,.55)}20%{color:#e98a96;text-shadow:none}}
#booth::after{content:"";position:absolute;left:8%;right:8%;top:1%;height:17%;border-radius:12%/30%;box-shadow:0 0 40px 10px rgba(255,200,90,.28);pointer-events:none;animation:bulb 1.6s ease-in-out infinite}
@keyframes bulb{50%{box-shadow:0 0 60px 18px rgba(255,200,90,.45)}}
#langsir{transform-origin:6% 0;transition:transform 1s cubic-bezier(.6,0,.3,1);filter:drop-shadow(4px 6px 8px rgba(0,0,0,.4));pointer-events:none}
#langsir.buka{transform:scaleX(.26)}
#klip{overflow:hidden;pointer-events:none}
#klip .jal{position:absolute;left:0;top:0;width:100%}
#koin{z-index:9;cursor:grab;touch-action:none;filter:drop-shadow(0 8px 10px rgba(0,0,0,.45))}
#koin img{width:100%;animation:putar 2.2s linear infinite}
@keyframes putar{0%{transform:rotateY(0)}50%{transform:rotateY(180deg)}100%{transform:rotateY(360deg)}}
#koin.emas img{filter:drop-shadow(0 0 12px rgba(255,220,120,.95)) drop-shadow(0 0 22px rgba(255,190,70,.8))}
#koin.seret img{animation:none}
#koin.tiada{display:none}
.dinding{z-index:4;cursor:pointer;filter:drop-shadow(0 8px 8px rgba(0,0,0,.45))}
.dinding::before{content:"";position:absolute;left:50%;top:-6px;width:34%;height:14px;translate:-50% 0;background:rgba(242,177,52,.85);z-index:2;rotate:-4deg}
#jari{position:fixed;z-index:14;pointer-events:none;font-size:34px;opacity:0;transition:opacity .3s}
#jari.on{opacity:1}
/* atas & bawah */
#atas{position:fixed;left:0;right:0;top:calc(env(safe-area-inset-top,0px) + 86px);z-index:15;text-align:center;padding:0 18px;pointer-events:none;transition:opacity .5s}
.tajuk{font:400 clamp(1.45rem,6.8vw,2.2rem)/1.1 Righteous,Fredoka,sans-serif;color:var(--mustard);text-shadow:0 3px 0 #a3182f,0 0 18px rgba(242,177,52,.55)}
.sub{font:500 clamp(.74rem,3.1vw,.9rem) Poppins,sans-serif;color:var(--krim);margin-top:7px;background:rgba(74,23,48,.6);border:1px solid rgba(242,177,52,.45);display:inline-block;padding:3px 12px;border-radius:999px}
#bawah{position:fixed;left:0;right:0;bottom:calc(env(safe-area-inset-bottom,0px) + 18px);z-index:15;display:flex;flex-direction:column;align-items:center;gap:8px;padding:0 16px;pointer-events:none}

#hint{font:600 clamp(.8rem,3.5vw,.95rem) Poppins,sans-serif;color:var(--ink);background:var(--krim);border:2px solid var(--mustard);border-radius:999px;padding:7px 15px;text-align:center;display:none;box-shadow:0 4px 14px rgba(0,0,0,.35)}

@keyframes apungH{50%{translate:0 -5px}}
.pil{border:0;border-radius:999px;padding:13px 26px;font:400 1rem Righteous,Fredoka,sans-serif;letter-spacing:.03em;cursor:pointer;color:#fff;background:linear-gradient(135deg,#e4344b,#b8233a);box-shadow:0 6px 0 #7a1428,0 10px 22px rgba(0,0,0,.35)}
.pil.p2{background:var(--krim);color:#a3182f;box-shadow:0 5px 0 #d9a84e}

.pil:active{translate:0 3px}
.pil:disabled{opacity:.5}
.btnB{display:flex;gap:10px;flex-wrap:wrap;justify-content:center;margin-top:16px}
#confetti{position:fixed;inset:0;z-index:90;pointer-events:none}
#flash{position:fixed;inset:0;z-index:89;background:#fff;opacity:0;pointer-events:none}
/* dalam booth */
#dalam{position:fixed;inset:0;z-index:30;display:none;flex-direction:column;align-items:center;justify-content:flex-start;padding:calc(env(safe-area-inset-top,0px) + 58px) 16px calc(env(safe-area-inset-bottom,0px) + 18px);background:radial-gradient(ellipse at 50% 28%,#7a1d38,#3a0c1d 60%,#1e0610)}
#dalam.on{display:flex;animation:muncul .6s ease}
@keyframes muncul{from{opacity:0}}
#dalam .tir{position:absolute;top:0;height:100%;width:24vw;max-width:150px;object-fit:cover;object-position:0 0;pointer-events:none;filter:brightness(.75) drop-shadow(0 0 20px rgba(0,0,0,.6))}
#kam{position:relative;flex:none;z-index:2}
#kam>img{width:100%;filter:drop-shadow(0 12px 18px rgba(0,0,0,.5))}

#layar{position:relative;flex:none;margin-top:14px;border-radius:10px;background:#140409;box-shadow:inset 0 0 0 4px #c9b089,0 10px 24px rgba(0,0,0,.5);overflow:hidden;z-index:2;display:flex;align-items:center;justify-content:center}
#layar .ft{position:absolute;inset:0;background:#222 center/cover no-repeat;cursor:zoom-in;animation:muncul .4s}
#layar .kira{font:400 clamp(4rem,24vw,7rem) Righteous,sans-serif;color:var(--mustard);text-shadow:0 0 30px rgba(242,177,52,.8);animation:kira .9s ease-out both}
@keyframes kira{from{scale:2.2;opacity:0}40%{opacity:1}to{scale:.9;opacity:.9}}
#layar .sedia{font:500 .9rem Poppins,sans-serif;color:rgba(255,241,214,.7);text-align:center;padding:10px}
#kapD{position:relative;z-index:2;margin-top:10px;min-height:2.4em;max-width:min(88vw,420px);text-align:center;font:700 clamp(1.2rem,5.4vw,1.6rem)/1.2 Caveat,cursive;color:var(--krim);text-shadow:0 2px 8px rgba(0,0,0,.6)}
#ktD{position:relative;z-index:2;font:400 .8rem Righteous,sans-serif;letter-spacing:.2em;color:var(--mustard);margin-top:6px}
#bSnap{position:relative;z-index:2;margin-top:auto;width:96px;height:96px;border-radius:50%;border:6px solid var(--krim);background:radial-gradient(circle at 35% 30%,#ff6a7a,#d7263d 55%,#9a1426);color:#fff;font:400 1rem Righteous,sans-serif;box-shadow:0 8px 0 #6a0f1e,0 0 0 6px rgba(242,177,52,.35),0 12px 30px rgba(0,0,0,.5);cursor:pointer;flex:none}
#bSnap:active{translate:0 4px;box-shadow:0 4px 0 #6a0f1e}
#bSnap.denyut{animation:denyut 1.4s ease-in-out infinite}
@keyframes denyut{50%{box-shadow:0 8px 0 #6a0f1e,0 0 0 16px rgba(242,177,52,.15),0 12px 30px rgba(0,0,0,.5)}}
#bSnap:disabled{opacity:.55;animation:none}
#bCetak{position:relative;z-index:2;margin-top:auto;display:none}
/* slot gambar */
.slt{position:absolute;overflow:hidden;background:#e8dcc4 center/cover no-repeat}
.slt.nota{display:flex;align-items:center;justify-content:center;text-align:center;background:#fff4dc;padding:6%;font:700 1rem/1.1 Caveat,cursive;color:var(--ink);word-break:break-word}
.slt.kosong{background:#f3e3c2 radial-gradient(circle,#f2b134 0 12%,transparent 13%) center/28% 28%}
.slt.vid::after{content:"▶";position:absolute;left:50%;top:50%;translate:-50% -50%;width:34%;aspect-ratio:1;border-radius:50%;background:rgba(255,255,255,.9);color:var(--merah);display:flex;align-items:center;justify-content:center;font-size:.9em}
.slt .im{position:absolute;inset:0;background:#e8dcc4 center/cover no-repeat}
.cuci{animation:cuci 4.5s ease-out both}
@keyframes cuci{0%{filter:grayscale(1) brightness(1.9) contrast(.35) blur(1px)}45%{filter:grayscale(.2) sepia(.85) brightness(1.2) contrast(.8)}100%{filter:none}}
.gaya1{filter:sepia(.75) contrast(1.05)}.gaya2{filter:grayscale(1) contrast(1.15)}.gaya3{filter:saturate(1.5) hue-rotate(-12deg) brightness(1.05)}
.jal{position:relative}
.jal>img{position:relative;width:100%;z-index:2;pointer-events:none}
.jal .slt{z-index:1}
.jal .cap{position:absolute;left:6%;right:6%;bottom:2.5%;height:15%;z-index:3;display:flex;align-items:center;justify-content:center;text-align:center;font:400 .8rem/1.05 Righteous,sans-serif;color:#a3182f;letter-spacing:.04em;overflow:hidden}
.jal.e .cap{color:#5a2a0a}
/* lapisan */
.lap{position:fixed;inset:0;z-index:80;display:none;align-items:center;justify-content:center;flex-direction:column;padding:16px;background:rgba(30,6,16,.86);-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px)}
.lap.on{display:flex;animation:muncul .35s ease}
.no{font:400 .8rem Righteous,sans-serif;letter-spacing:.22em;color:var(--mustard);margin-bottom:10px;text-align:center}
#jalBox{position:relative;animation:terbang .8s cubic-bezier(.2,1.2,.4,1)}
@keyframes terbang{from{translate:0 40vh;rotate:-12deg;scale:.3}}
#jalBox .jal{filter:drop-shadow(0 16px 26px rgba(0,0,0,.55))}
#jalBox .slt{cursor:zoom-in}
#jalKap{margin-top:12px;color:rgba(255,241,214,.75);font-size:.78rem;text-align:center}
#isiK{position:relative;border-radius:8px;overflow:hidden;box-shadow:0 0 0 8px var(--krim),0 16px 30px rgba(0,0,0,.5);animation:muncul .4s}
#isiK .ft{position:absolute;inset:0;background:#222 center/cover no-repeat}
#isiK.nota{background:#fff4dc;display:flex;align-items:center;justify-content:center;text-align:center;padding:8%;font:700 1.6rem/1.3 Caveat,cursive;color:var(--ink);white-space:pre-line;overflow-y:auto}
#isiKap{margin-top:22px;max-width:min(88vw,420px);text-align:center;font:700 clamp(1.3rem,6vw,1.8rem)/1.2 Caveat,cursive;color:var(--krim);white-space:pre-line}
#vidLap .box{position:relative;width:min(92vw,560px);aspect-ratio:16/9;border-radius:12px;overflow:hidden;background:#000}
#vidLap iframe{position:absolute;inset:0;width:100%;height:100%;border:0}
#senarai{display:flex;gap:14px;flex-wrap:wrap;justify-content:center;max-width:min(92vw,480px)}
#senarai .jal{cursor:pointer;filter:drop-shadow(0 8px 12px rgba(0,0,0,.5))}
#sk2{position:fixed;inset:0;z-index:70;display:none;flex-direction:column;align-items:center;justify-content:center;padding:calc(env(safe-area-inset-top,0px) + 86px) 14px calc(env(safe-area-inset-bottom,0px) + 20px);background:radial-gradient(ellipse at 50% 40%,#6a1a33,#3a0c1d 65%,#1e0610)}
#sk2.on{display:flex;animation:muncul .5s ease}
#sk2 .tajuk{margin-bottom:14px;font-size:clamp(1.3rem,6vw,1.9rem)}
#kadBox{position:relative;animation:naik 1s cubic-bezier(.2,.8,.3,1) both}
@keyframes naik{from{opacity:0;translate:0 80px;rotate:4deg}}
#kadBox>img{width:100%;filter:drop-shadow(0 14px 26px rgba(0,0,0,.5))}
#suratTx{position:absolute;overflow-y:auto;font:600 clamp(1.05rem,4.6vw,1.32rem)/1.38 Caveat,cursive;color:var(--ink);white-space:pre-line;padding:2% 3%;-webkit-overflow-scrolling:touch}
#suratTx .ttd{margin-top:14px;text-align:right;color:#a3182f}
/* umum */
#bhs{position:fixed;top:10px;right:10px;z-index:95;display:flex;background:rgba(255,241,214,.85);border-radius:30px;padding:3px;border:1px solid var(--mustard)}
#bhs button{border:0;background:transparent;color:#a3182f;font:600 .68rem Poppins,sans-serif;padding:5px 11px;border-radius:20px;cursor:pointer}
#bhs button.on{background:var(--merah);color:#fff}
#bMuzik{position:fixed;top:10px;left:10px;z-index:95;width:34px;height:34px;border-radius:50%;border:1px solid var(--mustard);background:rgba(255,241,214,.85);color:#a3182f;font-size:15px;cursor:pointer;display:none}
#bMuzik.on{display:block}#bMuzik.henti{opacity:.5;text-decoration:line-through}
#gk-album-btn{bottom:auto!important;top:calc(env(safe-area-inset-top,0px) + 48px)!important;right:10px!important;padding:8px 12px!important;font-size:.64rem!important}
.tagpv{position:fixed;top:14px;left:50%;translate:-50% 0;z-index:95;background:rgba(242,177,52,.3);color:#fff;font:500 .5rem Poppins,sans-serif;letter-spacing:.18em;padding:4px 10px;border-radius:40px;pointer-events:none}
.gagal{position:fixed;inset:0;z-index:999;display:flex;align-items:center;justify-content:center;padding:24px;text-align:center;background:#2a0c18;font:15px/1.7 Poppins,sans-serif;color:var(--krim)}
#lb{z-index:1000;background:rgba(20,4,10,.96);padding:0;touch-action:none;overflow:hidden}
#lb img{max-width:100vw;max-height:100vh;transform-origin:0 0;will-change:transform;-webkit-user-drag:none}
#lb .tt{position:absolute;left:0;right:0;bottom:calc(env(safe-area-inset-bottom,0px) + 16px);text-align:center;font:italic 12px Poppins,sans-serif;color:rgba(255,255,255,.6);pointer-events:none}
.x{position:fixed;right:14px;top:14px;width:32px;height:32px;border-radius:50%;border:0;background:var(--krim);color:var(--ink);font-size:14px;cursor:pointer;z-index:3}
</style>

function lbTerap(){$('lbimg').style.transform='translate('+LB.x+'px,'+LB.y+'px) scale('+LB.s+')';}
(function(){var lb=$('lb'),im=$('lbimg'),pts={},d0=0,s0=1,c0=null,x0=0,y0=0,gerak=false,lastTap=0,tapT=0;
  function pusat(){var k=Object.keys(pts);if(k.length<2)return null;var a=pts[k[0]],b=pts[k[1]];return{x:(a.x+b.x)/2,y:(a.y+b.y)/2,d:Math.hypot(a.x-b.x,a.y-b.y)};}
  lb.addEventListener('pointerdown',function(e){if(e.target.closest('.x'))return;pts[e.pointerId]={x:e.clientX,y:e.clientY};try{lb.setPointerCapture(e.pointerId);}catch(_){}
    var p=pusat();if(p){d0=p.d;s0=LB.s;c0=p;x0=LB.x;y0=LB.y;}else{x0=LB.x;y0=LB.y;c0={x:e.clientX,y:e.clientY};}gerak=false;tapT=Date.now();});
  lb.addEventListener('pointermove',function(e){if(!pts[e.pointerId])return;pts[e.pointerId]={x:e.clientX,y:e.clientY};var p=pusat();
    if(p){var s=Math.max(1,Math.min(5,s0*p.d/d0));var r=im.getBoundingClientRect();
      /* zum ke arah titik cubit: kekalkan titik bawah jari */
      var px=(c0.x-(x0+im.offsetLeft))/s0,py=(c0.y-(y0+im.offsetTop))/s0;
      LB.s=s;LB.x=p.x-im.offsetLeft-px*s;LB.y=p.y-im.offsetTop-py*s;gerak=true;lbTerap();}
    else if(LB.s>1){var dx=e.clientX-c0.x,dy=e.clientY-c0.y;if(Math.hypot(dx,dy)>6)gerak=true;LB.x=x0+dx;LB.y=y0+dy;lbTerap();}});
  function lepas(e){if(!pts[e.pointerId])return;delete pts[e.pointerId];
    if(Object.keys(pts).length===0){var t=Date.now();
      if(!gerak&&t-tapT<300){if(t-lastTap<320){/* dwiketik: zum 2.5x ke titik / reset */
          if(LB.s>1){LB={s:1,x:0,y:0};}else{var s=2.5,px=e.clientX-im.offsetLeft,py=e.clientY-im.offsetTop;LB={s:s,x:px-px*s,y:py-py*s};}lbTerap();lastTap=0;}
        else{lastTap=t;setTimeout(function(){if(lastTap===t&&LB.s===1)tutupLap('lb');},320);}}
      if(LB.s===1){LB.x=0;LB.y=0;lbTerap();}}
    else{var k=Object.keys(pts)[0];c0={x:pts[k].x,y:pts[k].y};x0=LB.x;y0=LB.y;}}
  lb.addEventListener('pointerup',lepas);lb.addEventListener('pointercancel',lepas);
})();
