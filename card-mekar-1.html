/* 5 — kenangan */
.galeri{display:flex;flex-wrap:wrap;justify-content:center;align-items:center;gap:3.4vmin 3vmin;max-width:min(96vw,160vmin);padding:1vmin 0 4vmin}
.pol2{position:relative;container-type:inline-size;filter:drop-shadow(0 1vmin 1.6vmin rgba(120,80,90,.25));opacity:0}
.pol2.masuk{animation:jatuhPol .7s cubic-bezier(.3,1.4,.5,1) forwards}
@keyframes jatuhPol{0%{opacity:0;transform:translateY(-6vmin) rotate(0) scale(.6)}100%{opacity:1;transform:rotate(var(--r)) scale(1)}}
.pol2 .kp{position:absolute;left:8%;right:8%;display:flex;align-items:center;justify-content:center;text-align:center;font:700 9cqw/1 Caveat,cursive;color:#4a3640;overflow:hidden}
.pol2.lebar .kp{font-size:7cqw}
/* 6 — lagu & video */
.lv{display:flex;align-items:center;justify-content:center;gap:5vmin}
body.potret .lv{flex-direction:column;gap:3vmin}
.tv{position:relative;width:min(48vmin,82vw);aspect-ratio:var(--a);cursor:pointer;animation:pop .7s backwards}
.skrin{position:absolute;overflow:hidden;background:#2f2b45;border-radius:8%/10%}
.skrin img,.skrin iframe{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;border:0}
.skrin img.slaid{opacity:0;transition:opacity .8s}
.skrin img.slaid.on{opacity:1}
.skrin .main{position:absolute;left:50%;top:50%;width:22%;aspect-ratio:1;transform:translate(-50%,-50%);border-radius:50%;background:rgba(201,100,122,.92);border:3px solid #fff;display:flex;align-items:center;justify-content:center;animation:denyut 1.4s infinite;z-index:2}
.skrin .main svg{width:42%;fill:#fff;margin-left:8%}
.muz{display:flex;flex-direction:column;align-items:center;gap:1.4vmin;cursor:pointer}
.muz>img{height:min(30vmin,40vw)}
.muz.main>img{animation:dentum .5s ease-in-out infinite alternate}
@keyframes dentum{to{transform:scale(1.05) rotate(-2deg)}}
.eq{display:flex;align-items:flex-end;gap:5px;height:4.4vmin;opacity:.35}
.muz.main .eq{opacity:1}
.eq i{width:7px;background:#c9647a;border-radius:3px;height:30%}
.muz.main .eq i{animation:eq .8s ease-in-out infinite alternate}
.eq i:nth-child(2){animation-delay:-.3s;background:#8aa6dc}.eq i:nth-child(3){animation-delay:-.6s}.eq i:nth-child(4){animation-delay:-.15s;background:#f7a8b8}.eq i:nth-child(5){animation-delay:-.45s}
@keyframes eq{to{height:100%}}
/* 7 — hadiah */
.hadiah{width:min(32vmin,52vw);animation:pop .7s backwards,goyang 2s ease-in-out 1s infinite}
.hadiah.gegar{animation:gegar .4s}
@keyframes gegar{0%,100%{transform:rotate(0) scale(1)}25%{transform:rotate(-9deg) scale(1.06)}75%{transform:rotate(9deg) scale(1.06)}}
.hadiah.buka{animation:bukaH 1s forwards}
@keyframes bukaH{0%{transform:scale(1)}30%{transform:scale(.85) rotate(-6deg)}60%{transform:scale(1.25) rotate(6deg)}100%{transform:scale(1.1)}}
.kira3{display:flex;gap:10px}
.kira3 i{width:16px;height:16px;border-radius:50%;background:#efdcd6;border:2px solid #fff;box-shadow:0 1px 3px rgba(0,0,0,.15)}
.kira3 i.on{background:#c9647a}
#rumah{position:fixed;left:10px;bottom:max(14px,env(safe-area-inset-bottom));width:46px;height:46px;border-radius:50%;border:3px solid #fff;background:#d8a0ac;color:#fff;font-size:20px;cursor:pointer;box-shadow:0 3px 10px rgba(120,80,90,.35);z-index:1000;display:none}
#rumah.on{display:block;animation:pop .4s}
.hatiT{position:fixed;z-index:1600;pointer-events:none;font-size:18px;animation:hatiT 1s ease-out forwards}
@keyframes hatiT{0%{opacity:1;transform:translate(-50%,-50%) scale(.5)}100%{opacity:0;transform:translate(-50%,-160%) scale(1.3)}}
#alat button{background:#fff;color:#c9647a}
.pop .box{background:#fffaf6;border:4px solid #efdcd6}
.pop h3{font-family:Caveat,cursive;font-style:normal;color:#c9647a;font-size:34px}
</style>
</head>

function fotoDemo(n){ var W=720,H=540,c=document.createElement('canvas'); c.width=W; c.height=H; var x=c.getContext('2d');

  x.fillStyle='rgba(255,255,255,.35)'; x.beginPath(); x.arc(W*(.2+(n%3)*.3),H*.25,90,0,7); x.fill();
  x.fillStyle='rgba(0,0,0,.08)'; x.fillRect(0,H*.78,W,H*.22);
  var X=[W*.38,W*.62], K=[P[2],'#1f3b7a'], R=['#3b2a20','#1d1d1d'];
  for(var i=0;i<2;i++){ var cx=X[i], cy=H*.56, s=i?1.08:1;
    x.fillStyle=K[i]; x.beginPath(); x.ellipse(cx,cy+150*s,82*s,130*s,0,Math.PI,0); x.fill();
    x.fillStyle=R[i]; x.beginPath(); x.arc(cx,cy-12*s,46*s,0,7); x.fill(); if(!i){ x.fillRect(cx-46*s,cy-12*s,92*s,60*s); }
    x.fillStyle='#f2c9a0'; x.beginPath(); x.arc(cx,cy-4*s,36*s,0,7); x.fill(); }
  x.strokeStyle='#f2c9a0'; x.lineWidth=18; x.lineCap='round'; x.beginPath(); x.moveTo(W*.42,H*.86); x.quadraticCurveTo(W*.5,H*.8,W*.58,H*.86); x.stroke();
  function hati(hx,hy,hs,c2){ x.fillStyle=c2; x.beginPath(); x.moveTo(hx,hy+hs*.3); x.bezierCurveTo(hx,hy,hx-hs*.5,hy,hx-hs*.5,hy+hs*.3); x.bezierCurveTo(hx-hs*.5,hy+hs*.6,hx,hy+hs*.8,hx,hy+hs); x.bezierCurveTo(hx,hy+hs*.8,hx+hs*.5,hy+hs*.6,hx+hs*.5,hy+hs*.3); x.bezierCurveTo(hx+hs*.5,hy,hx,hy,hx,hy+hs*.3); x.fill(); }
  hati(W*.5,H*.1,70,'#e8505b'); for(var q=0;q<10;q++) hati(40+Math.random()*(W-80),20+Math.random()*H*.45,14+Math.random()*16,['#fff','#e8505b','#f4acb7'][q%3]);
  x.fillStyle='rgba(0,0,0,.35)'; x.font='bold 28px sans-serif'; for(var m=0;m<4;m++) x.fillText('♪',60+Math.random()*(W-120),40+Math.random()*H*.4);
  return c.toDataURL('image/jpeg',0.8); }
