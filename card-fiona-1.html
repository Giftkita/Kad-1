<!DOCTYPE html>
<html lang="ms">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Fiona — GiftKita</title>
<script src="https://unpkg.com/@supabase/supabase-js@2"></script>
<script>if(!window.supabase){document.write('<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"><\/script>');}</script>
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;overflow:hidden;background:#F2E7D3}
body{font-family:Georgia,'Times New Roman',serif;color:#5b4a3f}
#stage{position:fixed;inset:0;overflow:hidden}

/* ---------- sampul ---------- */
/* z-index 30: atas kad (20) tapi BAWAH medan bunga (50) — kalau lebih tinggi,
   latar krim sampul akan menutup animasi bunga */
#scEnv{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;
  justify-content:center;gap:5vh;z-index:30;background:#F6F0DE;cursor:pointer}
#envImg{width:min(58vw,290px);filter:drop-shadow(0 14px 26px rgba(120,90,70,.22));
  animation:flo 4.5s ease-in-out infinite;will-change:transform}
@keyframes flo{0%,100%{transform:translateY(0) rotate(-.5deg)}50%{transform:translateY(-10px) rotate(.5deg)}}
#tapTxt{font-style:italic;font-size:clamp(14px,3.8vw,19px);color:#c4737b;animation:pul 2.4s ease-in-out infinite}
@keyframes pul{0%,100%{opacity:.55}50%{opacity:1}}

/* ---------- mekar ---------- */
#bloomBg{position:absolute;inset:0;z-index:48;opacity:0;pointer-events:none;
  background:radial-gradient(circle at 50% 50%,#f8dcdd 0%,#f0c6c8 55%,#e3aab0 100%)}
#field{position:absolute;inset:0;z-index:50;pointer-events:none;transform-origin:50% 50%}
.pet{position:absolute;left:50%;top:50%;width:42vmin;transform:translate(-50%,-50%) scale(.04);
  opacity:0;will-change:transform,opacity;backface-visibility:hidden}
.pet.bg{width:64vmin}
#flash{position:absolute;left:50%;top:50%;width:10px;height:10px;border-radius:50%;z-index:52;
  background:radial-gradient(circle,rgba(255,252,240,.95) 0%,rgba(255,245,225,.6) 40%,rgba(255,240,220,0) 70%);
  transform:translate(-50%,-50%) scale(0);opacity:0;pointer-events:none}

/* ---------- kad utama ---------- */
#scCard{position:absolute;inset:0;z-index:20;opacity:0;display:flex;align-items:center;
  justify-content:center;background:#e9c9c4;overflow:hidden}
#cardBd{position:absolute;inset:-4%;width:108%;height:108%;object-fit:cover;filter:blur(14px) saturate(.95)}
#cardWrap{position:relative;width:100%;aspect-ratio:941/1672;max-height:100%;
  max-width:calc(100vh*941/1672);box-shadow:0 10px 40px rgba(90,60,55,.18)}
#cardImg{width:100%;height:100%;object-fit:contain;display:block}
.ov{position:absolute}

#ovHead{left:50%;top:5.2%;transform:translateX(-50%);width:76%;text-align:center;
  font-size:clamp(8px,1.45vh,13px);letter-spacing:.2em;color:#9a8578;text-transform:uppercase}

/* slot gambar (polaroid) — kedudukan ditetapkan oleh SLOT di bawah */
#slotFoto{overflow:hidden;background:#efe6d6;cursor:pointer}
#slotFoto img{width:100%;height:100%;object-fit:cover;display:block}
#slotFoto .kosong{width:100%;height:100%;display:grid;place-items:center;
  font-size:clamp(8px,1.3vh,12px);color:#b9a692;font-style:italic;text-align:center;padding:6%}

/* slot surat (nota mustard) */
#slotNota{overflow:hidden;font-style:italic;line-height:1.46;color:#5c4a3d;padding:2% 3%}
#slotNota.potong{cursor:pointer;
  -webkit-mask-image:linear-gradient(#000 74%,rgba(0,0,0,.15) 96%);
  mask-image:linear-gradient(#000 74%,rgba(0,0,0,.15) 96%)}
#notaLagi{font-size:clamp(7px,1.1vh,10px);color:#8a7767;font-style:italic;display:none}

/* senarai lagu */
#ovTracks{display:flex;flex-direction:column;gap:.45vh}
.trk{display:flex;align-items:center;gap:.7em;border-bottom:1px solid rgba(150,125,110,.26);padding-bottom:.4vh}
.trk:last-child{border-bottom:0}
.trkNo{font-style:italic;font-size:clamp(8px,1.4vh,12px);color:#a08d7e;width:1.6em;flex:none}
.trkTx{flex:1;min-width:0}
.trkTt{font-size:clamp(9px,1.6vh,14px);font-weight:600;color:#4a3b33;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.trkAr{font-size:clamp(7px,1.2vh,11px);color:#9a8578;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.trkBt{width:clamp(20px,3.5vh,30px);aspect-ratio:1;border-radius:50%;border:0;background:#2f5245;
  color:#fff;font-size:clamp(7px,1.2vh,11px);cursor:pointer;display:grid;place-items:center;flex:none}
.trkBt.on{background:#7c3f4a}
#nowPlay{font-size:clamp(7px,1.15vh,11px);color:#9a8578;font-style:italic;min-height:1.2em}

/* butang bawah */
#ovBtn{display:flex;flex-direction:column;align-items:center;gap:.9vh}
#btnAkhir{background:#2f5245;color:#f4ece0;border:0;border-radius:999px;padding:1.35vh 6vw;
  font-size:clamp(8px,1.35vh,12px);letter-spacing:.16em;text-transform:uppercase;
  font-family:inherit;cursor:pointer;white-space:nowrap}
#tools{display:flex;gap:2.4vw;justify-content:center;flex-wrap:wrap}
.tool{background:rgba(255,252,245,.82);border:1px solid rgba(150,125,110,.3);border-radius:999px;
  padding:.75vh 3.2vw;font-size:clamp(7px,1.15vh,11px);color:#6b5a4c;font-family:inherit;cursor:pointer}

/* ---------- lapisan atas ---------- */
#lang{position:fixed;top:calc(10px + env(safe-area-inset-top));right:12px;z-index:80;
  background:rgba(255,252,245,.9);border:1px solid rgba(150,125,110,.3);border-radius:999px;
  padding:6px 12px;font-size:12px;color:#6b5a4c;font-family:inherit;cursor:pointer;display:none}
.pop{position:fixed;inset:0;z-index:90;background:rgba(40,28,26,.86);display:none;
  align-items:center;justify-content:center;padding:18px}
.pop.on{display:flex}
.pop .box{max-width:560px;width:100%;max-height:86vh;overflow:auto;background:#f8f2e4;
  border-radius:16px;padding:20px 18px;position:relative;box-shadow:0 20px 60px rgba(0,0,0,.35)}
.pop .x{position:absolute;top:8px;right:10px;border:0;background:transparent;font-size:24px;
  color:#8a7767;cursor:pointer;line-height:1}
.pop h3{font-size:1.02rem;margin-bottom:10px;color:#4a3b33;padding-right:26px}
.pop p{font-size:.92rem;line-height:1.6;white-space:pre-wrap;color:#5c4a3d}
#lbImg{max-width:100%;max-height:82vh;border-radius:10px;display:block;margin:0 auto}
#vidFrame{width:100%;aspect-ratio:16/9;border:0;border-radius:12px;display:block}
#galeri{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:10px}
#galeri img{width:100%;aspect-ratio:1;object-fit:cover;border-radius:8px;cursor:pointer}
#yt-root{position:fixed;width:1px;height:1px;opacity:0;pointer-events:none;left:-10px;top:-10px}
#gagal{position:fixed;inset:0;z-index:95;display:none;align-items:center;justify-content:center;
  background:#F6F0DE;padding:26px;text-align:center}
#gagal div{max-width:340px;font-size:.95rem;line-height:1.6;color:#6b5a4c}
#badge{position:fixed;left:12px;top:calc(10px + env(safe-area-inset-top));z-index:80;
  background:#c4737b;color:#fff;font-size:11px;letter-spacing:.14em;padding:5px 11px;
  border-radius:999px;display:none;font-family:system-ui,sans-serif}
</style>
</head>

/* ============ util ============ */
function ytId(u){
  if(!u) return '';
  var m=String(u).match(/(?:v=|youtu\.be\/|embed\/|shorts\/)([A-Za-z0-9_-]{11})/);
  return m?m[1]:'';
}
function esc(s){ return String(s==null?'':s).replace(/[&<>"]/g,function(c){
  return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]; }); }

/* ============ muzik — MESTI dipanggil dalam gesture klik ============ */
function stopSemua(){
  if(audio){ try{audio.pause()}catch(e){} audio=null; }
  document.getElementById('yt-root').innerHTML='';
  ytAktif=-1;
  [].forEach.call(document.querySelectorAll('.trkBt'),function(b){ b.classList.remove('on'); b.innerHTML='&#9654;'; });
  var np=document.getElementById('nowPlay'); if(np) np.textContent='';
}
function mainLagu(i){
  var tr=(D.tracks||[])[i]; if(!tr) return;
  var dahMain=(ytAktif===i);
  stopSemua();
  if(dahMain) return;                       /* tekan lagi = berhenti */
  if(tr.mp3){
    try{ audio=new Audio(tr.mp3); audio.loop=true; audio.play(); }catch(e){}
  }else{
    var id=ytId(tr.yt);
    if(id){
      document.getElementById('yt-root').innerHTML=
        '<iframe width="1" height="1" allow="autoplay" src="https://www.youtube.com/embed/'+id+
        '?autoplay=1&loop=1&playlist='+id+'&controls=0&playsinline=1"></iframe>';
    }
  }
  ytAktif=i;
  var b=document.querySelectorAll('.trkBt')[i];
  if(b){ b.classList.add('on'); b.innerHTML='&#10073;&#10073;'; }
  var np=document.getElementById('nowPlay');
  if(np) np.textContent=T('main')+tr.t;
}
function muzik(){ if((D.tracks||[]).length) mainLagu(0); }

/* ============ bina kad ============ */
function bina(){
  document.getElementById('tapTxt').textContent=T('tap');
  document.getElementById('btnAkhir').textContent=T('akhir');
  document.getElementById('lang').style.display='block';

  document.getElementById('ovHead').innerHTML=
    (D.to?esc(T('utk')+' '+D.to):'')+(D.to&&D.from?' &nbsp;·&nbsp; ':'')+(D.from?esc(T('drp')+' '+D.from):'');

  /* gambar dalam bingkai polaroid */
  var sf=document.getElementById('slotFoto');
  if(D.photo){
    sf.innerHTML='<img src="'+D.photo+'" alt="">';
    sf.onclick=function(){ buka('popLb'); document.getElementById('lbImg').src=D.photo; };
  }else{
    sf.innerHTML='<div class="kosong">'+esc(T('kosongFoto'))+'</div>';
  }

  /* surat — auto kecilkan saiz teks supaya muat dalam nota */
  var sn=document.getElementById('slotNota');
  sn.textContent=D.letter||'';
  muatSurat();

  /* senarai lagu */
  var tr=D.tracks||[], h='';
  tr.forEach(function(t,i){
    h+='<div class="trk"><span class="trkNo">'+('0'+(i+1)).slice(-2)+'</span>'+
       '<span class="trkTx"><div class="trkTt">'+esc(t.t)+'</div>'+
       '<div class="trkAr">'+esc(t.a)+'</div></span>'+
       '<button class="trkBt" data-i="'+i+'">&#9654;</button></div>';
  });
  h+='<div id="nowPlay"></div>';
  document.getElementById('ovTracks').innerHTML=h;
  [].forEach.call(document.querySelectorAll('.trkBt'),function(b){
    b.onclick=function(){ mainLagu(+b.getAttribute('data-i')); };
  });

  /* butang kecil */
  var tools=[];
  if(ytId(D.video)) tools.push(['video',function(){
      buka('popVid');
      document.getElementById('vidFrame').src='https://www.youtube.com/embed/'+ytId(D.video)+'?autoplay=1&playsinline=1';
    }]);
  if((D.photos||[]).length) tools.push(['galeri',galeri]);
  if(window.GKAlbum) tools.push(['album',function(){ try{GKAlbum.open&&GKAlbum.open()}catch(e){} }]);
  var th='';
  tools.forEach(function(t,i){ th+='<button class="tool" data-t="'+i+'">'+esc(T(t[0]))+'</button>'; });
  document.getElementById('tools').innerHTML=th;
  [].forEach.call(document.querySelectorAll('.tool'),function(b){
    b.onclick=tools[+b.getAttribute('data-t')][1];
  });

  document.getElementById('btnAkhir').onclick=function(){
    popTeks(T('kejutan'), D.surprise||'');
  };

  /* album PDF — map nama medan ke skema Hari Jadi (album.js dikongsi) */
  try{
    if(window.GKAlbum&&GKAlbum.init){
      var ph=D.photos||[], m={
        title:  D.to?('Songs for you — '+D.to):'Songs for you',
        subtitle: D.from?('From '+D.from):'',
        wishes: D.letter||'',
        cake_img: D.photo||'',
        quote: (D.tracks&&D.tracks[0])?(D.tracks[0].t+' — '+D.tracks[0].a):'',
        author: D.from||'',
        story: (D.tracks||[]).map(function(t,i){return (i+1)+'. '+t.t+' — '+t.a;}).join('\n'),
        story_img: ph[0]||D.photo||'',
        surprise_msg: D.surprise||''
      };
      for(var i=0;i<6;i++) m['p'+(i+1)+'_img']=ph[i]||'';
      GKAlbum.init(m);
    }
  }catch(e){}
}

/* kecilkan teks surat sampai muat; kalau masih panjang, potong + boleh tekan */
function muatSurat(){
  var sn=document.getElementById('slotNota'), lg=document.getElementById('notaLagi');
  if(!sn) return;
  sn.classList.remove('potong'); sn.onclick=null; lg.style.display='none';
  var H=sn.clientHeight; if(!H) return;
  var besar=Math.max(7,Math.min(13.5,H*0.115)), kecil=6.2, pilih=kecil;
  for(var s=besar;s>=kecil;s-=0.3){
    sn.style.fontSize=s.toFixed(2)+'px';

  }
  sn.style.fontSize=pilih.toFixed(2)+'px';
  if(sn.scrollHeight>H+2){
    sn.classList.add('potong');
    lg.textContent=(lang==='ms'?'tekan untuk baca penuh':'tap to read it all');

    sn.onclick=lg.onclick=function(){ popTeks(T('surat'), D.letter||''); };
  }
}

}

function rnd(a,b){ return a+Math.random()*(b-a); }
function petalCount(){ var w=innerWidth; return w<420?22:(w<900?26:30); }
function buildPetals(){
  var field=document.getElementById('field'); field.innerHTML=''; var out=[];
  var VS=Math.max(1,innerHeight/innerWidth)*0.92;
  [[-30,-40],[32,-34],[-34,28],[30,38],[2,-58],[-4,56],[-46,-4],[46,6]].forEach(function(s,i){
    var img=document.createElement('img'); img.className='pet bg'; img.src=SPRITES[(i+2)%SPRITES.length];
    out.push({el:img,dx:s[0]+rnd(-5,5),dy:(s[1]+rnd(-5,5))*VS,rot0:rnd(-40,40),
      rot1:rnd(-40,40)+(Math.random()<.5?-1:1)*rnd(80,200),size:rnd(1.5,2.3),delay:120+rnd(0,260)});
    field.appendChild(img);
  });
  var n=petalCount();
  for(var i=0;i<n;i++){
    var img2=document.createElement('img'); img2.className='pet'; img2.src=SPRITES[i%SPRITES.length];
    var wave=i<n*0.32?0:(i<n*0.68?1:2);
    var ang=(i/n)*Math.PI*2+rnd(-0.35,0.35);
    var rad=[rnd(6,18),rnd(22,38),rnd(40,60)][wave];
    var size=[rnd(.6,.9),rnd(.95,1.35),rnd(1.3,1.95)][wave];
    out.push({el:img2,dx:Math.cos(ang)*rad,dy:Math.sin(ang)*rad*VS,rot0:rnd(-70,70),
      rot1:rnd(-70,70)+(Math.random()<.5?-1:1)*rnd(150,420),size:size,delay:wave*85+rnd(0,220)});
    field.appendChild(img2);
  }
  return out;
}
function animasi(){
  var petals=buildPetals();
  var env=document.getElementById('envImg');
  env.style.animation='none';
  env.animate([{transform:'scale(1) rotate(0deg)'},
    {transform:'scale(.9) rotate(-2deg)',offset:.22},
    {transform:'scale(1.16) rotate(1.5deg)',offset:.5},
    {transform:'scale(2.1) rotate(4deg)',opacity:0}],
    {duration:900,easing:'cubic-bezier(.3,0,.2,1)',fill:'forwards'});
  document.getElementById('tapTxt').animate([{opacity:.8},{opacity:0}],{duration:260,fill:'forwards'});
  document.getElementById('flash').animate(
    [{transform:'translate(-50%,-50%) scale(0)',opacity:0,offset:0},
     {transform:'translate(-50%,-50%) scale(26)',opacity:.9,offset:.25},
     {transform:'translate(-50%,-50%) scale(70)',opacity:0}],
    {duration:900,delay:150,easing:'ease-out',fill:'forwards'});
  document.getElementById('bloomBg').animate(
    [{opacity:0},{opacity:1,offset:.35},{opacity:1,offset:.72},{opacity:0}],
    {duration:2900,delay:200,fill:'forwards'});
  petals.forEach(function(p){
    p.el.animate([
      {transform:'translate(-50%,-50%) translate(0,0) rotate('+p.rot0+'deg) scale(.04)',opacity:0},
      {transform:'translate(-50%,-50%) translate('+p.dx*.42+'vmin,'+p.dy*.42+'vmin) rotate('+((p.rot0+p.rot1)/2)+'deg) scale('+p.size*.72+')',opacity:1,offset:.42},
      {transform:'translate(-50%,-50%) translate('+p.dx+'vmin,'+p.dy+'vmin) rotate('+p.rot1+'deg) scale('+p.size+')',opacity:1}],
      {duration:1500,delay:200+p.delay,easing:'cubic-bezier(.16,.72,.28,1)',fill:'forwards'});
  });
  document.getElementById('field').animate(
    [{transform:'scale(.92) rotate(-7deg)',opacity:1,offset:0},
     {transform:'scale(1.5) rotate(-2deg)',opacity:1,offset:.55},
     {transform:'scale(3.4) rotate(5deg)',opacity:0}],
    {duration:2700,delay:200,easing:'cubic-bezier(.42,0,.72,1)',fill:'forwards'});
  document.getElementById('scCard').animate(
    [{opacity:0,transform:'scale(1.1)'},{opacity:1,transform:'scale(1)'}],
    {duration:900,delay:1900,easing:'cubic-bezier(.2,.6,.2,1)',fill:'forwards'});
  setTimeout(function(){
    document.getElementById('scEnv').style.display='none';
    document.getElementById('field').style.display='none';
    document.getElementById('bloomBg').style.display='none';
  },3000);
}
function bukaKad(){
  if(dahBuka) return; dahBuka=true;
  muzik();                       /* TERUS dalam gesture — jangan lengahkan */
  animasi();
}
document.getElementById('scEnv').addEventListener('click',bukaKad);

/* ============ bahasa ============ */
document.getElementById('lang').onclick=function(){
  lang=(lang==='ms')?'en':'ms';
  try{ localStorage.setItem('gk_lang',lang); }catch(e){}
  var simpan=ytAktif; bina();
  if(simpan>-1){ ytAktif=-1; mainLagu(simpan); }
};
try{ var L=localStorage.getItem('gk_lang'); if(L==='en'||L==='ms') lang=L; }catch(e){}

function gagal(msg){
  document.getElementById('gagalTeks').textContent=msg;
  document.getElementById('gagal').style.display='flex';
  document.getElementById('scEnv').style.display='none';
}
function badge(){ document.getElementById('badge').style.display='block'; }

/* ============ muat data ============ */
(function init(){
  var p=new URLSearchParams(location.search);
  if(p.get('preview')==='1'){
    try{ D=JSON.parse(localStorage.getItem('gk_preview')); }catch(e){ D=null; }
    if(!D||!Object.keys(D).length) D=DEMO;
    bina(); badge(); return;
  }
  var id=p.get('id');
  if(!id){ D=DEMO; bina(); badge(); return; }
  if(!db){ gagal(T('dbGagal')); return; }
  db.from('cards').select('card_data,paid').eq('id',id).single().then(function(r){
    if(r.error) throw r.error;
    if(r.data.paid!==true){ gagal(T('belum')); return; }
    D=r.data.card_data; bina();
  }).catch(function(){ gagal(T('tiada')); });
})();
</script>
