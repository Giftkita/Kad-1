<!--
  GiftKita — Kad Anniversary "Planet Kecil Kita" (template: planet) — idea asal GiftKita (1 Okt 2026)
  Aliran: angkasa berbintang → planet kecil naik → tekan: lagu, pasangan duduk, 8 tempat tumbuh di permukaan
          → seret/anak panah untuk pusing planet; tempat di titik fokus bersinar; tekan = kenangan (polaroid + kapsyen)
          → semua kenangan dibuka: senja, matahari terbenam, bintang berkumpul jadi hati, ucapan → video.
  card_data: template, untuk, dari, pembuka, f1..f6, k1..k6, ucapan, penutup, yt, video, lang
-->
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;overflow:hidden;background:#1f2550;overscroll-behavior:none}
body{font-family:Poppins,sans-serif;color:#fff;-webkit-user-select:none;user-select:none}
img{-webkit-user-drag:none;display:block}
button{font-family:inherit}
#pentas{position:fixed;inset:0;overflow:hidden;touch-action:none}
#langit{position:absolute;inset:0;background:center/cover no-repeat}
#senja{position:absolute;inset:0;background:linear-gradient(0deg,rgba(255,170,120,.7) 0,rgba(255,150,170,.5) 35%,rgba(220,140,200,.18) 60%,rgba(0,0,0,0) 80%);mix-blend-mode:screen;opacity:0;transition:opacity 4.5s ease}
#senja.on{opacity:1}
#bintang{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
#matahari{position:absolute;transform:translate(-50%,-50%);opacity:0;transition:top 7s cubic-bezier(.3,0,.4,1),left 7s cubic-bezier(.3,0,.4,1),opacity 1.5s;filter:drop-shadow(0 0 30px rgba(255,170,110,.9)) drop-shadow(0 0 70px rgba(255,140,120,.6))}
#matahari img{width:100%}
#dunia{position:absolute;transition:transform 2.6s cubic-bezier(.2,.9,.3,1)}
#dunia.turun{transform:translateY(70%)}
#putar{position:absolute;inset:0;will-change:transform}
#planetImg{position:absolute;inset:0;width:100%;height:100%;border-radius:50%}
#bayang{position:absolute;inset:0;border-radius:50%;pointer-events:none;background:radial-gradient(circle at 36% 28%,rgba(255,255,230,.22) 0,rgba(255,255,230,0) 38%),radial-gradient(circle at 50% 50%,rgba(0,0,0,0) 55%,rgba(30,20,70,.38) 100%);box-shadow:0 0 60px 8px rgba(180,170,255,.25)}
.tmp{position:absolute;left:50%;top:50%;transform-origin:50% 100%;cursor:pointer}
.tmp .isi{position:relative;transform:scale(0);transform-origin:50% 100%;transition:transform .7s cubic-bezier(.2,1.6,.4,1),filter .4s}
.tmp.on .isi{transform:scale(1)}
.tmp .isi img{width:100%}
.tmp.fokus .isi{filter:drop-shadow(0 0 10px rgba(255,240,170,.95)) drop-shadow(0 0 22px rgba(255,220,140,.6))}
.tmp .bt{position:absolute;left:50%;top:-22%;transform:translateX(-50%);font-size:clamp(12px,3.6vw,16px);opacity:0;transition:opacity .4s}
.tmp.dah .bt{opacity:1}
.tmp.fokus.ada:not(.dah) .bt{opacity:1;animation:kilau 1.1s ease-in-out infinite}
@keyframes kilau{50%{transform:translateX(-50%) scale(1.35)}}
#pasangan{position:absolute;transform-origin:50% 100%;transition:opacity 1s}
#pasangan img{width:100%;position:absolute;left:0;bottom:0;transition:opacity 1.4s}
#pasangan .b{opacity:0}
#pasangan.bangun .a{opacity:0}#pasangan.bangun .b{opacity:1}
#pasangan.sorok{opacity:0}
#pasangan .naf{position:absolute;inset:0;animation:nafas 3.6s ease-in-out infinite;transform-origin:50% 100%}
@keyframes nafas{50%{transform:scaleY(1.015)}}
/* teks */
#atas{position:absolute;left:0;right:0;top:calc(env(safe-area-inset-top,0px) + 9%);text-align:center;padding:0 22px;pointer-events:none;z-index:20}
#pembuka{font:italic 500 clamp(1.35rem,6.4vw,1.85rem)/1.25 'Cormorant Garamond',serif;color:#f6efff;text-shadow:0 2px 14px rgba(20,10,50,.7);opacity:0;transition:opacity 1.6s}
#pembuka.on{opacity:1}
#nama{font:700 clamp(2.1rem,10.5vw,3rem)/1 Caveat,cursive;color:#fff3c4;text-shadow:0 0 18px rgba(255,230,150,.55),0 2px 10px rgba(20,10,50,.6);opacity:0;transform:translateY(10px);transition:opacity 1.2s,transform 1.2s}
#nama.on{opacity:1;transform:none}
#kiraan{margin-top:8px;display:inline-block;font:600 .74rem Poppins,sans-serif;color:#fff;background:rgba(255,255,255,.14);border:1px solid rgba(255,255,255,.3);padding:5px 12px;border-radius:999px;opacity:0;transition:opacity .6s;backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px)}
#kiraan.on{opacity:1}
#hint{position:absolute;left:50%;bottom:calc(env(safe-area-inset-bottom,0px) + 24px);transform:translateX(-50%);z-index:30;background:rgba(255,255,255,.16);border:1px solid rgba(255,255,255,.35);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);color:#fff;font:500 .76rem Poppins,sans-serif;padding:9px 18px;border-radius:999px;white-space:nowrap;animation:denyutH 1.8s ease-in-out infinite;transition:opacity .5s}
@keyframes denyutH{50%{transform:translateX(-50%) scale(1.06)}}
#hint.off{opacity:0;pointer-events:none}
.anak{position:absolute;bottom:calc(env(safe-area-inset-bottom,0px) + 70px);z-index:30;width:44px;height:44px;border-radius:50%;border:1px solid rgba(255,255,255,.4);background:rgba(255,255,255,.16);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);color:#fff;font-size:1.4rem;cursor:pointer;display:none}
.anak.on{display:block}
#kiri{left:16px}#kanan{right:16px}
/* kad kenangan */
#kenangan{position:fixed;inset:0;z-index:100;display:none;align-items:center;justify-content:center;background:rgba(18,14,44,.6);backdrop-filter:blur(3px);-webkit-backdrop-filter:blur(3px)}
#kenangan.on{display:flex}
#pol{background:#fffaf2;padding:12px 12px 16px;border-radius:4px;box-shadow:0 20px 50px rgba(0,0,0,.45);width:min(78vw,340px);transform:rotate(-2deg);animation:polIn .6s cubic-bezier(.2,1.4,.4,1) both;color:#5a4a6a;text-align:center}
@keyframes polIn{from{transform:translateY(40vh) rotate(-14deg) scale(.6);opacity:0}}
#pol .ft{width:100%;aspect-ratio:1;background:#ddd center/cover;border-radius:2px}
#pol .tk{font:700 clamp(1.25rem,6vw,1.6rem)/1.15 Caveat,cursive;margin-top:10px;min-height:1.2em}
#pol .tp{font:500 .68rem Poppins,sans-serif;letter-spacing:.14em;color:#9a8aa8;text-transform:uppercase;margin-top:4px}
#kenangan .x{position:absolute;top:calc(env(safe-area-inset-top,0px) + 12px);right:14px;width:40px;height:40px;border-radius:50%;border:0;background:rgba(255,255,255,.18);color:#fff;font-size:1.4rem;cursor:pointer}
#kenangan .nota{position:absolute;bottom:calc(env(safe-area-inset-bottom,0px) + 26px);left:0;right:0;text-align:center;font:500 .72rem Poppins,sans-serif;color:rgba(255,255,255,.8)}
/* ucapan */
#kertas{position:absolute;left:5%;right:5%;bottom:calc(env(safe-area-inset-bottom,0px) + 14px);z-index:25;background:rgba(255,250,245,.93);border-radius:18px;padding:18px 18px 16px;color:#5a4a6a;box-shadow:0 12px 40px rgba(20,10,40,.35);transform:translateY(130%);transition:transform 1s cubic-bezier(.2,1,.3,1)}
#kertas.on{transform:none}
#kertas .uc{font:500 clamp(1.1rem,5.2vw,1.35rem)/1.35 Caveat,cursive;white-space:pre-wrap;min-height:4em;max-height:30vh;overflow:auto}
#kertas .uc .kursor{display:inline-block;width:2px;height:1em;background:#9a6ad0;vertical-align:-2px;animation:kelip .7s steps(2) infinite}
@keyframes kelip{to{opacity:0}}
#kertas .ttd{font:700 clamp(1.3rem,6vw,1.7rem) Caveat,cursive;color:#8a5ac8;text-align:right;margin-top:4px}
#kertas .pen{font:italic 600 clamp(1rem,4.6vw,1.2rem) 'Cormorant Garamond',serif;color:#7a5a9a;text-align:center;margin-top:10px;opacity:0;transition:opacity 1.2s}
#kertas .pen.on{opacity:1}
#bVideo{display:none;margin:12px auto 0;border:0;border-radius:999px;padding:11px 22px;font:600 .86rem Poppins,sans-serif;color:#fff;background:linear-gradient(135deg,#ff5a5f,#e5242b);box-shadow:0 8px 20px rgba(229,36,43,.3);cursor:pointer}
#bVideo.on{display:block;animation:muncul .5s both}
@keyframes muncul{from{opacity:0;transform:translateY(10px)}}
/* bahasa, muzik, lapisan */
#bhs{position:fixed;top:calc(env(safe-area-inset-top,0px) + 10px);right:12px;z-index:150;display:flex;background:rgba(255,255,255,.14);border:1px solid rgba(255,255,255,.35);border-radius:999px;overflow:hidden;backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px)}
#bhs button{border:0;background:transparent;color:#fff;padding:7px 12px;font:700 .68rem Poppins,sans-serif;cursor:pointer}
#bhs button.on{background:#fff3c4;color:#3a2f6a}
#bMuzik{position:fixed;top:calc(env(safe-area-inset-top,0px) + 10px);right:112px;z-index:150;width:34px;height:34px;border-radius:50%;border:1px solid rgba(255,255,255,.35);background:rgba(255,255,255,.14);color:#fff;font:700 1rem Poppins,sans-serif;cursor:pointer;display:none;backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px)}
#bMuzik.on{display:block}#bMuzik.main{animation:putarN 3s linear infinite}#bMuzik.henti{opacity:.5}
@keyframes putarN{to{transform:rotate(360deg)}}
.lap{position:fixed;inset:0;z-index:400;background:rgba(10,8,24,.94);display:none;align-items:center;justify-content:center;padding:20px}
.lap.on{display:flex}
.lap .x{position:absolute;top:calc(env(safe-area-inset-top,0px) + 12px);right:14px;width:40px;height:40px;border-radius:50%;border:0;background:rgba(255,255,255,.15);color:#fff;font-size:1.3rem;cursor:pointer;z-index:2}
#vidKotak{width:100%;max-width:640px;aspect-ratio:16/9;background:#000;position:relative;border-radius:8px;overflow:hidden}
#vidKotak iframe{position:absolute;inset:0;width:100%;height:100%;border:0}
.tagpv{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom,0px) + 4px);transform:translateX(-50%);z-index:160;background:rgba(0,0,0,.55);color:#fff;font:700 .58rem Poppins,sans-serif;letter-spacing:.14em;padding:4px 12px;border-radius:999px;pointer-events:none}
.gagal{position:fixed;inset:0;z-index:999;display:flex;align-items:center;justify-content:center;padding:24px;text-align:center;background:#1f2550;font:15px/1.7 Poppins,sans-serif;color:#fff}
#gk-album-btn{bottom:auto!important;top:calc(env(safe-area-inset-top,0px) + 54px)!important;right:10px!important;padding:8px 12px!important;font-size:.64rem!important}
</style>
</head>
<body>
<div id="bhs"><button data-l="ms">BM</button><button data-l="en">EN</button></div>

<div id="yt-root" style="position:fixed;left:-9999px;top:0;width:1px;height:1px;overflow:hidden"></div>

<div id="pentas">

  <div id="matahari"><img alt="" id="matahariImg"></div>

  </div>
  <div id="atas"><div id="pembuka"></div><div id="nama"></div><div id="kiraan"></div></div>
  <button class="anak" id="kiri" aria-label="kiri">‹</button><button class="anak" id="kanan" aria-label="kanan">›</button>
  <div id="kertas"><div class="uc" id="uc"></div><div class="ttd" id="ttd"></div><div class="pen" id="pen"></div><button id="bVideo" onclick="bukaVideo()"></button></div>
  <div id="hint"></div>
</div>

<div id="kenangan"><button class="x" onclick="tutupKenangan()">×</button><div id="pol"><div class="ft" id="kFt"></div><div class="tk" id="kTk"></div><div class="tp" id="kTp"></div></div><div class="nota" id="kNota"></div></div>

(function(){var P=$('pentas');
