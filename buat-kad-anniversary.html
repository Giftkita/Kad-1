<!DOCTYPE html>
<html lang="ms">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Pilih Tema — Anniversary 💑</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600&family=Poppins:wght@400;500;600&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Poppins',sans-serif;background:linear-gradient(135deg,#f6ece2,#eee0cd);min-height:100vh;padding:26px 18px 44px}
.back{display:block;text-align:center;font-size:.8rem;color:#8a6a3f;margin-bottom:14px;text-decoration:none}
.g-head{text-align:center;max-width:520px;margin:6px auto 24px}
.g-title{font-family:'Playfair Display',serif;font-size:2rem;color:#6b4a1e;line-height:1.15}
.g-sub{font-size:.88rem;color:#8a7355;margin-top:8px}
.g-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:16px;max-width:640px;margin:0 auto}
.g-card{border-radius:18px;overflow:hidden;background:#fff;border:1.5px solid #e4d6bd;cursor:pointer;transition:.2s;text-decoration:none;display:block}
.g-card:hover{transform:translateY(-3px);box-shadow:0 14px 32px rgba(107,74,30,.16);border-color:#c9a24b}
.g-card:active{transform:scale(.97)}
.g-card .gp{height:130px;display:flex;align-items:center;justify-content:center;font-size:2.4rem;position:relative}
.g-card .gm{padding:12px 14px 14px}
.g-card h3{font-size:1rem;font-weight:600;color:#3a2f12;font-family:'Playfair Display',serif}
.g-card span{font-size:.74rem;color:#8a7355}
.g-badge{position:absolute;top:8px;right:8px;font-size:.55rem;font-weight:700;letter-spacing:.03em;padding:3px 8px;border-radius:50px;z-index:2;background:#e8f7ee;color:#1a9e54}
.g-glow{position:absolute;inset:0;background:radial-gradient(ellipse at 50% 40%,rgba(255,255,255,.2),transparent 60%)}
.gp-ourstory{background:linear-gradient(160deg,#8e1224,#c9223c 55%,#f26d8f)}
.gp-suratcinta{background:linear-gradient(160deg,#0a1a2f,#13294b 55%,#4a6fa5)}
.gp-fiona{background:linear-gradient(160deg,#4f6042,#8fa07d 52%,#e8c5c0)}

#lang{position:absolute;top:14px;right:14px;background:rgba(255,255,255,.9);border:1px solid rgba(0,0,0,.12);
  border-radius:999px;padding:6px 12px;font-size:12px;color:#5a4a42;cursor:pointer;font-family:inherit;z-index:5}
</style>
</head>
<body>
<button id="lang">BM / EN</button>
<a class="back" href="index.html" data-k="back">‹ Kembali ke Homepage</a>
<div class="g-head">
  <h2 class="g-title" data-k="tajuk">Pilih Tema Anniversary 💑</h2>
  <p class="g-sub" data-k="sub">Tiga gaya berbeza — pilih yang paling sesuai dengan cerita korang.</p>
</div>
<div class="g-grid">
  <a class="g-card" href="buat-kad-anniversary-ourstory.html">
    <div class="gp gp-ourstory"><span class="g-badge" data-k="ada">TERSEDIA</span>📔<div class="g-glow"></div></div>
    <div class="gm"><h3 data-k="n1">Our Story</h3><span data-k="d1">Buku diari — selak macam album</span></div>
  </a>
  <a class="g-card" href="buat-kad-suratcinta.html">
    <div class="gp gp-suratcinta"><span class="g-badge" data-k="ada">TERSEDIA</span>💌<div class="g-glow"></div></div>
    <div class="gm"><h3 data-k="n2">A Special Letter</h3><span data-k="d2">Surat cinta — scroll &amp; buka sampul</span></div>
  </a>
  <a class="g-card" href="buat-kad-fiona.html">
    <div class="gp gp-fiona"><span class="g-badge" data-k="ada">TERSEDIA</span>📼<div class="g-glow"></div></div>
    <div class="gm"><h3 data-k="n3">Fiona</h3><span data-k="d3">Mixtape — sampul, bunga mekar &amp; lagu</span></div>
  </a>
</div>

<script>
/* dwibahasa — kongsi pilihan dengan halaman lain melalui localStorage 'gk_lang' */
var L={
 ms:{title:'Pilih Tema — Anniversary 💑',back:'‹ Kembali ke Homepage',tajuk:'Pilih Tema Anniversary 💑',
     sub:'Tiga gaya berbeza — pilih yang paling sesuai dengan cerita korang.',ada:'TERSEDIA',baru:'BARU',
     n1:'Our Story',d1:'Buku diari — selak macam album',
     n2:'A Special Letter',d2:'Surat cinta — scroll &amp; buka sampul',
     n3:'Fiona',d3:'Mixtape — sampul, bunga mekar &amp; lagu'},
 en:{title:'Choose a Theme — Anniversary 💑',back:'‹ Back to Homepage',tajuk:'Choose an Anniversary Theme 💑',
     sub:'Three different styles — pick the one that fits your story.',ada:'AVAILABLE',baru:'NEW',
     n1:'Our Story',d1:'A diary book — flip it like an album',
     n2:'A Special Letter',d2:'A love letter — scroll &amp; open the envelope',
     n3:'Fiona',d3:'Mixtape — envelope, blooming flowers &amp; a song'}
};
var lang='ms'; try{var _l=localStorage.getItem('gk_lang'); if(_l==='en'||_l==='ms') lang=_l;}catch(e){}
function pakai(){
  document.documentElement.lang=lang;
  var d=L[lang];
  [].forEach.call(document.querySelectorAll('[data-k]'),function(el){
    var v=d[el.getAttribute('data-k')]; if(v!=null) el.innerHTML=v;
  });
  if(d.title) document.title=d.title;
}
document.getElementById('lang').onclick=function(){
  lang=(lang==='ms')?'en':'ms';
  try{localStorage.setItem('gk_lang',lang);}catch(e){}
  pakai();
};
pakai();
</script>
</body>
</html>
