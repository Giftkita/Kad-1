#pentas{position:fixed;container-type:inline-size}
#pentas>*{position:absolute}
.ob{filter:drop-shadow(0 .9cqw 1.2cqw rgba(80,50,30,.28));cursor:pointer}
.ob img.x{pointer-events:none}
.ob:active{transform:scale(.97)}
#menuK .mt{position:absolute;inset:0;container-type:inline-size;display:flex;flex-direction:column;align-items:center;text-align:center;padding-top:12%}
#menuK .bul{width:44%;aspect-ratio:1;border-radius:50%;overflow:hidden;border:1.4cqw solid #fff;box-shadow:0 1cqw 2cqw rgba(0,0,0,.18);position:relative;background:#f4b6c2}
#menuK .bul img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
#menuK h1{font:italic 700 15cqw/1 'Playfair Display',serif;color:#6b4226;margin-top:6cqw}
#menuK p{font:700 8.4cqw/1.1 Caveat,cursive;color:#c2456a;margin-top:2cqw}
#menuK small{font:700 4.6cqw/1.2 'Courier Prime',monospace;color:#a08a74;letter-spacing:.2em;margin-top:5cqw}
#cawan{transition:left .9s cubic-bezier(.5,.1,.3,1),opacity .4s;cursor:default}
#cawan .kopi{position:absolute;overflow:hidden;border-radius:50%;background:radial-gradient(circle at 50% 50%,#c8955a 0 16%,#93603a 42%,#5f3a22 70%,#3f2616);-webkit-mask-size:100% 100%;mask-size:100% 100%}
#cawan .susu{position:absolute;inset:6%;border-radius:50%;background:radial-gradient(circle,#fff8ee 0 55%,#f1dcbf 70%,rgba(241,220,191,0) 74%);transform:scale(0);transition:transform 1.5s cubic-bezier(.2,.7,.3,1)}
#cawan .hati{position:absolute;inset:9%;transform:scale(0) rotate(-20deg);opacity:0;transition:transform 1.1s cubic-bezier(.3,1.5,.5,1),opacity .4s}
#cawan.tuang .susu{transform:scale(1)}
#cawan.seni .hati{transform:scale(1) rotate(0);opacity:1}
#cawan .aliran{position:absolute;left:47.5%;width:5%;top:-40%;height:0;border-radius:99px;background:linear-gradient(180deg,rgba(255,250,240,0),#fff8ee 30%);opacity:0}
#cawan.tuang .aliran{animation:alir 1.5s ease-in-out}
@keyframes alir{0%{height:0;opacity:1}30%{height:88%;opacity:1}80%{height:88%;opacity:1;top:-40%}100%{height:0;top:48%;opacity:0}}
.wap{position:absolute;width:12%;height:40%;border-radius:50%;background:radial-gradient(ellipse,rgba(255,255,255,.75),rgba(255,255,255,0) 70%);filter:blur(1.2cqw);opacity:0;pointer-events:none}
#cawan.seni .wap{animation:wap 3.4s ease-out infinite}
@keyframes wap{0%{transform:translateY(0) scaleX(1);opacity:0}25%{opacity:.85}100%{transform:translateY(-120%) scaleX(1.8);opacity:0}}
#tablet .skrin{position:absolute;overflow:hidden;background:#2a1f1c}
#tablet .skrin img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;opacity:.92}
#tablet .main{position:absolute;left:50%;top:50%;width:22%;aspect-ratio:1;transform:translate(-50%,-50%);border-radius:50%;background:rgba(194,69,106,.92);border:.5cqw solid #fff;display:flex;align-items:center;justify-content:center;animation:denyutTv 1.6s infinite}
#tablet .main svg{width:42%;fill:#fff;margin-left:8%}
@keyframes denyutTv{0%{box-shadow:0 0 0 0 rgba(194,69,106,.6)}70%{box-shadow:0 0 0 2.4cqw rgba(194,69,106,0)}100%{box-shadow:0 0 0 0 rgba(194,69,106,0)}}
#printer{z-index:4}
#printer.cetak{animation:getar .12s linear 10}
@keyframes getar{50%{transform:translateX(.25cqw)}}
#kertasR{position:absolute;overflow:hidden;z-index:3;pointer-events:none}
#kertasR img{position:absolute;left:0;width:100%;bottom:0;transform:translateY(100%);transition:transform 1.6s steps(12)}
#kertasR.naik img{transform:translateY(0)}
#tudung{z-index:6;transition:transform 1s cubic-bezier(.4,0,.3,1),opacity 1s;cursor:pointer}
#tudung.angkat{transform:translate(18cqw,-26cqw) rotate(18deg) scale(1.08);opacity:0;pointer-events:none}
#tudung:not(.angkat){animation:kilat 3s ease-in-out infinite}
@keyframes kilat{0%,100%{filter:drop-shadow(0 .8cqw 1cqw rgba(80,50,30,.25)) brightness(1)}50%{filter:drop-shadow(0 .8cqw 1cqw rgba(80,50,30,.25)) brightness(1.12)}}
#tent .tt{position:absolute;left:8%;right:30%;top:16%;bottom:16%;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;container-type:inline-size}
#tent b{font:400 9.4cqw/1 'Bebas Neue',sans-serif;color:#c2456a;letter-spacing:.14em}
#tent span{font:700 13cqw/1.05 Caveat,cursive;color:#6b4226;margin-top:2cqw}
/* menu besar */
.menuB{position:relative;animation:terbang .6s cubic-bezier(.3,1.4,.5,1) backwards;filter:drop-shadow(0 1.4vmin 2.4vmin rgba(0,0,0,.4))}
.menuB .mi{position:absolute;left:10%;right:10%;top:7%;bottom:6%;container-type:inline-size;display:flex;flex-direction:column}
.menuB h2{font:italic 700 12cqw/1 'Playfair Display',serif;color:#6b4226;text-align:center}
.menuB .s{font:700 6.4cqw/1.1 Caveat,cursive;color:#c2456a;text-align:center;margin:1cqw 0 2.4cqw}
.menuB .gr{border-top:.5cqw double #c9a35a;margin-bottom:1.4cqw}
.item{display:flex;align-items:flex-start;gap:2cqw;padding:2cqw 1.6cqw;border-radius:2cqw;cursor:pointer;transition:background .2s}
.item:active,.item:hover{background:rgba(244,182,194,.28)}
.item .no{font:400 6.4cqw/1 'Bebas Neue',sans-serif;color:#c9a35a;width:7cqw;flex:none}
.item .b{flex:1;min-width:0}
.item .nm{display:flex;font:700 4.6cqw/1.2 'Courier Prime',monospace;color:#6b4226;text-transform:uppercase;letter-spacing:.06em}
.item .nm i{flex:1;border-bottom:.5cqw dotted #c9b8a2;margin:0 1.6cqw .9cqw}
.item .nm em{font-style:normal;color:#c2456a}
.item .kp{font:700 5.8cqw/1.1 Caveat,cursive;color:#3a2a24;margin-top:.6cqw}
.item.dah .nm{color:#a08a74}.item.dah em:after{content:' ✓';color:#7fa07a}
/* resit */
.resit{position:relative;container-type:inline-size;animation:cetakR 1s cubic-bezier(.3,1.1,.5,1) backwards;filter:drop-shadow(0 1.4vmin 2.4vmin rgba(0,0,0,.35))}

  for(var i=0;i<n;i++){ var t=i/n; d[i]=(Math.random()*2-1)*.18*Math.sin(Math.PI*t); }
  var s=a.createBufferSource(), f=a.createBiquadFilter(); f.type='bandpass'; f.frequency.value=1400; f.Q.value=.8; s.buffer=b; s.connect(f); f.connect(a.destination); s.start(); }

  for(var i=0;i<14;i++){ var o=a.createOscillator(), g=a.createGain(); o.type='square'; o.frequency.value=180+(i%3)*40; g.gain.setValueAtTime(.05,t+i*.11); g.gain.exponentialRampToValueAtTime(.001,t+i*.11+.08); o.connect(g); g.connect(a.destination); o.start(t+i*.11); o.stop(t+i*.11+.09); }
  var o2=a.createOscillator(), g2=a.createGain(); o2.frequency.value=1760; g2.gain.setValueAtTime(.12,t+1.7); g2.gain.exponentialRampToValueAtTime(.001,t+2.3); o2.connect(g2); g2.connect(a.destination); o2.start(t+1.7); o2.stop(t+2.35); }

    x.fillStyle=R[i]; x.beginPath(); x.arc(cx,cy-12*s,46*s,0,7); x.fill(); if(!i){ x.fillRect(cx-46*s,cy-12*s,92*s,60*s); }
