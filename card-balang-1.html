<html lang="ms">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Balang Seribu Sebab 🫙</title>
<script src="https://unpkg.com/@supabase/supabase-js@2"></script>
<script>if(!window.supabase){document.write('<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"><\/script>');}</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Caveat:wght@600;700&family=Poppins:wght@400;500;600&display=swap" rel="stylesheet">
<!--
  GiftKita — Kad Love Letter "Balang Seribu Sebab" (template: balang) — reka sendiri (27 Sep 2026)
  Aliran: meja malam + lampu kelip + balang penuh bintang kertas → buka penutup (muzik) → goncang phone / ketik balang →
          satu kertas terbang keluar ke meja → ketik → nota "Sebab #n" / polaroid / video → simpan ke timbunan (kaunter) →
          balang kosong → kelip-kelip terbang keluar → kejutan (polaroid) → surat penuh.
  card_data: template, nama, pengirim, s1_teks..s20_teks, s1_img..s20_img (+_pos), video, surat, surprise_img (+_pos), surprise, yt|mp3, lang
-->
<style>
:root{--kuning:#ffd98a;--krim:#fff3dc}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;overflow:hidden}
body{font-family:Poppins,sans-serif;color:var(--krim);-webkit-user-select:none;user-select:none;background:#1c1220}
img{-webkit-user-drag:none;display:block}
button{font-family:inherit}
#latar{position:fixed;inset:0;background:radial-gradient(ellipse 80% 55% at 50% 58%,#5a3440 0%,#3a2232 45%,#1c1220 100%);overflow:hidden}
.bokeh{position:absolute;border-radius:50%;background:radial-gradient(circle,rgba(255,210,140,.55),rgba(255,210,140,0) 70%);animation:bok var(--d,6s) ease-in-out infinite}
@keyframes bok{50%{opacity:.35;transform:scale(1.2)}}
.sk{position:fixed;inset:0;display:none;overflow:hidden}
.sk.on{display:block}
#tabir{position:fixed;inset:0;z-index:500;background:#1c1220;opacity:0;pointer-events:none;transition:opacity .5s}
#tabir.on{opacity:1;pointer-events:auto}
.skrip{font:700 clamp(1.9rem,9vw,2.7rem)/1.05 Caveat,cursive;color:var(--kuning);text-align:center;text-shadow:0 0 18px rgba(255,200,110,.5)}
.sub{font:500 clamp(.74rem,3.1vw,.9rem) Poppins,sans-serif;color:#e8cfc4;text-align:center;margin-top:6px}
.pil{border:0;border-radius:999px;padding:13px 28px;font:600 .95rem Fredoka,Poppins,sans-serif;cursor:pointer;background:linear-gradient(135deg,#ffe2a6,#f0a987);color:#3a1f2c;box-shadow:0 0 22px rgba(255,200,130,.45);animation:denyut 1.8s ease-in-out infinite}
.pil.p2{background:rgba(255,255,255,.12);color:var(--krim);box-shadow:none;border:1px solid rgba(255,217,138,.5);animation:none}
.pil:active{scale:.95}
@keyframes denyut{50%{scale:1.05}}
@keyframes apung{50%{translate:0 -8px}}

/* 1 — meja */
#atas{position:absolute;left:0;right:0;top:calc(env(safe-area-inset-top,0px) + 50px);z-index:20;padding:0 18px;pointer-events:none}
#atas .pil{pointer-events:auto}
#kaunter{display:none;margin:10px auto 0;width:max-content;background:rgba(255,255,255,.12);border:1px solid rgba(255,217,138,.35);border-radius:999px;padding:6px 14px;font:600 .78rem Fredoka,Poppins,sans-serif;color:var(--krim)}
#kaunter.on{display:block}
#pentas{position:absolute;left:50%;bottom:0;translate:-50% 0}
#pentas>*{position:absolute}
#lampu{left:-4%;width:108%;top:0;transform-origin:50% 0;animation:ayun 6s ease-in-out infinite;z-index:3}
#lampu img{width:100%;filter:drop-shadow(0 0 6px rgba(255,210,130,.6))}
#lampu .mt{position:absolute;width:5%;aspect-ratio:1;translate:-50% -50%;border-radius:50%;background:radial-gradient(circle,rgba(255,236,170,.95),rgba(255,210,120,0) 70%);animation:kelip var(--d,2.4s) ease-in-out infinite;mix-blend-mode:screen}
@keyframes ayun{50%{rotate:1.2deg}}
@keyframes kelip{0%,100%{opacity:.25;scale:.7}50%{opacity:1;scale:1.25}}
#meja{left:-12%;width:124%;bottom:0;z-index:1}
#balangBox{z-index:5;cursor:pointer}
#balangBox>img.kaca{position:relative;width:100%;z-index:3;pointer-events:none}
#balangBox::before{content:"";position:absolute;left:0;right:0;bottom:-3%;height:8%;border-radius:50%;background:radial-gradient(ellipse,rgba(20,8,12,.55),rgba(20,8,12,0) 70%);z-index:0}
#sinar{position:absolute;left:5%;right:5%;top:24%;bottom:6%;border-radius:22%/16%;background:radial-gradient(ellipse at 50% 70%,rgba(255,220,150,.28),rgba(255,220,150,0) 70%);z-index:1;transition:background 1.5s}
#balangBox.terang #sinar{background:radial-gradient(ellipse at 50% 60%,rgba(255,244,170,.75),rgba(255,220,150,.1) 75%)}
#isi{position:absolute;left:5%;width:90%;top:22%;height:73%;border-radius:0 0 26% 26%/0 0 16% 16%;overflow:hidden;z-index:2}
#isi img{position:absolute;filter:brightness(.92) saturate(.95);transition:translate .6s cubic-bezier(.3,1.4,.5,1)}
#balangBox.goyang{animation:goyang .55s ease-in-out}
@keyframes goyang{20%{rotate:-6deg}45%{rotate:5deg}70%{rotate:-3deg}90%{rotate:1.5deg}}
#balangBox{transform-origin:50% 96%}
#penutup{z-index:6;pointer-events:none;transition:none}
#tag{z-index:7;transform-origin:30% 4%;animation:tagAyun 4s ease-in-out infinite;pointer-events:none}
#tag img{width:100%}
#tag .tx{position:absolute;left:3%;right:39%;top:42%;bottom:8%;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;color:#5b3a22}
#tag .tx b{font:700 1rem/.95 Caveat,cursive}
#tag .tx i{font:600 .6rem/1.1 Poppins,sans-serif;font-style:normal;margin-top:3px;opacity:.8}
@keyframes tagAyun{50%{rotate:4deg}}
#timbun{z-index:8;cursor:pointer;display:none}
#timbun.on{display:block}
#timbun img{position:absolute;width:100%;filter:drop-shadow(0 3px 4px rgba(0,0,0,.35))}
#timbun .bil{position:absolute;right:-8%;top:-10%;min-width:24px;height:24px;border-radius:12px;padding:0 6px;background:#f08aa3;color:#fff;font:700 .72rem/24px Fredoka,sans-serif;text-align:center;z-index:2}
.jatuh{position:fixed;z-index:60;pointer-events:none;filter:drop-shadow(0 4px 6px rgba(0,0,0,.35))}
#turun{z-index:9;cursor:pointer;display:none;translate:-50% -50%}
#turun.on{display:block;animation:denyut 1.3s ease-in-out infinite}
#turun img{width:100%;filter:drop-shadow(0 0 10px rgba(255,230,160,.9))}
#turunLbl{position:absolute;left:50%;bottom:112%;translate:-50% 0;white-space:nowrap;background:linear-gradient(135deg,#ffe2a6,#f0a987);color:#3a1f2c;border-radius:999px;padding:6px 12px;font:600 .74rem Fredoka,Poppins,sans-serif;box-shadow:0 0 14px rgba(255,200,130,.5)}
#turunLbl::after{content:"";position:absolute;left:50%;bottom:-6px;margin-left:-6px;border:6px solid transparent;border-bottom:0;border-top-color:#f4b890}
#bawah{position:absolute;left:0;right:0;bottom:calc(env(safe-area-inset-bottom,0px) + 22px);z-index:20;display:flex;flex-direction:column;align-items:center;gap:8px;padding:0 16px;pointer-events:none}
#bawah .pil{pointer-events:auto}
#hint{margin:10px auto 0;width:max-content;max-width:92%;font:600 clamp(.8rem,3.5vw,.95rem) Fredoka,Poppins,sans-serif;color:var(--krim);background:rgba(28,18,32,.55);border-radius:999px;padding:7px 15px;text-align:center;display:none;-webkit-backdrop-filter:blur(4px);backdrop-filter:blur(4px)}
#hint.on{display:block;animation:apung 2.4s ease-in-out infinite}
.kk{position:absolute;z-index:40;width:9px;height:9px;border-radius:50%;background:#fff6b8;box-shadow:0 0 8px 3px rgba(255,236,140,.85),0 0 22px 8px rgba(210,255,140,.35);pointer-events:none}

/* lapisan */
.lap{position:fixed;inset:0;z-index:80;display:none;align-items:center;justify-content:center;flex-direction:column;padding:16px;background:rgba(20,10,18,.72);-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px)}
.lap.on{display:flex;animation:muncul .35s ease}
@keyframes muncul{from{opacity:0}}
.no{font:600 .72rem Poppins,sans-serif;letter-spacing:.2em;color:#f2c6b4;margin-bottom:10px;text-align:center}
.buka{position:relative;animation:bukaK .7s cubic-bezier(.2,1.2,.4,1)}
@keyframes bukaK{from{scale:.2 .05;rotate:-12deg;opacity:0}60%{scale:1.03 .9}}
.buka>img.bg{width:100%;height:100%;filter:drop-shadow(0 10px 22px rgba(0,0,0,.45))}
.buka .sl{position:absolute}
.nTx{display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;overflow-y:auto;color:#5a3242;padding:2%}
.nTx .h{font:700 .7rem Poppins,sans-serif;letter-spacing:.22em;color:#c0708a;margin-bottom:8px}
.nTx .t{font:700 1.6rem/1.25 Caveat,cursive;white-space:pre-line;word-break:break-word}
.ft{background:#2a1a24 center/cover no-repeat;cursor:zoom-in}
.ft .main{position:absolute;left:50%;top:50%;width:62px;height:62px;margin:-31px 0 0 -31px;border-radius:50%;background:rgba(255,255,255,.9)}
.ft .main::after{content:"";position:absolute;left:25px;top:19px;border:12px solid transparent;border-left:20px solid #e0607e;border-right:0}
.kapP{position:absolute;left:6%;right:6%;display:flex;align-items:center;justify-content:center;text-align:center;font:700 clamp(1rem,4.6vw,1.35rem)/1.15 Caveat,cursive;color:#5a3242;overflow:hidden;white-space:pre-line}
.btnB{display:flex;gap:10px;flex-wrap:wrap;justify-content:center;margin-top:16px}
#senarai{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;max-width:min(88vw,380px);width:100%}
#senarai button{aspect-ratio:1;border:0;border-radius:14px;background:rgba(255,243,220,.12) center/60% no-repeat;border:1px solid rgba(255,217,138,.3);color:var(--krim);font:700 .95rem Fredoka,sans-serif;cursor:pointer;display:flex;align-items:flex-end;justify-content:center;padding-bottom:6px}
#vidLap .box{position:relative;width:min(92vw,560px);aspect-ratio:16/9;border-radius:12px;overflow:hidden;background:#000}
#vidLap iframe{position:absolute;inset:0;width:100%;height:100%;border:0}

/* 2 — surat */
#sk2{display:none;flex-direction:column;align-items:center;justify-content:center;padding:calc(env(safe-area-inset-top,0px) + 54px) 14px calc(env(safe-area-inset-bottom,0px) + 20px)}
#sk2.on{display:flex}
#sk2 .skrip{font-size:clamp(1.5rem,7vw,2.1rem);margin-bottom:10px}
#suratBox{position:relative;animation:naik 1s cubic-bezier(.2,.8,.3,1) both}
@keyframes naik{from{opacity:0;translate:0 80px}}
#suratBox>img{width:100%;filter:drop-shadow(0 12px 24px rgba(0,0,0,.5))}
#suratTx{position:absolute;overflow-y:auto;font:600 clamp(1.05rem,4.6vw,1.32rem)/1.38 Caveat,cursive;color:#5a3242;white-space:pre-line;padding:2% 3%;-webkit-overflow-scrolling:touch}
#suratTx .ttd{margin-top:14px;text-align:right;color:#c0587a}

/* umum */
#bhs{position:fixed;top:10px;right:10px;z-index:95;display:flex;background:rgba(255,255,255,.14);border-radius:30px;padding:3px;border:1px solid rgba(255,255,255,.2)}
#bhs button{border:0;background:transparent;color:var(--krim);font:600 .68rem Poppins,sans-serif;padding:5px 11px;border-radius:20px;cursor:pointer}
#bhs button.on{background:var(--kuning);color:#3a1f2c}
#bMuzik{position:fixed;top:10px;left:10px;z-index:95;width:34px;height:34px;border-radius:50%;border:1px solid rgba(255,255,255,.25);background:rgba(255,255,255,.14);color:var(--kuning);font-size:15px;cursor:pointer;display:none}
#bMuzik.on{display:block}#bMuzik.henti{opacity:.5;text-decoration:line-through}
.tagpv{position:fixed;top:12px;left:50%;transform:translateX(-50%);z-index:95;background:rgba(255,255,255,.18);color:#fff;font:500 .53rem Poppins,sans-serif;letter-spacing:.18em;padding:5px 13px;border-radius:40px;pointer-events:none}
.gagal{position:fixed;inset:0;z-index:999;display:flex;align-items:center;justify-content:center;padding:24px;text-align:center;background:#1c1220;font:15px/1.7 Poppins,sans-serif;color:var(--krim)}
#lb{z-index:1000;background:rgba(14,6,12,.95);padding:0;touch-action:none;overflow:hidden}
#lb img{max-width:100vw;max-height:100vh;transform-origin:0 0;will-change:transform;-webkit-user-drag:none}
#lb .tt{position:absolute;left:0;right:0;bottom:calc(env(safe-area-inset-bottom,0px) + 16px);text-align:center;font:italic 12px Poppins,sans-serif;color:rgba(255,255,255,.6);pointer-events:none}
.x{position:fixed;right:14px;top:14px;width:32px;height:32px;border-radius:50%;border:0;background:rgba(255,255,255,.9);color:#3a1f2c;font-size:14px;cursor:pointer;z-index:3}
</style>
</head>
<body>
<div id="latar"></div>
<div id="bhs"><button id="bMS" onclick="setBhs('ms')">BM</button><button id="bEN" onclick="setBhs('en')">EN</button></div>
<button id="bMuzik" aria-label="Muzik">♪</button>

<section class="sk on" id="sk1">
  <div id="pentas">
    <div id="lampu"><img id="iLampu" alt=""></div>
    <img id="meja" alt="">
    <div id="timbun"><span class="bil" id="bil">0</span></div>
    <div id="balangBox"><div id="sinar"></div><div id="isi"></div><img class="kaca" id="iBalang" alt=""></div>
    <img id="penutup" alt="">
    <div id="tag"><img id="iTag" alt=""><div class="tx"><b id="tagT"></b><i id="tagN"></i></div></div>
    <div id="turun"><img id="turunImg" alt=""><div id="turunLbl"></div></div>
  </div>
  <div id="atas"><div class="skrip" id="t1"></div><div class="sub" id="t1s"></div><div id="kaunter"></div><div id="hint"></div></div>
  <div id="bawah"><button class="pil" id="bBuka"></button><div class="btnB" id="btnAkhir" style="margin:0"></div></div>
</section>

<section class="sk" id="sk2">
  <div class="skrip" id="t2"></div>
  <div id="suratBox"><img id="iSurat" alt=""><div id="suratTx"></div></div>
  <div class="btnB"><button class="pil p2" id="bBalik"></button></div>
</section>

<div class="lap" id="notaLap"><div class="no" id="notaNo"></div><div class="buka" id="notaK"></div><div class="btnB"><button class="pil" id="bSimpan"></button></div></div>
<div class="lap" id="senLap" onclick="if(event.target===this)tutupLap('senLap')"><button class="x" onclick="tutupLap('senLap')">✕</button><div class="no" id="senNo"></div><div id="senarai"></div></div>
<div class="lap" id="kjLap"><div class="no" id="kjNo"></div><div class="buka" id="kjK"></div><div class="btnB"><button class="pil" id="bSurat"></button></div></div>
<div class="lap" id="vidLap" onclick="if(event.target===this)tutupVideo()"><button class="x" onclick="tutupVideo()">✕</button><div class="box" id="vidBox"></div><div class="sub" id="vidTt" style="margin-top:14px"></div></div>
<div class="lap" id="lb"><button class="x" onclick="tutupLap('lb')">✕</button><img id="lbimg" alt=""><div class="tt" id="lbTt"></div></div>
<div id="tabir"></div>
<audio id="mp3" loop></audio>
<div id="yt-root" style="position:fixed;bottom:-300px;left:-300px;width:1px;height:1px;overflow:hidden"></div>

var LB={s:1,x:0,y:0};
function lbBuka(src){var im=$('lbimg');im.src=src;LB={s:1,x:0,y:0};lbTerap();$('lbTt').textContent=T('lbTt');$('lb').classList.add('on');}
function lbTerap(){$('lbimg').style.transform='translate('+LB.x+'px,'+LB.y+'px) scale('+LB.s+')';}
(function(){var lb=$('lb'),im=$('lbimg'),pts={},d0=0,s0=1,c0=null,x0=0,y0=0,gerak=false,lastTap=0,tapT=0;
  function pusat(){var k=Object.keys(pts);if(k.length<2)return null;var a=pts[k[0]],b=pts[k[1]];return{x:(a.x+b.x)/2,y:(a.y+b.y)/2,d:Math.hypot(a.x-b.x,a.y-b.y)};}
  lb.addEventListener('pointerdown',function(e){if(e.target.closest('.x'))return;pts[e.pointerId]={x:e.clientX,y:e.clientY};try{lb.setPointerCapture(e.pointerId);}catch(_){}
    var p=pusat();if(p){d0=p.d;s0=LB.s;c0=p;x0=LB.x;y0=LB.y;}else{x0=LB.x;y0=LB.y;c0={x:e.clientX,y:e.clientY};}gerak=false;tapT=Date.now();});
  lb.addEventListener('pointermove',function(e){if(!pts[e.pointerId])return;pts[e.pointerId]={x:e.clientX,y:e.clientY};var p=pusat();
    if(p){var s=Math.max(1,Math.min(5,s0*p.d/d0));var r=im.getBoundingClientRect();
      /* zum ke arah titik cubit: kekalkan titik bawah jari */
      var px=(c0.x-(x0+im.offsetLeft))/s0,py=(c0.y-(y0+im.offsetTop))/s0;
      LB.s=s;LB.x=p.x-im.offsetLeft-px*s;LB.y=p.y-im.offsetTop-py*s;gerak=true;lbTerap();}
    else if(LB.s>1){var dx=e.clientX-c0.x,dy=e.clientY-c0.y;if(Math.hypot(dx,dy)>6)gerak=true;LB.x=x0+dx;LB.y=y0+dy;lbTerap();}});
  function lepas(e){if(!pts[e.pointerId])return;delete pts[e.pointerId];
    if(Object.keys(pts).length===0){var t=Date.now();
      if(!gerak&&t-tapT<300){if(t-lastTap<320){/* dwiketik: zum 2.5x ke titik / reset */
          if(LB.s>1){LB={s:1,x:0,y:0};}else{var s=2.5,px=e.clientX-im.offsetLeft,py=e.clientY-im.offsetTop;LB={s:s,x:px-px*s,y:py-py*s};}lbTerap();lastTap=0;}
        else{lastTap=t;setTimeout(function(){if(lastTap===t&&LB.s===1)tutupLap('lb');},320);}}
      if(LB.s===1){LB.x=0;LB.y=0;lbTerap();}}
    else{var k=Object.keys(pts)[0];c0={x:pts[k].x,y:pts[k].y};x0=LB.x;y0=LB.y;}}
  lb.addEventListener('pointerup',lepas);lb.addEventListener('pointercancel',lepas);
})();
