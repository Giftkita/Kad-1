.bay{filter:drop-shadow(0 .8cqw 1cqw rgba(90,40,50,.28))}
#papan .pt{position:absolute;left:12%;right:12%;top:13%;bottom:13%;container-type:inline-size;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;color:#fdfbf6}
#papan small{font:400 7cqw/1 'Bebas Neue',sans-serif;letter-spacing:.3em;opacity:.8}
#papan h1{font:700 15cqw/1 Caveat,cursive;margin:2cqw 0;text-shadow:0 0 1.2cqw rgba(255,255,255,.25)}
#papan p{font:700 8.6cqw/1.1 Caveat,cursive;color:#ffd7e0}
#pin{transform:rotate(-8deg)}
.ft{position:absolute;overflow:hidden;background:#d9a6b2;cursor:zoom-in}
.ft img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
#tv .skrin{position:absolute;overflow:hidden;background:#2a1f1c;border-radius:14%/18%}
#tv .skrin img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
#tv .main{position:absolute;left:50%;top:50%;width:26%;aspect-ratio:1;transform:translate(-50%,-50%);border-radius:50%;background:rgba(224,87,127,.92);border:.4cqw solid #fff;display:flex;align-items:center;justify-content:center;animation:denyutTv 1.6s infinite}
#tv .main svg{width:42%;fill:#fff;margin-left:8%}
@keyframes denyutTv{0%{box-shadow:0 0 0 0 rgba(224,87,127,.6)}70%{box-shadow:0 0 0 2cqw rgba(224,87,127,0)}100%{box-shadow:0 0 0 0 rgba(224,87,127,0)}}
.mini,#dulang,#kotak,#tag,#tv,#pin{pointer-events:auto}
.mini{cursor:pointer;transition:transform .5s cubic-bezier(.3,1.5,.5,1),opacity .4s;transform-origin:50% 100%;filter:drop-shadow(0 .4cqw .5cqw rgba(90,40,50,.25));z-index:3}
.mini:hover{transform:translateY(-.6cqw) scale(1.06)}
.mini.dah{opacity:.45}
.mini.angkat{transform:translateY(-6cqw) scale(1.5);opacity:0}
.lap{opacity:0;transform:translateY(-40cqw);z-index:4;pointer-events:none}
.lap.jatuh{opacity:1;transform:none;transition:transform .55s cubic-bezier(.5,0,.6,1.35),opacity .1s}
#tulisNama{z-index:6;pointer-events:none;text-align:center;white-space:nowrap;font:700 3.4cqw/1 Caveat,cursive;color:#e0577f;text-shadow:0 .15cqw 0 #fff,0 0 .4cqw #fff;clip-path:inset(0 100% 0 0);transition:clip-path 1.6s steps(18)}
#tulisNama.on{clip-path:inset(0 0 0 0)}
#tulisUmur{z-index:6;pointer-events:none;text-align:center;white-space:nowrap;font:400 4cqw/1 'Bebas Neue',sans-serif;color:#d4af5a;letter-spacing:.06em;text-shadow:0 .15cqw 0 #fff;opacity:0;transform:scale(.4);transition:all .5s cubic-bezier(.3,1.6,.5,1)}
#tulisUmur.on{opacity:1;transform:none}
.lilin{z-index:5;opacity:0;transform:translateY(-22cqw);pointer-events:none}
.lilin.on{opacity:1;transform:none;transition:transform .45s cubic-bezier(.5,0,.6,1.4),opacity .1s}
.api{position:absolute;left:50%;top:-38%;width:150%;height:38%;transform:translateX(-50%) scale(0);transform-origin:50% 100%;transition:transform .3s;pointer-events:none}
.api i{position:absolute;inset:0;border-radius:50% 50% 45% 45%/62% 62% 38% 38%;background:radial-gradient(ellipse at 50% 72%,#fffbe6 0 18%,#ffd95c 32%,#ff9a2e 58%,rgba(255,110,40,0) 72%);animation:kelip .18s ease-in-out infinite alternate;filter:drop-shadow(0 0 .8cqw rgba(255,190,80,.9))}
.lilin.nyala .api{transform:translateX(-50%) scale(1)}
@keyframes kelip{to{transform:scaleY(1.12) translateX(4%) rotate(3deg)}}
.asap{position:absolute;left:50%;top:-30%;width:120%;height:60%;transform:translateX(-50%);border-radius:50%;background:radial-gradient(rgba(220,220,220,.8),rgba(220,220,220,0) 70%);filter:blur(.4cqw);opacity:0;pointer-events:none}
.lilin.padam .asap{animation:asap 1.8s ease-out forwards}
@keyframes asap{0%{opacity:.9;transform:translate(-50%,0) scale(.6)}100%{opacity:0;transform:translate(-50%,-180%) scale(2)}}
#dulang{z-index:3}
#dulang.sedia{animation:sinarD 1.4s ease-in-out infinite}
@keyframes sinarD{0%,100%{filter:drop-shadow(0 .8cqw 1cqw rgba(90,40,50,.28))}50%{filter:drop-shadow(0 0 2.2cqw rgba(255,214,90,.95)) drop-shadow(0 0 1cqw #fff)}}
#kotak{z-index:7;transition:left 1s cubic-bezier(.3,1.1,.5,1);cursor:pointer}
#kotak.goyang{animation:goyangK 2.2s ease-in-out infinite}
@keyframes goyangK{0%,70%,100%{transform:rotate(0)}76%{transform:rotate(-6deg)}82%{transform:rotate(6deg)}88%{transform:rotate(-3deg)}}
#kotak.buka{animation:lompatK .7s cubic-bezier(.3,1.6,.5,1)}
@keyframes lompatK{40%{transform:translateY(-4cqw) scale(1.08)}}
#tag{z-index:8;cursor:pointer;transform-origin:50% 0;animation:ayunT 2.6s ease-in-out infinite;transition:left 1s cubic-bezier(.3,1.1,.5,1)}
@keyframes ayunT{0%,100%{transform:rotate(-8deg)}50%{transform:rotate(6deg)}}
#tag{container-type:inline-size}
#tag.sedia{filter:drop-shadow(0 0 1.6cqw rgba(255,214,90,.95)) drop-shadow(0 0 .6cqw #fff)}
#tag .tt{position:absolute;left:12%;right:12%;top:36%;bottom:8%;display:flex;align-items:center;justify-content:center;text-align:center;font:700 34cqw/1 Caveat,cursive;color:#c2456a}
#gelap{position:fixed;inset:0;z-index:850;background:rgba(30,12,18,.62);display:flex;align-items:center;justify-content:center;transition:opacity 1s;cursor:pointer}
#gelap.hilang{opacity:0;pointer-events:none}
#tanda{position:relative;width:min(56vw,300px);aspect-ratio:2.2;perspective:600px}
#tanda .tali{position:absolute;left:20%;right:20%;top:-34%;height:40%;border:3px solid #c9a35a;border-bottom:0;border-radius:50% 50% 0 0/100% 100% 0 0}
#tanda .k{position:absolute;inset:0;transform-style:preserve-3d;transition:transform .8s cubic-bezier(.4,1.5,.5,1)}
#tanda.buka .k{transform:rotateY(180deg)}
#tanda .m{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;border-radius:14px;display:flex;flex-direction:column;align-items:center;justify-content:center;font:400 min(13vw,64px)/1 'Bebas Neue',sans-serif;letter-spacing:.14em;box-shadow:0 10px 30px rgba(0,0,0,.35);border:4px solid #fff}
#tanda .m small{font:700 min(4.4vw,20px)/1.2 Caveat,cursive;letter-spacing:0;margin-top:4px}
#tanda .t1{background:#7a3b44;color:#f7c7cf}
#tanda .t2{background:#f7a8b8;color:#fff;transform:rotateY(180deg)}
#tap{white-space:normal!important;max-width:92vw;text-align:center;line-height:1.3!important}
#mic{position:fixed;left:50%;transform:translateX(-50%);z-index:902;border:0;border-radius:99px;padding:10px 16px;background:#fff;color:#e0577f;font:600 13px/1 Fredoka,sans-serif;box-shadow:0 4px 14px rgba(0,0,0,.25);display:none;cursor:pointer}
/* kad ucapan */
.kadU{position:relative;background:#fff6f8;border-radius:12px;box-shadow:0 1.4vmin 3vmin rgba(0,0,0,.35);animation:terbang .6s cubic-bezier(.3,1.4,.5,1) backwards;overflow:hidden;
  background-image:radial-gradient(#f7c7cf 1.2px,transparent 1.6px);background-size:18px 18px}
.kadU .in{position:absolute;inset:6%;background:#fffdfb;border:2px dashed #f7a8b8;border-radius:10px;padding:5% 6%;display:flex;flex-direction:column;container-type:inline-size;overflow:hidden}
.kadU h3{font:700 10cqw/1 Caveat,cursive;color:#e0577f;text-align:center}
.kadU .s{font:400 4.6cqw/1 'Bebas Neue',sans-serif;letter-spacing:.3em;color:#d4af5a;text-align:center;margin:1.4cqw 0 3cqw}
.kadU .b{font:500 6.4cqw/1.28 Caveat,cursive;color:#4a2a30;white-space:pre-wrap;flex:1;overflow:hidden}
.kadU .f{font:700 7cqw/1.1 Caveat,cursive;color:#7a3b44;text-align:right;margin-top:2cqw}
.tvB{position:relative;animation:terbang .6s cubic-bezier(.3,1.4,.5,1) backwards;filter:drop-shadow(0 1.4vmin 2.4vmin rgba(0,0,0,.4))}
.tvB .skrin{position:absolute;overflow:hidden;background:#000;border-radius:14%/18%}
.tvB .skrin img,.tvB .skrin iframe{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;border:0}
</style>
</head>

function sediaMuzik(){

  else if(ytId(v('yt'))){ var f=document.createElement('iframe'); f.style.cssText='position:fixed;width:1px;height:1px;opacity:0;pointer-events:none;left:-10px';
    f.allow='autoplay'; document.body.appendChild(f); var yid=ytId(v('yt'));

  if(!audio) $('#bMuzik').classList.add('hide');
}

/* ---------- demo: ilustrasi pasangan ---------- */
function fotoDemo0(n){ var W=720,H=540,c=document.createElement('canvas'); c.width=W; c.height=H; var x=c.getContext('2d');
  var P=[['#fde2e4','#f4acb7','#9d4edd'],['#e2ece9','#a8d5ba','#2d6a4f'],['#fff1e6','#f8c8a0','#b5651d'],['#dbe7f6','#9cb8e0','#1f3b7a'],['#fbe7ef','#e7a3ae','#8e3b46'],['#f1e8d6','#d9c39a','#5e4b3c']][n%6];
  var g=x.createLinearGradient(0,0,0,H); g.addColorStop(0,P[0]); g.addColorStop(1,P[1]); x.fillStyle=g; x.fillRect(0,0,W,H);
  x.fillStyle='rgba(255,255,255,.35)'; x.beginPath(); x.arc(W*(.2+(n%3)*.3),H*.25,90,0,7); x.fill();
  x.fillStyle='rgba(0,0,0,.08)'; x.fillRect(0,H*.78,W,H*.22);
  var X=[W*.38,W*.62], K=[P[2],'#1f3b7a'], R=['#3b2a20','#1d1d1d'];
  for(var i=0;i<2;i++){ var cx=X[i], cy=H*.56, s=i?1.08:1;
    x.fillStyle=K[i]; x.beginPath(); x.ellipse(cx,cy+150*s,82*s,130*s,0,Math.PI,0); x.fill();
    x.fillStyle=R[i]; x.beginPath(); x.arc(cx,cy-12*s,46*s,0,7); x.fill(); if(!i){ x.fillRect(cx-46*s,cy-12*s,92*s,60*s); }
    x.fillStyle='#f2c9a0'; x.beginPath(); x.arc(cx,cy-4*s,36*s,0,7); x.fill(); }
  x.strokeStyle='#f2c9a0'; x.lineWidth=18; x.lineCap='round'; x.beginPath(); x.moveTo(W*.42,H*.86); x.quadraticCurveTo(W*.5,H*.8,W*.58,H*.86); x.stroke();
  function hati(hx,hy,hs,c2){ x.fillStyle=c2; x.beginPath(); x.moveTo(hx,hy+hs*.3); x.bezierCurveTo(hx,hy,hx-hs*.5,hy,hx-hs*.5,hy+hs*.3); x.bezierCurveTo(hx-hs*.5,hy+hs*.6,hx,hy+hs*.8,hx,hy+hs); x.bezierCurveTo(hx,hy+hs*.8,hx+hs*.5,hy+hs*.6,hx+hs*.5,hy+hs*.3); x.bezierCurveTo(hx+hs*.5,hy,hx,hy,hx,hy+hs*.3); x.fill(); }
  hati(W*.5,H*.1,70,'#e8505b'); for(var q=0;q<10;q++) hati(40+Math.random()*(W-80),20+Math.random()*H*.45,14+Math.random()*16,['#fff','#e8505b','#f4acb7'][q%3]);
  x.fillStyle='rgba(0,0,0,.35)'; x.font='bold 28px sans-serif'; for(var m=0;m<4;m++) x.fillText('♪',60+Math.random()*(W-120),40+Math.random()*H*.4);
  return c.toDataURL('image/jpeg',0.8); }
function fotoDemo(n){ var u=fotoDemo0(n); return u; }
