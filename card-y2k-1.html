<!DOCTYPE html>
<html lang="ms">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Telefon Y2K 📱💌</title>
<script src="https://unpkg.com/@supabase/supabase-js@2"></script>
<script>if(!window.supabase){document.write('<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"><\/script>');}</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=VT323&family=Caveat:wght@600;700&family=Poppins:wght@400;500;600&display=swap" rel="stylesheet">
<!--
  GiftKita — Kad Love Letter "Telefon Y2K" (template: y2k) — reka sendiri (27 Sep 2026)
  Aliran: flip phone tertutup bergetar ("1 mesej baru") → ketik → telefon terbuka (flip) + muzik → boot LCD →
          skrin utama → menu (Mesej · Galeri · Muzik · Video) → SMS ditaip huruf demi huruf →
          habis baca semua mesej → panggilan masuk → angkat → kejutan (bingkai gel) → surat (kertas binder).
  Navigasi: ketik terus pada skrin LCD ATAU tekan butang telefon (atas/bawah/kiri/kanan/OK/lembut/hijau/merah).
  card_data: template, nama, pengirim, m1_teks..m12_teks, m1_img..m12_img (+_pos), g1_img..g10_img (+_pos), video, lagu_tajuk,
             surat, surprise_img (+_pos), surprise, yt|mp3, lang
-->
<style>
:root{--pink:#ff8fc0;--lilac:#c9a8f5;--ink:#3a2a5c;--lcd:#eef2ff}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;overflow:hidden}
body{font-family:Poppins,sans-serif;color:var(--ink);-webkit-user-select:none;user-select:none;background:#f6e6ff}
img{-webkit-user-drag:none;display:block}
button{font-family:inherit}
#latar{position:fixed;inset:0;overflow:hidden;background:
  linear-gradient(rgba(255,255,255,.35) 1px,transparent 1px) 0 0/28px 28px,
  linear-gradient(90deg,rgba(255,255,255,.35) 1px,transparent 1px) 0 0/28px 28px,
  radial-gradient(ellipse 90% 60% at 20% 10%,#ffd6ec 0%,rgba(255,214,236,0) 60%),
  radial-gradient(ellipse 80% 60% at 90% 90%,#cfe6ff 0%,rgba(207,230,255,0) 60%),
  linear-gradient(160deg,#fbe3f4,#e8dcff 55%,#dff0ff)}
.plk{position:absolute;pointer-events:none;animation:terapung var(--d,7s) ease-in-out infinite;filter:drop-shadow(0 6px 10px rgba(120,80,160,.25))}
@keyframes terapung{50%{translate:0 -14px;rotate:var(--r2,6deg)}}
.kil{position:absolute;pointer-events:none;animation:kerlip var(--d,2.6s) ease-in-out infinite}
@keyframes kerlip{0%,100%{opacity:.2;scale:.6}50%{opacity:1;scale:1}}
.sk{position:fixed;inset:0;display:none;overflow:hidden}
.sk.on{display:block}
#tabir{position:fixed;inset:0;z-index:500;background:#f6e6ff;opacity:0;pointer-events:none;transition:opacity .45s}
#tabir.on{opacity:1;pointer-events:auto}
.tajuk{font:700 clamp(1.5rem,7vw,2.2rem)/1.1 Fredoka,Poppins,sans-serif;color:#fff;text-align:center;-webkit-text-stroke:1.2px #e46aa6;text-shadow:0 3px 0 #e46aa6,0 6px 16px rgba(228,106,166,.45);letter-spacing:.01em}
.sub{font:500 clamp(.76rem,3.2vw,.92rem) Poppins,sans-serif;color:#7a5a9a;text-align:center;margin-top:8px}
.pil{border:0;border-radius:999px;padding:13px 28px;font:600 .95rem Fredoka,Poppins,sans-serif;cursor:pointer;color:#fff;background:linear-gradient(135deg,#ff9cc8,#b98af0);box-shadow:0 6px 0 #b0679f,0 10px 22px rgba(176,103,159,.35);animation:denyut 1.8s ease-in-out infinite}
.pil.p2{background:#fff;color:#7a4fa0;box-shadow:0 4px 0 #d4bdf0;animation:none}
.pil:active{translate:0 3px}
@keyframes denyut{50%{scale:1.05}}

/* 1 — telefon tertutup */
#sk1{display:none;flex-direction:column;align-items:center;justify-content:center;padding:calc(env(safe-area-inset-top,0px) + 50px) 16px calc(env(safe-area-inset-bottom,0px) + 22px)}
#sk1.on{display:flex}
#tutupBox{position:relative;margin:18px 0 20px;cursor:pointer}
#tutupBox>img.hp{position:relative;width:100%;z-index:2;filter:drop-shadow(0 16px 22px rgba(120,70,150,.35))}
#tutupBox.getar{animation:getar .6s linear}
@keyframes getar{10%,30%,50%,70%,90%{translate:-4px 0;rotate:-2deg}20%,40%,60%,80%{translate:4px 0;rotate:2deg}}
#luar{position:absolute;z-index:1;border-radius:6%;overflow:hidden;background:linear-gradient(160deg,#1b1f4a,#3a2c6e);color:#bfe9ff;display:flex;flex-direction:column;align-items:center;justify-content:center;font:400 1rem/1 VT323,monospace;text-align:center}
#luar .jam{font-size:1.3em;letter-spacing:.05em}
#luar .ms{margin-top:4px;color:#ffc2e2;animation:kelipT 1s steps(2) infinite}
@keyframes kelipT{50%{opacity:.25}}
.tali{position:absolute;z-index:3;transform-origin:50% 2%;animation:ayun 3.2s ease-in-out infinite;pointer-events:none;filter:drop-shadow(0 6px 8px rgba(120,70,150,.3))}
@keyframes ayun{50%{rotate:-7deg}}

/* 2 — telefon terbuka */
#hint{position:absolute;left:0;right:0;top:calc(env(safe-area-inset-top,0px) + 80px);text-align:center;font:600 .74rem Fredoka,Poppins,sans-serif;color:#7a4fa0;z-index:5;pointer-events:none;padding:0 16px}
#hp{position:absolute;left:50%;translate:-50% 0;perspective:1400px;z-index:4}
#hp .bh{position:absolute;left:0;right:0;overflow:hidden}
#hp .bh img{position:absolute;left:0;width:100%;pointer-events:none}
#hpA{top:0;transform-origin:50% 100%;backface-visibility:hidden;-webkit-backface-visibility:hidden;z-index:3}
#hpB{z-index:2;filter:drop-shadow(0 18px 24px rgba(120,70,150,.35))}
#hpA img{filter:drop-shadow(0 -4px 14px rgba(120,70,150,.25))}
#lcd{position:absolute;z-index:0;overflow:hidden;border-radius:3%;background:var(--lcd);color:var(--ink);font:400 16px/1.15 VT323,monospace;display:flex;flex-direction:column}
#hp #lcd img{position:static;filter:none;pointer-events:auto}
#hp #lcd .notif img{width:26px}
#hp #lcd .panggil img{height:34%;width:60%}
#lcd::after{content:"";position:absolute;inset:0;pointer-events:none;background:repeating-linear-gradient(0deg,rgba(40,30,90,.05) 0 1px,transparent 1px 3px),repeating-linear-gradient(90deg,rgba(40,30,90,.035) 0 1px,transparent 1px 3px);z-index:9}
#lcd.gelap{background:#1b1f4a}
#stat{display:flex;justify-content:space-between;align-items:center;padding:3px 6px 2px;background:linear-gradient(#ffd6ec,#f1c4ff);font-size:.95em;flex:0 0 auto}
#stat .isy{display:flex;gap:1px;align-items:flex-end;height:10px}
#stat .isy i{display:block;width:3px;background:var(--ink)}
#stat .bat{width:18px;height:9px;border:1.5px solid var(--ink);border-radius:2px;position:relative;padding:1px}
#stat .bat::before{content:"";display:block;height:100%;width:80%;background:var(--ink)}
#stat .bat::after{content:"";position:absolute;right:-4px;top:2px;width:2px;height:3px;background:var(--ink)}
#isiL{position:relative;flex:1 1 auto;overflow:hidden}
#lembut{display:flex;justify-content:space-between;align-items:center;padding:2px 6px 3px;background:linear-gradient(#f1c4ff,#ffd6ec);font-size:1em;flex:0 0 auto}
#lembut span{cursor:pointer;min-width:30%}
#lembut span:nth-child(2){text-align:center;min-width:0}
#lembut span:last-child{text-align:right}
.pg{position:absolute;inset:0;display:flex;flex-direction:column}
.boot{align-items:center;justify-content:center;background:#1b1f4a;color:#ffc2e2;gap:8px}
.boot .lg{font-size:2.6em;animation:denyut .8s ease-in-out infinite}
.boot .bar{width:64%;height:8px;border:1.5px solid #ffc2e2;padding:1px}
.boot .bar i{display:block;height:100%;width:0;background:#ffc2e2;transition:width 1.4s steps(10)}
.home{background:#2a2a5a center/cover no-repeat;color:#fff;justify-content:space-between;cursor:pointer}
.home::before{content:"";position:absolute;inset:0;background:linear-gradient(rgba(30,20,70,.15),rgba(30,20,70,.55))}
.home>*{position:relative}
.home .jamB{font-size:2.8em;text-align:center;margin-top:10%;text-shadow:0 2px 0 rgba(0,0,0,.35)}
.home .tr{text-align:center;font-size:1em;opacity:.9}
.home .notif{margin:0 6% 7%;background:rgba(255,214,236,.92);color:var(--ink);border-radius:6px;padding:5px 7px;display:flex;align-items:center;gap:6px;animation:kelipT 1.2s steps(2) 4}
.home .notif img{width:26px}
.menu{display:grid;grid-template-columns:1fr 1fr;grid-auto-rows:1fr;gap:5px;padding:6px;background:linear-gradient(#fff0f8,#eef2ff)}
.mi{border-radius:8px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;cursor:pointer;border:2px solid transparent;font-size:1.05em;text-align:center}
.mi .ik{font-size:1.9em;line-height:1}
.mi img{width:42%}
.mi.pil2{background:rgba(201,168,245,.35);border-color:#b98af0}
.mi .bd{font-size:.8em;background:#ff6fae;color:#fff;border-radius:8px;padding:0 5px}
.jdl{padding:4px 7px;background:#b98af0;color:#fff;font-size:1.05em;flex:0 0 auto;display:flex;justify-content:space-between}
.senarai{flex:1;overflow:hidden}
.bar{display:flex;align-items:center;gap:6px;padding:5px 7px;border-bottom:1px dashed rgba(58,42,92,.2);cursor:pointer}
.bar.pil2{background:#ffd6ec}
.bar .dt{width:7px;height:7px;border-radius:50%;background:#ff4f9a;flex:0 0 auto}
.bar .dt.dah{background:transparent;border:1px solid rgba(58,42,92,.35)}
.bar .tx{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bar .tx b{font-weight:400;display:block}
.bar .tx small{opacity:.65;font-size:.9em}
.sms{background:linear-gradient(#fff6fb,#eef2ff)}
.sms .kand{flex:1;overflow-y:auto;padding:6px 7px 8px;-webkit-overflow-scrolling:touch}
.gel{background:#fff;border:1.5px solid #e9b3d4;border-radius:10px 10px 10px 2px;padding:6px 8px;font-size:1.12em;line-height:1.15;white-space:pre-wrap;word-break:break-word;box-shadow:0 2px 0 #f3cfe3}
.gel .kur{display:inline-block;width:7px;height:1em;background:var(--ink);vertical-align:-2px;animation:kelipT .7s steps(2) infinite}
.gel .ft{margin-top:6px;width:100%;aspect-ratio:1;border-radius:6px;background:#ddd center/cover no-repeat;cursor:zoom-in;opacity:0;transition:opacity .4s}
.gel .ft.on{opacity:1}
.wkt{font-size:.85em;opacity:.55;margin:3px 2px 0}
.galeri{background:#111;color:#fff}
.galeri .gb{flex:1;background:#222 center/cover no-repeat;cursor:zoom-in;transition:opacity .25s}
.galeri .gn{position:absolute;left:0;right:0;bottom:4px;display:flex;justify-content:space-between;padding:0 8px;font-size:1.1em;text-shadow:0 1px 2px #000}
.galeri .gn span{cursor:pointer;padding:0 6px}
.muzik{align-items:center;justify-content:center;gap:6px;background:linear-gradient(#ffe6f4,#e8dcff);text-align:center;padding:6px}
.muzik .cd{width:44%;aspect-ratio:1;border-radius:50%;background:conic-gradient(#ffd6ec,#cfe6ff,#e8dcff,#fff,#ffd6ec);position:relative;box-shadow:0 2px 6px rgba(58,42,92,.3)}
.muzik .cd::after{content:"";position:absolute;inset:38%;border-radius:50%;background:#fff;border:2px solid #d4bdf0}
.muzik .cd.pusing{animation:pusing 3s linear infinite}
@keyframes pusing{to{rotate:360deg}}
.muzik .eq{display:flex;gap:2px;align-items:flex-end;height:18px}
.muzik .eq i{display:block;width:4px;background:#b98af0;height:30%}
.muzik .eq.main i{animation:eq .5s ease-in-out infinite alternate}
@keyframes eq{to{height:100%}}
.muzik .tj{font-size:1.25em;max-width:100%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.video{background:#000}
.video iframe{position:absolute;inset:0;width:100%;height:100%;border:0}
.panggil{align-items:center;justify-content:center;gap:6px;background:linear-gradient(#ffd6ec,#c9a8f5);text-align:center}
.panggil img{height:34%;width:60%;object-fit:contain;flex:0 0 auto;animation:denyut .7s ease-in-out infinite}
.panggil .nm{font-size:1.5em}
.panggil .ang{font-size:.95em;background:#3fbf6a;color:#fff;border-radius:10px;padding:2px 8px;animation:kelipT .8s steps(2) infinite;cursor:pointer}
.kunci{position:absolute;z-index:5;border-radius:40%;cursor:pointer}
.kunci.tekan{background:radial-gradient(circle,rgba(255,255,255,.75),rgba(255,255,255,0) 70%)}
.kunci.nadi{animation:nadi 1s ease-in-out infinite}
@keyframes nadi{0%,100%{box-shadow:0 0 0 0 rgba(63,191,106,.7)}50%{box-shadow:0 0 0 8px rgba(63,191,106,0)}}
#hp.getar{animation:getar .6s linear}

/* lapisan */
.lap{position:fixed;inset:0;z-index:80;display:none;align-items:center;justify-content:center;flex-direction:column;padding:16px;background:rgba(246,230,255,.78);-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px)}
.lap.on{display:flex;animation:muncul .35s ease}
@keyframes muncul{from{opacity:0}}
.no{font:600 .72rem Fredoka,Poppins,sans-serif;letter-spacing:.2em;color:#b0679f;margin-bottom:10px;text-align:center}
#kjBox{position:relative;animation:timbul .7s cubic-bezier(.2,1.3,.4,1)}
@keyframes timbul{from{scale:.3;rotate:-12deg;opacity:0}}
#kjBox>img{position:relative;width:100%;z-index:2;pointer-events:none;filter:drop-shadow(0 12px 22px rgba(120,70,150,.35))}
#kjFt{position:absolute;z-index:1;background:#eee center/cover no-repeat;cursor:zoom-in;border-radius:6%}
.kap{margin-top:14px;max-width:min(86vw,420px);text-align:center;font:700 clamp(1.3rem,6vw,1.8rem)/1.2 Caveat,cursive;color:#7a3f7a;white-space:pre-line}
.btnB{display:flex;gap:10px;flex-wrap:wrap;justify-content:center;margin-top:18px}

/* 3 — surat */
#sk3{display:none;flex-direction:column;align-items:center;justify-content:center;padding:calc(env(safe-area-inset-top,0px) + 54px) 14px calc(env(safe-area-inset-bottom,0px) + 20px)}
#sk3.on{display:flex}
#sk3 .tajuk{font-size:clamp(1.3rem,6vw,1.8rem);margin-bottom:12px}
#suratBox{position:relative;animation:naik 1s cubic-bezier(.2,.8,.3,1) both}
@keyframes naik{from{opacity:0;translate:0 80px}}
#suratBox>img{width:100%;filter:drop-shadow(0 12px 24px rgba(120,70,150,.3))}
#suratTx{position:absolute;overflow-y:auto;font:600 clamp(1.05rem,4.6vw,1.32rem)/1.36 Caveat,cursive;color:#5a2f6a;white-space:pre-line;padding:2% 3%;-webkit-overflow-scrolling:touch;
  background:linear-gradient(rgba(233,160,200,.28) 1px,transparent 1px) 0 0/100% 1.36em,linear-gradient(90deg,rgba(233,160,200,.18) 1px,transparent 1px) 0 0/1.36em 100%;background-attachment:local}
#suratTx .ttd{margin-top:14px;text-align:right;color:#d0508f}

/* umum */
#bhs{position:fixed;top:10px;right:10px;z-index:95;display:flex;background:rgba(255,255,255,.7);border-radius:30px;padding:3px;border:1px solid #e4cff5}
#bhs button{border:0;background:transparent;color:#7a4fa0;font:600 .68rem Poppins,sans-serif;padding:5px 11px;border-radius:20px;cursor:pointer}
#bhs button.on{background:#b98af0;color:#fff}
#bMuzik{position:fixed;top:10px;left:10px;z-index:95;width:34px;height:34px;border-radius:50%;border:1px solid #e4cff5;background:rgba(255,255,255,.7);color:#b0679f;font-size:15px;cursor:pointer;display:none}
#bMuzik.on{display:block}#bMuzik.henti{opacity:.5;text-decoration:line-through}
#gk-album-btn{bottom:auto!important;top:calc(env(safe-area-inset-top,0px) + 48px)!important;right:10px!important;padding:8px 12px!important;font-size:.64rem!important}
.tagpv{position:fixed;top:12px;left:50%;transform:translateX(-50%);z-index:95;background:rgba(122,79,160,.25);color:#fff;font:500 .53rem Poppins,sans-serif;letter-spacing:.18em;padding:5px 13px;border-radius:40px;pointer-events:none}
.gagal{position:fixed;inset:0;z-index:999;display:flex;align-items:center;justify-content:center;padding:24px;text-align:center;background:#f6e6ff;font:15px/1.7 Poppins,sans-serif;color:var(--ink)}
#lb{z-index:1000;background:rgba(30,16,46,.95);padding:0;touch-action:none;overflow:hidden}
#lb img{max-width:100vw;max-height:100vh;transform-origin:0 0;will-change:transform;-webkit-user-drag:none}
#lb .tt{position:absolute;left:0;right:0;bottom:calc(env(safe-area-inset-bottom,0px) + 16px);text-align:center;font:italic 12px Poppins,sans-serif;color:rgba(255,255,255,.6);pointer-events:none}
.x{position:fixed;right:14px;top:14px;width:32px;height:32px;border-radius:50%;border:0;background:rgba(255,255,255,.9);color:#3a2a5c;font-size:14px;cursor:pointer;z-index:3}
</style>
</head>
<body>
<div id="latar"></div>
<div id="bhs"><button id="bMS" onclick="setBhs('ms')">BM</button><button id="bEN" onclick="setBhs('en')">EN</button></div>
<button id="bMuzik" aria-label="Muzik">♪</button>

<section class="sk on" id="sk1">
  <div class="tajuk" id="t1"></div><div class="sub" id="t1s"></div>
  <div id="tutupBox"><div id="luar"><div class="jam" id="jamL"></div><div class="ms" id="msL"></div></div><img class="hp" id="iTutup" alt=""><img class="tali" id="tali1" alt=""></div>
  <button class="pil" id="bBuka"></button>
</section>

<section class="sk" id="sk2">
  <div id="hint"></div>
  <div id="hp">
    <div class="bh" id="hpB"><img id="iB" alt=""></div>
    <div class="bh" id="hpA"><div id="lcd"><div id="stat"></div><div id="isiL"></div><div id="lembut"><span id="sL"></span><span id="sT"></span><span id="sR"></span></div></div><img id="iA" alt=""></div>
    <div id="kunciG"></div>
    <img class="tali" id="tali2" alt="">
  </div>
</section>

<section class="sk" id="sk3">
  <div class="tajuk" id="t3"></div>
  <div id="suratBox"><img id="iKertas" alt=""><div id="suratTx"></div></div>
  <div class="btnB"><button class="pil p2" id="bBalik"></button></div>
</section>

<div class="lap" id="kjLap"><div class="no" id="kjNo"></div><div id="kjBox"><div id="kjFt"></div><img id="iBingkai" alt=""></div><div class="kap" id="kjKap"></div><div class="btnB"><button class="pil" id="bSurat"></button></div></div>
<div class="lap" id="lb"><button class="x" onclick="tutupLap('lb')">✕</button><img id="lbimg" alt=""><div class="tt" id="lbTt"></div></div>
<div id="tabir"></div>
<audio id="mp3" loop></audio>

(function(){var lb=$('lb'),im=$('lbimg'),pts={},d0=0,s0=1,c0=null,x0=0,y0=0,gerak=false,lastTap=0,tapT=0;
  function pusat(){var k=Object.keys(pts);if(k.length<2)return null;var a=pts[k[0]],b=pts[k[1]];return{x:(a.x+b.x)/2,y:(a.y+b.y)/2,d:Math.hypot(a.x-b.x,a.y-b.y)};}
  lb.addEventListener('pointerdown',function(e){if(e.target.closest('.x'))return;pts[e.pointerId]={x:e.clientX,y:e.clientY};try{lb.setPointerCapture(e.pointerId);}catch(_){}
    var p=pusat();if(p){d0=p.d;s0=LB.s;c0=p;x0=LB.x;y0=LB.y;}else{x0=LB.x;y0=LB.y;c0={x:e.clientX,y:e.clientY};}gerak=false;tapT=Date.now();});
  lb.addEventListener('pointermove',function(e){if(!pts[e.pointerId])return;pts[e.pointerId]={x:e.clientX,y:e.clientY};var p=pusat();
    if(p){var s=Math.max(1,Math.min(5,s0*p.d/d0));var r=im.getBoundingClientRect();
      /* zum ke arah titik cubit: kekalkan titik bawah jari */
      var px=(c0.x-(x0+im.offsetLeft))/s0,py=(c0.y-(y0+im.offsetTop))/s0;
      LB.s=s;LB.x=p.x-im.offsetLeft-px*s;LB.y=p.y-im.offsetTop-py*s;gerak=true;lbTerap();}
    else if(LB.s>1){var dx=e.clientX-c0.x,dy=e.clientY-c0.y;if(Math.hypot(dx,dy)>6)gerak=true;LB.x=x0+dx;LB.y=y0+dy;lbTerap();}});
  function lepas(e){if(!pts[e.pointerId])return;delete pts[e.pointerId];
    if(Object.keys(pts).length===0){var t=Date.now();
      if(!gerak&&t-tapT<300){if(t-lastTap<320){/* dwiketik: zum 2.5x ke titik / reset */
          if(LB.s>1){LB={s:1,x:0,y:0};}else{var s=2.5,px=e.clientX-im.offsetLeft,py=e.clientY-im.offsetTop;LB={s:s,x:px-px*s,y:py-py*s};}lbTerap();lastTap=0;}
        else{lastTap=t;setTimeout(function(){if(lastTap===t&&LB.s===1)tutupLap('lb');},320);}}
      if(LB.s===1){LB.x=0;LB.y=0;lbTerap();}}
    else{var k=Object.keys(pts)[0];c0={x:pts[k].x,y:pts[k].y};x0=LB.x;y0=LB.y;}}
  lb.addEventListener('pointerup',lepas);lb.addEventListener('pointercancel',lepas);
})();

var mode=null,ytp=null,ytOk=false,siapM=false,mainLagu=false,dihentiUser=false;
function muzik(){if(siapM||!D)return;siapM=true;
  if(D.mp3){mode='mp3';var a=$('mp3');a.src=D.mp3;a.play().then(function(){setMain(true);}).catch(function(){});$('bMuzik').classList.add('on');}
  else if(D.yt){var id=ytId(D.yt);if(!id)return;mode='yt';$('bMuzik').classList.add('on');
    if(window.YT&&YT.Player)buatYT(id);else{var s=document.createElement('script');s.src='https://www.youtube.com/iframe_api';document.head.appendChild(s);window.onYouTubeIframeAPIReady=function(){buatYT(id);};}}
}
function buatYT(id){ytp=new YT.Player('yt-root',{width:'1',height:'1',videoId:id,playerVars:{autoplay:1,controls:0,disablekb:1,fs:0,rel:0,playsinline:1,loop:1,playlist:id},
  events:{onReady:function(){ytOk=true;try{ytp.playVideo();}catch(e){}},onStateChange:function(e){setMain(e.data===1);}}});}
function setMain(b){mainLagu=b;$('bMuzik').classList.toggle('henti',!b);if(skrin==='muzik'&&dahBuka)lukis();}
function hentiMuzik(user){if(user)dihentiUser=true;if(mode==='mp3'){$('mp3').pause();setMain(false);}else if(ytp&&ytOk)try{ytp.pauseVideo();}catch(e){}}
function sambungMuzik(user){if(user)dihentiUser=false;if(dihentiUser)return;
  if(mode==='mp3'){var a=$('mp3');if(a.paused)a.play().then(function(){setMain(true);}).catch(function(){});}
  else if(mode==='yt'&&ytp&&ytOk){try{if(ytp.getPlayerState()!==1)ytp.playVideo();}catch(e){}}}
