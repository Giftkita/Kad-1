.copB{position:absolute;right:3vmin;bottom:2vmin;width:clamp(56px,11vmin,84px);aspect-ratio:1;border-radius:50%;border:0;padding:0;cursor:pointer;background:conic-gradient(#e0577f calc(var(--p,0)*1turn),#f7d6de 0);touch-action:none;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
body.potret .copB{right:16px;bottom:10px}
.copB::before{content:'';position:absolute;inset:4px;border-radius:50%;background:#fff}
.copB img{position:absolute;left:12%;top:8%;width:76%;transition:transform .2s;pointer-events:none}
.copB.tekan img{transform:translateY(6%) scale(.92)}
.meterai{position:absolute;right:16%;bottom:10%;width:clamp(78px,15vmin,120px);aspect-ratio:1;border-radius:50%;border:4px double #e0577f;color:#e0577f;display:none;flex-direction:column;align-items:center;justify-content:center;transform:rotate(-14deg);font:400 clamp(14px,2.6vmin,20px)/1 'Bebas Neue',sans-serif;letter-spacing:.08em;opacity:.88;text-align:center;background:rgba(255,240,244,.6)}
.janji.siap .meterai{display:flex;animation:copM2 .5s cubic-bezier(.3,1.6,.5,1) backwards}
.janji.siap .copB{display:none}
@keyframes copM2{from{transform:rotate(-14deg) scale(2.4);opacity:0}}
/* 6 — lagu & video */
.lv{display:flex;align-items:center;justify-content:center;gap:5vmin}
body.potret .lv{flex-direction:column;gap:3vmin}
.radioW{position:relative;width:min(40vmin,70vw);cursor:pointer;animation:pop .7s backwards}
.radioW>img{width:100%;display:block}
.radioW.main>img{animation:dentum .5s ease-in-out infinite alternate}
@keyframes dentum{to{transform:scale(1.035) rotate(-1deg)}}
.eq{position:absolute;left:24%;right:24%;top:-14%;height:14%;display:flex;align-items:flex-end;justify-content:center;gap:5%;opacity:0;transition:opacity .4s}
.radioW.main .eq{opacity:1}
.eq i{flex:1;background:#e0577f;border-radius:3px;height:30%;animation:eq .8s ease-in-out infinite alternate}
.eq i:nth-child(2){animation-delay:-.3s;background:#f7a8b8}.eq i:nth-child(3){animation-delay:-.6s}.eq i:nth-child(4){animation-delay:-.15s;background:#a9cbef}.eq i:nth-child(5){animation-delay:-.45s}
@keyframes eq{to{height:100%}}
.radioW .not{position:absolute;font-size:clamp(16px,3.4vmin,26px);color:#e0577f;opacity:0;pointer-events:none}
.radioW.main .not{animation:not 2.4s ease-out infinite}
@keyframes not{0%{opacity:0;transform:translate(0,0)}20%{opacity:1}100%{opacity:0;transform:translate(3vmin,-14vmin) rotate(20deg)}}
.fon{position:relative;width:min(24vmin,40vw);aspect-ratio:var(--a);cursor:pointer;animation:pop .7s .15s backwards}
body.potret .fon{width:36vw}
body.potret .radioW{width:62vw}
.skrin{position:absolute;overflow:hidden;background:#3a2530;border-radius:6%/3.5%}
.skrin img,.skrin iframe{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;border:0}
.skrin img.slaid{opacity:0;transition:opacity .8s}
.skrin img.slaid.on{opacity:1}
.skrin .main{position:absolute;left:50%;top:50%;width:36%;aspect-ratio:1;transform:translate(-50%,-50%);border-radius:50%;background:rgba(224,87,127,.92);border:3px solid #fff;display:flex;align-items:center;justify-content:center;animation:denyut 1.4s infinite;z-index:2}
.skrin .main svg{width:42%;fill:#fff;margin-left:8%}
/* 7 — bungkusan */
.bungkus{width:min(32vmin,52vw);animation:pop .7s backwards,goyang 2s ease-in-out 1s infinite}
.bungkus.geleng{animation:geleng .5s}
.bungkus.buka{animation:bukaH 1s forwards}
@keyframes bukaH{0%{transform:scale(1)}30%{transform:scale(.85) rotate(-6deg)}60%{transform:scale(1.25) rotate(6deg)}100%{transform:scale(1.1)}}
.soalan{font:700 clamp(22px,4.6vmin,36px)/1.15 Caveat,cursive;color:#5b3341;text-align:center;max-width:90vw}
.kunciRow{display:flex;gap:10px;align-items:center;justify-content:center;flex-wrap:wrap}
#kIn{width:min(64vw,270px);padding:12px 16px;border-radius:99px;border:3px solid #f7a8b8;background:#fff;font:600 clamp(16px,3vmin,21px)/1 Fredoka,sans-serif;color:#7a3b52;text-align:center;outline:none}
#kIn:focus{border-color:#e0577f}
#kIn.salah{animation:geleng .5s;border-color:#e2556b}
#kMsg{min-height:1.4em;font-weight:600}
#rumah{position:fixed;left:10px;bottom:max(14px,env(safe-area-inset-bottom));width:46px;height:46px;border-radius:50%;border:3px solid #fff;background:#f7a8b8;color:#fff;font-size:20px;cursor:pointer;box-shadow:0 3px 10px rgba(224,87,127,.35);z-index:1000;display:none}
#rumah.on{display:block;animation:pop .4s}
.hatiT{position:fixed;z-index:1600;pointer-events:none;font-size:18px;animation:hatiT 1s ease-out forwards}
@keyframes hatiT{0%{opacity:1;transform:translate(-50%,-50%) scale(.5)}100%{opacity:0;transform:translate(-50%,-160%) scale(1.3)}}
#alat button{background:#fff;color:#e0577f}
.pop .box{background:#fff8fa;border:4px solid #fbd7de}
.pop h3{font-family:Caveat,cursive;font-style:normal;color:#e0577f;font-size:34px}

function fotoDemo(n){ var W=720,H=540,c=document.createElement('canvas'); c.width=W; c.height=H; var x=c.getContext('2d');
  var P=[['#fde2e4','#f4acb7','#9d4edd'],['#e2ece9','#a8d5ba','#2d6a4f'],['#fff1e6','#f8c8a0','#b5651d'],['#dbe7f6','#9cb8e0','#1f3b7a'],['#fbe7ef','#e7a3ae','#8e3b46'],['#f1e8d6','#d9c39a','#5e4b3c']][n%6];

  x.fillStyle='rgba(0,0,0,.08)'; x.fillRect(0,H*.78,W,H*.22);
  var X=[W*.38,W*.62], K=[P[2],'#1f3b7a'], R=['#3b2a20','#1d1d1d'];
  for(var i=0;i<2;i++){ var cx=X[i], cy=H*.56, s=i?1.08:1;
    x.fillStyle=K[i]; x.beginPath(); x.ellipse(cx,cy+150*s,82*s,130*s,0,Math.PI,0); x.fill();
    x.fillStyle=R[i]; x.beginPath(); x.arc(cx,cy-12*s,46*s,0,7); x.fill(); if(!i){ x.fillRect(cx-46*s,cy-12*s,92*s,60*s); }
    x.fillStyle='#f2c9a0'; x.beginPath(); x.arc(cx,cy-4*s,36*s,0,7); x.fill(); }
  x.strokeStyle='#f2c9a0'; x.lineWidth=18; x.lineCap='round'; x.beginPath(); x.moveTo(W*.42,H*.86); x.quadraticCurveTo(W*.5,H*.8,W*.58,H*.86); x.stroke();

  hati(W*.5,H*.1,70,'#e8505b'); for(var q=0;q<10;q++) hati(40+Math.random()*(W-80),20+Math.random()*H*.45,14+Math.random()*16,['#fff','#e8505b','#f4acb7'][q%3]);

  return c.toDataURL('image/jpeg',0.8); }
