<html lang="ms">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Bintang Kita ✨</title>
<script src="https://unpkg.com/@supabase/supabase-js@2"></script>
<script>if(!window.supabase){document.write('<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"><\/script>');}</script>

<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Caveat:wght@600;700&family=Poppins:wght@400;500;600&display=swap" rel="stylesheet">
<!--
  GiftKita — Kad Love Letter "Bintang Kita" (template: bintang) — buruj bintang, reka sendiri (27 Sep 2026)
  Aliran: bilik malam + tingkap → buka tingkap (muzik) → langit: sambung bintang ikut bentuk hati (setiap bintang = foto + ayat)
          → buruj lengkap, nama bercahaya → tahi bintang, buat hajat (kejutan) → teleskop (video, pilihan) → bulan → surat.
  card_data: template, nama, pengirim, b1_teks..b8_teks, b1_img..b8_img (+_pos), surat, surprise_img (+_pos), surprise, video, yt|mp3, lang
-->
<style>
:root{--emas:#f3d58a}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;overflow:hidden}
body{font-family:Poppins,sans-serif;color:#f6ecd2;-webkit-user-select:none;user-select:none;background:#0b1030}
img{-webkit-user-drag:none;display:block}
button{font-family:inherit}
#langit{position:fixed;inset:0;background:radial-gradient(ellipse 120% 80% at 50% 0%,#1a2358 0%,#0e1440 45%,#0a0d2a 100%),linear-gradient(180deg,#0a0d2a,#2a1d4e);overflow:hidden}
#langit::after{content:"";position:absolute;left:0;right:0;bottom:0;height:40%;background:linear-gradient(180deg,transparent,rgba(120,70,150,.25))}
.bk{position:absolute;border-radius:50%;background:#fff8e0;animation:kelip var(--d,3s) ease-in-out infinite;box-shadow:0 0 4px 1px rgba(255,240,200,.6)}
@keyframes kelip{0%,100%{opacity:.25;transform:scale(.7)}50%{opacity:1;transform:scale(1)}}
.awanM{position:absolute;opacity:.55;animation:hanyut linear infinite}
@keyframes hanyut{from{transform:translateX(110vw)}to{transform:translateX(-130%)}}
.sk{position:fixed;inset:0;display:none;flex-direction:column;align-items:center;justify-content:center;padding:calc(env(safe-area-inset-top,0px) + 54px) 14px calc(env(safe-area-inset-bottom,0px) + 28px);overflow:hidden}
.sk.on{display:flex}
#tabir{position:fixed;inset:0;z-index:500;background:#0a0d2a;opacity:0;pointer-events:none;transition:opacity .5s}
#tabir.on{opacity:1;pointer-events:auto}
.skrip{font:700 clamp(1.9rem,9vw,2.8rem) Caveat,cursive;color:var(--emas);text-align:center;text-shadow:0 0 18px rgba(255,210,120,.55)}
.sub{font:500 clamp(.74rem,3.1vw,.9rem) Poppins,sans-serif;color:#c9c2e8;text-align:center;margin-top:6px}
.pil{margin-top:18px;border:0;border-radius:999px;padding:13px 28px;font:600 .95rem Fredoka,Poppins,sans-serif;cursor:pointer;background:linear-gradient(135deg,#f6dc98,#e2b25a);color:#2a2150;box-shadow:0 0 22px rgba(246,210,130,.5);animation:denyut 1.8s ease-in-out infinite}
.pil.p2{background:rgba(255,255,255,.12);color:#f6ecd2;box-shadow:none;border:1px solid rgba(246,220,152,.5);animation:none}
.pil:active{transform:scale(.95)}
@keyframes denyut{50%{transform:scale(1.05)}}
@keyframes apung{50%{transform:translateY(-10px)}}

/* 1 — bilik */
#sk1{background:radial-gradient(ellipse 90% 70% at 50% 40%,#3a2f63 0%,#241c45 60%,#150f2e 100%)}
#tgBox{position:relative;width:min(86vw,440px);transition:transform 1.4s cubic-bezier(.6,0,.4,1),opacity 1.2s}
#tgBox.zum{transform:scale(7);opacity:0}
#tgBox>img{position:relative;width:100%;z-index:2}
#pandang{position:absolute;overflow:hidden;background:radial-gradient(ellipse at 50% 20%,#233070,#0b1030);z-index:1}
#pandang .bln{position:absolute;left:52%;top:10%;width:34%;filter:drop-shadow(0 0 10px rgba(255,220,140,.6));animation:apung 4s ease-in-out infinite}
#t1{margin-top:14px}

/* 2 — buruj */
#buruj{position:relative}
#buruj svg{position:absolute;inset:0;width:100%;height:100%;overflow:visible}
.garis{stroke:#ffe7a3;stroke-width:1.1;stroke-linecap:round;fill:none;filter:drop-shadow(0 0 1.6px rgba(255,220,140,.95))}
#hatiIsi{fill:rgba(255,214,130,.0);transition:fill 2s}
#buruj.lengkap #hatiIsi{fill:rgba(255,214,130,.12)}
.bt{position:absolute;transform:translate(-50%,-50%);cursor:pointer;transition:transform .3s,filter .3s,opacity .4s;z-index:2}
.bt.kc{z-index:1;filter:drop-shadow(0 0 4px rgba(255,220,140,.8))}
.bt img{width:100%}
.bt.sasar{animation:sasar 1.4s ease-in-out infinite}
.bt.sasar::after{content:"";position:absolute;inset:-30%;border-radius:50%;border:2px solid rgba(255,231,163,.7);animation:cincin 1.4s ease-out infinite}
@keyframes sasar{50%{transform:translate(-50%,-50%) scale(1.18)}}
@keyframes cincin{from{transform:scale(.5);opacity:1}to{transform:scale(1.4);opacity:0}}
.bt.malap{filter:brightness(.45) saturate(.6)}
.bt.nyala{filter:brightness(1.15) drop-shadow(0 0 8px rgba(255,220,140,.9))}
.bt.gegar{animation:bgegar .4s}
@keyframes bgegar{25%{transform:translate(-56%,-50%)}75%{transform:translate(-44%,-50%)}}
#burujNama{position:absolute;left:0;right:0;top:40%;text-align:center;font:700 clamp(1.6rem,7.5vw,2.4rem) Caveat,cursive;color:#fff3cf;text-shadow:0 0 16px rgba(255,210,120,.8);opacity:0;transition:opacity 1.6s;pointer-events:none;padding:0 18%}
#buruj.lengkap #burujNama{opacity:1}
#t2{margin-bottom:6px}
#bulanK{position:fixed;right:6vw;top:calc(env(safe-area-inset-top,0px) + 52px);width:min(18vw,90px);filter:drop-shadow(0 0 14px rgba(255,220,140,.6));animation:apung 5s ease-in-out infinite;z-index:3;pointer-events:none}
#teleskop{position:fixed;left:3vw;bottom:calc(env(safe-area-inset-bottom,0px) + 14px);width:min(24vw,120px);cursor:pointer;display:none;z-index:4;animation:apung 4s ease-in-out infinite}
#teleskop.on{display:block}
#teleskop::after{content:"▶";position:absolute;right:4%;top:4%;width:26px;height:26px;border-radius:50%;background:#e62117;color:#fff;font-size:11px;display:flex;align-items:center;justify-content:center}
#tahi{position:fixed;z-index:6;width:min(70vw,420px);pointer-events:none;opacity:0}
.btnB{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}

/* lapisan kenangan */
.lap{position:fixed;inset:0;z-index:80;display:none;align-items:center;justify-content:center;flex-direction:column;padding:16px}
.lap.on{display:flex;animation:muncul .4s ease}
@keyframes muncul{from{opacity:0}}
#kenLap,#kjLap,#kantaLap{background:rgba(8,10,34,.72);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px)}
.bulat{position:relative;animation:timbul .7s cubic-bezier(.2,1.2,.4,1)}
@keyframes timbul{from{transform:scale(.3) rotate(-20deg);opacity:0}}
.bulat .ft{position:absolute;border-radius:50%;background:#20284f center/cover no-repeat;cursor:zoom-in}
.bulat>img{position:relative;width:100%;pointer-events:none;filter:drop-shadow(0 0 16px rgba(255,210,120,.5))}
.kap{margin-top:14px;max-width:min(86vw,420px);text-align:center;font:700 clamp(1.3rem,6vw,1.8rem)/1.2 Caveat,cursive;color:#fff3cf;text-shadow:0 0 10px rgba(255,210,120,.5);white-space:pre-line}
.no{font:600 .72rem Poppins,sans-serif;letter-spacing:.2em;color:#c9c2e8;margin-bottom:10px}
#kantaBox{position:relative;width:min(84vw,420px)}
#kantaBox>img{position:relative;width:100%;z-index:2;pointer-events:none}
#kantaVid{position:absolute;z-index:1;border-radius:4%;overflow:hidden;background:radial-gradient(circle,#1d2660,#05060f)}
#kantaVid iframe{position:absolute;left:-39%;top:0;width:178%;height:100%;border:0}  /* 16:9 dipotong tengah jadi segi empat sama */

/* 3 — surat */
#sk3 #bulanB{width:min(40vw,190px);filter:drop-shadow(0 0 22px rgba(255,220,140,.7));animation:bulanMasuk 1.4s cubic-bezier(.2,.8,.3,1) both}
@keyframes bulanMasuk{from{transform:translateY(-60vh) scale(.4)}}
#kertasBox{position:relative;width:min(90vw,440px);margin-top:-18px;animation:naik 1.1s cubic-bezier(.2,.8,.3,1) .7s both}
@keyframes naik{from{opacity:0;transform:translateY(80px)}}
#kertasBox>img{width:100%}
#suratTx{position:absolute;overflow-y:auto;font:600 clamp(1.05rem,4.6vw,1.35rem)/1.4 Caveat,cursive;color:#f6dc98;white-space:pre-line;padding:2% 3%;text-shadow:0 0 6px rgba(255,210,120,.35)}
#suratTx .ttd{margin-top:14px;text-align:right;color:#ffd2dd}

/* umum */
#bhs{position:fixed;top:10px;right:10px;z-index:95;display:flex;background:rgba(255,255,255,.14);border-radius:30px;padding:3px;border:1px solid rgba(255,255,255,.2)}
#bhs button{border:0;background:transparent;color:#f6ecd2;font:600 .68rem Poppins,sans-serif;padding:5px 11px;border-radius:20px;cursor:pointer}
#bhs button.on{background:var(--emas);color:#2a2150}
#bMuzik{position:fixed;top:10px;left:10px;z-index:95;width:34px;height:34px;border-radius:50%;border:1px solid rgba(255,255,255,.25);background:rgba(255,255,255,.14);color:var(--emas);font-size:15px;cursor:pointer;display:none}
#bMuzik.on{display:block}#bMuzik.henti{opacity:.5;text-decoration:line-through}
.tagpv{position:fixed;top:12px;left:50%;transform:translateX(-50%);z-index:95;background:rgba(255,255,255,.18);color:#fff;font:500 .53rem Poppins,sans-serif;letter-spacing:.18em;padding:5px 13px;border-radius:40px;pointer-events:none}
.gagal{position:fixed;inset:0;z-index:999;display:flex;align-items:center;justify-content:center;padding:24px;text-align:center;background:#0e1440;font:15px/1.7 Poppins,sans-serif;color:#f6ecd2}
#lb{z-index:1000;background:rgba(6,8,26,.95);padding:0;touch-action:none;overflow:hidden}
#lb img{max-width:100vw;max-height:100vh;transform-origin:0 0;will-change:transform;-webkit-user-drag:none}
#lb .tt{position:absolute;left:0;right:0;bottom:calc(env(safe-area-inset-bottom,0px) + 16px);text-align:center;font:italic 12px Poppins,sans-serif;color:rgba(255,255,255,.6);pointer-events:none}
.x{position:fixed;right:14px;top:14px;width:32px;height:32px;border-radius:50%;border:0;background:rgba(255,255,255,.9);color:#2a2150;font-size:14px;cursor:pointer;z-index:3}
.kilat{position:fixed;z-index:70;pointer-events:none;animation:kilat 1.8s ease-out forwards}
@keyframes kilat{to{transform:translate(var(--dx),var(--dy)) scale(.2) rotate(var(--dr));opacity:0}}
</style>
</head>
<body>
<div id="langit"></div>
<div id="bhs"><button id="bMS" onclick="setBhs('ms')">BM</button><button id="bEN" onclick="setBhs('en')">EN</button></div>
<button id="bMuzik" aria-label="Muzik">♪</button>

<section class="sk on" id="sk1">
  <div id="tgBox"><div id="pandang"><img class="bln" id="iBlnK" alt=""></div><img id="iTingkap" alt=""></div>
  <div class="skrip" id="t1"></div><div class="sub" id="t1s"></div>
  <button class="pil" id="bBuka"></button>
</section>

<section class="sk" id="sk2">
  <div class="skrip" id="t2" style="font-size:clamp(1.4rem,6.4vw,2rem)"></div><div class="sub" id="t2s"></div>
  <div id="buruj"><svg id="svg" viewBox="0 0 100 90" preserveAspectRatio="none"><path id="hatiIsi"/><path id="hatiGaris" fill="none" stroke="rgba(255,231,163,.18)" stroke-width=".35" stroke-dasharray="1 1.4"/><g id="garisG"></g></svg><div id="burujNama"></div></div>
  <div class="btnB" id="btn2"></div>
</section>

<section class="sk" id="sk3">
  <img id="bulanB" alt="">
  <div id="kertasBox"><img id="iKertas" alt=""><div id="suratTx"></div></div>
  <div class="btnB"><button class="pil p2" id="bBalik"></button></div>
</section>

<img id="bulanK" alt="" style="display:none">
<img id="teleskop" alt="">
<img id="tahi" alt="">

<div class="lap" id="kenLap"><div class="no" id="kenNo"></div><div class="bulat" id="kenB"><div class="ft" id="kenFt"></div><img id="kenCincin" alt=""></div><div class="kap" id="kenKap"></div><button class="pil" id="bSambung"></button></div>
<div class="lap" id="kjLap"><div class="no" id="kjNo"></div><div class="bulat" id="kjB"><div class="ft" id="kjFt"></div><img id="kjCincin" alt=""></div><div class="kap" id="kjKap"></div><button class="pil" id="bSurat"></button></div>
<div class="lap" id="kantaLap" onclick="if(event.target===this)tutupVideo()"><button class="x" onclick="tutupVideo()">✕</button><div id="kantaBox"><div id="kantaVid"></div><img id="iKanta" alt=""></div><div class="sub" id="kantaTt" style="margin-top:14px"></div></div>
<div class="lap" id="lb"><button class="x" onclick="tutupLap('lb')">✕</button><img id="lbimg" alt=""><div class="tt" id="lbTt"></div></div>
<div id="tabir"></div>
<audio id="mp3" loop></audio>
<div id="yt-root" style="position:fixed;bottom:-300px;left:-300px;width:1px;height:1px;overflow:hidden"></div>

function percik(el,n){var r=el.getBoundingClientRect(),x=r.left+r.width/2,y=r.top+r.height/2;n=n||10;
  for(var i=0;i<n;i++){var s=document.createElement('img');s.src=ASET[i%3?'kilauK':'kilau'];s.className='kilat';var z=rnd(10,24);s.style.width=z+'px';s.style.left=(x-z/2)+'px';s.style.top=(y-z/2)+'px';
    var a=rnd(0,Math.PI*2),d=rnd(40,n>12?220:110);s.style.setProperty('--dx',Math.cos(a)*d+'px');s.style.setProperty('--dy',Math.sin(a)*d+'px');s.style.setProperty('--dr',rnd(-180,180)+'deg');
    document.body.appendChild(s);setTimeout(function(s){s.remove();}.bind(null,s),1900);}}
var AC=null;
function bunyi(j){try{AC=AC||new (window.AudioContext||window.webkitAudioContext)();var t=AC.currentTime;
  var not={ting:[1568,2093],garis:[784],lengkap:[1047,1319,1568,2093],tahi:[2637]}[j]||[880];
  not.forEach(function(f,i){var o=AC.createOscillator(),g=AC.createGain();o.type=j==='garis'?'triangle':'sine';o.frequency.setValueAtTime(f,t+i*.12);if(j==='tahi')o.frequency.exponentialRampToValueAtTime(900,t+1.2);
    o.connect(g);g.connect(AC.destination);g.gain.setValueAtTime(.0001,t+i*.12);g.gain.exponentialRampToValueAtTime(j==='garis'?.03:.06,t+i*.12+.02);g.gain.exponentialRampToValueAtTime(.0001,t+i*.12+(j==='tahi'?1.3:.9));o.start(t+i*.12);o.stop(t+i*.12+1.4);});}catch(e){}}

/* lightbox: cubit zum, seret, dwiketik; ketik sekali (tanpa zum) = tutup */
var LB={s:1,x:0,y:0};
function lbBuka(src){var im=$('lbimg');im.src=src;LB={s:1,x:0,y:0};lbTerap();$('lbTt').textContent=T('lbTt');$('lb').classList.add('on');}
function lbTerap(){$('lbimg').style.transform='translate('+LB.x+'px,'+LB.y+'px) scale('+LB.s+')';}
(function(){var lb=$('lb'),im=$('lbimg'),pts={},d0=0,s0=1,c0=null,x0=0,y0=0,gerak=false,lastTap=0,tapT=0;
  function pusat(){var k=Object.keys(pts);if(k.length<2)return null;var a=pts[k[0]],b=pts[k[1]];return{x:(a.x+b.x)/2,y:(a.y+b.y)/2,d:Math.hypot(a.x-b.x,a.y-b.y)};}
  lb.addEventListener('pointerdown',function(e){if(e.target.closest('.x'))return;pts[e.pointerId]={x:e.clientX,y:e.clientY};try{lb.setPointerCapture(e.pointerId);}catch(_){}
    var p=pusat();if(p){d0=p.d;s0=LB.s;c0=p;x0=LB.x;y0=LB.y;}else{x0=LB.x;y0=LB.y;c0={x:e.clientX,y:e.clientY};}gerak=false;tapT=Date.now();});
  lb.addEventListener('pointermove',function(e){if(!pts[e.pointerId])return;pts[e.pointerId]={x:e.clientX,y:e.clientY};var p=pusat();
    if(p){var s=Math.max(1,Math.min(5,s0*p.d/d0));var r=im.getBoundingClientRect();
      /* zum ke arah titik cubit: kekalkan titik bawah jari */
      var px=(c0.x-(x0+im.offsetLeft))/s0,py=(c0.y-(y0+im.offsetTop))/s0;
      LB.s=s;LB.x=p.x-im.offsetLeft-px*s;LB.y=p.y-im.offsetTop-py*s;gerak=true;lbTerap();}
    else if(LB.s>1){var dx=e.clientX-c0.x,dy=e.clientY-c0.y;if(Math.hypot(dx,dy)>6)gerak=true;LB.x=x0+dx;LB.y=y0+dy;lbTerap();}});
  function lepas(e){if(!pts[e.pointerId])return;delete pts[e.pointerId];
    if(Object.keys(pts).length===0){var t=Date.now();
      if(!gerak&&t-tapT<300){if(t-lastTap<320){/* dwiketik: zum 2.5x ke titik / reset */
          if(LB.s>1){LB={s:1,x:0,y:0};}else{var s=2.5,px=e.clientX-im.offsetLeft,py=e.clientY-im.offsetTop;LB={s:s,x:px-px*s,y:py-py*s};}lbTerap();lastTap=0;}
        else{lastTap=t;setTimeout(function(){if(lastTap===t&&LB.s===1)tutupLap('lb');},320);}}
      if(LB.s===1){LB.x=0;LB.y=0;lbTerap();}}
    else{var k=Object.keys(pts)[0];c0={x:pts[k].x,y:pts[k].y};x0=LB.x;y0=LB.y;}}
  lb.addEventListener('pointerup',lepas);lb.addEventListener('pointercancel',lepas);
})();


/* ═══ MUZIK ═══ */
var mode=null,ytp=null,ytOk=false,siapM=false,mainLagu=false,dihentiUser=false;
function muzik(){if(siapM||!D)return;siapM=true;
  if(D.mp3){mode='mp3';var a=$('mp3');a.src=D.mp3;a.play().then(function(){setMain(true);}).catch(function(){});$('bMuzik').classList.add('on');}
  else if(D.yt){var id=ytId(D.yt);if(!id)return;mode='yt';$('bMuzik').classList.add('on');
    if(window.YT&&YT.Player)buatYT(id);else{var s=document.createElement('script');s.src='https://www.youtube.com/iframe_api';document.head.appendChild(s);window.onYouTubeIframeAPIReady=function(){buatYT(id);};}}
}
function buatYT(id){ytp=new YT.Player('yt-root',{width:'1',height:'1',videoId:id,playerVars:{autoplay:1,controls:0,disablekb:1,fs:0,rel:0,playsinline:1,loop:1,playlist:id},
  events:{onReady:function(){ytOk=true;try{ytp.playVideo();}catch(e){}},onStateChange:function(e){setMain(e.data===1);}}});}
function setMain(b){mainLagu=b;$('bMuzik').classList.toggle('henti',!b);}
function hentiMuzik(user){if(user)dihentiUser=true;if(mode==='mp3'){$('mp3').pause();setMain(false);}else if(ytp&&ytOk)try{ytp.pauseVideo();}catch(e){}}
function sambungMuzik(user){if(user)dihentiUser=false;if(dihentiUser)return;
  if(mode==='mp3'){var a=$('mp3');if(a.paused)a.play().then(function(){setMain(true);}).catch(function(){});}
  else if(mode==='yt'&&ytp&&ytOk){try{if(ytp.getPlayerState()!==1)ytp.playVideo();}catch(e){}}}
