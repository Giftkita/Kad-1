<!DOCTYPE html>
<html lang="ms">
<head>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&family=Fredoka:wght@700&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
body{font-family:Poppins,system-ui,sans-serif;background:linear-gradient(180deg,#e9e4f7,#f6f2fb 55%,#fff6e3);background-attachment:fixed;color:#4a3b3d;min-height:100vh}
.wrap{max-width:620px;margin:0 auto;padding:18px 16px 60px}
h1{font:700 2rem Fredoka,Poppins,sans-serif;color:#2a2150;text-align:center;margin:4px 0 2px}
.sub{text-align:center;color:#9a7f84;font-size:.8rem;margin-bottom:14px}
.aliran{display:flex;gap:6px;justify-content:center;flex-wrap:wrap;margin:0 0 16px}
.aliran span{font-size:.68rem;color:#9a7f84;background:rgba(255,255,255,.55);padding:4px 10px;border-radius:50px}
.sect{background:#fffdfd;border-radius:16px;padding:16px;margin-bottom:14px;box-shadow:0 8px 24px rgba(120,60,50,.12)}
.sect h2{font-size:.95rem;color:#2a2150;border-bottom:2px solid #fbe3e6;padding-bottom:6px;margin-bottom:10px}
label{display:block;font-size:.8rem;font-weight:500;color:#5a4a4c;margin:10px 0 4px}
input[type=text],input[type=url],input[type=date],textarea{width:100%;padding:10px 12px;border:1.5px solid #f0d5d9;border-radius:10px;font-family:inherit;font-size:.88rem;background:#fff;color:#4a3b3d}
input:focus,textarea:focus{outline:none;border-color:#e2b25a}
textarea{min-height:140px;resize:vertical;line-height:1.55}
.hint{font-size:.72rem;color:#a0898d;margin-top:3px;line-height:1.5}
.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-top:8px}
.th{position:relative;border-radius:4px;overflow:hidden;background:#fdf0f2;border:1.5px dashed #eaa9af;display:flex;align-items:center;justify-content:center;font-size:.68rem;color:#c0616c;text-align:center;cursor:pointer;box-shadow:0 0 0 5px #fff,0 4px 12px rgba(120,60,50,.12)}
.th img{width:100%;height:100%;object-fit:cover}
.th .num{position:absolute;top:4px;left:4px;min-width:20px;height:20px;border-radius:10px;padding:0 5px;background:rgba(184,51,60,.85);color:#fff;font-size:.66rem;display:flex;align-items:center;justify-content:center}
.th .del{position:absolute;top:4px;right:4px;width:20px;height:20px;border-radius:50%;background:rgba(184,51,60,.85);color:#fff;font-size:.7rem;border:0;cursor:pointer}
.th input{position:absolute;inset:0;opacity:0;cursor:pointer}
.btn2{display:inline-block;padding:9px 14px;border:1.5px solid #e2b25a;background:#fff;color:#2a2150;border-radius:10px;font:600 .8rem Poppins,sans-serif;cursor:pointer}
.btn2.on{background:#2a2150;color:#fff}
.toggle{display:flex;gap:8px;margin-top:4px}.toggle .btn2{flex:1}
.panel{display:none;margin-top:6px}.panel.on{display:block}
#petaWrap{position:relative;margin-top:10px;border-radius:12px;overflow:hidden;display:none;cursor:crosshair}
#petaWrap img{display:block;width:100%}
.pinF{position:absolute;width:26px;height:26px;border-radius:50%;background:#e2b25a;border:2px solid #fff;color:#fff;font:600 .72rem/22px Poppins;text-align:center;transform:translate(-50%,-100%);box-shadow:0 2px 6px rgba(0,0,0,.3);pointer-events:none}
.pinK{border:1.5px solid #f5dde0;border-radius:12px;padding:10px;margin-top:10px;display:grid;grid-template-columns:70px 1fr;gap:8px 10px;align-items:start}
.pinK .th{width:70px;height:70px}
.pinK .f label{margin:0 0 2px;font-size:.7rem}.pinK .f input{padding:7px 9px;font-size:.8rem;margin-bottom:6px}
.pinK .hapus{grid-column:1/-1;justify-self:end;border:0;background:none;color:#2a2150;font:500 .72rem Poppins;cursor:pointer}
.rek{display:flex;align-items:center;gap:10px;margin-top:8px;flex-wrap:wrap}
.rek .dot{width:10px;height:10px;border-radius:50%;background:#c33;display:none;animation:kd 1s infinite}
.rek.aktif .dot{display:inline-block}@keyframes kd{50%{opacity:.2}}
#saiz{font-size:.72rem;margin-top:6px;color:#6a8a5a}#saiz.berat{color:#c33;font-weight:600}
#adj{position:fixed;inset:0;z-index:100;background:rgba(60,25,32,.93);display:none;flex-direction:column;align-items:center;justify-content:center;padding:20px}
#adj.on{display:flex}#adj .l{color:#fde;font-size:.78rem;margin-bottom:14px}
#adjBox{position:relative;overflow:hidden;border:6px solid #fff;touch-action:none}
#adjImg{position:absolute;max-width:none;cursor:grab;user-select:none}
#adjOk{margin-top:16px;padding:11px 34px;background:#fff;color:#2a2150;border:0;border-radius:30px;font-weight:700;cursor:pointer;font-family:inherit}
.previewbtn{width:100%;padding:14px;background:linear-gradient(135deg,#e2b25a,#2a2150);color:#fff;border:none;border-radius:12px;font:600 .95rem Poppins,sans-serif;cursor:pointer;margin:4px 0 14px;box-shadow:0 8px 20px rgba(120,60,50,.25)}
#gk-pratonton{min-height:40px;margin-bottom:10px}
.langtoggle{position:fixed;top:10px;right:10px;z-index:50;display:flex;background:#fff;border-radius:30px;padding:3px;box-shadow:0 2px 10px rgba(0,0,0,.15)}
.langtoggle button{border:0;background:transparent;color:#2a2150;font:700 .72rem Poppins;padding:5px 12px;border-radius:20px;cursor:pointer}
.langtoggle button.on{background:#2a2150;color:#fff}
.back{display:block;text-align:center;font-size:.8rem;color:#9a7f84;margin-bottom:6px;text-decoration:none}
.grid.jalur{grid-template-columns:repeat(4,1fr)}
.plan{border:1.5px solid #f5dde0;border-radius:12px;padding:10px 12px;margin-top:10px;background:#fbf8f2}
.plan b{font-size:.78rem;color:#2a2150}
.nt{display:grid;gap:6px;margin-top:6px}
.banyak{position:relative;overflow:hidden;display:block;width:100%;text-align:center;padding:13px;margin-top:10px;background:linear-gradient(135deg,#f6b8c0,#e2b25a);color:#fff;border:0;font-size:.85rem;box-shadow:0 6px 16px rgba(232,129,138,.3)}
.banyak input{position:absolute;inset:0;opacity:0;cursor:pointer}
.kap{display:grid;grid-template-columns:78px 1fr;gap:10px;align-items:start;border:1.5px solid #f5dde0;border-radius:12px;padding:10px;margin-top:10px;background:#fffafb}
.kap b{grid-column:1/-1;font-size:.78rem;color:#2a2150}
.kap textarea{min-height:70px;font-size:.84rem}
.kap .th{width:78px;border-radius:50%}
</style>
</head>
<body>
<div class="langtoggle"><button id="bMS" class="on" onclick="setLang('ms')">BM</button><button id="bEN" onclick="setLang('en')">EN</button></div>
<div class="wrap">
  <a class="back" href="buat-kad-cinta.html" data-i="back">‹ Kembali</a>
  <h1>Bintang Kita ✨</h1>
  <div class="sub" data-i="sub"></div>
  <div class="aliran"><span data-i="a1"></span><span data-i="a2"></span><span data-i="a3"></span><span data-i="a4"></span><span data-i="a5"></span></div>

  <div class="sect"><h2 data-i="hNama"></h2>
    <label data-i="lFrom"></label><input type="text" id="fFrom" maxlength="30" data-ph="phFrom">
    <label data-i="lFor"></label><input type="text" id="fFor" maxlength="30" data-ph="phFor">
  </div>

  <div class="sect"><h2 data-i="hKap"></h2>
    <div class="hint" data-i="hintKap"></div>
    <label class="btn2 banyak"><span data-i="bBanyak"></span><input type="file" id="fBanyak" accept="image/*" multiple></label>
    <div id="proses" class="hint"></div>
    <div id="gKap"></div>
  </div>

  <div class="sect"><h2 data-i="hSurat"></h2>
    <textarea id="fSurat" maxlength="900"></textarea>
    <div class="hint" data-i="hintSurat"></div>
    <label data-i="lKjFoto"></label>
    <div class="grid" id="gKejut" style="grid-template-columns:1fr;max-width:170px;margin:8px auto 0"></div>
    <label data-i="lKjMsg"></label><input type="text" id="fKejut" maxlength="80" data-ph="phKjMsg">
  </div>

  <div class="sect"><h2 data-i="hVideo"></h2>
    <label data-i="lVideo"></label><input type="url" id="fVideo" placeholder="https://youtube.com/watch?v=...">
    <div class="hint" data-i="hintVideo"></div>
  </div>

  <div class="sect"><h2 data-i="hLagu"></h2>
    <div class="toggle"><button type="button" class="btn2 on" id="tYT" data-i="bYT"></button><button type="button" class="btn2" id="tMP3" data-i="bMP3"></button></div>
    <div class="panel on" id="pYT"><label data-i="lYT"></label><input type="url" id="fYT" placeholder="https://youtube.com/watch?v=..."></div>
    <div class="panel" id="pMP3"><label data-i="lMP3"></label><input type="file" id="fMP3" accept="audio/mpeg,audio/mp3"></div>
    <div class="hint" data-i="hintLagu"></div>
  </div>

  <button class="previewbtn" id="btnPreview" type="button" data-i="bPrev"></button>
  <div id="saiz"></div>

  <div class="sect" style="margin-top:16px"><h2 data-i="hBayar"></h2><div id="gk-pratonton"></div><div id="gk-bayar"></div></div>
</div>

<div id="adj"><div class="l" data-i="adj"></div><div id="adjBox"><img id="adjImg" alt=""></div><button type="button" id="adjOk" data-i="selesai"></button></div>

<script src="gk-bayar.js"></script>
<script>
var LANG='ms';
var TX={
 ms:{back:'‹ Kembali',sub:'Langit malam yang romantik: buka tingkap, sambung bintang jadi buruj berbentuk hati (setiap bintang satu kenangan), buat hajat pada tahi bintang dan baca surat dari bulan.',
  a1:'🪟 Buka tingkap',a2:'⭐ Sambung bintang',a3:'💛 Buruj hati',a4:'🌠 Buat hajat',a5:'🌙 Surat bulan',
  hNama:'Nama',lFrom:'Daripada (nama kamu)',phFrom:'Contoh: Danial',lFor:'Untuk (nama penerima)',phFor:'Contoh: Aina',
  hKap:'Bintang kenangan (sehingga 8) ⭐',hintKap:'Setiap bintang = satu gambar (keluar dalam bingkai bulat emas) dan satu ayat. Bintang kosong tak keluar. Buruj tetap berbentuk hati walau berapa bintang pun.',
  bBanyak:'📷 Pilih banyak gambar sekali gus',proses:'Memproses gambar',penuhSlot:'Semua 8 bintang dah ada gambar — buang gambar dulu untuk tukar.',lebih:' gambar tak masuk sebab bintang dah penuh.',
  kap:'Bintang',foto:'Gambar',phTeks:'Ayat untuk kenangan ni…',
  hSurat:'Surat dari bulan 🌙',hintSurat:'Keluar paling akhir atas kertas biru malam bertulisan emas.',
  lKjFoto:'Gambar hajat — tahi bintang (pilihan)',lKjMsg:'Ayat hajat (pilihan)',phKjMsg:'Contoh: Tiket konsert kita dah ada 🎟️',fKejut:'Gambar hajat',
  hVideo:'Video (pilihan) 🎬',lVideo:'Pautan YouTube',hintVideo:'Keluar sebagai teleskop di sudut langit — ketik untuk tengok video dalam kanta.',
  hLagu:'Lagu',bYT:'Pautan YouTube',bMP3:'Upload MP3',lYT:'Pautan YouTube lagu',lMP3:'Fail MP3 (Premium)',hintLagu:'Lagu main bila penerima buka tingkap. Butang ♪ di atas untuk henti/main.',
  bPrev:'👀 Pratonton Kad',hBayar:'Bayaran',adj:'Seret gambar untuk laraskan kedudukan',selesai:'Selesai',
  saiz:'Saiz kad: ',berat:' — terlalu besar, kecilkan/buang beberapa gambar atau MP3',penuh:'Gambar terlalu besar untuk pratonton. Cuba gambar yang lebih kecil.',besar:'Fail terlalu besar (maks 600KB).'},
 en:{back:'‹ Back',sub:'A romantic night sky: open the window, connect the stars into a heart constellation (each star is a memory), make a wish on a shooting star and read a letter from the moon.',
  a1:'🪟 Open the window',a2:'⭐ Connect the stars',a3:'💛 Heart constellation',a4:'🌠 Make a wish',a5:'🌙 Moon letter',
  hNama:'Names',lFrom:'From (your name)',phFrom:'e.g. Danial',lFor:'For (recipient)',phFor:'e.g. Aina',
  hKap:'Memory stars (up to 8) ⭐',hintKap:'Each star = one photo (shown in a round gold frame) and one line. Empty stars are skipped. The constellation is always a heart, whatever the number of stars.',
  bBanyak:'📷 Pick many photos at once',proses:'Processing photos',penuhSlot:'All 8 stars already have photos — remove one first to change it.',lebih:' photo(s) not added because the stars are full.',
  kap:'Star',foto:'Photo',phTeks:'A line for this memory…',
  hSurat:'Letter from the moon 🌙',hintSurat:'Shown last on midnight-blue paper in gold writing.',
  lKjFoto:'Wish photo — shooting star (optional)',lKjMsg:'Wish message (optional)',phKjMsg:'e.g. Our concert tickets are booked 🎟️',fKejut:'Wish photo',
  hVideo:'Video (optional) 🎬',lVideo:'YouTube link',hintVideo:'Shown as a telescope in the corner of the sky — tap to watch the video in the lens.',
  hLagu:'Song',bYT:'YouTube Link',bMP3:'Upload MP3',lYT:'Song YouTube link',lMP3:'MP3 file (Premium)',hintLagu:'The song plays when the window is opened. The ♪ button pauses/plays.',
  bPrev:'👀 Preview Card',hBayar:'Payment',adj:'Drag the photo to adjust its position',selesai:'Done',
  saiz:'Card size: ',berat:' — too big, shrink/remove some photos or the MP3',penuh:'Photos are too large to preview. Try smaller photos.',besar:'File too large (max 600KB).'}
};
var LALAI={
 ms:{kap:['Malam pertama kita berbual sampai subuh 🌙','Tempat kita selalu lepak','Senyuman yang buat aku jatuh cinta','Perjalanan pertama kita berdua','Hari biasa yang jadi istimewa sebab kamu','','',''],
  surat:'Sayang,\n\nKalau setiap kenangan kita ialah bintang, langit aku dah penuh dengan cahaya kamu.\n\nTerima kasih sebab jadi bintang paling terang dalam hidup aku. Walau gelap macam mana pun malam, aku tahu ke mana nak pandang.'},
 en:{kap:['Our first night talking until sunrise 🌙','Our favourite place to hang out','The smile that made me fall in love','Our very first trip together','An ordinary day made special because of you','','',''],
  surat:'My love,\n\nIf every memory of ours were a star, my sky would be full of your light.\n\nThank you for being the brightest star in my life. However dark the night, I always know where to look.'}
};
function t(k){return TX[LANG][k];}
function $(i){return document.getElementById(i);}
function binaMedan(){var g=$('gKap');if(g.children.length)return;
  for(var i=1;i<=8;i++){var d=document.createElement('div');d.className='kap';d.innerHTML='<b class="kt"></b><div id="kf'+i+'"></div><textarea id="kt'+i+'" maxlength="140"></textarea>';g.appendChild(d);
    $('kt'+i).addEventListener('input',kiraSaiz);}}
function setLang(l){LANG=l;try{localStorage.setItem('gk_lang',l);}catch(e){}document.documentElement.lang=l;
  $('bMS').classList.toggle('on',l==='ms');$('bEN').classList.toggle('on',l==='en');
  document.querySelectorAll('[data-i]').forEach(function(e){var v=TX[l][e.getAttribute('data-i')];if(v!=null)e.textContent=v;});
  document.querySelectorAll('[data-ph]').forEach(function(e){var v=TX[l][e.getAttribute('data-ph')];if(v!=null)e.placeholder=v;});
  binaMedan();var L=LALAI[l];
  [].forEach.call(document.querySelectorAll('.kap'),function(d,j){d.querySelector('.kt').textContent=t('kap')+' '+(j+1);var x=$('kt'+(j+1));x.placeholder=t('phTeks');if(!x.dataset.ubah)x.value=L.kap[j];});
  if(!$('fSurat').dataset.ubah)$('fSurat').value=L.surat;
  renderFoto();if(window.GKBayar&&GKBayar.lang)GKBayar.lang();}
document.addEventListener('input',function(e){if(e.target.matches('#gKap textarea,#fSurat'))e.target.dataset.ubah='1';});

var RATIO={surprise_img:1,b1_img:1,b2_img:1,b3_img:1,b4_img:1,b5_img:1,b6_img:1,b7_img:1,b8_img:1};
var F={},POS={};
var SLOT=['b1_img','b2_img','b3_img','b4_img','b5_img','b6_img','b7_img','b8_img'];
/* isi petak kosong ikut turutan, bermula dari petak 'mula' (atau yang pertama kosong); proses satu-satu supaya tak tersekat */
function isiBanyak(files,mula){var kosong=SLOT.slice(mula?SLOT.indexOf(mula):0).concat(mula?SLOT.slice(0,SLOT.indexOf(mula)):[]).filter(function(k){return !F[k];});
  if(!kosong.length){alert(t('penuhSlot'));return;}
  var lebih=Math.max(0,files.length-kosong.length);files=files.slice(0,kosong.length);var n=0,p=$('proses');
  (function satu(){if(n>=files.length){p.textContent='';renderFoto();if(lebih)alert(lebih+t('lebih'));return;}
    p.textContent=t('proses')+' '+(n+1)+'/'+files.length+'…';var k=kosong[n];
    resize(files[n],760,.8,function(d){F[k]=d;n++;if(n%3===0)renderFoto();satu();});})();}
function resize(file,maxW,q,cb){var r=new FileReader();r.onload=function(ev){var im=new Image();im.onload=function(){var s=Math.min(1,maxW/Math.max(im.width,im.height)),w=Math.round(im.width*s),h=Math.round(im.height*s);
  var c=document.createElement('canvas');c.width=w;c.height=h;c.getContext('2d').drawImage(im,0,0,w,h);cb(c.toDataURL('image/jpeg',q));};im.src=ev.target.result;};r.readAsDataURL(file);}
function kotak(k,label,num){var el=document.createElement('div');el.className='th';el.style.aspectRatio=RATIO[k];
  if(F[k]){var p=POS[k]||{x:50,y:50};el.innerHTML='<img src="'+F[k]+'" style="object-position:'+p.x+'% '+p.y+'%"><div class="num">'+num+'</div><button type="button" class="del">✕</button>';
    el.querySelector('.del').onclick=function(e){e.stopPropagation();delete F[k];delete POS[k];renderFoto();};el.querySelector('img').onclick=function(){bukaAdj(k);};}
  else{el.textContent='📷 '+label;var i=document.createElement('input');i.type='file';i.accept='image/*';if(SLOT.indexOf(k)>=0)i.multiple=true;
    i.onchange=function(){if(!i.files.length)return;if(SLOT.indexOf(k)>=0)isiBanyak([].slice.call(i.files),k);else resize(i.files[0],760,.8,function(d){F[k]=d;renderFoto();});};el.appendChild(i);}
  return el;}
function renderFoto(){for(var i=1;i<=8;i++){var c=$('kf'+i);if(!c)continue;c.innerHTML='';c.appendChild(kotak('b'+i+'_img',t('foto'),i));}
  var gk=$('gKejut');gk.innerHTML='';gk.appendChild(kotak('surprise_img',t('fKejut'),'🌠'));kiraSaiz();}
var adj=null;
function bukaAdj(k){var box=$('adjBox'),im=$('adjImg'),bw=Math.min(280,innerWidth-40),bh=bw/RATIO[k];box.style.width=bw+'px';box.style.height=bh+'px';im.src=F[k];$('adj').classList.add('on');
  im.onload=function(){var s=Math.max(bw/im.naturalWidth,bh/im.naturalHeight),dw=im.naturalWidth*s,dh=im.naturalHeight*s,p=POS[k]||{x:50,y:50};im.style.width=dw+'px';im.style.height=dh+'px';
    adj={k:k,dw:dw,dh:dh,bw:bw,bh:bh,x:-(p.x/100)*(dw-bw),y:-(p.y/100)*(dh-bh)};im.style.left=adj.x+'px';im.style.top=adj.y+'px';};}
(function(){var im=$('adjImg'),d=false,sx,sy,ox,oy;im.onpointerdown=function(e){if(!adj)return;d=true;sx=e.clientX;sy=e.clientY;ox=adj.x;oy=adj.y;};
  addEventListener('pointermove',function(e){if(!d)return;adj.x=Math.min(0,Math.max(adj.bw-adj.dw,ox+e.clientX-sx));adj.y=Math.min(0,Math.max(adj.bh-adj.dh,oy+e.clientY-sy));im.style.left=adj.x+'px';im.style.top=adj.y+'px';});
  addEventListener('pointerup',function(){d=false;});})();
$('adjOk').onclick=function(){if(!adj)return;POS[adj.k]={x:Math.round(adj.dw>adj.bw?-adj.x/(adj.dw-adj.bw)*100:50),y:Math.round(adj.dh>adj.bh?-adj.y/(adj.dh-adj.bh)*100:50)};$('adj').classList.remove('on');adj=null;renderFoto();};

/* ── lagu ── */
var MP3=null;
$('tYT').onclick=function(){$('tYT').classList.add('on');$('tMP3').classList.remove('on');$('pYT').classList.add('on');$('pMP3').classList.remove('on');kiraSaiz();};
$('tMP3').onclick=function(){$('tMP3').classList.add('on');$('tYT').classList.remove('on');$('pMP3').classList.add('on');$('pYT').classList.remove('on');kiraSaiz();};
$('fMP3').onchange=function(e){var f=e.target.files[0];if(!f)return;var r=new FileReader();r.onload=function(ev){MP3=ev.target.result;kiraSaiz();};r.readAsDataURL(f);};

/* ── kumpul data (SYNC, return terus) ── */
function collect(){
  var D={template:'bintang',pengirim:$('fFrom').value.trim(),nama:$('fFor').value.trim(),surat:$('fSurat').value,
    surprise:$('fKejut').value.trim(),video:$('fVideo').value.trim(),lang:LANG};
  for(var i=1;i<=8;i++){var x=$('kt'+i);if(x&&x.value.trim())D['b'+i+'_teks']=x.value.trim();}
  ['b1_img','b2_img','b3_img','b4_img','b5_img','b6_img','b7_img','b8_img','surprise_img'].forEach(function(k){if(F[k]){D[k]=F[k];if(POS[k])D[k+'_pos']=POS[k].x+'% '+POS[k].y+'%';}});
  if($('tMP3').classList.contains('on')){if(MP3)D.mp3=MP3;}else D.yt=$('fYT').value.trim();
  return D;
}
function kiraSaiz(){if(!$('kt1'))return;var kb=JSON.stringify(collect()).length/1024,el=$('saiz');el.textContent=t('saiz')+(kb/1024).toFixed(2)+' MB'+(kb>3800?t('berat'):'');el.classList.toggle('berat',kb>3800);}
['fFrom','fFor','fSurat','fKejut','fYT','fVideo'].forEach(function(i){$(i).addEventListener('input',kiraSaiz);});
$('fBanyak').onchange=function(e){var fs=[].slice.call(e.target.files);e.target.value='';if(fs.length)isiBanyak(fs,null);};
$('btnPreview').onclick=function(){try{localStorage.setItem('gk_preview',JSON.stringify(collect()));}catch(e){alert(t('penuh'));return;}window.open('card-bintang-1.html?preview=1','_blank');};

if(window.GKBayar){GKBayar.mount({el:'gk-bayar',previewEl:'gk-pratonton',viewer:'card-bintang-1.html',collect:collect,produk:'Bintang Kita',qr:true});}
else{$('gk-bayar').innerHTML='<div style="padding:14px 16px;background:#ffebee;border:1.5px solid #ef9a9a;border-radius:12px;font-size:.82rem;color:#c62828">Fail <b>gk-bayar.js</b> tidak dijumpai. Pastikan ia di root repo, bukan dalam folder api.</div>';}
try{if(localStorage.getItem('gk_lang')==='en')LANG='en';}catch(e){}
setLang(LANG);
</script>
