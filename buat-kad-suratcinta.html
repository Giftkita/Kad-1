<!DOCTYPE html>
<html lang="ms">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Buat Kad — Surat Cinta</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
body{font-family:Georgia,'Times New Roman',serif;background:#f3ead9;color:#0a1a2f}
.wrap{max-width:620px;margin:0 auto;padding:18px 16px 60px}
h1{font-size:1.3rem;color:#0a1a2f;text-align:center;margin-bottom:4px}
.sub{text-align:center;color:#6b5c3f;font-size:.8rem;margin-bottom:20px}
.sect{background:#fff;border:1px solid #e3d7bd;border-radius:10px;padding:16px;margin-bottom:16px}
.sect h2{font-size:1rem;color:#13294b;border-bottom:2px solid #c9a24b;padding-bottom:6px;margin-bottom:12px}
label{display:block;font-size:.85rem;color:#3a2f12;margin:10px 0 4px}
input[type=text],input[type=url],textarea{width:100%;padding:9px 10px;border:1px solid #cbb98f;
 border-radius:6px;font-family:inherit;font-size:.9rem;background:#fffdf7}
textarea{min-height:90px;resize:vertical}
.hint{font-size:.72rem;color:#8a7a55;margin-top:2px}
.foto-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:8px}
.foto-slot{position:relative;aspect-ratio:1;border:1.5px dashed #c9a24b;border-radius:8px;
 overflow:hidden;background:#f7f1e3;display:flex;align-items:center;justify-content:center;
 font-size:.65rem;color:#8a7a55;text-align:center;cursor:pointer}
.foto-slot img{width:100%;height:100%;object-fit:cover}
.foto-slot input{position:absolute;inset:0;opacity:0;cursor:pointer}
.music-toggle{display:flex;gap:8px;margin-top:8px}
.music-toggle button{flex:1;padding:8px;border:1px solid #c9a24b;background:#fff;border-radius:6px;
 font-size:.8rem;cursor:pointer;color:#13294b}
.music-toggle button.on{background:#13294b;color:#fff}
.music-panel{display:none;margin-top:8px}
.music-panel.on{display:block}
#gk-pratonton{min-height:40px;margin-bottom:10px}
#gk-bayar{margin-top:6px}
.previewbtn{width:100%;padding:12px;background:#0a1a2f;color:#f3ead9;border:none;border-radius:8px;
 font-size:.95rem;cursor:pointer;margin-top:6px}
</style>
</head>
<body>
<div class="wrap">
  <h1>A Special Letter — Just For You</h1>
  <div class="sub">Isi borang di bawah untuk buat kad surat cinta korang sendiri</div>

  <div class="sect">
    <h2>Nama</h2>
    <label>Nama penerima (untuk rujukan sahaja — belum dipaparkan atas kad)</label>
    <input type="text" id="f-nama" placeholder="Contoh: Aina">
    <label>Nama pengirim (untuk rujukan sahaja)</label>
    <input type="text" id="f-pengirim" placeholder="Contoh: Danial">
  </div>

  <div class="sect">
    <h2>Gambar (maksimum 10)</h2>
    <div class="hint">Ketik setiap kotak untuk upload. Boleh biar kosong jika tiada gambar untuk slot tu.</div>
    <div class="foto-grid" id="fotoGrid"></div>
  </div>

  <div class="sect">
    <h2>Video (pilihan)</h2>
    <label>Pautan YouTube</label>
    <input type="url" id="f-vid" placeholder="https://youtube.com/watch?v=...">
  </div>

  <div class="sect">
    <h2>Surat Cinta</h2>
    <label>Bahagian 1 (surat permulaan)</label>
    <textarea id="f-surat1" placeholder="Hai, sayang..."></textarea>
    <label>Bahagian 2 (sambungan &amp; penutup surat)</label>
    <textarea id="f-surat2" placeholder="Aku harap kau tahu..."></textarea>
  </div>

  <div class="sect">
    <h2>Kejutan</h2>
    <label>Mesej kejutan (dipaparkan bila customer ketik reveal)</label>
    <textarea id="f-kejut" placeholder="Aku ada satu lagi kejutan untuk kau..."></textarea>
  </div>

  <div class="sect">
    <h2>Muzik</h2>
    <div class="music-toggle">
      <button type="button" id="btnYT" class="on">Pautan YouTube</button>
      <button type="button" id="btnMP3">Upload MP3</button>
    </div>
    <div class="music-panel on" id="panelYT">
      <label>Pautan YouTube lagu</label>
      <input type="url" id="f-lagu-yt" placeholder="https://youtube.com/watch?v=...">
    </div>
    <div class="music-panel" id="panelMP3">
      <label>Fail MP3</label>
      <input type="file" id="f-lagu-mp3" accept="audio/mpeg,audio/mp3">
    </div>
    <label>Tajuk lagu (papar semasa main)</label>
    <input type="text" id="f-mtitle" placeholder="Contoh: Lagu Kita">
  </div>

  <button class="previewbtn" id="btnPreview" type="button">Pratonton Kad</button>

  <div class="sect" style="margin-top:16px">
    <h2>Bayaran</h2>
    <div id="gk-pratonton"></div>
    <div id="gk-bayar"></div>
  </div>
</div>

<script src="gk-bayar.js"></script>
<script>
var FOTO_N = 10;
var fotoData = {};

(function buildFotoGrid(){
  var grid = document.getElementById('fotoGrid');
  for (var i = 1; i <= FOTO_N; i++) {
    var slot = document.createElement('div');
    slot.className = 'foto-slot';
    slot.id = 'slot-f' + i;
    slot.innerHTML = 'Foto ' + i +
      '<input type="file" accept="image/*" data-n="' + i + '">';
    grid.appendChild(slot);
    slot.querySelector('input').addEventListener('change', onFotoChange);
  }
})();

function onFotoChange(e){
  var n = e.target.getAttribute('data-n');
  var file = e.target.files[0];
  if (!file) return;
  resizeImage(file, 800, 0.8, function(dataUrl){
    fotoData['f' + n] = dataUrl;
    var slot = document.getElementById('slot-f' + n);
    var img = slot.querySelector('img');
    if (!img) {
      img = document.createElement('img');
      slot.insertBefore(img, slot.firstChild);
    }
    img.src = dataUrl;
  });
}

function resizeImage(file, maxW, quality, cb){
  var reader = new FileReader();
  reader.onload = function(ev){
    var img = new Image();
    img.onload = function(){
      var scale = Math.min(1, maxW / img.width);
      var w = Math.round(img.width * scale);
      var h = Math.round(img.height * scale);
      var canvas = document.createElement('canvas');
      canvas.width = w; canvas.height = h;
      canvas.getContext('2d').drawImage(img, 0, 0, w, h);
      cb(canvas.toDataURL('image/jpeg', quality));
    };
    img.src = ev.target.result;
  };
  reader.readAsDataURL(file);
}

/* muzik toggle */
var btnYT = document.getElementById('btnYT'), btnMP3 = document.getElementById('btnMP3');
var panelYT = document.getElementById('panelYT'), panelMP3 = document.getElementById('panelMP3');
btnYT.onclick = function(){
  btnYT.classList.add('on'); btnMP3.classList.remove('on');
  panelYT.classList.add('on'); panelMP3.classList.remove('on');
};
btnMP3.onclick = function(){
  btnMP3.classList.add('on'); btnYT.classList.remove('on');
  panelMP3.classList.add('on'); panelYT.classList.remove('on');
};

function collect(cb){
  var D = {
    nama: document.getElementById('f-nama').value.trim(),
    pengirim: document.getElementById('f-pengirim').value.trim(),
    vid_yt: document.getElementById('f-vid').value.trim(),
    surat1: document.getElementById('f-surat1').value,
    surat2: document.getElementById('f-surat2').value,
    kejut_msg: document.getElementById('f-kejut').value,
    mtitle: document.getElementById('f-mtitle').value.trim() || 'Lagu Kita'
  };
  for (var i = 1; i <= FOTO_N; i++) {
    if (fotoData['f' + i]) D['f' + i] = fotoData['f' + i];
  }
  var useMP3 = btnMP3.classList.contains('on');
  if (useMP3) {
    var file = document.getElementById('f-lagu-mp3').files[0];
    if (file) {
      var reader = new FileReader();
      reader.onload = function(ev){ D.mp3 = ev.target.result; if (cb) cb(D); };
      reader.readAsDataURL(file);
      return;
    }
    if (cb) cb(D);
  } else {
    D.yt = document.getElementById('f-lagu-yt').value.trim();
    if (cb) cb(D);
  }
}

document.getElementById('btnPreview').addEventListener('click', function(){
  collect(function(D){
    try { localStorage.setItem('gk_preview', JSON.stringify(D)); } catch (e) {}
    window.open('card-suratcinta-1.html?preview=1', '_blank');
  });
});

/* ---- sambung ke enjin bayaran (gk-bayar.js) ----
   Ikut corak sedia ada: GKBayar.mount({el, previewEl, viewer, collect, produk, qr})
   Sila semak semula selepas gk-bayar.js diupload — struktur ni ikut dokumentasi
   projek, belum diuji terus dengan fail gk-bayar.js sebenar dalam sesi ni. */
if (window.GKBayar) {
  GKBayar.mount({
    el: document.getElementById('gk-bayar'),
    previewEl: document.getElementById('gk-pratonton'),
    viewer: 'card-suratcinta-1.html',
    collect: collect,
    produk: 'Surat Cinta',
    qr: false
  });
}
</script>
</body>
</html>
