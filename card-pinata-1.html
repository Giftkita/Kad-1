<!--

<style>
:root{--ink:#5a2f4a}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;overflow:hidden}
body{font-family:Poppins,sans-serif;color:var(--ink);-webkit-user-select:none;user-select:none;background:#ffe6d6}
img{-webkit-user-drag:none;display:block}
button{font-family:inherit}
#laman{position:fixed;inset:0;overflow:hidden;background:radial-gradient(circle at 78% 22%,rgba(255,250,220,.95) 0 40px,rgba(255,240,200,.5) 70px,rgba(255,240,200,0) 160px),linear-gradient(#ffd9c7 0%,#ffcfe0 45%,#e6d2ff 78%)}
#laman>*{position:absolute}
.awan{background:#fff;border-radius:999px;opacity:.75;filter:blur(1px);animation:hanyut linear infinite}
.awan::before,.awan::after{content:"";position:absolute;background:#fff;border-radius:50%}
.awan::before{width:55%;height:160%;left:15%;bottom:20%}.awan::after{width:40%;height:130%;right:12%;bottom:25%}
@keyframes hanyut{from{translate:-40vw 0}to{translate:140vw 0}}
#rumput{left:-5%;right:-5%;bottom:0;height:26%;background:radial-gradient(circle at 20px -6px,transparent 18px,#b9e6b0 19px) 0 0/40px 26px repeat-x,linear-gradient(#b9e6b0 26px,#a6dba0 60%,#94cf8f)}
#bunting{z-index:3;animation:ayunB 5s ease-in-out infinite;transform-origin:50% 0;pointer-events:none}
@keyframes ayunB{50%{rotate:.8deg}}
.hias{pointer-events:none;filter:drop-shadow(0 8px 10px rgba(120,60,90,.22))}
.hias.apung{animation:apung 4s ease-in-out infinite}
@keyframes apung{50%{translate:0 -12px;rotate:2deg}}
#ayun{z-index:5;width:0;transform-origin:0 0}
#tali{position:absolute;left:-1.5px;top:0;width:3px;background:linear-gradient(90deg,#b58d5b,#e4c89b,#b58d5b)}
#pin{position:absolute;cursor:pointer}
#pin>img{width:100%;filter:drop-shadow(0 12px 14px rgba(120,60,90,.28))}
#retak{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;-webkit-mask-size:100% 100%;mask-size:100% 100%;-webkit-mask-repeat:no-repeat;mask-repeat:no-repeat}
#retak path{fill:none;stroke-linecap:round;stroke-linejoin:round}
#pin.gegar{animation:gegar .25s}
@keyframes gegar{25%{translate:-5px 2px}50%{translate:5px -2px}75%{translate:-3px 1px}}
#kayu{z-index:8;pointer-events:none;opacity:0;filter:drop-shadow(0 8px 10px rgba(80,40,60,.3));left:0;top:0}
#kayu.tangan{opacity:1;transition:none}
#kayu.rehat{opacity:1;animation:rehat 1.6s ease-in-out infinite}
@keyframes rehat{50%{translate:0 -10px}}
#laman.main{touch-action:none}
#jari{position:fixed;z-index:14;pointer-events:none;font-size:34px;opacity:0;transition:opacity .3s}
#jari.on{opacity:1;animation:jari 1.8s ease-in-out infinite}
@keyframes jari{0%,100%{translate:-40px 0;rotate:-15deg}50%{translate:40px -30px;rotate:15deg}}
.benda.gul.dah img{filter:saturate(.7) brightness(1.02) drop-shadow(0 4px 4px rgba(80,40,60,.2));animation:none}
.benda.gul.dah::after{content:"✓";position:absolute;right:-4px;top:-8px;width:20px;height:20px;border-radius:50%;background:#7cc98a;color:#fff;font:700 12px/20px Fredoka,sans-serif;text-align:center}
.benda.emas.dah img{animation:none;filter:drop-shadow(0 0 6px rgba(255,220,120,.7))}
#senarai{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;max-width:min(88vw,360px);width:100%}
#senarai button{aspect-ratio:1;border-radius:16px;background:rgba(255,255,255,.85) center 38%/64% no-repeat;border:1.5px solid #f3c4dc;color:#b0508a;font:700 .8rem Fredoka,sans-serif;cursor:pointer;display:flex;align-items:flex-end;justify-content:center;padding-bottom:7px;box-shadow:0 4px 10px rgba(120,60,90,.12)}
.jumbai{position:fixed;z-index:9;width:10px;height:5px;border-radius:2px;pointer-events:none;animation:jumbai 1.2s ease-out forwards}
@keyframes jumbai{to{translate:var(--dx) var(--dy);rotate:var(--dr);opacity:0}}
.serpih{position:fixed;z-index:9;pointer-events:none;background-size:100% 100%;background-repeat:no-repeat;filter:drop-shadow(0 6px 6px rgba(80,40,60,.25))}
.benda{position:absolute;left:0;top:0;z-index:6;cursor:grab;will-change:transform;touch-action:none}
.benda.seret{cursor:grabbing}
.benda.seret img{filter:drop-shadow(0 14px 12px rgba(80,40,60,.35));scale:1.08}
.benda img{width:100%;pointer-events:none;filter:drop-shadow(0 5px 5px rgba(80,40,60,.25))}
.benda.gul{z-index:7}
.benda.gul.sedia img{animation:cahaya 1.4s ease-in-out infinite}
@keyframes cahaya{50%{filter:drop-shadow(0 0 10px rgba(255,255,255,.95)) drop-shadow(0 0 16px rgba(255,190,220,.9))}}
.benda.emas img{animation:cahayaE 1.1s ease-in-out infinite}
@keyframes cahayaE{50%{filter:drop-shadow(0 0 14px rgba(255,230,140,1)) drop-shadow(0 0 24px rgba(255,200,80,.9))}}
.benda.picit img{animation:picit .35s}
@keyframes picit{40%{scale:1.25 .8}}
.kil{position:fixed;z-index:12;pointer-events:none;font-size:16px;animation:kil .8s ease-out forwards}
@keyframes kil{to{translate:var(--dx) var(--dy);opacity:0;scale:.4}}
#atas{position:fixed;left:0;right:0;top:calc(env(safe-area-inset-top,0px) + 86px);z-index:15;text-align:center;padding:0 18px;pointer-events:none}
.tajuk{font:700 clamp(1.4rem,6.6vw,2.1rem)/1.1 Fredoka,Poppins,sans-serif;color:#fff;-webkit-text-stroke:1.2px #e46aa6;text-shadow:0 3px 0 #e46aa6,0 6px 18px rgba(228,106,166,.45)}
.sub{font:500 clamp(.74rem,3.1vw,.9rem) Poppins,sans-serif;color:#8a4f78;margin-top:5px}
#kaunter{display:none;margin:8px auto 0;width:max-content;background:rgba(255,255,255,.85);border:1px solid #f3c4dc;border-radius:999px;padding:5px 13px;font:600 .78rem Fredoka,Poppins,sans-serif;color:#b0508a}
#kaunter.on{display:block}
#bawah{position:fixed;left:0;right:0;bottom:calc(env(safe-area-inset-bottom,0px) + 18px);z-index:15;display:flex;flex-direction:column;align-items:center;gap:8px;padding:0 16px;pointer-events:none}
#bawah>*{pointer-events:auto}
#hint{font:600 clamp(.8rem,3.5vw,.95rem) Fredoka,Poppins,sans-serif;color:#b0508a;background:rgba(255,255,255,.9);border-radius:999px;padding:7px 15px;text-align:center;display:none;box-shadow:0 4px 12px rgba(120,60,90,.2)}
#hint.on{display:block;animation:apungH 2.4s ease-in-out infinite}
@keyframes apungH{50%{translate:0 -5px}}
.pil{border:0;border-radius:999px;padding:13px 28px;font:600 .95rem Fredoka,Poppins,sans-serif;cursor:pointer;color:#fff;background:linear-gradient(135deg,#ff9cc8,#f0a35e);box-shadow:0 6px 0 #c0668f,0 10px 22px rgba(192,102,143,.35);animation:denyut 1.8s ease-in-out infinite}
.pil.p2{background:#fff;color:#b0508a;box-shadow:0 4px 0 #f0c3d8;animation:none}
.pil:active{translate:0 3px}
@keyframes denyut{50%{scale:1.05}}
#confetti{position:fixed;inset:0;z-index:40;pointer-events:none}

/* lapisan */
.lap{position:fixed;inset:0;z-index:80;display:none;align-items:center;justify-content:center;flex-direction:column;padding:16px;background:rgba(255,236,245,.82);-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px)}
.lap.on{display:flex;animation:muncul .35s ease}
@keyframes muncul{from{opacity:0}}
.no{font:600 .72rem Fredoka,Poppins,sans-serif;letter-spacing:.2em;color:#c0668f;margin-bottom:10px;text-align:center}
.bkBox{position:relative;animation:timbul .7s cubic-bezier(.2,1.3,.4,1)}
@keyframes timbul{from{scale:.3;rotate:-10deg;opacity:0}}
.bkBox>img{position:relative;width:100%;z-index:2;pointer-events:none;filter:drop-shadow(0 12px 22px rgba(140,70,110,.3))}
.bkBox .ft{position:absolute;z-index:1;background:#f5e6ee center/cover no-repeat;cursor:zoom-in}
.bkBox .main{position:absolute;left:50%;top:50%;width:64px;height:64px;margin:-32px 0 0 -32px;border-radius:50%;background:rgba(255,255,255,.92);z-index:3;cursor:pointer}
.bkBox .main::after{content:"";position:absolute;left:25px;top:20px;border:12px solid transparent;border-left:20px solid #e46aa6;border-right:0}
.nTx{position:absolute;z-index:3;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;overflow-y:auto;padding:3%}
.nTx .t{font:700 1.7rem/1.25 Caveat,cursive;color:var(--ink);white-space:pre-line;word-break:break-word}
.kap{margin-top:14px;max-width:min(86vw,420px);text-align:center;font:700 clamp(1.3rem,6vw,1.8rem)/1.2 Caveat,cursive;color:var(--ink);white-space:pre-line}
.btnB{display:flex;gap:10px;flex-wrap:wrap;justify-content:center;margin-top:16px}
#vidLap .box{position:relative;width:min(92vw,560px);aspect-ratio:16/9;border-radius:12px;overflow:hidden;background:#000}
#vidLap iframe{position:absolute;inset:0;width:100%;height:100%;border:0}
#sk2{position:fixed;inset:0;z-index:70;display:none;flex-direction:column;align-items:center;justify-content:center;padding:calc(env(safe-area-inset-top,0px) + 54px) 14px calc(env(safe-area-inset-bottom,0px) + 20px);background:radial-gradient(ellipse at 50% 40%,#fff3f8,#ffd9e8 60%,#e9cdf5)}
#sk2.on{display:flex;animation:muncul .5s ease}
#sk2 .tajuk{margin-bottom:12px;font-size:clamp(1.3rem,6vw,1.9rem)}
#kadBox{position:relative;animation:naik 1s cubic-bezier(.2,.8,.3,1) both}
@keyframes naik{from{opacity:0;translate:0 80px}}
#kadBox>img{width:100%;filter:drop-shadow(0 12px 24px rgba(140,70,110,.3))}
#suratTx{position:absolute;overflow-y:auto;font:600 clamp(1.05rem,4.6vw,1.32rem)/1.38 Caveat,cursive;color:var(--ink);white-space:pre-line;padding:2% 3%;-webkit-overflow-scrolling:touch}
#suratTx .ttd{margin-top:14px;text-align:right;color:#d0508f}

/* umum */
#bhs{position:fixed;top:10px;right:10px;z-index:95;display:flex;background:rgba(255,255,255,.75);border-radius:30px;padding:3px;border:1px solid #f3c4dc}
#bhs button{border:0;background:transparent;color:#b0508a;font:600 .68rem Poppins,sans-serif;padding:5px 11px;border-radius:20px;cursor:pointer}
#bhs button.on{background:#f08ab8;color:#fff}
#bMuzik{position:fixed;top:10px;left:10px;z-index:95;width:34px;height:34px;border-radius:50%;border:1px solid #f3c4dc;background:rgba(255,255,255,.75);color:#d0508f;font-size:15px;cursor:pointer;display:none}
#bMuzik.on{display:block}#bMuzik.henti{opacity:.5;text-decoration:line-through}
#gk-album-btn{bottom:auto!important;top:calc(env(safe-area-inset-top,0px) + 48px)!important;right:10px!important;padding:8px 12px!important;font-size:.64rem!important}
.tagpv{position:fixed;top:14px;left:50%;translate:-50% 0;z-index:95;background:rgba(176,80,138,.3);color:#fff;font:500 .5rem Poppins,sans-serif;letter-spacing:.18em;padding:4px 10px;border-radius:40px;pointer-events:none}
.gagal{position:fixed;inset:0;z-index:999;display:flex;align-items:center;justify-content:center;padding:24px;text-align:center;background:#ffe9f2;font:15px/1.7 Poppins,sans-serif;color:var(--ink)}
#lb{z-index:1000;background:rgba(40,16,34,.95);padding:0;touch-action:none;overflow:hidden}
#lb img{max-width:100vw;max-height:100vh;transform-origin:0 0;will-change:transform;-webkit-user-drag:none}
#lb .tt{position:absolute;left:0;right:0;bottom:calc(env(safe-area-inset-bottom,0px) + 16px);text-align:center;font:italic 12px Poppins,sans-serif;color:rgba(255,255,255,.6);pointer-events:none}
.x{position:fixed;right:14px;top:14px;width:32px;height:32px;border-radius:50%;border:0;background:rgba(255,255,255,.9);color:#5a2f4a;font-size:14px;cursor:pointer;z-index:3}
</style>

/* ═══ CONFETTI ═══ */
var CF=[],cfRaf=null;
function confetti(x,y,arah,n){var c=$('confetti');c.width=innerWidth;c.height=innerHeight;var W=['#f7a8c4','#ffe08a','#a8dbff','#cdb6f5','#aee6cf','#e6c27a','#ff8fb8'];
  for(var i=0;i<n;i++){var a=(arah===0?rnd(0,Math.PI*2):-Math.PI/2+arah*.45+rnd(-.5,.5)),v=rnd(7,16);CF.push({x:x,y:y,vx:Math.cos(a)*v,vy:Math.sin(a)*v,w:rnd(6,11),h:rnd(4,8),r:rnd(0,6),vr:rnd(-.3,.3),c:W[i%W.length],t:0});}
  if(!cfRaf)(function f(){var ctx=c.getContext('2d');ctx.clearRect(0,0,c.width,c.height);CF=CF.filter(function(p){p.t++;p.vy+=.28;p.vx*=.985;p.x+=p.vx;p.y+=p.vy;p.r+=p.vr;
    ctx.save();ctx.translate(p.x,p.y);ctx.rotate(p.r);ctx.fillStyle=p.c;ctx.fillRect(-p.w/2,-p.h/2,p.w,p.h*Math.abs(Math.cos(p.t*.12)));ctx.restore();return p.y<c.height+30&&p.t<400;});
    cfRaf=CF.length?requestAnimationFrame(f):null;if(!CF.length)ctx.clearRect(0,0,c.width,c.height);})();}

/* ═══ BUNYI ═══ */
var AC=null;
function bunyiInit(){try{AC=AC||new (window.AudioContext||window.webkitAudioContext)();if(AC.state==='suspended')AC.resume();}catch(e){}}
function nota(f,t0,d,jenis,v,f2){var o=AC.createOscillator(),g=AC.createGain();o.type=jenis||'sine';o.frequency.setValueAtTime(f,t0);if(f2)o.frequency.exponentialRampToValueAtTime(f2,t0+d*.8);o.connect(g);g.connect(AC.destination);
  g.gain.setValueAtTime(.0001,t0);g.gain.exponentialRampToValueAtTime(v||.05,t0+.01);g.gain.exponentialRampToValueAtTime(.0001,t0+d);o.start(t0);o.stop(t0+d+.02);}
function hingar(t0,d,v,fq,jenis){var n=AC.sampleRate*d,b=AC.createBuffer(1,n,AC.sampleRate),x=b.getChannelData(0);for(var i=0;i<n;i++)x[i]=(Math.random()*2-1)*Math.pow(1-i/n,2);
  var s=AC.createBufferSource(),g=AC.createGain(),fl=AC.createBiquadFilter();fl.type=jenis||'lowpass';fl.frequency.value=fq||1200;s.buffer=b;s.connect(fl);fl.connect(g);g.connect(AC.destination);g.gain.value=v||.15;s.start(t0);}
function bunyi(j){try{bunyiInit();var t=AC.currentTime;
  if(j==='buk'){nota(140,t,.18,'sine',.25,55);hingar(t,.12,.35,500);}
  else if(j==='retak')hingar(t+.02,.08,.12,3500,'highpass');
  else if(j==='pecah'){hingar(t,.5,.4,1800);nota(180,t,.3,'sine',.2,60);[523,659,784,1047].forEach(function(f,i){nota(f,t+.15+i*.08,.4,'triangle',.04);});}
  else if(j==='sorak'){hingar(t,1.2,.08,1500,'bandpass');}
  else if(j==='gula'){nota(rnd(900,1400),t,.12,'sine',.06,rnd(1600,2200));}
  else if(j==='buka')[1047,1568].forEach(function(f,i){nota(f,t+i*.08,.4);});
  else if(j==='ajaib')[1047,1319,1568,2093,2637].forEach(function(f,i){nota(f,t+i*.09,.7,'sine',.04);});
  }catch(e){}}

/* lightbox: cubit zum, seret, dwiketik; ketik sekali (tanpa zum) = tutup */
var LB={s:1,x:0,y:0};
function lbBuka(src){var im=$('lbimg');im.src=src;LB={s:1,x:0,y:0};lbTerap();$('lbTt').textContent=T('lbTt');$('lb').classList.add('on');}
function lbTerap(){$('lbimg').style.transform='translate('+LB.x+'px,'+LB.y+'px) scale('+LB.s+')';}
(function(){var lb=$('lb'),im=$('lbimg'),pts={},d0=0,s0=1,c0=null,x0=0,y0=0,gerak=false,lastTap=0,tapT=0;
  function pusat(){var k=Object.keys(pts);if(k.length<2)return null;var a=pts[k[0]],b=pts[k[1]];return{x:(a.x+b.x)/2,y:(a.y+b.y)/2,d:Math.hypot(a.x-b.x,a.y-b.y)};}
  lb.addEventListener('pointerdown',function(e){if(e.target.closest('.x'))return;pts[e.pointerId]={x:e.clientX,y:e.clientY};try{lb.setPointerCapture(e.pointerId);}catch(_){}
    var p=pusat();if(p){d0=p.d;s0=LB.s;c0=p;x0=LB.x;y0=LB.y;}else{x0=LB.x;y0=LB.y;c0={x:e.clientX,y:e.clientY};}gerak=false;tapT=Date.now();});
  lb.addEventListener('pointermove',function(e){if(!pts[e.pointerId])return;pts[e.pointerId]={x:e.clientX,y:e.clientY};var p=pusat();
    if(p){var s=Math.max(1,Math.min(5,s0*p.d/d0));var r=im.getBoundingClientRect();
      /* zum ke arah titik cubit: kekalkan titik bawah jari */
      var px=(c0.x-(x0+im.offsetLeft))/s0,py=(c0.y-(y0+im.offsetTop))/s0;
      LB.s=s;LB.x=p.x-im.offsetLeft-px*s;LB.y=p.y-im.offsetTop-py*s;gerak=true;lbTerap();}
    else if(LB.s>1){var dx=e.clientX-c0.x,dy=e.clientY-c0.y;if(Math.hypot(dx,dy)>6)gerak=true;LB.x=x0+dx;LB.y=y0+dy;lbTerap();}});
  function lepas(e){if(!pts[e.pointerId])return;delete pts[e.pointerId];
    if(Object.keys(pts).length===0){var t=Date.now();
      if(!gerak&&t-tapT<300){if(t-lastTap<320){/* dwiketik: zum 2.5x ke titik / reset */
          if(LB.s>1){LB={s:1,x:0,y:0};}else{var s=2.5,px=e.clientX-im.offsetLeft,py=e.clientY-im.offsetTop;LB={s:s,x:px-px*s,y:py-py*s};}lbTerap();lastTap=0;}
        else{lastTap=t;setTimeout(function(){if(lastTap===t&&LB.s===1)tutupLap('lb');},320);}}
      if(LB.s===1){LB.x=0;LB.y=0;lbTerap();}}
    else{var k=Object.keys(pts)[0];c0={x:pts[k].x,y:pts[k].y};x0=LB.x;y0=LB.y;}}
  lb.addEventListener('pointerup',lepas);lb.addEventListener('pointercancel',lepas);
})();
