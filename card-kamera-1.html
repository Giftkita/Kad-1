<script>
/* ====================================================================
   KAMERA PAKAI BUANG (kamera) — kategori Graduasi. Latar FOTO Canva: K1 meja flat lay, K2 bilik gelap lampu merah (2 tali + dulang), K3 bahan hijau
   (ST.B: 0 kamera, 1 sampul kraft tertutup, 2 sampul terbuka + lubang, 3 jalur negatif 4 lubang, 4 penyepit, 5 hadiah, 6 kertas, 7 TV retro + lubang, 8 pita).

function fotoDemo(n){ var W=720,H=480,c=document.createElement('canvas'); c.width=W; c.height=H; var x=c.getContext('2d'), topi=n>=10;
  var P=[['#fde2e4','#f4acb7','#9d4edd'],['#e2ece9','#a8d5ba','#2d6a4f'],['#fff1e6','#f8c8a0','#b5651d'],['#dbe7f6','#9cb8e0','#1f3b7a'],['#fbe7ef','#e7a3ae','#8e3b46'],['#f1e8d6','#d9c39a','#5e4b3c']][n%6];
  var g=x.createLinearGradient(0,0,0,H); g.addColorStop(0,P[0]); g.addColorStop(1,P[1]); x.fillStyle=g; x.fillRect(0,0,W,H);
  x.fillStyle='rgba(255,255,255,.35)'; x.beginPath(); x.arc(W*(.2+(n%3)*.3),H*.25,80,0,7); x.fill(); x.fillStyle='rgba(0,0,0,.08)'; x.fillRect(0,H*.8,W,H*.2);
  var N=n%2?3:2, X=N===2?[W*.38,W*.62]:[W*.26,W*.5,W*.74];
  for(var i=0;i<N;i++){ var cx=X[i], cy=H*.58, s=.95-(i%2)*.06;
    x.fillStyle=topi?'#1a1a2e':[P[2],'#1f3b7a','#b5651d'][i]; x.beginPath(); x.ellipse(cx,cy+150*s,82*s,130*s,0,Math.PI,0); x.fill();
    x.fillStyle=i===1?'#c96b6b':'#3b2a20'; x.beginPath(); x.arc(cx,cy-12*s,46*s,0,7); x.fill(); x.fillRect(cx-46*s,cy-12*s,92*s,60*s);
    x.fillStyle='#f2c9a0'; x.beginPath(); x.arc(cx,cy-4*s,34*s,0,7); x.fill();
    if(topi){ x.fillStyle='#1a1a2e'; x.beginPath(); x.moveTo(cx-60*s,cy-50*s); x.lineTo(cx,cy-74*s); x.lineTo(cx+60*s,cy-50*s); x.lineTo(cx,cy-28*s); x.fill(); } }
  return c.toDataURL('image/jpeg',0.8); }
